name: Premium Functional UI Workflow Cleanup

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-final-run.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 20

      - name: Remove temporary premium UI workflows
        run: |
          set -euo pipefail
          git rm .github/workflows/premium-functional-ui-final-run.yml .github/workflows/premium-functional-ui-finalize.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove premium UI temporary verification workflows"
          git push origin HEAD:feature/premium-functional-ui
