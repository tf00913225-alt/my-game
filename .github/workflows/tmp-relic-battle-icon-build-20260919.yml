name: TEMP relic battle icon conversion

on:
  push:
    branches:
      - fix/relic-battle-cutin-icon-readability-20260919

permissions:
  contents: write

jobs:
  convert-build:
    if: ${{ !contains(github.event.head_commit.message, 'build(relic): add battle icon assets') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/relic-battle-cutin-icon-readability-20260919
          fetch-depth: 0

      - name: Checkout asset library
        uses: actions/checkout@v4
        with:
          ref: assets-library
          path: _asset_library
          fetch-depth: 1

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert 20 battle icons to lossless WebP and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src=Path("_asset_library/assets/inbox/秘寶icon/秘寶戰鬥icon")
          dst=Path("assets/relics/battle-icons")
          dst.mkdir(parents=True,exist_ok=True)
          mapping={
              "乾坤玉壺 戰鬥去背.png":"relic_qiankun_flask",
              "烈陽神珠 戰鬥去背.png":"relic_sun_orb",
              "玄武靈印 戰鬥去背.png":"relic_xuanwu_seal",
              "鎮魂古鐘 戰鬥去背.png":"relic_soul_bell",
              "天罡戰旗 戰鬥去背.png":"relic_tiangang_banner",
              "九龍神火罩 戰鬥去背.png":"relic_nine_dragon_fire",
              "寒泉玉佩 戰鬥去背.png":"relic_cold_spring_jade",
              "青嵐羽符 戰鬥去背.png":"relic_qinglan_feather",
              "岩岳鎮印 戰鬥去背.png":"relic_rock_mountain_seal",
              "回天寶輪 戰鬥去背.png":"relic_returning_wheel",
              "太初聖符 戰鬥去背.png":"relic_origin_talisman",
              "破軍殘卷 戰鬥去背.png":"relic_broken_army_scroll",
              "赤霄戰紋 戰鬥去背.png":"relic_red_sky_war_mark",
              "玄冰鏡心 戰鬥去背.png":"relic_ice_mirror_heart",
              "追風行符 戰鬥去背.png":"relic_wind_chasing_talisman",
              "山河寶鼎 戰鬥去背.png":"relic_mountain_river_cauldron",
              "焚星殘印 戰鬥去背.png":"relic_burning_star_mark",
              "靈泉法瓶 戰鬥去背.png":"relic_spirit_spring_bottle",
              "伏魔金印 戰鬥去背.png":"relic_demon_suppressing_seal",
              "萬象歸元盤 戰鬥去背.png":"relic_all_returning_array",
          }
          actual={p.name for p in src.glob("*.png")}
          expected=set(mapping)
          if actual != expected:
              raise SystemExit(f"asset mismatch missing={sorted(expected-actual)} extra={sorted(actual-expected)}")
          rows=[]
          for filename,relic_id in mapping.items():
              source=src/filename
              target=dst/f"{relic_id}.webp"
              with Image.open(source) as im:
                  im.load()
                  source_size=im.size
                  source_has_alpha="A" in im.getbands()
                  rgba=im.convert("RGBA")
                  rgba.save(target,"WEBP",lossless=True,quality=100,method=6,exact=True)
              with Image.open(target) as out:
                  out.load()
                  if out.size != source_size:
                      raise SystemExit(f"dimension mismatch {filename}: {source_size} -> {out.size}")
                  if source_has_alpha and "A" not in out.getbands():
                      raise SystemExit(f"alpha lost: {filename}")
                  rows.append((filename,relic_id,source_size,target.stat().st_size,"A" in out.getbands()))
          if len(rows)!=20:
              raise SystemExit(f"expected 20 converted icons, got {len(rows)}")
          for row in rows:
              print(row)
          PY

      - name: Remove staging checkout
        run: rm -rf _asset_library

      - name: Synchronize production build
        run: npm run build

      - name: Run relic cut-in contract
        run: node tests/relic-battle-cutin-icon-readability-20260919.test.js

      - name: Run repository unit checks
        run: npm test

      - name: Commit generated assets and build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "build(relic): add battle icon assets and sync production build"
          git push origin HEAD:fix/relic-battle-cutin-icon-readability-20260919
