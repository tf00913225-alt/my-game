name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  verify:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check out cold-start repair branch head
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/cold-start-character-creation-lifecycle-20260911'
        run: |
          git fetch --no-tags origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"

      - name: Retire legacy creation owners and regenerate production bundles
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/cold-start-character-creation-lifecycle-20260911'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old in text:
                  text=text.replace(old,new,1)
                  p.write_text(text)
              elif new not in text:
                  raise SystemExit(f"expected text missing in {path}: {old!r}")

          replace_once(
              "scripts/build-production.mjs",
              '    "js/22-v124-character-creation-native-runtime.js",\n',
              ''
          )
          replace_once(
              "scripts/build-production.mjs",
              ',"css/28-v124-character-creation-native.css"',
              ''
          )
          replace_once(
              "tests/v170-final-spec-integration.test.js",
              '    "js/22-v124-character-creation-native-runtime.js",\n',
              ''
          )

          p=Path("tests/boot-architecture.test.js")
          text=p.read_text()
          marker='assert.doesNotMatch(productionBuild,/js\\/22-v124-character-creation-native-runtime\\.js|css\\/28-v124-character-creation-native\\.css/,\n    "retired V124 creation owners must not re-enter the production app-shell");\n'
          if marker not in text:
              anchor='const boot=JSON.parse(fs.readFileSync("config/boot-manifest.json","utf8"));\n'
              if anchor not in text: raise SystemExit("boot architecture insertion anchor missing")
              text=text.replace(anchor,anchor+marker,1)
              p.write_text(text)

          p=Path(".github/scripts/run-boot-architecture-browser-qa.mjs")
          text=p.read_text()
          if 'creationOverflowY:getComputedStyle(creation).overflowY,' not in text:
              old='        appDisplay:getComputedStyle(app).display,\n        hitInsideNext:'
              new='        appDisplay:getComputedStyle(app).display,\n        creationOverflowY:getComputedStyle(creation).overflowY,\n        creationTouchAction:getComputedStyle(creation).touchAction,\n        hitInsideNext:'
              if old not in text: raise SystemExit("browser QA style capture anchor missing")
              text=text.replace(old,new,1)
          if 'assert.equal(guest.creationOverflowY,"clip"' not in text:
              old='    assert.equal(guest.appDisplay,"none","Legacy app remained painted behind character creation");\n    assert.equal(guest.hitInsideNext,true'
              new='    assert.equal(guest.appDisplay,"none","Legacy app remained painted behind character creation");\n    assert.equal(guest.creationOverflowY,"clip","Retired V124 scroll CSS is still overriding the fixed creation canvas");\n    assert.equal(guest.creationTouchAction,"none","Retired V124 pan-y CSS is still overriding the fixed creation canvas");\n    assert.equal(guest.hitInsideNext,true'
              if old not in text: raise SystemExit("browser QA style assertion anchor missing")
              text=text.replace(old,new,1)
          text=text.replace('"--headless=new","--no-sandbox","--disable-gpu","--disable-dev-shm-usage"','"--headless=new","--no-sandbox","--disable-dev-shm-usage"')
          p.write_text(text)

          handoff=Path("HANDOFF.md")
          text=handoff.read_text()
          heading='## 2026-09-11 — Cold-start 創角 Native lifecycle 修復（PR #157）'
          if heading not in text:
              entry='''\n\n## 2026-09-11 — Cold-start 創角 Native lifecycle 修復（PR #157）\n\n- 基準：`dev@29f83030d6427f2641952745243291b35731659a`；工作分支 `fix/cold-start-character-creation-lifecycle-20260911`。`main` 未修改。\n- 根因：account-first Startup State Machine 在 `NEED_CHARACTER` 直接把 `#creationPage` 設成 `display:block`，繞過 `FourSymbolsGameSave.showCreation()` 與 `js/24-v125-character-creation-native-runtime.js` 的 Native 啟用流程；Android Chrome 因而可能在第一個可見 frame 缺少 `creation-fixed-active` / `creation-native-active`，讓 legacy `#app` / overlay 仍參與 paint/compositing。\n- 修正：`js/52-v173.20-startup-loader.js` 新增 fail-closed 的 `showCharacterCreationSurface()`，只透過 canonical `FourSymbolsGameSave.showCreation()` 進入創角，並在 startup loader 尚覆蓋舞台時先完成 Native layer migration / isolation，再淡出 loader。禁止再由 startup owner 直接 `display:block`。\n- 清理：production `app-shell` 不再打包退役的 `js/22-v124-character-creation-native-runtime.js` 與 `css/28-v124-character-creation-native.css`；保留 `js/23` bootstrap + `js/24` runtime + critical `css/29` 為目前創角 owner，避免舊版 `overflow-y:auto` / `touch-action:pan-y` / isolation 規則在新版固定 canvas 後方重新覆寫。\n- Browser QA：390×844、DPR 3、touch emulation 的 account-first 新 UID 冷啟動現在必須驗證 `#creationPage` 位於 `#game-overlay-layer`、`native-creation-page`、`creation-fixed-active`、`creation-native-active`、legacy `#app` inert 且不 paint、創角 canvas `overflow-y:clip` / `touch-action:none`，並以 `elementFromPoint()` 驗證「下一步」按鈕右側沒有被其他 layer 蓋住；Boot QA 不再強制 `--disable-gpu`。\n- Production build 仍由 `scripts/build-production.mjs` 產生 content-hash bundle / manifest；本輪不得用 query version 或臨時 CSS/JS patch 規避 owner。\n'''
              handoff.write_text(text+entry)
          PY
          node scripts/build-production.mjs

      - name: Commit deterministic owner cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/cold-start-character-creation-lifecycle-20260911'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/build-production.mjs tests/v170-final-spec-integration.test.js tests/boot-architecture.test.js .github/scripts/run-boot-architecture-browser-qa.mjs HANDOFF.md index.html asset-manifest.json build/
          if ! git diff --cached --quiet; then
            git commit -m "fix: retire legacy creation owners"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi

      - name: Prepare Git comparison base
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$CI_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && \
             [[ ! "$CI_BASE_SHA" =~ ^0{40}$ ]] && \
             ! git cat-file -e "$CI_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          fi

          # Typography regression suites audit the pre-change baseline and the
          # approved gameplay battle baseline byte-for-byte. fetch-depth: 2 does
          # not retain those fixed historical objects after the integration merge.
          for typography_baseline_sha in \
            39767ce2b9dbfa59650b7c5fd4d52a57a2642ea5 \
            4a592dd4c41d7efb1a4849fbfe0cbf68598121bf \
            29b9668057846164a941fbf6617d2458d9af5476; do
            if ! git cat-file -e "$typography_baseline_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$typography_baseline_sha"
            fi
          done

      - name: Check CI script syntax
        run: |
          node --check .github/scripts/ci.mjs
          node --check .github/scripts/boot-live-browser-qa.mjs
          node --check .github/scripts/release-gate.mjs
          node --check .github/scripts/run-boot-architecture-browser-qa.mjs
          node --check .github/scripts/run-skill-progression-browser-qa.mjs
          node --check .github/scripts/run-relic-progression-browser-qa.mjs

      - name: Check all project JavaScript syntax
        run: node .github/scripts/ci.mjs syntax

      - name: Ensure existing asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run all Node unit and integration suites
        run: node .github/scripts/ci.mjs tests

      - name: Run account-first cold/warm mobile browser QA
        run: node .github/scripts/run-boot-architecture-browser-qa.mjs

      - name: Upload boot architecture browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-architecture-browser-qa-${{ github.sha }}
          path: artifacts/browser-qa/boot-architecture-browser-qa.json
          if-no-files-found: error
          retention-days: 90

      - name: Run skill progression mobile browser QA
        run: node .github/scripts/run-skill-progression-browser-qa.mjs

      - name: Run relic progression mobile browser QA
        run: node .github/scripts/run-relic-progression-browser-qa.mjs

      - name: Check static local resources
        run: node .github/scripts/ci.mjs resources

      - name: Check duplicate HTML IDs
        run: node .github/scripts/ci.mjs html-ids

      - name: Check release entries and loader integrity
        run: node .github/scripts/ci.mjs loader

      - name: Enforce release, cache, checklist and deprecated-code gates
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/release-gate.mjs ci

      - name: Check Git whitespace and conflict markers
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci.mjs git-diff

  deploy_dev:
    name: Dev deployment gate
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-dev-cloudflare.yml
    secrets: inherit
