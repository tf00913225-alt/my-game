name: Skill Action QA Diagnostic Recovery
on:
  push:
    branches: [fix/skill-action-dom-presentation-runtime-qa-20260930]
    paths: [.github/workflows/skill-action-qa-diagnostic-recovery.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/skill-action-dom-presentation-runtime-qa-20260930, fetch-depth: 0}
      - name: Apply QA diagnostic patch
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/skill-action-qa.patch
          git apply --whitespace=nowarn /tmp/skill-action-qa.patch
      - name: Commit diagnostic repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/skill-action-qa-diagnostic-recovery.yml
          git add .github/scripts/run-skill-progression-browser-qa.mjs
          git commit -m "test: initialize formal skill feature runtime"
          git push origin HEAD:fix/skill-action-dom-presentation-runtime-qa-20260930
