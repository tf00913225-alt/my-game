name: Temporary final skill counter rebuild

on:
  push:
    branches:
      - feature/boss-balance-gameplay-relic-lv20-20260911

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/boss-balance-gameplay-relic-lv20-20260911
          fetch-depth: 0

      - name: Rebuild production assets
        run: |
          node scripts/build-production.mjs
          node scripts/build-production.mjs --check

      - name: Verify counter owner and mobile UI
        run: |
          node tests/v174-current-ui-fixes.test.js
          node tests/ui-v174-current-fixes-mobile-browser.test.js
          node tests/gameplay-ui-mobile-browser.test.js

      - name: Verify loader
        run: node .github/scripts/ci.mjs loader

      - name: Remove temporary workflow and trigger
        run: |
          rm -f .github/workflows/tmp-rebuild-skill-counter-20260911.yml
          rm -f scripts/tmp-skill-counter-rebuild-trigger.txt
          git add -A
          git status --short
          git diff --cached --check

      - name: Commit rebuilt production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh final skill counter assets"
          git push origin HEAD:feature/boss-balance-gameplay-relic-lv20-20260911
