name: Premium Functional UI Responsive Formal Runtime Repair

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-responsive-cdp-meta-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate responsive harness with formal stage runtime
        run: |
          set -euo pipefail
          awk '/python3 <<'"'"'PY'"'"'/{capture=1;next} capture&&/^          PY$/{exit} capture{sub(/^          /,"");print}' .github/workflows/premium-functional-ui-responsive-cdp-fix.yml > /tmp/patch.py
          python3 /tmp/patch.py
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/premium-functional-ui-responsive-browser.test.js')
          t=p.read_text()
          anchor='const links=styles.map(file=>`<link rel="stylesheet" href="${file}">`).join("");'
          insert=anchor+'\nconst scalerMarker="/*\\n   ★ COMPLETE virtual-stage validation helpers";\nconst scalerOwnerSource=fs.readFileSync(path.join(root,"js/00-main.js"),"utf8").split(scalerMarker)[0].replace(/<\\/script/gi,"<\\\\/script");'
          if anchor not in t:
              raise SystemExit('links anchor missing')
          t=t.replace(anchor,insert,1)
          old='<meta charset="utf-8">${links}'
          new='<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">${links}'
          if old not in t:
              raise SystemExit('surface viewport meta anchor missing')
          t=t.replace(old,new,1)
          old_dialog='<html><head>${links}'
          new_dialog='<html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">${links}'
          if old_dialog not in t:
              raise SystemExit('dialog viewport meta anchor missing')
          t=t.replace(old_dialog,new_dialog,1)
          old_runtime='const runtime=wide?\'<script src="js/19-stage-v78-character-inventory-runtime.js"></script>\':\'\';'
          new_runtime='const runtime=`<script>${scalerOwnerSource}</script>${wide?\'<script src="js/19-stage-v78-character-inventory-runtime.js"></script>\':\'\'}`;'
          if old_runtime not in t:
              raise SystemExit('runtime anchor missing')
          t=t.replace(old_runtime,new_runtime,1)
          old_nav='await navigate(client,fixtureUrl(fixture));\n    if(wide){'
          new_nav='await navigate(client,fixtureUrl(fixture));\n    await evaluate(client,"window.updateGameStageScale&&window.updateGameStageScale()");\n    if(wide){'
          if old_nav not in t:
              raise SystemExit('navigation anchor missing')
          t=t.replace(old_nav,new_nav,1)
          old_hit='const hit=await evaluate(client,`(()=>{const el=document.querySelector(${JSON.stringify(selector)});if(!el||el.disabled)return null;const r=el.getBoundingClientRect();'
          new_hit='const hit=await evaluate(client,`(()=>{const el=document.querySelector(${JSON.stringify(selector)});if(!el||el.disabled)return null;el.scrollIntoView({block:"center",inline:"nearest"});const r=el.getBoundingClientRect();'
          if old_hit not in t:
              raise SystemExit('hit test anchor missing')
          t=t.replace(old_hit,new_hit,1)
          old_data='const box=document.querySelector(\'.home-feature-modal-box\');const root=document.getElementById(\'characterTabContent\');const parent=box&&box.parentElement;'
          new_data='const box=document.querySelector(\'.home-feature-modal-box\');const root=document.getElementById(\'characterTabContent\');const parent=box&&box.parentElement;const stage=document.getElementById(\'game-stage\');'
          if old_data not in t:
              raise SystemExit('geometry anchor missing')
          t=t.replace(old_data,new_data,1)
          old_return='return {viewport:[innerWidth,innerHeight],surface:${JSON.stringify(surface)},docOverflow:'
          new_return='return {viewport:[innerWidth,innerHeight],surface:${JSON.stringify(surface)},stage:rect(stage),stageScale:window.GAME_STAGE_SCALE,stageViewport:[window.GAME_VIEWPORT_WIDTH,window.GAME_VIEWPORT_HEIGHT],docOverflow:'
          if old_return not in t:
              raise SystemExit('evidence anchor missing')
          t=t.replace(old_return,new_return,1)
          p.write_text(t)
          PY
          git diff --check
          test "$(git diff --name-only)" = "tests/premium-functional-ui-responsive-browser.test.js"
          node tests/premium-functional-ui-responsive-browser.test.js
      - name: Save verified responsive harness
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/premium-functional-ui-responsive-browser.test.js
          git diff --cached --check
          git commit -m "test: run responsive QA through formal stage runtime"
          git push origin HEAD:feature/premium-functional-ui
