name: Apply synthesis first-render icon fix

on:
  push:
    branches:
      - bugfix/synthesis-first-render-icons

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/synthesis-first-render-icons
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply owner-level first-render fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/36-v141-content-systems.js')
          s=p.read_text()
          old='''            ensureEquipmentUids();\n            renderSynthesis();\n'''
          new='''            ensureEquipmentUids();\n            // Route the very first open through the current public renderer.\n            // Calling the closure directly bypasses later presentation owners\n            // and is why equipment/talisman art only appears after a click.\n            if(typeof window.v141RenderSynthesis==="function"){ window.v141RenderSynthesis(); }\n            else{ renderSynthesis(); }\n'''
          if old not in s:
              raise SystemExit('js/36 synthesis entry owner pattern not found')
          p.write_text(s.replace(old,new,1))

          p=Path('js/58-v173.63-functional-fixes.js')
          s=p.read_text()
          old='''    window.v141RenderSynthesis=function(){\n        const result=originalRenderSynthesis.apply(this,arguments);\n        ensureMaterialTab();if(materialTabActive){renderMaterialSynthesis();}scheduleRepairs();return result;\n    };\n'''
          new='''    window.v141RenderSynthesis=function(){\n        // Presentation data must be hydrated before V143 builds the first icon picker.\n        if(typeof window.v17346SyncFourElementSets==="function"){try{window.v17346SyncFourElementSets();}catch(_){}}\n        syncCanonicalItemArt();\n        const result=originalRenderSynthesis.apply(this,arguments);\n        ensureMaterialTab();if(materialTabActive){renderMaterialSynthesis();}\n        repairSynthesisIcons();maximizeSynthesisPanel();scheduleRepairs();return result;\n    };\n'''
          if old not in s:
              raise SystemExit('js/58 render wrapper pattern not found')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/ui-synthesis-dungeon-equipment-comparison-regression.test.js')
          s=p.read_text()
          marker='console.log("✓ synthesis, dungeon preview and equipment comparison UI regression batch");'
          insert='''const synthesisOwner=read("js/36-v141-content-systems.js");\nassert.match(synthesisOwner,/ensureEquipmentUids\\(\\);[\\s\\S]*?window\\.v141RenderSynthesis\\(\\)/);\nassert.match(repairs,/window\\.v141RenderSynthesis=function\\(\\)\\{[\\s\\S]*?v17346SyncFourElementSets[\\s\\S]*?syncCanonicalItemArt\\(\\)[\\s\\S]*?originalRenderSynthesis\\.apply[\\s\\S]*?repairSynthesisIcons\\(\\)/);\n'''
          if marker not in s:
              raise SystemExit('regression test marker not found')
          p.write_text(s.replace(marker,insert+'\n'+marker,1))

          hand=Path('HANDOFF.md')
          hs=hand.read_text()
          note='''## 2026-09-07 合成首次開頁 Icon 時序修復（dev）\n- 使用者實機確認裝備／符咒 icon 在首次打開合成頁仍需點一下才顯示。根因是 `js/36-v141-content-systems.js` 的合成入口直接呼叫 closure `renderSynthesis()`，繞過 V143/V146/V173.63 的最終 public renderer。\n- 合成入口改為優先呼叫 `window.v141RenderSynthesis()`；`js/58-v173.63-functional-fixes.js` 在正式 render 前先同步 equipment/static item presentation，render 後立即 repair picker，不再把首次 icon 顯示依賴點擊或下一次 rerender。\n- owner：`js/36-v141-content-systems.js`（合成入口）＋ `js/58-v173.63-functional-fixes.js`（最終 presentation/render wrapper）；不新增 runtime patch。\n- Game/Cache Version 維持 V173.62，待 DEV 手機實機確認首次打開裝備與符咒均直接顯示 icon 後才能標 VERIFIED。\n\n'''
          if not hs.startswith(note):
              hand.write_text(note+hs)

          req=Path('release/requirement-batches/2026-09-07-synthesis-first-render-icons.json')
          req.write_text('''{\n  "schemaVersion": 1,\n  "batchId": "2026-09-07-synthesis-first-render-icons",\n  "releaseVersion": "173.62",\n  "status": "IMPLEMENTED",\n  "requirements": [\n    {\n      "id": "ICON-01",\n      "requirement": "裝備合成／冶煉的裝備 icon 首次打開頁面即顯示，不需要先點擊。",\n      "status": "IMPLEMENTED",\n      "evidence": {"files": ["js/36-v141-content-systems.js", "js/58-v173.63-functional-fixes.js", "tests/ui-synthesis-dungeon-equipment-comparison-regression.test.js"], "verification": "targeted + Repository checks + DEV visual pending"}\n    },\n    {\n      "id": "ICON-02",\n      "requirement": "符咒合成 icon 首次打開頁面即顯示，不需要先點擊。",\n      "status": "IMPLEMENTED",\n      "evidence": {"files": ["js/36-v141-content-systems.js", "js/58-v173.63-functional-fixes.js", "tests/ui-synthesis-dungeon-equipment-comparison-regression.test.js"], "verification": "targeted + Repository checks + DEV visual pending"}\n    }\n  ]\n}\n''')
          PY
      - name: Run targeted checks
        run: |
          node --check js/36-v141-content-systems.js
          node --check js/58-v173.63-functional-fixes.js
          node tests/ui-synthesis-dungeon-equipment-comparison-regression.test.js
          node tests/v143-combat-dungeon-polish.test.js
          node tests/v173.63-visible-ui-owner-repairs.test.js
          git diff --check
      - name: Commit verified fix and remove one-time workflow
        run: |
          rm -f .github/workflows/_apply-synthesis-first-render-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/36-v141-content-systems.js js/58-v173.63-functional-fixes.js tests/ui-synthesis-dungeon-equipment-comparison-regression.test.js HANDOFF.md release/requirement-batches/2026-09-07-synthesis-first-render-icons.json .github/workflows/_apply-synthesis-first-render-icons.yml
          git commit -m "fix: render synthesis icons on first open"
          git push origin HEAD:bugfix/synthesis-first-render-icons
