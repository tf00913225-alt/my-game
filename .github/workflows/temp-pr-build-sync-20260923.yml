name: TEMP PR production build sync 20260923

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/battle-ui-hit-status-owner-convergence-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Stop when production build is already synchronized
        id: check
        shell: bash
        run: |
          if npm run build:check; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate deterministic production build
        if: steps.check.outputs.synced != 'true'
        run: |
          npm run build
          git diff --check
          git add -A -- asset-manifest.json build index.html config/feature-manifest.json

      - name: Commit generated build through GitHub API
        if: steps.check.outputs.synced != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node <<'NODE'
          (async()=>{
          const fs=require("node:fs");
          const cp=require("node:child_process");
          const token=process.env.GH_TOKEN;
          const repo=process.env.REPO;
          const branch=process.env.BRANCH;
          const baseSha=cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();
          const raw=cp.execFileSync(
            "git",
            ["diff","--cached","--name-status","--no-renames","-z"],
            {encoding:"utf8"}
          );
          const parts=raw.split("\0").filter(Boolean);
          const changes=[];
          for(let i=0;i<parts.length;){
            const status=parts[i++];
            const path=parts[i++];
            if(!path){ throw new Error("Malformed staged diff"); }
            changes.push({status,path});
          }
          if(!changes.length){
            console.log("No generated changes to commit.");
            process.exit(0);
          }
          async function api(path,options={}){
            const response=await fetch("https://api.github.com/repos/"+repo+path,{
              method:options.method||"GET",
              headers:{
                "Accept":"application/vnd.github+json",
                "Authorization":"Bearer "+token,
                "X-GitHub-Api-Version":"2022-11-28",
                "Content-Type":"application/json"
              },
              body:options.body?JSON.stringify(options.body):undefined
            });
            if(!response.ok){
              throw new Error(response.status+" "+response.statusText+" "+await response.text());
            }
            return response.json();
          }
          const baseCommit=await api("/git/commits/"+baseSha);
          const entries=[];
          for(const change of changes){
            if(change.status==="D"){
              entries.push({path:change.path,mode:"100644",type:"blob",sha:null});
              continue;
            }
            const content=fs.readFileSync(change.path,"utf8");
            const blob=await api("/git/blobs",{method:"POST",body:{content,encoding:"utf-8"}});
            entries.push({path:change.path,mode:"100644",type:"blob",sha:blob.sha});
          }
          const tree=await api("/git/trees",{
            method:"POST",
            body:{base_tree:baseCommit.tree.sha,tree:entries}
          });
          const commit=await api("/git/commits",{
            method:"POST",
            body:{
              message:"build: synchronize production bundles",
              tree:tree.sha,
              parents:[baseSha]
            }
          });
          await api("/git/refs/heads/"+encodeURIComponent(branch),{
            method:"PATCH",
            body:{sha:commit.sha,force:false}
          });
          console.log("Created build commit "+commit.sha);
          })().catch(error=>{ console.error(error); process.exit(1); });
          NODE
