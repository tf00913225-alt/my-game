name: Temporary Readable Boss Card Build

on:
  push:
    branches:
      - fix/boss-ui-9x16-mobile-20260910

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Tune mechanism-card typography and concise copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_in_rule(path, selector, old, new):
              p=Path(path)
              text=p.read_text()
              start=text.find(selector)
              if start < 0:
                  raise SystemExit(f"Missing selector in {path}: {selector}")
              end=text.find("}",start)
              if end < 0:
                  raise SystemExit(f"Unclosed selector in {path}: {selector}")
              rule=text[start:end+1]
              if old in rule:
                  rule=rule.replace(old,new,1)
                  p.write_text(text[:start]+rule+text[end+1:])
                  return
              if new not in rule:
                  raise SystemExit(f"Missing token in {selector}: {old}")

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old in text:
                  p.write_text(text.replace(old,new,1))
                  return
              if new not in text:
                  raise SystemExit(f"Missing token in {path}: {old}")

          css="css/gameplay-boss-tower.css"
          replace_in_rule(css,"#game-stage #battleMonsterArea .boss-mechanism-kind{","font-size:12px;","font-size:13px;")
          replace_in_rule(css,"#game-stage #battleMonsterArea .boss-mechanism-name{","font-size:13px;","font-size:14px;")
          replace_in_rule(css,"#game-stage #battleMonsterArea .boss-mechanism-hp{","font-size:10px;","font-size:11px;")
          replace_in_rule(css,"#game-stage #battleMonsterArea .boss-mechanism-card::after{","font-size:10px;","font-size:11px;")
          replace_once(css,'content:"BOSS 受護體保護，優先擊破";','content:"護體中・優先擊破";')
          replace_once(css,'content:"倒數歸零發動重擊，擊破可取消";','content:"倒數重擊・擊破可取消";')
          replace_once(css,'content:"每回合恢復 BOSS 4% 最大生命";','content:"每回合回復 BOSS 4%";')
          replace_once(css,'content:"BOSS 傷害提高 25%";','content:"BOSS 傷害提高25%";')
          replace_once(css,'content:"我方治療與 SP 回復降低 40%";','content:"治療／SP 回復 -40%";')

          static="tests/boss-mechanism-vfx-card-ui-20260909.test.js"
          replace_once(static,"font-size:10px;[\\s\\S]*?font-weight:900","font-size:11px;[\\s\\S]*?font-weight:900")
          replace_once(static,'content:"BOSS 受護體保護，優先擊破"','content:"護體中・優先擊破"')
          replace_once(static,'content:"倒數歸零發動重擊，擊破可取消"','content:"倒數重擊・擊破可取消"')
          replace_once(static,'content:"每回合恢復 BOSS 4% 最大生命"','content:"每回合回復 BOSS 4%"')
          replace_once(static,'content:"BOSS 傷害提高 25%"','content:"BOSS 傷害提高25%"')
          replace_once(static,'content:"我方治療與 SP 回復降低 40%"','content:"治療／SP 回復 -40%"')
          extra='''assert.match(boss,/\\.boss-mechanism-kind\\{[\\s\\S]*?order:1;[\\s\\S]*?font-size:13px;/);\nassert.match(boss,/\\.boss-mechanism-name\\{[\\s\\S]*?order:2;[\\s\\S]*?font-size:14px;[\\s\\S]*?-webkit-line-clamp:2;/);'''
          p=Path(static); text=p.read_text()
          old_pair='''assert.match(boss,/\\.boss-mechanism-kind\\{[\\s\\S]*?order:1;/);\nassert.match(boss,/\\.boss-mechanism-name\\{[\\s\\S]*?order:2;[\\s\\S]*?-webkit-line-clamp:2;/);'''
          if old_pair in text:
              p.write_text(text.replace(old_pair,extra,1))
          elif extra not in text:
              raise SystemExit("Static typography assertions not found")

          preserve="tests/ui-typography-battle-preservation.test.js"
          replace_once(preserve,"font-size:10px;[\\s\\S]*?font-weight:900","font-size:11px;[\\s\\S]*?font-weight:900")
          PY
      - name: Rebuild deterministic production assets
        run: node scripts/build-production.mjs
      - name: Verify scoped UI and typography
        run: |
          node tests/boss-mechanism-vfx-card-ui-20260909.test.js
          node tests/boss-mobile-portrait-browser.test.js
          node tests/gameplay-hub-ui-and-icon.test.js
          node tests/ui-typography-battle-preservation.test.js
          node tests/ui-typography-standard.test.js
      - name: Commit verified source, tests, and production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A css/gameplay-boss-tower.css tests/boss-mechanism-vfx-card-ui-20260909.test.js tests/ui-typography-battle-preservation.test.js build asset-manifest.json index.html
          if git diff --cached --quiet; then
            echo "Readable mechanism-card build is already current."
            exit 0
          fi
          git commit -m "fix: keep boss mechanism card readable"
          git push origin "HEAD:${GITHUB_REF_NAME}"
