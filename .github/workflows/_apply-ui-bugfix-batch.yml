name: Apply UI bugfix batch

on:
  push:
    branches:
      - bugfix/synthesis-dungeon-equipment-ui

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: repair synthesis dungeon and equipment UI') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bugfix branch
        uses: actions/checkout@v4
        with:
          ref: bugfix/synthesis-dungeon-equipment-ui
          fetch-depth: 2

      - name: Apply owner-level fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text=read(path)
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              text=text.replace(old,new,1)
              write(path,text)

          def regex_once(path, pattern, replacement):
              text=read(path)
              text2,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
              if count!=1:
                  raise SystemExit(f"expected exactly one regex replacement in {path}, got {count}: {pattern[:100]!r}")
              write(path,text2)

          # 1. Reforge material tiers: one compact horizontal rail instead of a 2-column vertical grid.
          replace_once(
              "css/38-v141-system-expansion.css",
              '#game-stage .v17358-reforge-tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}',
              '#game-stage .v17358-reforge-tiers{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:0 0 4px;overscroll-behavior-x:contain;touch-action:pan-x;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;scrollbar-width:thin;}'
          )
          replace_once(
              "css/38-v141-system-expansion.css",
              '#game-stage .v17358-reforge-tier{display:flex!important;min-height:58px!important;flex-direction:column;align-items:flex-start!important;justify-content:center!important;gap:1px;padding:6px 8px!important;border:1px solid #72552d!important;border-radius:7px!important;background:linear-gradient(180deg,#291f13,#110d08)!important;color:#e8d6ae!important;text-align:left!important;}',
              '#game-stage .v17358-reforge-tier{display:flex!important;flex:0 0 142px!important;min-width:142px!important;min-height:58px!important;flex-direction:column;align-items:flex-start!important;justify-content:center!important;gap:1px;padding:6px 8px!important;border:1px solid #72552d!important;border-radius:7px!important;background:linear-gradient(180deg,#291f13,#110d08)!important;color:#e8d6ae!important;text-align:left!important;scroll-snap-align:start;}'
          )
          replace_once(
              "js/01-stage-v8-touch-lock.js",
              '"#statusHelpModal .item-stat-list, .skill-preview-body, .creation-skill-detail-levels, #dungeonTabContent, .v17342-abyss-battle-log, .v143-item-picker, " +',
              '"#statusHelpModal .item-stat-list, .skill-preview-body, .creation-skill-detail-levels, #dungeonTabContent, .v17342-abyss-battle-log, .v143-item-picker, .v17358-reforge-tiers, .v17363-game-select-menu, " +'
          )

          # 2. Reward previews are mounted under document.body, not #game-stage. Style the actual owner and give it enough height.
          reward_css=read("css/33-v132-content-expansion.css")
          reward_marker="/* 2026-09-07 — body-mounted text-only dungeon reward preview owner */"
          if reward_marker not in reward_css:
              reward_css += r'''

/* 2026-09-07 — body-mounted text-only dungeon reward preview owner */
.v132-reward-modal .v132-reward-modal-inner.v17363-text-reward-preview{
    width:min(100%,392px) !important;
    height:min(600px,calc(100dvh - 28px)) !important;
    max-width:392px !important;
    max-height:calc(100dvh - 28px) !important;
    min-height:min(520px,calc(100dvh - 28px)) !important;
    padding:18px !important;
    border:1px solid rgba(213,164,82,.82) !important;
    border-radius:15px !important;
    background:radial-gradient(circle at 50% 0,rgba(232,177,77,.16),transparent 36%),linear-gradient(160deg,#22170e,#090807 76%) !important;
    box-shadow:0 22px 52px rgba(0,0,0,.78),inset 0 0 0 1px rgba(255,231,171,.07) !important;
    overflow-x:hidden !important;
    overflow-y:auto !important;
}
