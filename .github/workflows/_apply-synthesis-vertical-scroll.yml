name: Apply synthesis vertical scroll fix

on:
  push:
    branches:
      - bugfix/synthesis-vertical-scroll

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bugfix branch
        uses: actions/checkout@v4
        with:
          ref: bugfix/synthesis-vertical-scroll
          fetch-depth: 2

      - name: Apply owner-level vertical scroll fix
        run: python3 .github/scripts/_apply-synthesis-vertical-scroll.py

      - name: Run targeted regression checks
        shell: bash
        run: |
          node --check js/01-stage-v8-touch-lock.js
          node --check js/58-v173.63-functional-fixes.js
          node tests/v173.45-synthesis-touch-icon.test.js
          node tests/ui-synthesis-large-panel-browser.test.js
          node tests/v173.58-reforge-redesign.test.js
          node tests/v173.63-visible-ui-owner-repairs.test.js
          CI_BASE_SHA="" node .github/scripts/release-gate.mjs ci
          git diff --check

      - name: Commit verified fix and remove one-time migration files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-synthesis-vertical-scroll.yml .github/scripts/_apply-synthesis-vertical-scroll.py
          git add css/38-v141-system-expansion.css js/01-stage-v8-touch-lock.js js/58-v173.63-functional-fixes.js \
                  tests/ui-synthesis-large-panel-browser.test.js tests/v173.45-synthesis-touch-icon.test.js \
                  release/requirement-batches/2026-09-07-synthesis-vertical-scroll.json HANDOFF.md
          git commit -m "fix: enable vertical scrolling in synthesis pages"
          git push origin HEAD:bugfix/synthesis-vertical-scroll
