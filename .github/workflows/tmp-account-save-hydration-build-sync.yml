name: Temporary account save hydration build sync

on:
  push:
    branches:
      - fix/account-save-legacy-skill-hydration-20260919
    paths:
      - .github/workflows/tmp-account-save-hydration-build-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: fix/account-save-legacy-skill-hydration-20260919
          fetch-depth: 0

      - name: Build production bundles
        run: |
          npm run build
          git diff --check

      - name: Commit synchronized build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json build
          if git diff --cached --quiet; then
            echo "Build already synchronized"
          else
            git commit -m "build: sync account save hydration bundles"
            git push origin HEAD:fix/account-save-legacy-skill-hydration-20260919
          fi
