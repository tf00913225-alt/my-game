name: V171 Fixed Slot Contract Validation

on:
  push:
    branches:
      - validation/v171-contract-run-20260917

permissions:
  contents: read

jobs:
  validate-v171:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/v171-contract-run-20260917
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify candidate scope
        shell: bash
        run: |
          base=67f4ff1d41f2135a3983bdbbd480a78604dcd7e8
          git fetch --no-tags --depth=1 origin "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fx "tests/v171-combat-vfx-fixes.test.js"
          printf '%s\n' "$changed" | grep -Fx ".github/workflows/validation-v171-contract.yml"
          test -z "$(git diff --name-only "$base" HEAD -- js css scripts config asset-manifest.json)"

      - name: Run V171 contract
        run: node tests/v171-combat-vfx-fixes.test.js

      - name: Run formal VFX geometry regressions
        shell: bash
        run: |
          node tests/v153-fire-vfx.test.js
          node tests/v166-water-vfx.test.js
          node tests/boss-vfx-reliability-20260914.test.js
          node tests/mechanism-card-vfx-reliability-20260914.test.js
          node tests/fixed-slot-battlefield-rendering-v2.test.js
