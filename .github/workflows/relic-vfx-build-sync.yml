name: Relic VFX build sync

on:
  push:
    branches:
      - feature/relic-vfx-animation-20260918
    paths:
      - .github/workflows/relic-vfx-build-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/relic-vfx-animation-20260918
          fetch-depth: 0

      - name: Source syntax
        run: |
          node --check js/39-v143-skill-animation.js
          node --check js/60-team-relic-system.js
          node --check tests/relic-vfx-animation-20260918.test.js

      - name: Focused relic and VFX tests
        run: |
          node tests/relic-vfx-animation-20260918.test.js
          node tests/v174-team-relic-system.test.js
          node tests/v174-team-relic-hardening.test.js
          node tests/v142-skill-animation.test.js
          node tests/battle-layout-vfx-runtime-20260917.test.js
          node tests/battle-primary-target-vfx-anchor-20260917.test.js

      - name: Synchronize production build
        run: npm run build

      - name: Verify synchronized build
        run: |
          npm run build:check
          git diff --check

      - name: Commit generated build outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A build asset-manifest.json index.html
          if git diff --cached --quiet; then
            echo "Generated build already synchronized"
          else
            git commit -m "build: synchronize relic VFX integration"
            git push origin HEAD:feature/relic-vfx-animation-20260918
          fi
