name: Temp Facebook diagnostic rebuild

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'fix/facebook-public-profile-diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate deterministic production assets
        run: node scripts/build-production.mjs
      - name: Commit generated assets
        shell: bash
        run: |
          git add index.html asset-manifest.json build/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate Facebook diagnostic assets"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
