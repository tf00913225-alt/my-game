name: Temporary potion asset stage

on:
  push:
    branches:
      - fix/potion-names-icons-webp-20260920

permissions:
  contents: write

jobs:
  convert:
    if: contains(github.event.head_commit.message, '[potion-asset-stage]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/potion-names-icons-webp-20260920
          fetch-depth: 0
      - name: Convert six potion icons losslessly
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y webp python3-pil
          mkdir -p assets/items/potions

          cwebp -quiet -lossless -exact "assets/inbox/道具icon/回春散icon.png" -o assets/items/potions/hp-potion-10-huichun.webp
          cwebp -quiet -lossless -exact "assets/inbox/道具icon/養命丹icon.png" -o assets/items/potions/hp-potion-20-yangming.webp
          cwebp -quiet -lossless -exact "assets/inbox/道具icon/大還丹icon.png" -o assets/items/potions/hp-potion-30-dahuan.webp
          cwebp -quiet -lossless -exact "assets/inbox/道具icon/凝氣散icon.png" -o assets/items/potions/sp-potion-10-ningqi.webp
          cwebp -quiet -lossless -exact "assets/inbox/道具icon/聚氣丹icon.png" -o assets/items/potions/sp-potion-20-juqi.webp
          cwebp -quiet -lossless -exact "assets/inbox/道具icon/歸元丹icon.png" -o assets/items/potions/sp-potion-30-guiyuan.webp

          python3 - <<'PY'
          from PIL import Image, ImageChops
          pairs = [
              ("assets/inbox/道具icon/回春散icon.png","assets/items/potions/hp-potion-10-huichun.webp"),
              ("assets/inbox/道具icon/養命丹icon.png","assets/items/potions/hp-potion-20-yangming.webp"),
              ("assets/inbox/道具icon/大還丹icon.png","assets/items/potions/hp-potion-30-dahuan.webp"),
              ("assets/inbox/道具icon/凝氣散icon.png","assets/items/potions/sp-potion-10-ningqi.webp"),
              ("assets/inbox/道具icon/聚氣丹icon.png","assets/items/potions/sp-potion-20-juqi.webp"),
              ("assets/inbox/道具icon/歸元丹icon.png","assets/items/potions/sp-potion-30-guiyuan.webp"),
          ]
          for src, dst in pairs:
              with Image.open(src) as a, Image.open(dst) as b:
                  assert a.size == b.size == (1254, 1254), (src, a.size, b.size)
                  ar, br = a.convert("RGBA"), b.convert("RGBA")
                  assert ImageChops.difference(ar, br).getbbox() is None, dst
                  assert ar.getchannel("A").getextrema() == br.getchannel("A").getextrema(), dst
          print("six lossless WebP potion icons verified")
          PY

          rm -rf "assets/inbox/道具icon"
          rm -f .github/workflows/_tmp-potion-asset-stage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: import six potion icons as lossless WebP"
          git push origin HEAD:fix/potion-names-icons-webp-20260920
