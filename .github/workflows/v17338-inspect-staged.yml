name: Inspect water skill learn gate

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17338-inspect-staged.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Inspect learnSkill
        run: |
          grep -n -A 140 -B 30 'function learnSkill' js/00-main.js || true
          grep -n -A 100 -B 20 'function isSkillPrereqMet' js/00-main.js || true
          grep -n -A 50 -B 20 'floodBeast' js/50-v169-water-skill-rules.js | head -120 || true
