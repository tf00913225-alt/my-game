name: Temporary branch production build sync

on:
  push:
    branches:
      - fix/battle-info-sp-result-layout-20260923
    paths:
      - .github/workflows/branch-build-sync-temporary.yml

permissions:
  contents: write

jobs:
  build-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/battle-info-sp-result-layout-20260923
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build deterministic production bundles
        run: npm run build
      - name: Commit generated production outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html asset-manifest.json build
          if git diff --cached --quiet; then
            echo "Production outputs already synchronized."
            exit 0
          fi
          git commit -m "build: sync result layout production bundle"
          git push origin HEAD:fix/battle-info-sp-result-layout-20260923
