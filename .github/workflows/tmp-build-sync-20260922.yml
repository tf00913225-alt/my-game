name: Temporary build sync 20260922

on:
  push:
    branches:
      - fix/battle-status-carousel-drawers-vfx-20260922

permissions:
  contents: write

jobs:
  sync-build:
    if: ${{ !contains(github.event.head_commit.message, '[build-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild canonical production output
        run: npm run build
      - name: Verify synchronized output
        run: npm run build:check
      - name: Commit synchronized build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html asset-manifest.json build
          if git diff --cached --quiet; then
            echo "Build already synchronized."
            exit 0
          fi
          git commit -m "[build-sync] battle: synchronize production bundle"
          git push origin HEAD:fix/battle-status-carousel-drawers-vfx-20260922
