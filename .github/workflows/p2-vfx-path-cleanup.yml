name: P2 VFX path cleanup

on:
  push:
    branches:
      - chore/p2-pr-vfx-inbox-cleanup-20260914-runner3

permissions:
  contents: write

jobs:
  relocate:
    if: ${{ !contains(github.event.head_commit.message, '[p2-vfx-cleanup-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Relocate formal Wind VFX and update references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/vfx/wind

          git mv 'assets/inbox/暴風拳-技能動態圖.png' 'assets/vfx/wind/storm-fist-cast.png'
          git mv 'assets/inbox/暴風亂擊-技能動態圖.png' 'assets/vfx/wind/storm-flurry-cast.png'
          git mv 'assets/inbox/風旋十字斬-技能動態圖.png' 'assets/vfx/wind/wind-cross-slash-cast.png'
          git mv 'assets/inbox/暈眩猛擊-技能動態圖.png' 'assets/vfx/wind/dizzy-fist-cast.png'
          git mv 'assets/inbox/狂風術-技能動態圖.png' 'assets/vfx/wind/wind-spell-cast.png'
          git mv 'assets/inbox/風焰術-技能動態圖.png' 'assets/vfx/wind/storm-circle-cast.png'
          git mv 'assets/inbox/風哮電擊-技能動態圖.png' 'assets/vfx/wind/wind-howl-lightning-cast.png'
          git mv 'assets/inbox/風起雲湧-技能動態圖.png' 'assets/vfx/wind/storm-rain-cast.png'
          git mv 'assets/inbox/閃躲術-技能動態圖.png' 'assets/vfx/wind/dodge-skill-cast.png'
          git mv 'assets/inbox/隱身術-技能動態圖.png' 'assets/vfx/wind/stealth-skill-cast.png'
          git mv 'assets/inbox/氣定神閒-技能動態圖.png' 'assets/vfx/wind/dinghaishenzhen-cast.png'
          git mv 'assets/inbox/重力-狀態循環圖.png' 'assets/vfx/wind/agility-down-loop.png'
          git mv 'assets/inbox/殤風-狀態循環圖.png' 'assets/vfx/wind/damage-down-loop.png'
          git mv 'assets/inbox/暈眩-狀態循環圖.png' 'assets/vfx/wind/stun-loop.png'
          git mv 'assets/inbox/風行-狀態循環圖.png' 'assets/vfx/wind/dodge-skill-loop.png'
          git mv 'assets/inbox/隱身-狀態循環圖.png' 'assets/vfx/wind/stealth-skill-loop.png'
          git mv 'assets/inbox/氣定神閒-狀態循環圖.png' 'assets/vfx/wind/dinghaishenzhen-loop.png'

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'assets/inbox/暴風拳-技能動態圖.png': 'assets/vfx/wind/storm-fist-cast.png',
              'assets/inbox/暴風亂擊-技能動態圖.png': 'assets/vfx/wind/storm-flurry-cast.png',
              'assets/inbox/風旋十字斬-技能動態圖.png': 'assets/vfx/wind/wind-cross-slash-cast.png',
              'assets/inbox/暈眩猛擊-技能動態圖.png': 'assets/vfx/wind/dizzy-fist-cast.png',
              'assets/inbox/狂風術-技能動態圖.png': 'assets/vfx/wind/wind-spell-cast.png',
              'assets/inbox/風焰術-技能動態圖.png': 'assets/vfx/wind/storm-circle-cast.png',
              'assets/inbox/風哮電擊-技能動態圖.png': 'assets/vfx/wind/wind-howl-lightning-cast.png',
              'assets/inbox/風起雲湧-技能動態圖.png': 'assets/vfx/wind/storm-rain-cast.png',
              'assets/inbox/閃躲術-技能動態圖.png': 'assets/vfx/wind/dodge-skill-cast.png',
              'assets/inbox/隱身術-技能動態圖.png': 'assets/vfx/wind/stealth-skill-cast.png',
              'assets/inbox/氣定神閒-技能動態圖.png': 'assets/vfx/wind/dinghaishenzhen-cast.png',
              'assets/inbox/重力-狀態循環圖.png': 'assets/vfx/wind/agility-down-loop.png',
              'assets/inbox/殤風-狀態循環圖.png': 'assets/vfx/wind/damage-down-loop.png',
              'assets/inbox/暈眩-狀態循環圖.png': 'assets/vfx/wind/stun-loop.png',
              'assets/inbox/風行-狀態循環圖.png': 'assets/vfx/wind/dodge-skill-loop.png',
              'assets/inbox/隱身-狀態循環圖.png': 'assets/vfx/wind/stealth-skill-loop.png',
              'assets/inbox/氣定神閒-狀態循環圖.png': 'assets/vfx/wind/dinghaishenzhen-loop.png',
          }

          owner = Path('js/39-v143-skill-animation.js')
          text = owner.read_text(encoding='utf-8')
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing owner reference: {old}')
              text = text.replace(old, new)
          owner.write_text(text, encoding='utf-8')

          test = Path('tests/v173.23-wind-vfx.test.js')
          text = test.read_text(encoding='utf-8')
          filename_map = {old.rsplit('/', 1)[1]: new.rsplit('/', 1)[1] for old, new in replacements.items()}
          for old, new in filename_map.items():
              if old not in text:
                  raise SystemExit(f'missing test filename: {old}')
              text = text.replace(old, new)
              text = text.replace(old[:-4], new[:-4])
          text = text.replace('assets/inbox/', 'assets/vfx/wind/')
          test.write_text(text, encoding='utf-8')
          PY

          cat > assets/inbox/README.md <<'EOF'
          # assets/inbox

          此目錄只用於原始母圖、待處理素材與尚未正式導入的 staging assets。

          - 正式 runtime 不得直接引用 `assets/inbox/`。
          - 已正式採用的 VFX 必須移至 `assets/vfx/<element>/` 等正式路徑。
          - 圖片格式、WebP、透明度、尺寸與 Sprite Sheet 驗證以 `docs/IMAGE_ASSET_SPEC.md` 為準。
          - 不得因整理 inbox 而刪除仍被正式程式引用的素材。

          2026-09-14：既有正式 Wind VFX 已由 `assets/inbox/` 遷移至 `assets/vfx/wind/`；本次只搬移原始 blob，不重新壓縮、不改尺寸、不改幀排列。
          EOF

          if grep -R -n --include='*.js' --include='*.html' --include='*.css' 'assets/inbox/' js css index.html; then
            echo 'ERROR: formal runtime still references assets/inbox/' >&2
            exit 1
          fi

          git diff --check
          node tests/v173.23-wind-vfx.test.js
          node tests/v174-raster-only-combat-vfx-owner.test.js
          node tests/boss-vfx-reliability-20260914.test.js
          node scripts/build-production.mjs --check

      - name: Commit verified cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/p2-vfx-path-cleanup.yml'
          git add -A
          git diff --cached --check
          git commit -m 'chore: formalize Wind VFX asset paths [p2-vfx-cleanup-done]'
          git push origin HEAD:${GITHUB_REF_NAME}
