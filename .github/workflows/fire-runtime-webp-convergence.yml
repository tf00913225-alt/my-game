name: Fire runtime WebP convergence

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - fix/fire-monster-runtime-webp-convergence-20260928

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Convert adopted fire runtime portraits to lossless WebP
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp
          node <<'NODE'
          const fs=require("node:fs");
          const {execFileSync}=require("node:child_process");
          const registryPath="config/monster-portrait-registry.json";
          const registry=JSON.parse(fs.readFileSync(registryPath,"utf8"));
          const selected=registry.assetPool.entries.filter(entry =>
            entry.element==="fire" &&
            entry.status==="adopted" &&
            /\.png$/i.test(entry.runtimePath)
          );
          if(selected.length!==21) throw new Error("Expected 21 PNG fire runtime portraits, got "+selected.length);
          for(const entry of selected){
            const src=entry.runtimePath;
            const dest=src.replace(/\.png$/i,".webp");
            execFileSync("convert",[src,"-define","webp:lossless=true","-quality","100",dest],{stdio:"inherit"});
            const identify=execFileSync("identify",["-format","%m %wx%h %[channels]",dest],{encoding:"utf8"}).trim();
            if(!/^WEBP \d+x\d+/.test(identify)) throw new Error("Invalid WebP: "+dest+" "+identify);
            if(!identify.includes("a") && !identify.includes("rgba")) throw new Error("Transparency channel missing: "+dest+" "+identify);
            fs.unlinkSync(src);
            entry.runtimePath=dest;
          }
          fs.writeFileSync(registryPath,JSON.stringify(registry,null,2)+"\n");
          console.log("Converted",selected.length,"fire runtime portraits.");
          NODE

      - name: Update runtime portrait manifest and verify all adopted fire assets
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          const crypto=require("node:crypto");
          const registry=JSON.parse(fs.readFileSync("config/monster-portrait-registry.json","utf8"));
          const fire=registry.assetPool.entries.filter(e=>e.element==="fire"&&e.status==="adopted");
          if(fire.length!==39) throw new Error("Expected 39 adopted fire assets, got "+fire.length);
          const portraitManifest=fire.map(e=>{
            const path=e.runtimePath;
            if(!/\.webp$/i.test(path)) throw new Error("Non-WebP runtime path: "+e.assetId);
            const bytes=fs.readFileSync(path);
            return {assetId:e.assetId,displayName:e.displayName,path,sha256:crypto.createHash("sha256").update(bytes).digest("hex"),bytes:bytes.length,decode:true};
          });
          for(const file of ["asset-manifest.json","build/asset-manifest.json"]){
            const raw=fs.readFileSync(file,"utf8"); let manifest; try{ manifest=JSON.parse(raw); }catch(error){ console.error("Manifest parse failed:",file,"length",raw.length,"tail",raw.slice(-200)); throw error; }
            manifest.runtimePortraits={fire:portraitManifest};
            fs.writeFileSync(file,JSON.stringify(manifest,null,2)+"\n");
          }
          console.log("Manifest updated with",portraitManifest.length,"fire WebP portraits.");
          NODE

      - name: Commit conversion and remove temporary workflow
        run: |
          rm -f .github/workflows/fire-runtime-webp-convergence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: convert fire runtime portraits to lossless webp"
          git push origin HEAD:${{ github.ref_name }}
