name: Apply V173.48 premium one-screen shop layout

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'retry v173.48 premium shop layout')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply patch
        run: |
          python .github/scripts/apply-v17348-shop-layout.py
          node --check js/equipment-progression.js
          node --check js/20-anonymous-20.js
          node --check js/51-v169-rpg-ui.js
          node tests/v173.48-premium-shop-layout.test.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/49-v169-rpg-ui.css js/equipment-progression.js js/20-anonymous-20.js js/51-v169-rpg-ui.js index.html tests/v173.48-premium-shop-layout.test.js
          git commit -m "V173.48 premium one-screen shop layout"
          git push origin HEAD:dev
