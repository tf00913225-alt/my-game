name: TEMP Premium UI Build Sync

on:
  push:
    branches:
      - feature/premium-functional-ui-demo-parity-20260916
    paths:
      - .github/workflows/temp-premium-ui-build-sync.yml

permissions:
  contents: write

concurrency:
  group: temp-premium-ui-build-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui-demo-parity-20260916
          fetch-depth: 2

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify exact branch head
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "tf00913225-alt/my-game"
          test "$GITHUB_REF_NAME" = "feature/premium-functional-ui-demo-parity-20260916"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feature/premium-functional-ui-demo-parity-20260916 | cut -f1)"
          test -n "$REMOTE_HEAD"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"

      - name: Build production assets
        run: npm run build

      - name: Verify synchronized build
        run: npm run build:check

      - name: Remove temporary export helpers and this workflow
        shell: bash
        run: |
          rm -f artifacts/build-sync/gameplay-core.ad03197fc360.js
          rm -f artifacts/build-sync/gameplay-core.0ffc92e3e32e.css
          rm -f artifacts/build-sync/feature-boss-relic.bdab8a40dfe3.css
          rmdir artifacts/build-sync 2>/dev/null || true
          rmdir artifacts 2>/dev/null || true
          rm -f .github/workflows/temp-premium-ui-build-sync.yml

      - name: Enforce build-sync scope
        shell: bash
        run: |
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              asset-manifest.json|index.html|build/gameplay-core.*|build/feature-boss-relic.*|artifacts/build-sync/gameplay-core.ad03197fc360.js|artifacts/build-sync/gameplay-core.0ffc92e3e32e.css|artifacts/build-sync/feature-boss-relic.bdab8a40dfe3.css|.github/workflows/temp-premium-ui-build-sync.yml)
                ;;
              *)
                echo "Unexpected build-sync change: $path"
                unexpected=1
                ;;
            esac
          done < <(git status --short | sed -E 's/^.. //')
          test "$unexpected" = "0"
          test -f build/gameplay-core.ad03197fc360.js
          test -f build/gameplay-core.0ffc92e3e32e.css
          test -f build/feature-boss-relic.bdab8a40dfe3.css
          test ! -e .github/workflows/temp-premium-ui-build-sync.yml
          test ! -e artifacts/build-sync/gameplay-core.ad03197fc360.js
          test ! -e artifacts/build-sync/gameplay-core.0ffc92e3e32e.css
          test ! -e artifacts/build-sync/feature-boss-relic.bdab8a40dfe3.css
          git diff --check

      - name: Commit synchronized production build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- asset-manifest.json index.html build artifacts .github/workflows/temp-premium-ui-build-sync.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "build: synchronize premium functional UI assets"
          git push origin HEAD:refs/heads/feature/premium-functional-ui-demo-parity-20260916
