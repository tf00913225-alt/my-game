name: TEMP V173.72 Production Live QA

on:
  push:
    branches:
      - release/v17372-production-closeout-20260924

permissions:
  contents: read

jobs:
  production-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 871e7ff9cb3219ee6ce499eedbed95a89af35431
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify production release metadata
        env:
          PROD_BASE_URL: https://tf00913225-alt.github.io/my-game
          EXPECTED_COMMIT_SHA: 871e7ff9cb3219ee6ce499eedbed95a89af35431
        run: |
          node <<'NODE'
          const base=process.env.PROD_BASE_URL.replace(/\/$/,"");
          const expected=process.env.EXPECTED_COMMIT_SHA;
          async function json(path){
            const response=await fetch(base+path+"?qa="+Date.now(),{headers:{"cache-control":"no-cache"}});
            if(!response.ok) throw new Error(path+" HTTP "+response.status);
            return response.json();
          }
          (async()=>{
            const release=await json("/release/release.json");
            const notice=await json("/release/release-update.json");
            if(String(release.version)!=="173.72"||String(release.cacheVersion)!=="173.72"){
              throw new Error("Production Game/Cache mismatch: "+JSON.stringify(release));
            }
            if(String(notice.releaseVersion)!=="V173.72"){
              throw new Error("Production release notice mismatch: "+JSON.stringify(notice));
            }
            console.log("Production release metadata PASS",JSON.stringify({
              version:release.version,cacheVersion:release.cacheVersion,
              notice:notice.releaseVersion,expectedPagesCommit:expected
            }));
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Run production Battle live QA
        env:
          DEV_BASE_URL: https://tf00913225-alt.github.io/my-game
          EXPECTED_COMMIT_SHA: 871e7ff9cb3219ee6ce499eedbed95a89af35431
        run: node .github/scripts/battle-layer-audio-live-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v17372-production-battle-live-qa
          path: |
            artifacts/browser-qa/battle-layer-audio-live-qa.json
            artifacts/browser-qa/battle-layout-wind-flame-mobile.png
            artifacts/browser-qa/battle-layer-element-box-mobile.png
            artifacts/browser-qa/battle-result-modal-mobile.png
            artifacts/browser-qa/boss-target-entity-live-412x915.png
          if-no-files-found: error
          retention-days: 90
