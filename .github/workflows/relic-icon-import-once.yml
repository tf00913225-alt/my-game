name: Relic icon import once

on:
  push:
    branches:
      - feature/relic-icons-webp-20260918

permissions:
  contents: write

jobs:
  convert-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/relic-icons-webp-20260918
          fetch-depth: 0

      - name: Fetch source asset branch
        run: git fetch origin assets-library:refs/remotes/origin/assets-library

      - name: Install lossless WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Convert confirmed relic assets losslessly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/relics/icons assets/relics/fragments
          convert_one() {
            src="$1"
            dest="$2"
            tmp="$RUNNER_TEMP/$(basename "$dest").png"
            git show "origin/assets-library:$src" > "$tmp"
            src_size="$(identify -format '%wx%h' "$tmp")"
            src_opaque="$(identify -format '%[opaque]' "$tmp")"
            cwebp -quiet -lossless -exact -m 6 -metadata all "$tmp" -o "$dest"
            webpinfo "$dest" >/dev/null
            dst_size="$(identify -format '%wx%h' "$dest")"
            dst_opaque="$(identify -format '%[opaque]' "$dest")"
            test "$src_size" = "$dst_size"
            test "$src_opaque" = "$dst_opaque"
            diff_pixels="$(compare -metric AE "$tmp" "$dest" null: 2>&1 || true)"
            test "$diff_pixels" = "0"
          }
          convert_one "assets/inbox/秘寶icon/乾坤玉壺.png" "assets/relics/icons/relic_qiankun_flask.webp"
          convert_one "assets/inbox/秘寶icon/烈陽神珠.png" "assets/relics/icons/relic_sun_orb.webp"
          convert_one "assets/inbox/秘寶icon/玄武靈印.png" "assets/relics/icons/relic_xuanwu_seal.webp"
          convert_one "assets/inbox/秘寶icon/鎮魂古鐘.png" "assets/relics/icons/relic_soul_bell.webp"
          convert_one "assets/inbox/秘寶icon/天罡戰旗.png" "assets/relics/icons/relic_tiangang_banner.webp"
          convert_one "assets/inbox/秘寶icon/九龍神火罩.png" "assets/relics/icons/relic_nine_dragon_fire.webp"
          convert_one "assets/inbox/秘寶icon/青嵐羽符.png" "assets/relics/icons/relic_qinglan_feather.webp"
          convert_one "assets/inbox/秘寶icon/岩岳鎮印.png" "assets/relics/icons/relic_rock_mountain_seal.webp"
          convert_one "assets/inbox/秘寶icon/回天寶輪.png" "assets/relics/icons/relic_returning_wheel.webp"
          convert_one "assets/inbox/秘寶icon/太初聖符.png" "assets/relics/icons/relic_origin_talisman.webp"
          convert_one "assets/inbox/秘寶icon/破軍殘卷.png" "assets/relics/icons/relic_broken_army_scroll.webp"
          convert_one "assets/inbox/秘寶icon/赤霄戰紋.png" "assets/relics/icons/relic_red_sky_war_mark.webp"
          convert_one "assets/inbox/秘寶icon/玄冰鏡心.png" "assets/relics/icons/relic_ice_mirror_heart.webp"
          convert_one "assets/inbox/秘寶icon/追風行符.png" "assets/relics/icons/relic_wind_chasing_talisman.webp"
          convert_one "assets/inbox/秘寶icon/山河寶鼎.png" "assets/relics/icons/relic_mountain_river_cauldron.webp"
          convert_one "assets/inbox/秘寶icon/焚星殘印.png" "assets/relics/icons/relic_burning_star_mark.webp"
          convert_one "assets/inbox/秘寶icon/靈泉法瓶.png" "assets/relics/icons/relic_spirit_spring_bottle.webp"
          convert_one "assets/inbox/秘寶icon/伏魔金印.png" "assets/relics/icons/relic_demon_suppressing_seal.webp"
          convert_one "assets/inbox/秘寶icon/萬象歸元盤.png" "assets/relics/icons/relic_all_returning_array.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/乾坤玉壺 碎片.png" "assets/relics/fragments/relic_qiankun_flask.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/烈陽神珠 碎片.png" "assets/relics/fragments/relic_sun_orb.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/玄武靈印 碎片.png" "assets/relics/fragments/relic_xuanwu_seal.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/鎮魂古鐘 碎片.png" "assets/relics/fragments/relic_soul_bell.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/天罡戰旗 碎片.png" "assets/relics/fragments/relic_tiangang_banner.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/九龍神火罩 碎片.png" "assets/relics/fragments/relic_nine_dragon_fire.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/青嵐羽符 碎片.png" "assets/relics/fragments/relic_qinglan_feather.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/岩岳鎮印 碎片.png" "assets/relics/fragments/relic_rock_mountain_seal.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/回天寶輪 碎片.png" "assets/relics/fragments/relic_returning_wheel.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/太初聖符 碎片.png" "assets/relics/fragments/relic_origin_talisman.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/破軍殘卷 碎片.png" "assets/relics/fragments/relic_broken_army_scroll.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/赤霄戰紋 碎片.png" "assets/relics/fragments/relic_red_sky_war_mark.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/玄冰鏡心 碎片.png" "assets/relics/fragments/relic_ice_mirror_heart.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/追風行符 碎片.png" "assets/relics/fragments/relic_wind_chasing_talisman.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/山河寶鼎 碎片.png" "assets/relics/fragments/relic_mountain_river_cauldron.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/焚星殘印 碎片.png" "assets/relics/fragments/relic_burning_star_mark.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/靈泉法瓶 碎片.png" "assets/relics/fragments/relic_spirit_spring_bottle.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/伏魔金印 碎片.png" "assets/relics/fragments/relic_demon_suppressing_seal.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/萬象歸元盤 碎片.png" "assets/relics/fragments/relic_all_returning_array.webp"
          convert_one "assets/inbox/秘寶icon/秘寶碎片icon/通用碎片icon.png" "assets/relics/fragments/relic_universal_fragment.webp"

      - name: Build and targeted regression
        run: |
          set -euo pipefail
          node --check js/60-team-relic-system.js
          node --check js/relic-progression-drop-system.js
          npm run build
          node --test tests/relic-icon-assets.test.mjs tests/v174-relic-square-art-ui.test.js tests/v174-relic-progression-drop-system.test.js
          npm run build:check
          git diff --check

      - name: Commit generated assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/relic-icon-import-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import relic and fragment WebP icons"
          git push origin HEAD:feature/relic-icons-webp-20260918
