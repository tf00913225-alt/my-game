name: One-time V173.71 build verify

on:
  push:
    branches:
      - release/v17371-prep-20260922

permissions:
  contents: write

concurrency:
  group: one-time-v17371-build-verify
  cancel-in-progress: false

jobs:
  build-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v17371-prep-20260922

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install existing asset-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build and verify V173.71
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run build:check
          node .github/scripts/release-gate.mjs ci
          npm test
          git diff --check

      - name: Commit synchronized production build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset-manifest.json build index.html
          if git diff --cached --quiet; then
            echo 'Production build already synchronized.'
            exit 0
          fi
          git commit -m 'build: sync V173.71 production bundles'
          git push origin HEAD:release/v17371-prep-20260922
