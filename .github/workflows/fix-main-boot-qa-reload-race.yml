name: Harden main boot QA reload synchronization

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-main-boot-qa-reload-race.yml

permissions:
  contents: write

jobs:
  patch-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Wait for the new document before measuring warm restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/run-boot-architecture-browser-qa.mjs')
          s=p.read_text(encoding='utf-8')
          old='''    await client.send("Network.setCacheDisabled",{cacheDisabled:false});await client.send("Page.reload",{ignoreCache:false});\n    await waitFor(client,"window.FourSymbolsStartupPolicy?.getState()===\'READY\'&&window.FourSymbolsStartupPolicy?.getUid()===\'uid-B\'&&performance.getEntriesByName(\'four-symbols:main-city-interactive\').length>0","warm account restore",15000);'''
          new='''    const warmPreviousTimeOrigin=await client.eval(`performance.timeOrigin`);\n    await client.send("Network.setCacheDisabled",{cacheDisabled:false});await client.send("Page.reload",{ignoreCache:false});\n    await waitFor(client,`performance.timeOrigin!==${JSON.stringify(warmPreviousTimeOrigin)}&&document.readyState===\'complete\'`,"warm reload new document",15000);\n    await waitFor(client,"window.FourSymbolsStartupPolicy?.getState()===\'READY\'&&window.FourSymbolsStartupPolicy?.getUid()===\'uid-B\'&&performance.getEntriesByName(\'four-symbols:main-city-interactive\').length>0","warm account restore",15000);'''
          if old not in s:
              raise SystemExit('warm reload block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check .github/scripts/run-boot-architecture-browser-qa.mjs
      - name: Commit QA synchronization and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-main-boot-qa-reload-race.yml
          git add .github/scripts/run-boot-architecture-browser-qa.mjs
          git commit -m "test: synchronize warm reload before boot timing"
          git push origin HEAD:dev
