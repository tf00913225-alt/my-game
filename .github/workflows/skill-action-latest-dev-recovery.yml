name: Skill action latest-dev recovery
on:
  push:
    branches:
      - fix/skill-action-dom-presentation-runtime-qa-rebased-20260930
    paths:
      - .github/workflows/skill-action-latest-dev-recovery.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-action-dom-presentation-runtime-qa-rebased-20260930
          fetch-depth: 0
      - name: Apply rebased repair and synchronize production build
        run: |
          curl -fsSL https://api.github.com/repos/tf00913225-alt/my-game/git/blobs/5789eb28bf76228a63da2a1d39fecbb02d36dd89 | jq -r .content | tr -d '\n' | base64 -d | gzip -d > /tmp/skill-action.patch
          git apply /tmp/skill-action.patch
          npm run build
          git rm .github/workflows/skill-action-latest-dev-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/run-skill-progression-browser-qa.mjs js/00-main.js index.html asset-manifest.json build
          git commit -m "fix: converge skill action buttons and real runtime QA"
          git push origin HEAD:fix/skill-action-dom-presentation-runtime-qa-rebased-20260930
