name: Fixed Slot Phase 4 Runtime Log

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916
    paths-ignore:
      - diagnostics/phase4-boss-runtime-output.txt

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the same staged owner patch
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          workflow=Path('.github/workflows/fixed-slot-phase4-boss-mechanism.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY\n",start)
          body=workflow[start:end]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          old='guards.map(unit=>unit.vGameplayBattlefieldSlot)'
          new='Array.from(guards,unit=>unit.vGameplayBattlefieldSlot)'
          body=body.replace(old,new,1)
          exec(compile(body,'phase4-owner-patch','exec'))
          PYCODE
      - name: Capture exact Boss runtime test output
        run: |
          mkdir -p diagnostics
          set +e
          node tests/gameplay-boss-tower-system.test.js > diagnostics/phase4-boss-runtime-output.txt 2>&1
          status=$?
          set -e
          { printf '\nEXIT_STATUS=%s\n' "$status"; } >> diagnostics/phase4-boss-runtime-output.txt
      - name: Save diagnostic output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/phase4-boss-runtime-output.txt
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: capture phase4 boss runtime failure"
          git push origin HEAD:feature/fixed-slot-battlefield-v1-20260916
