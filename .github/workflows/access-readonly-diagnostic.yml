name: Private DEV manifest phase diagnostic
on:
  push:
    branches: [fix/access-readonly-validation-20261030]
permissions:
  contents: read
concurrency:
  group: access-manifest-diagnostic
  cancel-in-progress: false
jobs:
  manifest:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/access-readonly-validation-20261030' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.DEV_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.DEV_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Observe private DEV manifest status
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const id=process.env.CF_ACCESS_CLIENT_ID,secret=process.env.CF_ACCESS_CLIENT_SECRET;
          try {
            if(!id||!secret) { console.log('RESULT missing_credentials'); process.exitCode=1; }
            else {
              const h=new Headers();
              try {h.set('CF-Access-Client-Id',id);h.set('CF-Access-Client-Secret',secret);} catch {console.log('RESULT invalid_credentials_format');process.exit(1);}
              const r=await fetch('https://dev.four-symbols-dev.pages.dev/release-manifest.json',{headers:h,redirect:'manual',signal:AbortSignal.timeout(15000)});
              console.log('RESULT http_status='+r.status);
              if(r.status!==200){process.exitCode=1;}
              else {
                let data;
                try {data=await r.json();console.log('RESULT json_parse=success');}
                catch {console.log('RESULT json_parse=failure');process.exit(1);}
                if(typeof data.commitSha==='string'&&/^[0-9a-f]{40}$/.test(data.commitSha))console.log('RESULT deployed_sha='+data.commitSha);
                else {console.log('RESULT deployed_sha=invalid');process.exitCode=1;}
              }
            }
          } catch(error) {
            const codes=['ETIMEDOUT','ECONNRESET','ECONNREFUSED','ENOTFOUND','EAI_AGAIN','UND_ERR_CONNECT_TIMEOUT'];
            const code=error?.cause?.code;
            console.log('RESULT network_error='+(codes.includes(code)?code:'unknown'));
            process.exitCode=1;
          }
          NODE
