#game-stage #itemModal .v17351-compare-stat span{color:#ab9b80!important}#game-stage #itemModal .v17351-compare-stat b{color:#e9c06a!important}
#game-stage #itemModal .v17351-compare-empty{display:grid!important;place-items:center!important;min-height:48px!important;padding:7px!important;color:#958873!important;text-align:center!important}
