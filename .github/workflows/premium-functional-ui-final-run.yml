name: Premium Functional UI Artifact Diagnostic

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-final-run.yml

permissions:
  contents: read

jobs:
  inspect-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reproduce Chrome QA temporary outputs only
        run: |
          set -euo pipefail
          node tests/ui-black-gold-window-browser.test.js
          node tests/ui-feature-large-panel-browser.test.js
          node tests/ui-critical-regressions-mobile-browser.test.js
          node tests/ui-team-relic-mobile-browser.test.js
          node tests/v173.49-exp-pool-scroll-stability-browser.test.js
          node .github/scripts/run-skill-progression-browser-qa.mjs
          node .github/scripts/run-relic-progression-browser-qa.mjs
          node .github/scripts/run-boot-architecture-browser-qa.mjs
          rm -rf artifacts/browser-qa/premium-functional-ui
          node tests/premium-functional-ui-responsive-browser.test.js

      - name: Print exact artifacts workspace state
        run: |
          set -euo pipefail
          echo '--- git status --porcelain ---'
          git status --porcelain
          echo '--- artifacts files ---'
          if [ -d artifacts ]; then
            find artifacts -maxdepth 4 -type f -print | sort
          else
            echo '(artifacts directory absent)'
          fi
          echo '--- artifacts directories ---'
          if [ -d artifacts ]; then
            find artifacts -maxdepth 4 -type d -print | sort
          else
            echo '(artifacts directory absent)'
          fi
