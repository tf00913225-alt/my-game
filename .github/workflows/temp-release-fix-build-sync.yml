name: TEMP release fix production build sync

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/battle-info-fixed-inset-release-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: check
        shell: bash
        run: |
          if npm run build:check; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.synced != 'true'
        run: |
          npm run build
          git diff --check
          git add -A -- asset-manifest.json build index.html config/feature-manifest.json
      - if: steps.check.outputs.synced != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node <<'NODE'
          (async()=>{
          const fs=require("node:fs"),cp=require("node:child_process");
          const token=process.env.GH_TOKEN,repo=process.env.REPO,branch=process.env.BRANCH;
          const baseSha=cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();
          const parts=cp.execFileSync("git",["diff","--cached","--name-status","--no-renames","-z"],{encoding:"utf8"}).split("\0").filter(Boolean);
          const changes=[]; for(let i=0;i<parts.length;){changes.push({status:parts[i++],path:parts[i++]});}
          async function api(path,options={}){
            const response=await fetch("https://api.github.com/repos/"+repo+path,{method:options.method||"GET",headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},body:options.body?JSON.stringify(options.body):undefined});
            if(!response.ok) throw new Error(response.status+" "+await response.text());
            return response.json();
          }
          const base=await api("/git/commits/"+baseSha),entries=[];
          for(const ch of changes){
            if(ch.status==="D"){entries.push({path:ch.path,mode:"100644",type:"blob",sha:null});continue;}
            const blob=await api("/git/blobs",{method:"POST",body:{content:fs.readFileSync(ch.path,"utf8"),encoding:"utf-8"}});
            entries.push({path:ch.path,mode:"100644",type:"blob",sha:blob.sha});
          }
          if(!entries.length)return;
          const tree=await api("/git/trees",{method:"POST",body:{base_tree:base.tree.sha,tree:entries}});
          const commit=await api("/git/commits",{method:"POST",body:{message:"build: synchronize battle info inset fix",tree:tree.sha,parents:[baseSha]}});
          await api("/git/refs/heads/"+encodeURIComponent(branch),{method:"PATCH",body:{sha:commit.sha,force:false}});
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
