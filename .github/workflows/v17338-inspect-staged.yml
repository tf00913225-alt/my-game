name: V173.44 Maintenance Repair

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17338-inspect-staged.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - name: Apply maintenance fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding="utf-8")
          def write(p,s): Path(p).write_text(s,encoding="utf-8")
          def sub1(s,pattern,repl,label,flags=0):
              out,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n!=1: raise SystemExit(f"{label}: expected 1 match, got {n}")
              return out
          def replace_count(s,old,new,count,label):
              n=s.count(old)
              if n!=count: raise SystemExit(f"{label}: expected {count} matches, got {n}")
              return s.replace(old,new)

          # Daily dungeon owner.
          p="js/42-v148-combat-dungeon-fixes.js"; s=read(p)
          s=replace_count(s,'requirement:"任一角色達到20級"','requirement:"任一角色達到10級"',2,"daily requirements")
          s=replace_count(s,'reward:"通關後可指定1名角色獲得EXP"','reward:"通關EXP直接存入經驗池"',1,"exp reward copy")
          s=sub1(s,r'function hasLevel20Character\(\)\{\s*return partyIndexes\(\)\.some\(index=>numeric\(getPartyCharacterByIndex\(index\)\?\.level\)>=20\);\s*\}',
                 'function hasLevel10Character(){\n        return partyIndexes().some(index=>numeric(getPartyCharacterByIndex(index)?.level)>=10);\n    }',"daily helper",re.S)
          s=sub1(s,r'if\(type==="exp"\)\{\s*const ready=partyIndexes\(\)\.some\(index=>numeric\(getPartyCharacterByIndex\(index\)\?\.level\)>=10\);\s*if\(!ready\)\{ alert\("經驗副本需要任一角色達到10級才能開啟。"\); return; \}\s*\}else if\(!hasLevel20Character\(\)\)\{\s*alert\(meta\.title\+"需要任一角色達到20級才能開啟。"\);\s*return;\s*\}',
                 'if(!hasLevel10Character()){\n            alert(meta.title+"需要任一角色達到10級才能開啟。");\n            return;\n        }',"daily gate",re.S)
          exp_re=re.compile(r'    function showDailyExpReward\(baseExp\)\{.*?\n    function goldDungeonReward\(level\)\{',re.S)
          exp_new='''    function showDailyExpReward(baseExp){
        pendingDailyExpReward={baseExp:Math.max(0,Math.floor(numeric(baseExp)))};
        const html='<div class="v132-reward-modal-inner"><h3>經驗副本挑戰成功！</h3>'+\
            '<p>EXP：<b>'+pendingDailyExpReward.baseExp.toLocaleString("zh-TW")+'</b>，獎勵將直接存入經驗池。</p>'+\
            '<div class="v132-reward-actions">'+\
            '<button type="button" onclick="v148ClaimDailyExpReward(false)">存入經驗池</button>'+\
            '<button type="button" onclick="v148ClaimDailyExpReward(true)">看廣告雙倍存入</button></div></div>';
        if(typeof window.v132ShowRewardModal==="function"){ window.v132ShowRewardModal(html); }
    }

    window.v148ClaimDailyExpReward=function(doubled){
        const pending=pendingDailyExpReward;
        if(!pending){ return; }
        const grant=multiplier=>{
            const amount=Math.max(0,Math.floor(pending.baseExp*multiplier));
            sharedExp=Math.max(0,numeric(sharedExp)+amount);
            pendingDailyExpReward=null;
            if(typeof saveGame==="function"){ saveGame(); }
            if(typeof updateUI==="function"){ updateUI(); }
            if(typeof renderExpDistributeList==="function"){ renderExpDistributeList(); }
            if(typeof addBattleLog==="function"){ addBattleLog("經驗副本結算："+amount+" EXP 已存入經驗池。"); }
            if(typeof window.v132CloseRewardModal==="function"){ window.v132CloseRewardModal(); }
            showPage("dungeon");
            if(typeof switchDungeonTab==="function"){ switchDungeonTab("daily"); }
        };
        if(doubled&&typeof showRewardedAd==="function"){ showRewardedAd(()=>grant(2),()=>grant(1)); }
        else{ grant(1); }
    };

    function goldDungeonReward(level){'''
          s,n=exp_re.subn(exp_new,s,count=1)
          if n!=1: raise SystemExit(f"exp reward block: expected 1 match, got {n}")
          write(p,s)

          # Older V132 compatibility must load and follow the same single-Lv10 rule.
          p="js/27-v132-content-expansion.js"; s=read(p)
          old='window.v132HasTwoCharactersAtLevel20=hasTwoCharactersAtLevel20;'
          if s.count(old)!=1: raise SystemExit(f"V132 export: expected 1 match, got {s.count(old)}")
          s=s.replace(old,'window.v132HasLevel10CharacterForDailyDungeon=hasLevel10CharacterForDailyDungeon;\n    window.v132HasTwoCharactersAtLevel20=hasLevel10CharacterForDailyDungeon;',1)
          write(p,s)

          # New additional characters stay at Lv1; EXP catch-up remains.
          p="js/28-v133-economy-rebalance.js"; s=read(p)
          s=sub1(s,r'\n    function grantFastStartToAdditionalCharacter\(character,slotNumber\)\{.*?\n    \}\n\n    function grantDirectCatchUpExp',
                 '\n    function grantDirectCatchUpExp',"remove fast start",re.S)
          s=replace_count(s,'            grantFastStartToAdditionalCharacter(character,slotNumber);\n','',1,"remove fast start call")
          write(p,s)

          # Water skill UX: show the actual prerequisite instead of a generic lock.
          p="js/00-main.js"; s=read(p)
          s=replace_count(s,'"🔒 未解鎖"','"🔒 "+getSkillPrereqLabel(skill)',1,"skill lock label")
          write(p,s)

          # Main-city UHD asset version.
          p="css/46-v154-dev-fixes.css"; s=read(p)
          s=replace_count(s,'home-background-v17343.png','home-background-v17344.png',1,"main city UHD")
          write(p,s)

          # Historical/current regression alignment.
          p="tests/v173.42-player-flow.test.js"; s=read(p)
          s=s.replace('/* Second / third character catch-up is EXP-only after the Lv10 fast start and ends at Lv20. */','/* Second / third character starts at Lv1; catch-up is EXP-only and ends at Lv20. */')
          s=replace_count(s,'assert.match(economy,/function grantFastStartToAdditionalCharacter\\(character,slotNumber\\)/);\nassert.match(economy,/character\\.level=10/);','assert.doesNotMatch(economy,/function grantFastStartToAdditionalCharacter\\(character,slotNumber\\)/);\nassert.doesNotMatch(economy,/啟用追趕養成，從 Lv\\.10 開始冒險/);',1,"fast-start tests")
          s=s.replace('home-background-v17343\\.png','home-background-v17344\\.png')
          s=s.replace('"assets/ui/home-background-v17343.png"','"assets/ui/home-background-v17344.png"')
          s=replace_count(s,'assert.match(dungeonPolish,/v173GrantCharacterCatchUpExp/);','assert.match(dungeonPolish,/sharedExp=Math\\.max\\(0,numeric\\(sharedExp\\)\\+amount\\)/);\nassert.doesNotMatch(dungeonPolish,/請指定1名角色領取/);',1,"shared EXP test")
          write(p,s)

          p="tests/v173.44-current-request.test.js"; s=read(p)
          anchor='const v131=fs.readFileSync("js/25-v131-fix-batch.js","utf8");'
          addition=anchor+'\nconst economy=fs.readFileSync("js/28-v133-economy-rebalance.js","utf8");\nconst main=fs.readFileSync("js/00-main.js","utf8");\nconst water=fs.readFileSync("js/50-v169-water-skill-rules.js","utf8");\nconst v132=fs.readFileSync("js/27-v132-content-expansion.js","utf8");'
          s=replace_count(s,anchor,addition,1,"current imports")
          s=s.replace('assert.match(battle,/material:\\{title:"材料副本",requirement:"任一角色達到20級"/);','assert.match(battle,/material:\\{title:"材料副本",requirement:"任一角色達到10級"/);')
          s=s.replace('assert.match(battle,/gold:\\{title:"金幣副本",requirement:"任一角色達到20級"/);','assert.match(battle,/gold:\\{title:"金幣副本",requirement:"任一角色達到10級"/);')
          checks='''
assert.match(battle,/exp:\\{title:"經驗副本",requirement:"任一角色達到10級",reward:"通關EXP直接存入經驗池"/);
assert.match(battle,/function hasLevel10Character\\(\\)/);
assert.doesNotMatch(battle,/hasLevel20Character/);
assert.match(battle,/sharedExp=Math\\.max\\(0,numeric\\(sharedExp\\)\\+amount\\)/);
assert.doesNotMatch(battle,/請指定1名角色領取/);
assert.doesNotMatch(economy,/grantFastStartToAdditionalCharacter/);
assert.match(v132,/v132HasTwoCharactersAtLevel20=hasLevel10CharacterForDailyDungeon/);
assert.match(main,/"🔒 "\\+getSkillPrereqLabel\\(skill\\)/);
assert.match(water,/floodBeast:\\{[\\s\\S]*?learnCost:15[\\s\\S]*?requires:\\["waterBall"\\]/);
assert.match(abyssCss,/home-background-v17344\\.png/);
assert.equal(fs.existsSync("assets/ui/home-background-v17344.png"),true,"assets/ui/home-background-v17344.png");
'''
          s=replace_count(s,'console.log("✓ V173.44 current request regression passed");',checks+'\nconsole.log("✓ V173.44 current request regression passed");',1,"current tail")
          write(p,s)

          note='''

## DEV 預覽發布規則（2026-09-04 起）
- `dev` 仍是唯一開發分支；預覽需求不得改動 `main`。
- `dev` 每次 push 後，由 `.github/workflows/deploy-dev-cloudflare.yml` 自動部署 Cloudflare Pages。
- 固定 DEV 測試網址：`https://four-symbols-dev.pages.dev`。
- 不再使用 GitHack / RawGitHack / RawCDN 作為 `dev` 測試站，避免大量 CSS/JS/素材請求遭 429 限流造成裸 HTML 或新舊資源混載。
- `assets-library` 與 `assets-library/assets/inbox/` 仍留在 GitHub，素材讀取與整理流程不受 Cloudflare Pages 影響。
'''
          for doc in ("HANDOFF.md","AGENTS.md"):
              q=Path(doc)
              if q.exists():
                  t=q.read_text(encoding="utf-8")
                  if "https://four-symbols-dev.pages.dev" not in t:
                      q.write_text(t.rstrip()+note+"\n",encoding="utf-8")
          PY
          cp assets/ui/home-background-v17343.png assets/ui/home-background-v17344.png
          rm -f .github/workflows/v17344-maintenance-fix.yml

      - name: Validate maintenance fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check js/00-main.js
          node --check js/27-v132-content-expansion.js
          node --check js/28-v133-economy-rebalance.js
          node --check js/42-v148-combat-dungeon-fixes.js
          node --check js/50-v169-water-skill-rules.js
          node tests/v169-water-skill-rules.test.js
          node tests/v173.42-player-flow.test.js
          node tests/v173.43-growth-charge.test.js
          node tests/v173.44-current-request.test.js
          node .github/scripts/ci.mjs tests
          node .github/scripts/ci.mjs resources

      - name: Restore workflow and publish final dev state
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/v17338-inspect-staged.yml <<'YAML'
          name: V173.38 Inspect Staged Patch

          on:
            push:
              branches: [dev]
              paths:
                - .github/workflows/v17338-inspect-staged.yml
                - .github/v17338.patch.xz.b64

          permissions:
            contents: read

          jobs:
            inspect:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: dev
                    fetch-depth: 2
                - name: Decode and validate staged patch
                  run: |
                    base64 -d .github/v17338.patch.xz.b64 | xz -d > /tmp/v17338.patch
                    git apply --check /tmp/v17338.patch
                    git apply --stat /tmp/v17338.patch
                    sha256sum /tmp/v17338.patch
                    cp /tmp/v17338.patch v17338.patch
                - uses: actions/upload-artifact@v4
                  with:
                    name: v17338-staged-patch
                    path: v17338.patch
                    retention-days: 1
          YAML
          git config user.name "tf00913225-alt"
          git config user.email "tf00913225@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize V173.44 dungeon growth and water UX maintenance"
          git push origin HEAD:dev
