name: Restore direct skill animation trigger

on:
  push:
    branches:
      - bugfix/restore-direct-skill-animation-trigger

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure existing asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi
      - name: Apply known-good animation owner recovery
        run: |
          python .github/scripts/_restore-direct-skill-animation.py
          python .github/scripts/_align-v142-direct-trigger-test.py
      - name: Check modified JavaScript syntax
        run: |
          node --check js/00-main.js
          node --check js/37-v142-skill-animation.js
          node --check tests/v173.6-p0-runtime-recovery.test.js
          node --check tests/v173.62-direct-skill-animation-trigger.test.js
          node --check tests/v142-skill-animation.test.js
      - name: Run targeted animation regressions
        run: |
          node tests/v173.6-p0-runtime-recovery.test.js
          node tests/v173.62-direct-skill-animation-trigger.test.js
          node tests/v142-skill-animation.test.js
          node tests/v153-fire-vfx.test.js
          node tests/v165-fire-vfx-fixes.test.js
          node tests/v166-water-vfx.test.js
          node tests/v173.23-wind-vfx.test.js
      - name: Run all Node suites
        run: node .github/scripts/ci.mjs tests
      - name: Run release coherence gate
        env:
          CI_BASE_SHA: 3d32b2c28d07b0147875fab3691f20052fb89f2c
        run: node .github/scripts/release-gate.mjs ci
      - name: Check diff
        run: git diff --check
      - name: Commit verified restoration and remove one-time files
        run: |
          rm .github/workflows/_restore-direct-skill-animation-trigger.yml
          rm .github/scripts/_restore-direct-skill-animation.py
          rm .github/scripts/_align-v142-direct-trigger-test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore direct skill animation runtime"
          git push origin HEAD:bugfix/restore-direct-skill-animation-trigger
