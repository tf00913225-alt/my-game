name: Materialize clean V170 tests-only fix

on:
  push:
    branches:
      - validation/v170-snapshot-fixture-audit-r2-20260916

permissions:
  contents: write

jobs:
  materialize:
    name: Build one-file V170 fix commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIX_BRANCH: fix/v170-final-runtime-fixture-contract-20260917
      BASE_SHA: b01f996b53c9321c29dbc389d820af33714f4581
    steps:
      - name: Check out clean fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_BRANCH }}
          fetch-depth: 4

      - name: Confirm exact base
        shell: bash
        run: |
          set -euo pipefail
          echo "BEFORE_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply only V170 test contract fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('tests/v170-final-spec-integration.test.js')
          source=path.read_text(encoding='utf-8')

          runtime_old='''const EXPECTED_RUNTIME_PATHS=[\n    "js/25-v131-fix-batch.js",'''
          runtime_new='''const EXPECTED_RUNTIME_PATHS=[\n    "js/battlefield-slot-owner.js",\n    "js/25-v131-fix-batch.js",'''
          if source.count(runtime_old)!=1:
              raise SystemExit('runtime-order anchor not unique')
          source=source.replace(runtime_old,runtime_new,1)

          mock_old='''            if(property===Symbol.toPrimitive){ return ()=>0; }\n            if(property==="length"){ return 0; }'''
          mock_new='''            if(property===Symbol.toPrimitive){ return ()=>0; }\n            if(property==="parentElement"){ return null; }\n            if(property==="parentNode"){ return null; }\n            if(property==="ownerDocument"){ return null; }\n            if(property==="length"){ return 0; }'''
          if source.count(mock_old)!=1:
              raise SystemExit('mock-DOM anchor not unique')
          source=source.replace(mock_old,mock_new,1)

          snapshot_old='''        currentBattleMonsters.splice(0,currentBattleMonsters.length,0);\n        Math.random=function(){ return 0; };\n        const action=v141TryMonsterSpecialAction(0);'''
          snapshot_new='''        currentBattleMonsters.splice(0,currentBattleMonsters.length,0);\n        const snapshot=window.v138EnsureEnemyFormationSnapshot(currentBattleMonsters);\n        if(\n            !snapshot ||\n            window.FourSymbolsBattlefieldSlots.getEnemySlotForMonster(snapshot,0)!=="ENEMY_F3"\n        ){\n            throw new Error("V170 fixture must create the formal ENEMY_F3 snapshot before monster action");\n        }\n        Math.random=function(){ return 0; };\n        const action=v141TryMonsterSpecialAction(0);'''
          if source.count(snapshot_old)!=1:
              raise SystemExit('case-8 Snapshot anchor not unique')
          source=source.replace(snapshot_old,snapshot_new,1)

          if 'vm.runInContext(fs.readFileSync("js/battlefield-slot-owner.js"' in source:
              raise SystemExit('case-local Slot owner load detected')

          path.write_text(source,encoding='utf-8')
          PY

          changed="$(git diff --name-only)"
          printf 'CHANGED_FILES=%s\n' "$changed"
          test "$changed" = 'tests/v170-final-spec-integration.test.js'

          git diff --check
          grep -n -A4 'const EXPECTED_RUNTIME_PATHS=\[' tests/v170-final-spec-integration.test.js
          grep -n 'property==="parentElement"\|property==="parentNode"\|property==="ownerDocument"' tests/v170-final-spec-integration.test.js
          grep -n -A8 'const snapshot=window.v138EnsureEnemyFormationSnapshot' tests/v170-final-spec-integration.test.js

      - name: Commit clean one-file fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/v170-final-spec-integration.test.js
          test "$(git diff --cached --name-only)" = 'tests/v170-final-spec-integration.test.js'
          git commit -m 'test: align V170 final runtime fixture contract'
          echo "FIX_HEAD=$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$FIX_BRANCH"
