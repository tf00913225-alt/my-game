name: V170 Snapshot Fixture Audit R2

on:
  push:
    branches:
      - validation/v170-snapshot-fixture-audit-r2-20260916

permissions:
  contents: read

jobs:
  diagnose:
    name: Node 24 snapshot fixture diagnosis follow-up
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_SHA: b6bdb0d6f6a1f21587ed68b0a153dea7782b665d
      TARGET_TEST: accuracy, enemy Rage, monster shields and wind-elite Dodge use their formal state rules
    steps:
      - name: Check out diagnosis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Confirm diagnosis ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          echo "NODE_VERSION=$(node --version)"
          echo "DIAGNOSIS_HEAD=$(git rev-parse HEAD)"
          base="$(git merge-base "$BASE_SHA" HEAD)"
          echo "MERGE_BASE=$base"
          test "$base" = "$BASE_SHA"
          echo 'COMMITTED_DIFF_FROM_BASE:'
          git diff --name-only "$BASE_SHA" HEAD
          if git diff --name-only "$BASE_SHA" HEAD | grep -v '^.github/workflows/validate-v170-snapshot-fixture-audit-r2.yml$' | grep -q .; then
            echo 'Unexpected committed diagnosis diff' >&2
            exit 2
          fi
          cp tests/v170-final-spec-integration.test.js /tmp/v170.original.js
          cp js/46-v155-dev-fixes.js /tmp/v155.original.js

      - name: CASE A marker - locate Wind Dodge non-return
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v170.original.js tests/v170-final-spec-integration.test.js
          cp /tmp/v155.original.js js/46-v155-dev-fixes.js
          python - <<'PY'
          from pathlib import Path
          TARGET='accuracy, enemy Rage, monster shields and wind-elite Dodge use their formal state rules'
          def isolate_test(source):
              old='''function test(name,handler){\n    handler();\n    passed++;\n    console.log("✓ "+name);\n}'''
              new=f'''function test(name,handler){{\n    if(name!=={TARGET!r}){{ return; }}\n    console.log("START "+name);\n    handler();\n    passed++;\n    console.log("PASS "+name);\n}}'''
              if source.count(old)!=1: raise SystemExit('isolated test runner anchor not unique')
              return source.replace(old,new,1)
          def mark_wind_block(source):
              begin='    function resolveWindEliteDodge(monsterIndex,forceCast){'
              end='    window.v155ResolveWindEliteDodge=resolveWindEliteDodge;'
              start=source.find(begin); finish=source.find(end,start)
              if start<0 or finish<0: raise SystemExit('Wind Dodge function block not found')
              block=source[start:finish]
              replacements=[
                  ('''    function resolveWindEliteDodge(monsterIndex,forceCast){\n        const monster=''', '''    function resolveWindEliteDodge(monsterIndex,forceCast){\n        console.log("WIND 1 enter");\n        const monster='''),
                  ('''        const targets=allyTriTargets(monsterIndex).filter(entry=>!hasNamedState(entry.monster,"風行"));''', '''        console.log("WIND 2 before allyTriTargets");\n        const targets=allyTriTargets(monsterIndex).filter(entry=>!hasNamedState(entry.monster,"風行"));\n        console.log("WIND 3 after allyTriTargets "+JSON.stringify(targets.map(entry=>entry.index)));'''),
                  ('''        targets.forEach(entry=>{\n            const ally=entry.monster;''', '''        targets.forEach(entry=>{\n            console.log("WIND TARGET "+entry.index+" begin");\n            const ally=entry.monster;'''),
                  ('''            if(typeof window.v141PlayCardEffect==="function"){ window.v141PlayCardEffect("monster",entry.index,"buff"); }''', '''            if(typeof window.v141PlayCardEffect==="function"){\n                console.log("WIND TARGET "+entry.index+" before v141PlayCardEffect");\n                window.v141PlayCardEffect("monster",entry.index,"buff");\n                console.log("WIND TARGET "+entry.index+" after v141PlayCardEffect");\n            }''')
              ]
              for old,new in replacements:
                  if block.count(old)!=1: raise SystemExit('Wind-block marker anchor not unique: '+old[:70])
                  block=block.replace(old,new,1)
              return source[:start]+block+source[finish:]
          test_path=Path('tests/v170-final-spec-integration.test.js')
          source=isolate_test(test_path.read_text(encoding='utf-8'))
          old_call='''        currentBattleMonsters.splice(0,currentBattleMonsters.length,0);\n        battleToken=91;turn=4;\n        const dodgeCast=v155ResolveWindEliteDodge(0,true);'''
          new_call='''        currentBattleMonsters.splice(0,currentBattleMonsters.length,0);\n        battleToken=91;turn=4;\n        const activeSnapshot=window.FourSymbolsBattlefieldSlots.getActiveEnemySnapshot();\n        console.log("DODGE A snapshot = "+(activeSnapshot===null?"null":JSON.stringify(activeSnapshot)));\n        console.log("DODGE 1 before resolve");\n        const dodgeCast=v155ResolveWindEliteDodge(0,true);\n        console.log("DODGE 2 after resolve");'''
          if source.count(old_call)!=1: raise SystemExit('CASE A call anchor not unique')
          test_path.write_text(source.replace(old_call,new_call,1),encoding='utf-8')
          v155=Path('js/46-v155-dev-fixes.js')
          v155.write_text(mark_wind_block(v155.read_text(encoding='utf-8')),encoding='utf-8')
          PY
          set +e
          timeout 20s node tests/v170-final-spec-integration.test.js > /tmp/case-a-marker.log 2>&1
          status=$?
          set -e
          cat /tmp/case-a-marker.log
          echo "CASE_A_MARKER_EXIT=$status"
          grep -F 'DODGE A snapshot = null' /tmp/case-a-marker.log
          grep -F 'WIND 1 enter' /tmp/case-a-marker.log
          grep -F 'WIND 2 before allyTriTargets' /tmp/case-a-marker.log
          grep -F 'WIND 3 after allyTriTargets' /tmp/case-a-marker.log
          if grep -Fq 'before v141PlayCardEffect' /tmp/case-a-marker.log && ! grep -Fq 'after v141PlayCardEffect' /tmp/case-a-marker.log; then
            echo 'CASE_A_STUCK_IN_V141_PLAY_CARD_EFFECT=yes'
          else
            echo 'CASE_A_STUCK_IN_V141_PLAY_CARD_EFFECT=no'
          fi
          test "$status" -eq 124

      - name: CASE B - Formal Snapshot lifecycle equivalent
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v170.original.js tests/v170-final-spec-integration.test.js
          cp /tmp/v155.original.js js/46-v155-dev-fixes.js
          python - <<'PY'
          from pathlib import Path
          TARGET='accuracy, enemy Rage, monster shields and wind-elite Dodge use their formal state rules'
          def isolate_test(source):
              old='''function test(name,handler){\n    handler();\n    passed++;\n    console.log("✓ "+name);\n}'''
              new=f'''function test(name,handler){{\n    if(name!=={TARGET!r}){{ return; }}\n    console.log("START "+name);\n    handler();\n    passed++;\n    console.log("PASS "+name);\n}}'''
              if source.count(old)!=1: raise SystemExit('isolated test runner anchor not unique')
              return source.replace(old,new,1)
          def mark_wind_block(source):
              begin='    function resolveWindEliteDodge(monsterIndex,forceCast){'
              end='    window.v155ResolveWindEliteDodge=resolveWindEliteDodge;'
              start=source.find(begin); finish=source.find(end,start)
              if start<0 or finish<0: raise SystemExit('Wind Dodge function block not found')
              block=source[start:finish]
              replacements=[
                  ('''    function resolveWindEliteDodge(monsterIndex,forceCast){\n        const monster=''', '''    function resolveWindEliteDodge(monsterIndex,forceCast){\n        console.log("WIND 1 enter");\n        const monster='''),
                  ('''        const targets=allyTriTargets(monsterIndex).filter(entry=>!hasNamedState(entry.monster,"風行"));''', '''        console.log("WIND 2 before allyTriTargets");\n        const targets=allyTriTargets(monsterIndex).filter(entry=>!hasNamedState(entry.monster,"風行"));\n        console.log("WIND 3 after allyTriTargets "+JSON.stringify(targets.map(entry=>entry.index)));'''),
                  ('''        targets.forEach(entry=>{\n            const ally=entry.monster;''', '''        targets.forEach(entry=>{\n            console.log("WIND TARGET "+entry.index+" begin");\n            const ally=entry.monster;'''),
                  ('''            if(typeof window.v141PlayCardEffect==="function"){ window.v141PlayCardEffect("monster",entry.index,"buff"); }''', '''            if(typeof window.v141PlayCardEffect==="function"){\n                console.log("WIND TARGET "+entry.index+" before v141PlayCardEffect");\n                window.v141PlayCardEffect("monster",entry.index,"buff");\n                console.log("WIND TARGET "+entry.index+" after v141PlayCardEffect");\n            }''')
              ]
              for old,new in replacements:
                  if block.count(old)!=1: raise SystemExit('Wind-block marker anchor not unique: '+old[:70])
                  block=block.replace(old,new,1)
              return source[:start]+block+source[finish:]
          test_path=Path('tests/v170-final-spec-integration.test.js')
          source=isolate_test(test_path.read_text(encoding='utf-8'))
          old_call='''        currentBattleMonsters.splice(0,currentBattleMonsters.length,0);\n        battleToken=91;turn=4;\n        const dodgeCast=v155ResolveWindEliteDodge(0,true);'''
          new_call='''        currentBattleMonsters.splice(0,currentBattleMonsters.length,0);\n        const snapshot=window.v138EnsureEnemyFormationSnapshot(currentBattleMonsters);\n        const snapshotSlot=window.FourSymbolsBattlefieldSlots.getEnemySlotForMonster(snapshot,0);\n        console.log("DODGE B snapshot slot = "+snapshotSlot);\n        if(!snapshot||snapshotSlot!=="ENEMY_F3"){ throw new Error("CASE B requires formal ENEMY_F3 snapshot"); }\n        battleToken=91;turn=4;\n        console.log("DODGE 1 before resolve");\n        const dodgeCast=v155ResolveWindEliteDodge(0,true);\n        console.log("DODGE 2 after resolve");'''
          if source.count(old_call)!=1: raise SystemExit('CASE B call anchor not unique')
          test_path.write_text(source.replace(old_call,new_call,1),encoding='utf-8')
          v155=Path('js/46-v155-dev-fixes.js')
          v155.write_text(mark_wind_block(v155.read_text(encoding='utf-8')),encoding='utf-8')
          PY
          set +e
          timeout 25s node tests/v170-final-spec-integration.test.js > /tmp/case-b.log 2>&1
          status=$?
          set -e
          cat /tmp/case-b.log
          echo "CASE_B_EXIT=$status"
          if [ "$status" -ne 0 ]; then
            echo 'CASE_B_CLASSIFICATION=D: formal Snapshot did not return cleanly'
            exit 26
          fi
          grep -F 'DODGE B snapshot slot = ENEMY_F3' /tmp/case-b.log
          grep -F 'DODGE 2 after resolve' /tmp/case-b.log
          grep -F 'WIND 3 after allyTriTargets' /tmp/case-b.log
          grep -F 'after v141PlayCardEffect' /tmp/case-b.log
          echo 'CASE_AB_CLASSIFICATION=B: stale V170 fixture state'

      - name: Read-only V170 roster mutation audit
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v170.original.js tests/v170-final-spec-integration.test.js
          cp /tmp/v155.original.js js/46-v155-dev-fixes.js
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('tests/v170-final-spec-integration.test.js')
          lines=path.read_text(encoding='utf-8').splitlines()
          test_starts=[]; function_starts=[]
          for i,line in enumerate(lines,1):
              mt=re.search(r'^test\("([^"]+)"',line)
              if mt: test_starts.append((i,mt.group(1)))
              mf=re.search(r'^function\s+([A-Za-z0-9_$]+)\s*\(',line)
              if mf: function_starts.append((i,mf.group(1)))
          mutation_re=re.compile(r'(?:\bmonsters\.(?:splice|push)\b|\bcurrentBattleMonsters\.(?:splice|push)\b|\bcurrentBattleMonsters\s*=)')
          consumer_terms=['getSkillTargets','v141GetMonsterAllyTriTargets','v141TryMonsterSpecialAction','v155ResolveWindEliteDodge','v155ResolveNorthHeal','v155ResolveNorthSupport','v155ResolveExtremeEmperorAction','v155ResolveEastEarthShield','v155ResolveHeavenCalm','v141PlayCardEffect','castDamageSkill','processSingleMonsterAttack','FourSymbolsBattlefieldSlots','v138EnsureEnemyFormationSnapshot','tickStatusEffects']
          print('AUDIT_MUTATIONS_BEGIN')
          for i,line in enumerate(lines,1):
              if not mutation_re.search(line): continue
              nearest_test='<outside-test>'
              for start,name in test_starts:
                  if start<=i: nearest_test=name
                  else: break
              nearest_func='<top-level>'
              for start,name in function_starts:
                  if start<=i: nearest_func=name
                  else: break
              lo=max(1,i-45); hi=min(len(lines),i+95); consumers=[]
              for j in range(lo,hi+1):
                  for term in consumer_terms:
                      if term in lines[j-1]: consumers.append(f'{j}:{term}')
              print(f'MUTATION line={i} test={nearest_test!r} function={nearest_func!r}')
              print('  CODE '+line.strip())
              print('  CONSUMERS '+(', '.join(dict.fromkeys(consumers)) if consumers else '<none-nearby>'))
          print('AUDIT_MUTATIONS_END')
          print('AUDIT_TESTS_WITH_MUTATION_BEGIN')
          for idx,(start,name) in enumerate(test_starts):
              end=(test_starts[idx+1][0]-1) if idx+1<len(test_starts) else len(lines)
              mutations=[i for i in range(start,end+1) if mutation_re.search(lines[i-1])]
              if mutations:
                  terms=[]
                  for i in range(start,end+1):
                      for term in consumer_terms:
                          if term in lines[i-1]: terms.append(term)
                  print(f'TEST {name!r} lines={start}-{end} mutations={mutations} consumers={list(dict.fromkeys(terms))}')
          print('AUDIT_TESTS_WITH_MUTATION_END')
          PY
          echo 'WORKTREE_DIFF_AFTER_RESTORE_BEGIN'
          git diff -- tests/v170-final-spec-integration.test.js js/46-v155-dev-fixes.js
          echo 'WORKTREE_DIFF_AFTER_RESTORE_END'
