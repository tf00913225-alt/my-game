name: One-shot battle portrait owner repair

on:
  push:
    branches:
      - "fix/battle-portrait-owner-root-cause-20260915"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/battle-portrait-owner-root-cause-20260915
          fetch-depth: 2

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Repair existing battle presentation owner
        run: python3 .github/one-shot-battle-portrait-owner-repair.py

      - name: Rebuild deterministic production assets
        run: node scripts/build-production.mjs

      - name: Run focused owner and browser regressions
        shell: bash
        run: |
          node --test tests/v174-cardless-battle-presentation.test.js
          node tests/v174-cardless-battle-browser.test.js
          node scripts/build-production.mjs --check
          git diff --check

      - name: Commit repair and remove one-shot helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-one-shot-battle-portrait-owner-repair.yml
          git rm .github/one-shot-battle-portrait-owner-repair.py
          git add js/54-v173.51-battle-qa.js tests/v174-cardless-battle-presentation.test.js tests/v174-cardless-battle-browser.test.js asset-manifest.json build/asset-manifest.json build/
          git commit -m "fix: restore battle portrait owner at source"
          git push origin HEAD:fix/battle-portrait-owner-root-cause-20260915
