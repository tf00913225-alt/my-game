name: CI

on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        default: ''
      full_regression:
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ (inputs.candidate_sha || inputs.full_regression) && format('full-{0}-{1}', inputs.candidate_sha || github.sha, github.run_id) || (github.event_name == 'pull_request' && github.base_ref == 'dev' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'push-dev') || format('isolated-{0}', github.run_id) }}
  cancel-in-progress: ${{ !inputs.candidate_sha && !inputs.full_regression && ((github.event_name == 'pull_request' && github.base_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')) }}

permissions:
  contents: read

jobs:
  classify:
    name: CI change classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core_changed: ${{ steps.classify.outputs.core_changed }}
      battle_changed: ${{ steps.classify.outputs.battle_changed }}
      monster_balance_changed: ${{ steps.classify.outputs.monster_balance_changed }}
      tower_changed: ${{ steps.classify.outputs.tower_changed }}
      daily_changed: ${{ steps.classify.outputs.daily_changed }}
      abyss_changed: ${{ steps.classify.outputs.abyss_changed }}
      adventure_changed: ${{ steps.classify.outputs.adventure_changed }}
      boss_changed: ${{ steps.classify.outputs.boss_changed }}
      ui_changed: ${{ steps.classify.outputs.ui_changed }}
      inventory_changed: ${{ steps.classify.outputs.inventory_changed }}
      skill_changed: ${{ steps.classify.outputs.skill_changed }}
      portrait_changed: ${{ steps.classify.outputs.portrait_changed }}
      cloud_changed: ${{ steps.classify.outputs.cloud_changed }}
      persistence_changed: ${{ steps.classify.outputs.persistence_changed }}
      release_changed: ${{ steps.classify.outputs.release_changed }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
      unknown_runtime_changed: ${{ steps.classify.outputs.unknown_runtime_changed }}
      plan_json: ${{ steps.classify.outputs.plan_json }}
      full_node: ${{ steps.classify.outputs.full_node }}
      promotion_health: ${{ steps.classify.outputs.promotion_health }}
      strict: ${{ steps.classify.outputs.strict }}
      cloud_gate: ${{ steps.classify.outputs.cloud_gate }}
      core_checks: ${{ steps.classify.outputs.core_checks }}
      battle_browser: ${{ steps.classify.outputs.battle_browser }}
      ui_browser: ${{ steps.classify.outputs.ui_browser }}
      daily_browser: ${{ steps.classify.outputs.daily_browser }}
      tower_wild_browser: ${{ steps.classify.outputs.tower_wild_browser }}
      portrait_browser: ${{ steps.classify.outputs.portrait_browser }}
      adventure_ui_browser: ${{ steps.classify.outputs.adventure_ui_browser }}
      abyss_balance: ${{ steps.classify.outputs.abyss_balance }}
      adventure_balance: ${{ steps.classify.outputs.adventure_balance }}
      boss_balance: ${{ steps.classify.outputs.boss_balance }}
      main_browser: ${{ steps.classify.outputs.main_browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Confirm exact regression source snapshot
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Reject superseded dev integration before testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && !inputs.candidate_sha && !inputs.full_regression
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned CI parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify classifier fixtures before emitting policy
        run: node --test tests/ci-change-classifier.test.mjs tests/ci-boss-routing.test.mjs tests/ci-concurrency.test.mjs
      - name: Compute fail-closed PR/full plan
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ inputs.candidate_sha && 'dev' || github.base_ref || github.ref_name }}
          CI_FULL_REGRESSION: ${{ inputs.full_regression || false }}
        run: node .github/scripts/ci-change-classifier.mjs

  core_checks:
    needs: classify
    name: core_checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 2
      - name: Confirm exact regression source snapshot
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Use current Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned CI parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Git comparison base
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$CI_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && \
             [[ ! "$CI_BASE_SHA" =~ ^0{40}$ ]] && \
             ! git cat-file -e "$CI_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          fi

          for typography_baseline_sha in \
            39767ce2b9dbfa59650b7c5fd4d52a57a2642ea5 \
            4a592dd4c41d7efb1a4849fbfe0cbf68598121bf \
            29b9668057846164a941fbf6617d2458d9af5476; do
            if ! git cat-file -e "$typography_baseline_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$typography_baseline_sha"
            fi
          done

      - name: Check CI script syntax
        run: |
          node --check .github/scripts/ci.mjs
          node --check .github/scripts/boot-live-browser-qa.mjs
          node --check .github/scripts/release-gate.mjs
          node --check .github/scripts/run-boot-architecture-browser-qa.mjs
          node --check .github/scripts/run-skill-progression-browser-qa.mjs
          node --check .github/scripts/runtime-browser-qa-support.mjs
          node --check .github/scripts/run-responsive-item-browser-qa.mjs
          node --check .github/scripts/run-relic-progression-browser-qa.mjs
          node --check .github/scripts/run-adventure-browser-qa.mjs
          node --check .github/scripts/run-fixed-slot-battlefield-browser-qa.mjs
          node --check .github/scripts/run-release-update-notification-browser-qa.mjs
          node --check .github/scripts/battle-layer-audio-live-qa.mjs
          node --check .github/scripts/battle-runtime-architecture-guard.mjs
          node --check .github/scripts/run-daily-dungeon-webp-browser-qa.mjs
          node --check .github/scripts/run-fire-portrait-browser-qa.mjs
          node --check .github/scripts/run-water-wild-portrait-browser-qa.mjs

      - name: Verify CI aggregate failure propagation
        run: node --test tests/ci-change-classifier.test.mjs tests/ci-boss-routing.test.mjs tests/ci-concurrency.test.mjs tests/ci-aggregate.test.mjs tests/session-repository-checks-wait.test.mjs tests/full-regression-health.test.mjs

      - name: Check all project JavaScript syntax
        run: node .github/scripts/ci.mjs syntax

      - name: Enforce permanent image asset pipeline gate
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi
          node tests/permanent-image-asset-pipeline.test.mjs
          node scripts/measure-monster-portraits.mjs --check
          node tests/monster-portrait-convergence.test.mjs

      - name: Reject unregistered persistent state
        run: node scripts/check-persisted-state-registry.mjs --self-test

      - name: Enforce Battle Runtime architecture guard
        id: battle_architecture
        run: node .github/scripts/battle-runtime-architecture-guard.mjs --write

      - name: Upload Battle Runtime architecture evidence
        if: always() && steps.battle_architecture.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: battle-runtime-architecture-${{ inputs.candidate_sha || github.sha }}
          path: artifacts/architecture/battle-runtime-architecture.json
          if-no-files-found: error
          retention-days: 90

      - name: Run Release Update Notification targeted regression
        run: node tests/release-update-notification-system.test.js

      - name: Run Adventure V1 targeted regression
        run: node tests/adventure-node-system-v1.test.js

      - name: Run Cloud Save Phase 3 UID isolation regressions
        run: |
          node tests/cloud-save-phase3-uid-local-isolation.test.js
          node tests/account-save-ownership.test.js
          node tests/auth-before-character-creation.test.js
          node tests/firebase-auth-foundation.test.mjs

      - name: Run Fixed Slot battlefield rendering regression
        run: |
          node tests/boss-snapshot-owner-lifecycle-convergence-20261001.test.js
          node tests/fixed-slot-battlefield-rendering-v2.test.js
          node tests/fixed-battlefield-ally-formation.test.mjs

      - name: Run battle layout, timing and range-VFX regressions
        run: |
          node tests/monster-balance-owner-phase1.test.mjs
          node tests/monster-balance-owner-phase2a.test.mjs
          node tests/monster-balance-owner-phase2b.test.mjs
          node tests/abyss-owner-convergence-20260920.test.js
          node tests/abyss-two-tier-refactor.test.js
          node tests/monster-portrait-runtime.test.js
          node tests/daily-dungeon-portrait-assets.test.js
          node tests/daily-dungeon-portrait-owner-convergence-20260928.test.js
          node tests/monster-portrait-import-workflow.test.js
          node tests/v173.51-qa.test.js
          node tests/v173.56-shop-layout-preview-regression.test.js
          node tests/production-bundle-abyss-shop-owner.test.js
          node tests/ui-panel-browser-layout.test.js
          node tests/main-city-roster-header-browser.test.js
          node tests/battle-layout-vfx-runtime-20260917.test.js
          node tests/battle-presentation-followup-browser.test.js
          node tests/battle-status-info-assets-20260922.test.js
          node tests/boss-battle-architecture-convergence-20260918.test.js
          node tests/gameplay-boss-tower-system.test.js
          node tests/enemy-resource-integer-presentation.test.mjs
          node tests/gameplay-activity-art-integration-20260927.test.js
          node tests/v174-gameplay-cover-16x9-browser.test.js
          node tests/tower-element-formation-small-boss-20260924.test.js
          node tests/battle-stats-relic-tower-auto-20260920.test.js
          node tests/v142-skill-animation.test.js
          node tests/v150-ice-arrow-rain-vfx.test.js
          node tests/v173.23-wind-vfx.test.js
          node tests/battle-runtime-hot-path-convergence-20260923.test.js
          node tests/battle-ui-status-vfx-followup-20260922.test.js
          node tests/hit-evasion-final-percent-status-formula-20260923.test.js
          node tests/battle-presentation-owner-convergence-20260926.test.js

      - name: Run skill and relic owner convergence regressions
        run: |
          node tests/skill-progression-rebalance.test.js
          node tests/skill-relic-owner-convergence-20260923.test.js

      - name: Run Gameplay context navigation regression
        run: node tests/gameplay-context-nav-actions-20260915.test.js

      - name: Run Gameplay UI regression
        run: |
          node tests/gameplay-ui-regressions-20260908.test.js
          node tests/forge-sockets-gems.test.js

      - name: Run relic lifecycle and battle input regressions
        run: |
          node tests/relic-trigger-lifecycle-battle-input-ui-20260919.test.js
          node tests/v174-team-relic-system.test.js
          node tests/v174-team-relic-hardening.test.js
          node tests/v174-battle-presentation-sequencing.test.js
          node tests/relic-battle-cutin-icon-readability-20260919.test.js
          node tests/battle-input-hitbox-browser-20260919.test.js

      - name: Ensure existing asset-test dependency
        if: needs.classify.outputs.full_node == 'true'
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run all Node unit and integration suites
        if: needs.classify.outputs.full_node == 'true'
        run: node .github/scripts/ci.mjs tests

      - name: Verify production build is synchronized
        id: build_sync
        run: npm run build:check

      - name: Capture build synchronization evidence
        if: failure() && steps.build_sync.outcome == 'failure'
        run: |
          npm run build
          mkdir -p artifacts/build-sync
          cp index.html artifacts/build-sync/index.html
          cp asset-manifest.json artifacts/build-sync/asset-manifest.json
          cp config/feature-manifest.json artifacts/build-sync/feature-manifest.json
          cp -R build artifacts/build-sync/build
          git diff -- index.html asset-manifest.json config/feature-manifest.json build > artifacts/build-sync/build-sync.diff || true
          find build -type f -print | sort > artifacts/build-sync/build-files.txt

      - name: Upload build synchronization evidence
        if: failure() && steps.build_sync.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: production-build-sync-${{ inputs.candidate_sha || github.sha }}
          path: artifacts/build-sync
          if-no-files-found: error
          retention-days: 14

      - name: Check static local resources
        run: node .github/scripts/ci.mjs resources

      - name: Check duplicate HTML IDs
        run: node .github/scripts/ci.mjs html-ids

      - name: Check release entries and loader integrity
        run: node .github/scripts/ci.mjs loader

      - name: Enforce release, cache, checklist and deprecated-code gates
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node tests/package-version-ownership.test.mjs
          node .github/scripts/release-gate.mjs ci

      - name: Verify immutable deployment artifact
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.candidate_sha || github.sha }}
          EXPECTED_BRANCH: ${{ inputs.candidate_sha && 'dev' || github.base_ref || github.ref_name }}
        run: node .github/scripts/prepare-static-deployment.mjs

      - name: Check Git whitespace and conflict markers
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci.mjs git-diff


  battle_browser:
    needs: classify
    if: needs.classify.outputs.battle_browser == 'true'
    name: battle_browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 2
      - name: Confirm exact regression source snapshot
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Use current Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Prepare isolated browser evidence directory
        run: mkdir -p artifacts/browser-qa

      - name: Ensure CJK font support for player-text browser QA
        run: |
          if ! fc-list :lang=zh | rg -q .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi

      - name: Verify battle target lifecycle with final production owners
        id: battle_target_browser
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test tests/battle-target-lifecycle-20261005.test.js
          node .github/scripts/run-battle-target-lifecycle-browser-qa.mjs

      - name: Upload battle target lifecycle evidence
        if: always() && steps.battle_target_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: battle-target-lifecycle-${{ inputs.candidate_sha || github.sha }}
          path: artifacts/browser-qa/battle-target-*
          if-no-files-found: error
          retention-days: 90

      - name: Verify Hit / Evasion Percentage-Point V2
        id: hit_evasion_v2
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test tests/level-suppression-v2.test.mjs
          node tests/equipment-combat-percent-migration-v2.test.js
          node tests/six-stat-combat-attribute-convergence-20260930.test.js
          node tests/v170-final-spec-integration.test.js
          node tests/cloud-save-canonical-review-plan.test.mjs
          node tests/cloud-save-canonical-snapshot.test.mjs
          node .github/scripts/run-hit-evasion-v2-browser-qa.mjs

      - name: Upload Hit / Evasion V2 browser evidence
        if: always() && steps.hit_evasion_v2.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: hit-evasion-v2-${{ inputs.candidate_sha || github.sha }}
          path: artifacts/browser-qa/hit-evasion-v2*
          if-no-files-found: error
          retention-days: 90

      - name: Run Fixed Slot battlefield 9x16 mobile browser QA
        id: fixed_slot_browser
        if: success()
        run: node .github/scripts/run-fixed-slot-battlefield-browser-qa.mjs

      - name: Upload Fixed Slot battlefield browser evidence
        if: always() && steps.fixed_slot_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: fixed-slot-battlefield-browser-qa-${{ inputs.candidate_sha || github.sha }}
          path: |
            artifacts/browser-qa/fixed-slot-battlefield-rendering-v2.json
            artifacts/browser-qa/boss-battle-convergence-412x915.png
          if-no-files-found: error
          retention-days: 90

      - name: Run exact-candidate real battle mobile browser QA
        id: battle_live_browser
        if: success()
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/four-symbols-battle-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          DEV_BASE_URL=http://127.0.0.1:4173 node .github/scripts/battle-layer-audio-live-qa.mjs

      - name: Upload exact-candidate real battle browser evidence
        if: always() && steps.battle_live_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: battle-layout-vfx-live-qa-${{ inputs.candidate_sha || github.sha }}
          path: |
            artifacts/browser-qa/battle-layer-audio-live-qa.json
            artifacts/browser-qa/battle-layout-wind-flame-mobile.png
            artifacts/browser-qa/battle-layer-element-box-mobile.png
            artifacts/browser-qa/battle-result-modal-mobile.png
            artifacts/browser-qa/boss-target-entity-live-412x915.png
          if-no-files-found: error
          retention-days: 90


  ui_browser:
    needs: classify
    if: needs.classify.outputs.ui_browser == 'true'
    name: ui_browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 2
      - name: Confirm exact regression source snapshot
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Use current Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Prepare isolated browser evidence directory
        run: mkdir -p artifacts/browser-qa

      - name: Ensure CJK font support for player-text browser QA
        run: |
          if ! fc-list :lang=zh | rg -q .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi

      - name: Run canonical bottom navigation and fixed home browser QA
        id: bottom_nav_home_browser
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        if: success()
        run: |
          node tests/bottom-nav-home-scroll-browser.test.js
          node tests/starter-potion-recovery.test.js
          node .github/scripts/run-foreground-potion-browser-qa.mjs

      - name: Upload bottom navigation and home geometry evidence
        if: always() && steps.bottom_nav_home_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: bottom-nav-home-geometry-${{ inputs.candidate_sha || github.sha }}
          path: |
            artifacts/browser-qa/bottom-nav-home-scroll-qa.json
            artifacts/browser-qa/foreground-*
            artifacts/browser-qa/navigation-*.png
          if-no-files-found: error
          retention-days: 90

      - name: Run Responsive Item owner and production runtime regression
        id: responsive_item_browser
        run: |
          node tests/responsive-window-item-owner-convergence.test.js
          node tests/ui-critical-regressions-20260909.test.js
          node tests/backpack-grid-bottom-action.test.js
          node .github/scripts/run-responsive-item-browser-qa.mjs
          node .github/scripts/run-forge-sockets-browser-qa.mjs

      - name: Upload Responsive Item browser evidence
        if: always() && steps.responsive_item_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: responsive-item-browser-qa-${{ inputs.candidate_sha || github.sha }}
          path: artifacts/browser-qa/responsive-item/
          if-no-files-found: error
          retention-days: 90

      - name: Run Touch / Scroll / Navigation mobile browser QA
        id: touch_scroll_navigation_browser
        if: success()
        run: node .github/scripts/run-touch-scroll-navigation-browser-qa.mjs

      - name: Upload Touch / Scroll / Navigation browser evidence
        if: always() && steps.touch_scroll_navigation_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: touch-scroll-navigation-browser-qa-${{ inputs.candidate_sha || github.sha }}
          path: artifacts/browser-qa/touch-scroll-navigation-browser-qa.json
          if-no-files-found: error
          retention-days: 90

      - name: Run Release Update Notification mobile browser QA
        id: release_update_browser
        if: success()
        run: node .github/scripts/run-release-update-notification-browser-qa.mjs

      - name: Upload Release Update Notification browser evidence
        if: always() && steps.release_update_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: release-update-notification-browser-qa-${{ inputs.candidate_sha || github.sha }}
          path: |
            artifacts/browser-qa/release-update-notification-browser-qa.json
            artifacts/browser-qa/release-update-notification-360x800.png
            artifacts/browser-qa/release-update-notification-390x844.png
            artifacts/browser-qa/release-update-notification-412x915.png
          if-no-files-found: error
          retention-days: 90

      - name: Run skill progression mobile browser QA
        id: skill_inventory_browser
        if: success()
        run: node .github/scripts/run-skill-progression-browser-qa.mjs

      - name: Upload Skill / Inventory browser evidence
        if: always() && steps.skill_inventory_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: skill-inventory-semantic-browser-qa-${{ inputs.candidate_sha || github.sha }}
          path: |
            artifacts/browser-qa/skill-inventory-semantic-browser-qa.json
            artifacts/browser-qa/skill-360x800.png
            artifacts/browser-qa/skill-393x873.png
            artifacts/browser-qa/skill-412x915.png
