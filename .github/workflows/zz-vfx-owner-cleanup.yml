name: VFX owner cleanup

on:
  push:
    branches:
      - fix/combat-vfx-owner-cleanup-20260909

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source-level legacy VFX guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,sys
          files=["js/35-v141-ui-battle.js","js/37-v142-skill-animation.js","js/39-v143-skill-animation.js","js/43-v149-skill-ui-rules.js","js/59-abyss-two-tier-runtime.js"]
          banned=re.compile(r'playCanvasParticles|v141-effect-canvas|getContext\(|createElement\(["\']canvas["\']\)|installWordCircleDirector|v149-word-|v149-word-circle-stage|patchExistingV143ExplosiveFlurryRenderer|canvas-crop')
          hits=[]
          for path in files:
              for no,line in enumerate(Path(path).read_text().splitlines(),1):
                  if banned.search(line): hits.append(f"{path}:{no}:{line.strip()}")
          if hits: print("\n".join(hits)); sys.exit(1)
          PY
      - name: Focused VFX regression tests
        run: |
          node tests/v174-raster-only-combat-vfx-owner.test.js
          node tests/abyss-two-tier-refactor.test.js
          node tests/boss-mechanism-vfx-card-ui-20260909.test.js
          node tests/v153-fire-vfx.test.js
          node tests/v166-water-vfx.test.js
          node tests/v173.23-wind-vfx.test.js
          node tests/v173.39-earth-light-vfx.test.js
      - name: Full repository tests
        run: |
          if ! command -v identify >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y imagemagick; fi
          git fetch origin 39767ce2b9dbfa59650b7c5fd4d52a57a2642ea5 4a592dd4c41d7efb1a4849fbfe0cbf68598121bf --depth=1 || true
          for test in tests/*.test.js; do node "$test"; done
          node .github/scripts/ci.mjs
