name: V166 Water VFX Fixed Slot Migration Validation

on:
  push:
    branches:
      - validation/v166-water-vfx-fixed-slot-harness-20260917

permissions:
  contents: write

jobs:
  migrate-and-validate-v166:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation tools
        uses: actions/checkout@v4
        with:
          ref: validation/v166-water-vfx-fixed-slot-harness-20260917
          path: validation-tools
          fetch-depth: 2

      - name: Check out clean V166 candidate
        uses: actions/checkout@v4
        with:
          ref: validation/v166-water-vfx-migration-candidate-20260917
          path: candidate
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify clean candidate base
        shell: bash
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "19ecdef2878aabf5e8ca57673b71b163e1c8baec"
          test -z "$(git status --porcelain)"

      - name: Apply owner-derived V166 geometry migration
        shell: bash
        run: |
          python validation-tools/scripts/validation-v166-water-fixed-slot-migrate.py candidate/tests/v166-water-vfx.test.js
          cd candidate
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "tests/v166-water-vfx.test.js"
          test -z "$(git diff --name-only -- js css .github)"

      - name: Run migrated V166 Water VFX suite
        working-directory: candidate
        run: node tests/v166-water-vfx.test.js

      - name: Commit validated candidate
        working-directory: candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v166-water-vfx.test.js
          test "$(git diff --cached --name-only)" = "tests/v166-water-vfx.test.js"
          git commit -m "test: validate V166 water VFX fixed-slot migration"
          git push origin HEAD:validation/v166-water-vfx-migration-candidate-20260917
