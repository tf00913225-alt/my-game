name: Retry2 V173.50 inventory quality-of-life

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'retry2 V173.50 inventory quality-of-life patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Prepatch final runtime gate by regex
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('js/equipment-progression.js')
          text=path.read_text(encoding='utf-8')
          if 'function loadV17350InventoryQol()' not in text:
              pattern=r'\n\s*if\(typeof window\.__v17347RuntimeGateRelease==="function"\)\{\s*window\.__v17347RuntimeGateRelease\(\);\s*\}\s*\}\)\(\);\s*$'
              new='''

    function releaseV17350RuntimeGate(){
        if(typeof window.__v17347RuntimeGateRelease==="function"){
            window.__v17347RuntimeGateRelease();
        }
    }
    function failV17350RuntimeGate(message){
        if(typeof window.__v17347RuntimeGateFail==="function"){
            window.__v17347RuntimeGateFail(message||"背包與批量操作系統載入失敗，請重新整理。");
        }
    }
    function loadV17350InventoryQol(){
        if(typeof document==="undefined"||!document.head){
            releaseV17350RuntimeGate();
            return;
        }
        if(!document.getElementById("v17350-inventory-qol-style")){
            const link=document.createElement("link");
            link.id="v17350-inventory-qol-style";
            link.rel="stylesheet";
            link.href="css/52-v173.50-inventory-qol.css?v=173.50";
            link.onerror=function(){ failV17350RuntimeGate("背包介面樣式載入失敗，請重新整理。"); };
            document.head.appendChild(link);
        }
        if(document.getElementById("v17350-inventory-qol-runtime")){
            releaseV17350RuntimeGate();
            return;
        }
        const script=document.createElement("script");
        script.id="v17350-inventory-qol-runtime";
        script.src="js/53-v173.50-inventory-qol.js?v=173.50";
        script.async=false;
        script.onload=releaseV17350RuntimeGate;
        script.onerror=function(){ failV17350RuntimeGate("背包與批量操作系統載入失敗，請重新整理。"); };
        document.head.appendChild(script);
    }
    loadV17350InventoryQol();
})();
'''
              text,count=re.subn(pattern,new,text,count=1,flags=re.S)
              if count!=1:
                  print(repr(path.read_text(encoding='utf-8')[-300:]))
                  raise SystemExit('runtime gate regex tail not found')
              path.write_text(text,encoding='utf-8')
          PY

      - name: Apply complete V173.50 patch
        run: |
          python .github/scripts/apply_v17350_inventory_qol.py
          node --check js/53-v173.50-inventory-qol.js
          node --check js/45-v154-dev-fixes.js
          node --check js/equipment-progression.js
          node --check js/20-anonymous-20.js
          node --check js/51-v169-rpg-ui.js
          node tests/v173.50-inventory-qol.test.js
          git diff --check

      - name: Commit V173.50
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/45-v154-dev-fixes.js js/equipment-progression.js js/20-anonymous-20.js js/51-v169-rpg-ui.js index.html tests
          git commit -m "V173.50 inventory bulk actions and persistent recovery warning"
          git push origin HEAD:dev
