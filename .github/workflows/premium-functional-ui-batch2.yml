name: Premium Functional UI Batch 2

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-batch2.yml
      - .github/scripts/premium-functional-ui-batch2.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply corrected Batch 2 in formal presentation owners
        run: |
          set -euo pipefail
          before_runtime="$(sha256sum js/00-main.js js/41-v146-system-polish.js js/19-stage-v78-character-inventory-runtime.js js/60-v173.64-skill-progression-rebalance.js | sha256sum | awk '{print $1}')"
          python3 .github/scripts/premium-functional-ui-batch2.py
          after_runtime="$(sha256sum js/00-main.js js/41-v146-system-polish.js js/19-stage-v78-character-inventory-runtime.js js/60-v173.64-skill-progression-rebalance.js | sha256sum | awk '{print $1}')"
          test "$before_runtime" = "$after_runtime"
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "css/00-main.css
          css/31-v131-fix-batch.css
          css/38-v141-system-expansion.css
          tests/premium-functional-ui-batch2.test.js"

      - name: Run Batch 2 targeted regression
        run: |
          set -euo pipefail
          node tests/premium-functional-ui-batch1.test.js
          node tests/premium-functional-ui-batch2.test.js
          node tests/v173.42-player-flow.test.js
          node tests/v169-rpg-ui.test.js
          node tests/v173.49-exp-pool-scroll-stability.test.js
          node tests/v146-system-polish.test.js
          git diff --check

      - name: Save verified Batch 2 and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/premium-functional-ui-batch2.yml .github/scripts/premium-functional-ui-batch2.py
          git add css/00-main.css css/31-v131-fix-batch.css css/38-v141-system-expansion.css tests/premium-functional-ui-batch2.test.js
          git diff --cached --check
          git commit -m "feat: 統一角色成長與技能介面質感"
          git push origin HEAD:feature/premium-functional-ui
