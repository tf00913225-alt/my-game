name: Fixed Slot Phase 3 Inspect

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 1
      - name: Print exact phase 3 owner functions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def extract(path, needle, limit=12000):
              text=Path(path).read_text(encoding='utf-8')
              start=text.find(needle)
              print(f'\n===== {path} :: {needle} @ {start} =====')
              if start<0: return
              brace=text.find('{',start)
              if brace<0:
                  print(text[start:start+limit]); return
              depth=0; quote=None; esc=False; i=brace
              while i<len(text):
                  c=text[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:
                              print(text[start:i+1]); return
                  i+=1
              print(text[start:start+limit])

          for path,needle in [
            ('js/00-main.js','function prepareAction('),
            ('js/00-main.js','function setBattleAllyTargetSelectionMode('),
            ('js/00-main.js','function selectBattleAllyTarget('),
            ('js/00-main.js','function renderPlayers('),
            ('js/00-main.js','function openHomeFeature('),
          ]: extract(path,needle)
          PY
