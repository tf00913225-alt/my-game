name: Fix dev deploy browser QA

on:
  push:
    branches:
      - fix/dev-deploy-browser-qa-20260913
    paths:
      - .github/workflows/fix-dev-deploy-browser-qa.yml
      - scripts/fix-dev-deploy-browser-qa.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dev-deploy-browser-qa-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply owner-level repair
        run: python3 scripts/fix-dev-deploy-browser-qa.py
      - name: Ensure image validation dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi
      - name: Build production bundles
        run: npm run build
      - name: Run repository tests
        run: npm test
      - name: Run account-first boot browser QA
        run: node .github/scripts/run-boot-architecture-browser-qa.mjs
      - name: Verify production build
        run: npm run build:check
      - name: Run remaining repository gates
        run: |
          node .github/scripts/ci.mjs resources
          node .github/scripts/ci.mjs html-ids
          node .github/scripts/ci.mjs loader
          node .github/scripts/release-gate.mjs
          node .github/scripts/ci.mjs git-diff
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: keep home utilities lazy and unblock dev deploy"
          git push origin HEAD:fix/dev-deploy-browser-qa-20260913
