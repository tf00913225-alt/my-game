name: V173.44 Release Whitespace Fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17338-inspect-staged.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Clean release whitespace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/42-v148-combat-dungeon-fixes.js')
          s=p.read_text(encoding='utf-8')
          p.write_text('\n'.join(line.rstrip() for line in s.splitlines())+'\n',encoding='utf-8')
          PY
          git config user.name "tf00913225-alt"
          git config user.email "tf00913225@gmail.com"
          git add js/42-v148-combat-dungeon-fixes.js
          git diff --cached --check
          git commit -m "chore: clean V173.44 release whitespace"
          git push origin HEAD:dev
