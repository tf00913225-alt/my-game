name: Boss VFX reliability repair

on:
  push:
    branches:
      - fix/boss-vfx-reliability-20260914

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply owner repair
        run: python scripts/repair-boss-vfx-reliability-20260914.py
      - name: Focused VFX tests
        run: |
          node --check js/39-v143-skill-animation.js
          node --check tests/boss-vfx-reliability-20260914.test.js
          node tests/boss-vfx-reliability-20260914.test.js
          node tests/v174-raster-only-combat-vfx-owner.test.js
          node tests/v153-fire-vfx.test.js
          node tests/v166-water-vfx.test.js
          node tests/v173.23-wind-vfx.test.js
          node tests/v173.39-earth-light-vfx.test.js
      - name: Deterministic build verification
        run: |
          npm run build
          npm run build:check
          git diff --check
      - name: Commit verified repair
        run: |
          rm .github/workflows/boss-vfx-reliability-repair.yml
          rm scripts/repair-boss-vfx-reliability-20260914.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make boss battle VFX reliable'
          git push origin HEAD:fix/boss-vfx-reliability-20260914
