name: Inspect skill owner mapping

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17338-inspect-staged.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Inspect skill owner mapping
        run: |
          grep -n -A 140 -B 30 'function getSkillCharacterObject' js/00-main.js || true
          grep -n -A 120 -B 30 'function selectCharacterForTabs' js/00-main.js || true
          grep -n -A 100 -B 30 'currentSkillCharacter=' js/00-main.js | head -300 || true
