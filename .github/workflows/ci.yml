name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  patch_first_play_hold:
    name: Repair returning First Play update hold
    if: github.head_ref == 'feature/first-play-resource-preload-privacy-boot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ensure existing asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi
      - name: Patch, build, verify, restore standard CI and push
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path

          startup=Path('js/52-v173.20-startup-loader.js')
          text=startup.read_text()
          old='''    let introTimer=0;\n    let citySceneShown=false;'''
          new='''    let introTimer=0;\n    let citySceneShown=false;\n    let returningPresentationComplete=false;'''
          if old not in text:
              raise SystemExit('startup state declaration block not found')
          text=text.replace(old,new,1)

          old='''    async function runOpeningPresentation(returning,retryOnly){\n        if(retryOnly){ showCityScene("resource-retry"); return; }\n        if(root){ root.dataset.audience=returning?"returning":"first-boot"; }\n        await delay(returning?5000:1800);\n        showCityScene(returning?"returning-logo-complete":"first-boot-logo-complete");\n        if(returning){ await delay(5000); }\n    }\n    function renderFirstPlayProgress(value){\n        render(value.percent,value.title,value.detail);\n        if(root){ root.dataset.firstPlayPath=value.path||""; root.dataset.firstPlayPriority=value.priority||""; }\n    }'''
          new='''    async function runOpeningPresentation(returning,retryOnly){\n        returningPresentationComplete=false;\n        if(retryOnly){ showCityScene("resource-retry"); return; }\n        if(root){ root.dataset.audience=returning?"returning":"first-boot"; }\n        await delay(returning?5000:1800);\n        showCityScene(returning?"returning-logo-complete":"first-boot-logo-complete");\n        if(returning){\n            await delay(5000);\n            returningPresentationComplete=true;\n            const readyPercent=Number(progress&&progress.getAttribute("aria-valuenow")||0);\n            if(readyPercent<100){ status("正在更新必要資源","第二幕將維持顯示，完成後才進入帳號系統"); }\n        }\n    }\n    function renderFirstPlayProgress(value){\n        const holdReturningUpdate=returningPresentationComplete&&root&&root.dataset.audience==="returning"&&Number(value.percent)<100;\n        render(value.percent,holdReturningUpdate?"正在更新必要資源":value.title,value.detail);\n        if(root){ root.dataset.firstPlayPath=value.path||""; root.dataset.firstPlayPriority=value.priority||""; }\n    }'''
          if old not in text:
              raise SystemExit('opening presentation/progress block not found')
          startup.write_text(text.replace(old,new,1))

          qa=Path('.github/scripts/run-boot-architecture-browser-qa.mjs')
          text=qa.read_text()
          replacements={
              'resources.some(p=>/\\/app-shell\\./.test(p))':'resources.some(p=>p.includes("/app-shell."))',
              'resources.some(p=>/\\/gameplay-core\\./.test(p))':'resources.some(p=>p.includes("/gameplay-core."))',
              'resources.some(p=>/\\/feature-patrol\\./.test(p))':'resources.some(p=>p.includes("/feature-patrol."))',
              'async function waitForJson(url,timeoutMs=10000){':'async function waitForJson(url,timeoutMs=30000){',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit('expected QA fragment not found: '+old)
              text=text.replace(old,new,1)

          fake_block='''            const fetchDest=String(request.headers["sec-fetch-dest"]||"");\n            if(url.pathname===authPath&&fetchDest==="script"){response.writeHead(200,{"content-type":"text/javascript; charset=utf-8","cache-control":"no-store"});response.end(fakeAuth);return;}\n            if(url.pathname===cloudPath&&fetchDest==="script"){response.writeHead(200,{"content-type":"text/javascript; charset=utf-8","cache-control":"no-store"});response.end(fakeCloud);return;}'''
          fake_guarded='''            const fetchDest=String(request.headers["sec-fetch-dest"]||"");\n            let moduleReferrer="";\n            try{moduleReferrer=new URL(String(request.headers.referer||""),"http://127.0.0.1").pathname;}catch(_){}\n            const qaFirebaseModuleImport=fetchDest==="script"&&/\\/build\\/firebase\\/firebase-(?:bootstrap|auth-ui)\\.[0-9a-f]{12}\\.js$/.test(moduleReferrer);\n            if(url.pathname===authPath&&qaFirebaseModuleImport){response.writeHead(200,{"content-type":"text/javascript; charset=utf-8","cache-control":"no-store"});response.end(fakeAuth);return;}\n            if(url.pathname===cloudPath&&qaFirebaseModuleImport){response.writeHead(200,{"content-type":"text/javascript; charset=utf-8","cache-control":"no-store"});response.end(fakeCloud);return;}'''
          if fake_block not in text:
              raise SystemExit('Firebase QA interception block not found')
          text=text.replace(fake_block,fake_guarded,1)

          scenario='''  var scenario=new URL(location.href).searchParams.get("scenario")||"";'''
          injected='''  var scenario=new URL(location.href).searchParams.get("scenario")||"";\n  if(scenario==="manifest-update"){\n    var nativeFetch=window.fetch.bind(window);\n    window.__qaManifestDelayApplied=0;\n    window.fetch=function(input,init){\n      var target=typeof input==="string"?input:String(input&&input.url||"");\n      var pathname="";\n      try{pathname=new URL(target,location.href).pathname;}catch(_){}\n      if(pathname.endsWith("/assets/ui/nav-home.png")){\n        window.__qaManifestDelayApplied++;\n        return new Promise(function(resolve,reject){setTimeout(function(){nativeFetch(input,init).then(resolve,reject);},15000);});\n      }\n      return nativeFetch(input,init);\n    };\n  }'''
          if scenario not in text:
              raise SystemExit('qaPrelude scenario declaration not found')
          text=text.replace(scenario,injected,1)

          oldSlow='''            if(activeScenario==="manifest-update"&&relative==="assets/ui/nav-home.png"){ await sleep(10800); }'''
          if oldSlow not in text:
              raise SystemExit('legacy server manifest delay not found')
          text=text.replace(oldSlow,'            // manifest-update latency is injected in-page so it is bound to the current navigation only.',1)

          update_start='''    await clear();const updateStarted=Date.now();await navigate("manifest-update");await sleep(10100);'''
          update_start_new='''    await clear();const updateStarted=Date.now();await navigate("manifest-update");\n    const seededUpdateRecord=await client.eval(`JSON.parse(localStorage.getItem("four_symbols_first_play_ready")||"null")`);assert.equal(seededUpdateRecord&&seededUpdateRecord.manifestHash,"qa-stale-manifest","manifest-update scenario did not seed the stale First Play record");\n    await sleep(10100);'''
          if update_start not in text:
              raise SystemExit('manifest update start block not found')
          text=text.replace(update_start,update_start_new,1)

          oldReady='''    const updatedRecord=await client.eval(`JSON.parse(localStorage.getItem("four_symbols_first_play_ready"))`);assert.equal(updatedRecord.manifestHash,manifest.firstPlay.manifestHash);evidence.checks.manifestUpdateReady={manifestHash:updatedRecord.manifestHash};'''
          newReady='''    const updatedRecord=await client.eval(`JSON.parse(localStorage.getItem("four_symbols_first_play_ready"))`);assert.equal(updatedRecord.manifestHash,manifest.firstPlay.manifestHash);const delayApplied=await client.eval(`window.__qaManifestDelayApplied||0`);assert.ok(delayApplied>=1,"manifest-update QA did not delay the changed First Play asset");evidence.checks.manifestUpdateReady={manifestHash:updatedRecord.manifestHash,delayApplied};'''
          if oldReady not in text:
              raise SystemExit('manifest update completion assertion not found')
          qa.write_text(text.replace(oldReady,newReady,1))
          PY

          node --check js/52-v173.20-startup-loader.js
          node --check .github/scripts/run-boot-architecture-browser-qa.mjs
          npm run build
          npm run build:check
          node tests/v173.20-startup-loader.test.js
          node tests/v173.52-real-startup-progress.test.js
          node tests/boot-architecture.test.js
          node .github/scripts/run-boot-architecture-browser-qa.mjs

          rm -rf artifacts/browser-qa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "$CI_BASE_SHA:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git add -A
          git status --short
          git commit -m "fix: hold returning launch on scene two until First Play update is ready [generated]"
          git push origin HEAD:${GITHUB_HEAD_REF}
