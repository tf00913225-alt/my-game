name: V173.60 test compatibility

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/v17360-test-compat.yml

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Update formal-tier compatibility and V173.60 cache wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          # Real compatibility fixes in the synthesis/reforge owner.
          p=Path('js/36-v141-content-systems.js')
          s=p.read_text(encoding='utf-8')
          old='const ore=definitions().ores.find(item=>item.tierKey===tier);'
          if s.count(old)!=2:
              raise SystemExit(f'js/36 ore compatibility: expected 2 anchors, found {s.count(old)}')
          s=s.replace(old,'const ore=definitions().ores.find(item=>normalizeTierKey(item.tierKey)===tier);')
          old='consumeMatching(candidate=>candidate&&candidate.blueprintSlot&&candidate.tierKey===tier,cost)'
          if s.count(old)!=1:
              raise SystemExit(f'js/36 reforge consumption compatibility: expected 1 anchor, found {s.count(old)}')
          s=s.replace(old,'consumeMatching(candidate=>candidate&&candidate.blueprintSlot&&normalizeTierKey(candidate.tierKey)===tier,cost)',1)
          old='TALISMAN_GOLD[source.tierKey]'
          if s.count(old)!=4:
              raise SystemExit(f'js/36 talisman cost compatibility: expected 4 anchors, found {s.count(old)}')
          s=s.replace(old,'TALISMAN_GOLD[normalizeTierKey(source.tierKey)]')
          p.write_text(s,encoding='utf-8')

          # V141: blueprint grid now has six formal tiers; reforge default is white.
          p=Path('tests/v141-system-expansion.test.js')
          s=p.read_text(encoding='utf-8')
          for old,new in [
              ('assert.equal(5*4*4,80);','assert.equal(5*6*4,120);'),
              ('assert.match(contentSource,/reforgeMaterialTier:"low"/);','assert.match(contentSource,/reforgeMaterialTier:"white"/);\n    assert.match(contentSource,/TIER_ALIASES=\\{low:"white",mid:"blue",high:"purple",perfect:"orange"\\}/);')
          ]:
              if s.count(old)!=1:
                  raise SystemExit(f'v141: expected one anchor {old!r}, found {s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # V169: old low/mid/high/perfect classes are compatibility aliases for white/blue/purple/orange.
          p=Path('tests/v169-abyss-assets-flow.test.js')
          s=p.read_text(encoding='utf-8')
          old='''test("talisman and blueprint borders follow blue, purple, orange, magenta rarity order",()=>{\n    const expected={low:"#3ba7ff",mid:"#a855f7",high:"#ff9f38",perfect:"#ff4fa7"};\n    Object.entries(expected).forEach(([tier,color])=>{\n        assert.match(css,new RegExp("v169-(?:talisman|blueprint)-art\\\\.v169-rarity-"+tier+"[^}]+border-color:"+color));\n    });\n    assert.match(css,/\\.v169-item-art > img\\{[^}]*object-fit:contain/);\n});'''
          new='''test("talisman and blueprint borders follow formal white, blue, purple, orange rarity order",()=>{\n    const expected={low:"#D8D8D8",mid:"#42A5FF",high:"#B05CFF",perfect:"#FF9F38"};\n    Object.entries(expected).forEach(([tier,color])=>{\n        assert.match(css,new RegExp("v169-(?:talisman|blueprint)-art\\\\.v169-rarity-"+tier+"[^}]+border-color:"+color));\n    });\n    assert.match(css,/v169-rarity-pink[^}]+border-color:#FF4FA7/);\n    assert.match(css,/v169-rarity-four-symbol/);\n    assert.match(css,/\\.v169-item-art > img\\{[^}]*object-fit:contain/);\n});'''
          if s.count(old)!=1:
              raise SystemExit(f'v169: expected one rarity test anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # V173.50 inventory now understands all six formal equipment tiers.
          p=Path('tests/v173.50-inventory-qol.test.js')
          s=p.read_text(encoding='utf-8')
          for old,new in [
              ('assert.match(qol,/QUALITY_ORDER=\\["white","blue","purple","orange"\\]/);','assert.match(qol,/QUALITY_ORDER=\\["white","blue","purple","orange","pink","four-symbol"\\]/);'),
              ('assert.match(qol,/橙裝售出後無法復原/);','assert.match(qol,/高階裝備售出後無法復原/);')
          ]:
              if s.count(old)!=1:
                  raise SystemExit(f'v173.50: expected one anchor {old!r}, found {s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # V173.58 behavior remains; only formal tier names/compatibility semantics changed.
          p=Path('tests/v173.58-reforge-redesign.test.js')
          s=p.read_text(encoding='utf-8')
          replacements=[
              ('assert.match(synthesis,/reforgeMaterialTier:"low",lockedReforgeKeys:\\[\\]/);','assert.match(synthesis,/reforgeMaterialTier:"white",lockedReforgeKeys:\\[\\]/);'),
              ('assert.match(synthesis,/candidate&&candidate\\.blueprintSlot&&candidate\\.tierKey===tier,cost/);','assert.match(synthesis,/candidate&&candidate\\.blueprintSlot&&normalizeTierKey\\(candidate\\.tierKey\\)===tier,cost/);'),
              ('assert.match(css,/V173\\.60 — FREE-MATERIAL REFORGE UI/);','assert.match(css,/V173\\.58 — FREE-MATERIAL REFORGE UI/);')
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'v173.58: expected one anchor {old!r}, found {s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Real cache-busting fix: nested V173.51 QA assets must follow the release version.
          p=Path('js/53-v173.50-inventory-qol.js')
          s=p.read_text(encoding='utf-8')
          expected=[
              'css/53-v173.51-qa.css?v=173.58',
              'js/54-v173.51-battle-qa.js?v=173.58',
              'js/55-v173.51-inventory-qa.js?v=173.58',
              'js/56-v173.51-shop-qa.js?v=173.58',
              'js/57-v173.51-quest-qa.js?v=173.58'
          ]
          for old in expected:
              if s.count(old)!=1:
                  raise SystemExit(f'QA cache wiring: expected one {old}, found {s.count(old)}')
              s=s.replace(old,old.replace('173.58','173.60'),1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Ensure asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi
      - name: Run all Node test suites
        run: |
          node .github/scripts/ci.mjs tests
      - name: Commit compatibility and cache wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/36-v141-content-systems.js js/53-v173.50-inventory-qol.js tests/v141-system-expansion.test.js tests/v169-abyss-assets-flow.test.js tests/v173.50-inventory-qol.test.js tests/v173.58-reforge-redesign.test.js
          git diff --cached --check
          git commit -m "V173.60 finalize formal tier compatibility"
          git push origin HEAD:dev
