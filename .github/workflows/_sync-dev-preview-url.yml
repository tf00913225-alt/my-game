name: Sync DEV preview URL docs

on:
  push:
    branches:
      - docs/dev-preview-url

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/dev-preview-url
          fetch-depth: 2

      - name: Sync current DEV branch alias
        run: |
          python3 - <<'PY'
          from pathlib import Path

          agents=Path('AGENTS.md')
          text=agents.read_text(encoding='utf-8')
          old='DEV 唯一固定測試網址：`https://four-symbols-dev.pages.dev`。'
          new='DEV 唯一固定測試／SHA 驗證網址：`https://dev.four-symbols-dev.pages.dev`。此網址為 Cloudflare `dev` 分支固定 alias；不得再以專案 root `https://four-symbols-dev.pages.dev` 作為 dev commit 驗證來源。'
          if old not in text:
              raise SystemExit('AGENTS.md old DEV URL rule not found')
          agents.write_text(text.replace(old,new,1),encoding='utf-8')

          handoff=Path('HANDOFF.md')
          h=handoff.read_text(encoding='utf-8')
          marker='## 2026-09-07 — Cloudflare DEV branch alias'
          if marker not in h:
              h += '''\n\n## 2026-09-07 — Cloudflare DEV branch alias\n\n- Cloudflare 已由實際 deployment 證實：`dev` 分支固定 alias 為 `https://dev.four-symbols-dev.pages.dev`。\n- 現行 DEV 實機測試、release manifest 與 commit SHA read-back 一律使用此 branch alias；較早文件中出現的 `https://four-symbols-dev.pages.dev` 僅為歷史 root URL，不得再作為目前 `dev` SHA 驗證來源。\n- `.github/workflows/deploy-dev-cloudflare.yml` 已明確使用 `--branch=dev`，且部署後會從上述 branch alias 驗證 commit SHA、Game Version 與 Cache Version。\n'''
              handoff.write_text(h,encoding='utf-8')
          PY
          git diff --check

      - name: Commit docs and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_sync-dev-preview-url.yml
          git add AGENTS.md HANDOFF.md
          git commit -m "docs: sync Cloudflare dev preview URL"
          git push origin HEAD:docs/dev-preview-url
