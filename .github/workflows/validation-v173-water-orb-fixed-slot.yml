name: V173 Water Orb Fixed Slot Validation

on:
  push:
    branches:
      - validation/v173-water-orb-fixed-slot-contract-20260917

permissions:
  contents: read

jobs:
  validate-v173-water-orb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/v173-water-orb-fixed-slot-contract-20260917
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify validation scope
        shell: bash
        run: |
          base=e8db4f0bf827b5dce629236e9a1009213e81979c
          git fetch --no-tags --depth=1 origin "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          printf '%s\n' "$changed"
          test -z "$(git diff --name-only "$base" HEAD -- js css)"

      - name: Run formal V173 contract diagnosis
        run: node tests/diagnosis-v173-water-orb-fixed-slot-contract.test.js

      - name: Run migrated V173 Water Ball contract
        run: node tests/v173-water-orb-direction-vfx.test.js

      - name: Re-run formal Water runtime coverage
        run: node tests/v166-water-vfx.test.js
