name: V142 gate contract migration

on:
  push:
    branches:
      - fix/combat-vfx-owner-cleanup-20260909

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Replace retired V142 renderer contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/v142-skill-animation.test.js')
          s=p.read_text()
          start=s.find('    await test("direct badge action trigger shares one director and cleanup path"')
          end=s.find('\n    await test("元相光明 heals 350 HP and restores 95 SP to every living ally"',start)
          if start < 0 or end < 0:
              raise SystemExit('V142 historical renderer contract block not found')
          block='''    await test("direct badge trigger shares one gate-only director while V143 owns rendering",()=>{\n        assert.match(source,/window\\.v142PlaySkillAnimationFromBadge=function/);\n        assert.doesNotMatch(source,/const previous=showSkillNameBadge/);\n        assert.match(source,/removeEventListener\\("visibilitychange"/);\n        assert.doesNotMatch(source,/animationend|cancelAnimationFrame|registerRenderer|createElement\\(/);\n        assert.match(css,/visual renderer retired in V174/);\n        assert.doesNotMatch(css,/@keyframes|animation\\s*:|v142ActionClock|data-style=/);\n    });\n'''
          p.write_text(s[:start]+block+s[end:])
          PY
      - name: Verify V142 contract
        run: node tests/v142-skill-animation.test.js
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/v142-skill-animation.test.js
          git commit -m "test: retire V142 visual renderer assertions"
          git push origin HEAD:fix/combat-vfx-owner-cleanup-20260909
