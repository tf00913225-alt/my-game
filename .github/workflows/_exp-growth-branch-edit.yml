name: EXP growth branch edit

on:
  push:
    branches:
      - fix/exp-growth-curve-convergence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply EXP owner convergence
        run: python3 .github/scripts/_exp_growth_branch_edit.py

      - name: Run targeted EXP regressions
        run: |
          node --check js/25-v131-fix-batch.js
          node --check js/28-v133-economy-rebalance.js
          node tests/v139-economy-rested-exp.test.js
          node tests/v173.43-growth-charge.test.js
          node tests/v170-final-spec-integration.test.js

      - name: Run project syntax and all Node suites
        run: |
          node .github/scripts/ci.mjs syntax
          node .github/scripts/ci.mjs tests

      - name: Commit branch-only implementation
        run: |
          rm -f .github/workflows/_exp-growth-branch-edit.yml
          rm -f .github/scripts/_exp_growth_branch_edit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Converge formal EXP growth curve"
          git push origin HEAD:fix/exp-growth-curve-convergence
