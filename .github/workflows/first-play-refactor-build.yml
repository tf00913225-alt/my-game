name: First Play Refactor Build

on:
  push:
    branches:
      - feature/first-play-resource-preload-privacy-boot

permissions:
  contents: write

jobs:
  apply-build-test:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply formal-owner refactor
        run: node scripts/apply-first-play-refactor.mjs
      - name: Build deterministic production output
        run: npm run build
      - name: Deterministic build check
        run: npm run build:check
      - name: Repository tests
        run: npm test
      - name: Browser mobile boot QA
        run: npm run qa:boot
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: implement first play resource preparation [generated]"
          git push origin HEAD:feature/first-play-resource-preload-privacy-boot
