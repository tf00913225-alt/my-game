name: Premium Functional UI Batch 4

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-batch4.yml
      - .github/scripts/premium-functional-ui-batch4.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply Batch 4 in shop and synthesis presentation owners
        run: |
          set -euo pipefail
          before_runtime="$(sha256sum js/28-v133-economy-rebalance.js js/36-v141-content-systems.js js/40-v144-rules-and-abyss.js js/51-v169-rpg-ui.js js/58-v173.63-functional-fixes.js | sha256sum | awk '{print $1}')"
          python3 .github/scripts/premium-functional-ui-batch4.py
          after_runtime="$(sha256sum js/28-v133-economy-rebalance.js js/36-v141-content-systems.js js/40-v144-rules-and-abyss.js js/51-v169-rpg-ui.js js/58-v173.63-functional-fixes.js | sha256sum | awk '{print $1}')"
          test "$before_runtime" = "$after_runtime"
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "css/38-v141-system-expansion.css
          css/49-v169-rpg-ui.css"
          test -f tests/premium-functional-ui-batch4.test.js
      - name: Run Batch 4 targeted regression
        run: |
          set -euo pipefail
          node tests/premium-functional-ui-batch1.test.js
          node tests/premium-functional-ui-batch2.test.js
          node tests/premium-functional-ui-batch3.test.js
          node tests/premium-functional-ui-batch4.test.js
          node tests/v141-system-expansion.test.js
          node tests/v146-system-polish.test.js
          node tests/v169-rpg-ui.test.js
          node tests/v173.42-player-flow.test.js
          node tests/v173.48-premium-shop-layout.test.js
          node tests/v173.56-shop-layout-preview-regression.test.js
          git diff --check
      - name: Save verified Batch 4 and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/premium-functional-ui-batch4.yml .github/scripts/premium-functional-ui-batch4.py
          git add css/38-v141-system-expansion.css css/49-v169-rpg-ui.css tests/premium-functional-ui-batch4.test.js
          git diff --cached --check
          git commit -m "feat: 統一商店合成與冶煉介面質感"
          git push origin HEAD:feature/premium-functional-ui
