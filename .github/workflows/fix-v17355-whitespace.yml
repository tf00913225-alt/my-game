name: Fix V173.55 whitespace

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'launch V173.55 whitespace cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove trailing whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/53-v173.50-inventory-qol.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          p.write_text('\n'.join(line.rstrip() for line in lines)+'\n',encoding='utf-8')
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/53-v173.50-inventory-qol.js
          git commit -m "V173.55 remove trailing whitespace"
          git push origin HEAD:dev
