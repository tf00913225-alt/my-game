name: V173.59 remove starter ring

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/v17359-remove-starter-ring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove starter ring from new-account inventory
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/00-main.js')
          text = path.read_text(encoding='utf-8')
          marker = 'id:"powerRing"'
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one powerRing marker, found {text.count(marker)}')
          pos = text.index(marker)
          start = text.rfind('    {\n', 0, pos)
          separator = text.find('\n    },\n\n    {', pos)
          if start < 0 or separator < 0:
              raise SystemExit('could not isolate starter powerRing object')
          block = text[start:separator + len('\n    },\n\n')]
          for required in ('name:"力量戒指"', 'type:"accessory"', 'attack:5'):
              if required not in block:
                  raise SystemExit(f'unexpected powerRing object; missing {required}')
          path.write_text(text[:start] + text[separator + len('\n    },\n\n'):], encoding='utf-8')
          PY
          node --check js/00-main.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/00-main.js
          git diff --cached --check
          git commit -m "V173.59 remove starter ring from new accounts"
          git push origin HEAD:dev
