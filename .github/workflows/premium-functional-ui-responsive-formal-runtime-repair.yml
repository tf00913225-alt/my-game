name: Premium Functional UI Responsive Cleanup

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-responsive-formal-runtime-repair.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Normalize responsive regression test
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/premium-functional-ui-responsive-browser.test.js')
          t=p.read_text()
          old='if(data.majorMin<38){const details=await evaluate(client,"[...document.querySelectorAll(\\\".qa-major\\\")].map((el,i)=>{const c=getComputedStyle(el),r=el.getBoundingClientRect();return {i,id:el.id,className:String(el.className),text:el.textContent.trim().slice(0,30),computedMinHeight:c.minHeight,computedHeight:c.height,rect:{left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}}})");throw new Error(`${surface} major logical hit area ${data.majorMin}: ${JSON.stringify(details)}`);}'
          new='assert.ok(data.majorMin>=38,`${surface} major logical hit area ${data.majorMin}`);'
          if old not in t:
              raise SystemExit('responsive diagnostic assertion anchor missing')
          p.write_text(t.replace(old,new,1))
          PY
          git diff --check
          node tests/premium-functional-ui-responsive-browser.test.js
      - name: Remove temporary responsive workflows and save cleanup
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/premium-functional-ui-responsive-inline-owner-fix.yml \
            .github/workflows/premium-functional-ui-responsive-cdp-fix.yml \
            .github/workflows/premium-functional-ui-responsive-cdp-meta-repair.yml \
            .github/workflows/premium-functional-ui-responsive-formal-runtime-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/premium-functional-ui-responsive-browser.test.js
          git diff --cached --check
          git commit -m "test: finalize responsive browser QA harness"
          git push origin HEAD:feature/premium-functional-ui
