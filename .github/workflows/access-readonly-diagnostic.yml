name: Private DEV image read-only diagnostic
on:
  push:
    branches: [fix/access-readonly-validation-20261030]
permissions:
  contents: read
jobs:
  verify-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_REQUIRED: "1"
      CF_ACCESS_CLIENT_ID: ${{ secrets.DEV_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.DEV_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5e4dc940a7c1f8a942dc77d86eb266607748a7fc
          sparse-checkout: .github/scripts/dev-access-fetch.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify authorized static image responses
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {devAccessFetch} from './.github/scripts/dev-access-fetch.mjs';
          const origin='https://dev.four-symbols-dev.pages.dev/';
          const repo='https://raw.githubusercontent.com/tf00913225-alt/my-game/';
          const merge='ad2a8dcdf947ad0b10a26a6b6e8657a234785887';
          const manifestUrl=origin+'release-manifest.json';
          async function manifest(){
            const response=await devAccessFetch(manifestUrl,{cache:'no-store',signal:AbortSignal.timeout(15000)});
            if(response.status!==200)throw Error('manifest HTTP '+response.status);
            const result=await response.json();
            if(!/^[0-9a-f]{40}$/.test(result.commitSha))throw Error('invalid manifest SHA');
            return result.commitSha;
          }
          const digest=bytes=>createHash('sha256').update(bytes).digest('hex');
          const sha=await manifest();
          const ancestry=await fetch(`https://api.github.com/repos/tf00913225-alt/my-game/compare/${merge}...${sha}`,{signal:AbortSignal.timeout(15000)});
          if(!ancestry.ok)throw Error('ancestry HTTP '+ancestry.status);
          const comparison=await ancestry.json();
          if(!['ahead','identical'].includes(comparison.status))throw Error('deployed SHA does not contain requested merge');
          console.log('IMAGE_AUDIT_START '+JSON.stringify({sha,merge,at:new Date().toISOString()}));
          let failed=false;
          for(const variant of ['readable_',''])for(const sex of ['female','male'])for(const num of ['01','02','03','04']){
            const path=`assets/characters/battle/player_battle_${variant}${sex}_${num}.webp`;
            const [live,source]=await Promise.all([
              devAccessFetch(origin+path,{cache:'no-store',signal:AbortSignal.timeout(30000)}),
              fetch(repo+sha+'/'+path,{cache:'no-store',signal:AbortSignal.timeout(30000)})
            ]);
            const mime=(live.headers.get('content-type')||'').split(';')[0].trim().toLowerCase();
            const bytes=Buffer.from(await live.arrayBuffer()),gitBytes=Buffer.from(await source.arrayBuffer());
            const actual=digest(bytes),expected=digest(gitBytes);
            const pass=live.status===200&&source.status===200&&mime==='image/webp'&&actual===expected;
            failed ||= !pass;
            console.log('IMAGE_AUDIT_ITEM '+JSON.stringify({path,http:live.status,mime,sha256:actual,gitHttp:source.status,gitSha256:expected,bytes:bytes.length,pass}));
          }
          const end=await manifest();
          const stable=sha===end;
          console.log('IMAGE_AUDIT_END '+JSON.stringify({shaBefore:sha,shaAfter:end,stable,pass:!failed&&stable,at:new Date().toISOString()}));
          if(failed||!stable)process.exitCode=1;
          NODE
