name: Android Facebook Login PoC

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-native-facebook-login-poc-20260912
    paths:
      - "android/facebook-login-poc/**"
      - ".github/workflows/android-facebook-poc.yml"

permissions:
  contents: read

jobs:
  build-poc:
    name: Build PoC APK and Facebook key hash
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        working-directory: android/facebook-login-poc
        run: chmod +x gradlew

      - name: Ensure Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Restore Firebase Android config
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_GOOGLE_SERVICES_JSON:-}" ]; then
            echo "Missing required Actions secret: FIREBASE_GOOGLE_SERVICES_JSON" >&2
            exit 1
          fi

          DEST="android/facebook-login-poc/app/google-services.json"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" | base64 --decode > "$DEST"

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'android/facebook-login-poc/app/google-services.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const clients = Array.isArray(data.client) ? data.client : [];
          const packages = clients
            .map((client) => client?.client_info?.android_client_info?.package_name)
            .filter(Boolean);

          if (data?.project_info?.project_id !== 'four-symbols-jianghu') {
            throw new Error('google-services.json belongs to the wrong Firebase project');
          }
          if (!packages.includes('com.foursymbols.jianghu.authpoc')) {
            throw new Error('google-services.json does not contain com.foursymbols.jianghu.authpoc');
          }
          console.log('Firebase Android config validated for PoC package.');
          NODE

      - name: Validate Meta client token
        shell: bash
        env:
          META_FACEBOOK_CLIENT_TOKEN: ${{ secrets.META_FACEBOOK_CLIENT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${META_FACEBOOK_CLIENT_TOKEN:-}" ]; then
            echo "Missing required Actions secret: META_FACEBOOK_CLIENT_TOKEN" >&2
            exit 1
          fi

          echo "::add-mask::$META_FACEBOOK_CLIENT_TOKEN"
          echo "Meta client token is available for the Android build."

      - name: Build debug APK
        working-directory: android/facebook-login-poc
        env:
          META_FACEBOOK_CLIENT_TOKEN: ${{ secrets.META_FACEBOOK_CLIENT_TOKEN }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Generate Facebook debug key hash from built APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/facebook-login-poc/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "Built debug APK is missing: $APK" >&2
            exit 1
          fi

          HASH="$(keytool -printcert -rfc -jarfile "$APK" 2>/dev/null \
            | openssl x509 -outform der \
            | openssl sha1 -binary \
            | openssl base64)"

          if [ -z "$HASH" ]; then
            echo "Facebook debug key hash is empty" >&2
            exit 1
          fi

          mkdir -p android/facebook-login-poc/build/poc-output
          printf '%s\n' "$HASH" | tee android/facebook-login-poc/build/poc-output/facebook-debug-key-hash.txt
          echo "FACEBOOK_DEBUG_KEY_HASH=$HASH" >> "$GITHUB_ENV"
          echo "### Facebook debug Key Hash (from built APK certificate)" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$HASH" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        run: |
          cp android/facebook-login-poc/app/build/outputs/apk/debug/app-debug.apk \
             android/facebook-login-poc/build/poc-output/facebook-login-poc-debug.apk

      - name: Upload PoC APK and key hash
        uses: actions/upload-artifact@v4
        with:
          name: android-facebook-login-poc-${{ github.sha }}
          path: android/facebook-login-poc/build/poc-output/
          if-no-files-found: error
          retention-days: 14
