<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>四象江湖傳｜單張立繪戰鬥動態原型</title>
<style>
:root{
  color-scheme:dark;
  --gold:#d9b66e;
  --gold-soft:#9e7740;
  --ink:#100d0a;
  --panel:rgba(14,11,8,.82);
  --text:#f8efd9;
  --muted:#c4b89e;
  --danger:#ff745f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080706;color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;overflow:hidden}
button{font:inherit}
.prototype{
  position:relative;
  width:min(100vw,480px);
  height:min(100dvh,853px);
  min-height:640px;
  overflow:hidden;
  isolation:isolate;
  background:
    linear-gradient(180deg,rgba(4,6,5,.15) 0%,rgba(9,8,6,.08) 38%,rgba(9,7,5,.72) 100%),
    url("https://raw.githubusercontent.com/tf00913225-alt/my-game/dev/assets/maps/forest.jpg") center/cover no-repeat;
}
.prototype::before{
  content:"";
  position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse at 50% 37%,rgba(240,213,154,.12),transparent 42%),
    linear-gradient(90deg,rgba(3,3,2,.38),transparent 20% 80%,rgba(3,3,2,.38));
  pointer-events:none;
}
.prototype::after{
  content:"";
  position:absolute;left:-15%;right:-15%;bottom:21%;height:24%;
  background:radial-gradient(ellipse at 50% 100%,rgba(226,218,187,.22),rgba(195,202,187,.07) 45%,transparent 70%);
  filter:blur(16px);
  opacity:.62;
  pointer-events:none;
  animation:mistDrift 8s ease-in-out infinite alternate;
}
@keyframes mistDrift{to{transform:translate3d(4%,1%,0);opacity:.48}}

.topbar{
  position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
.title{
  padding:9px 12px 8px;border:1px solid rgba(217,182,110,.65);
  background:linear-gradient(180deg,rgba(28,22,15,.92),rgba(11,9,7,.78));
  box-shadow:0 5px 18px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,239,197,.05);
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);
}
.title strong{display:block;font-size:15px;letter-spacing:.08em}
.title small{display:block;margin-top:2px;color:var(--muted);font-size:12px}
.badge{
  padding:7px 9px;border:1px solid rgba(217,182,110,.42);background:rgba(13,10,7,.72);
  color:#ead5a5;font-size:12px;white-space:nowrap
}

.arena{position:absolute;inset:72px 0 144px;z-index:2}
.ground-line{
  position:absolute;left:4%;right:4%;bottom:24%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(226,205,159,.18),transparent)
}

.unit{position:absolute;width:34%;max-width:164px;aspect-ratio:3/4;pointer-events:none}
.unit.player{left:4%;bottom:4%}
.unit.soldier{right:4%;bottom:33%;width:29%;max-width:136px}
.unit.boss{right:7%;bottom:5%;width:39%;max-width:188px}
.unit[data-state="dead"]{pointer-events:none}

.unit .nameplate{
  position:absolute;z-index:8;left:50%;top:-32px;transform:translateX(-50%);
  min-width:86px;max-width:150px;padding:4px 8px;text-align:center;
  border:1px solid rgba(217,182,110,.5);background:rgba(11,8,5,.8);
  color:#fff5dd;font-weight:800;font-size:13px;line-height:1.15;white-space:nowrap
}
.unit .hp{
  position:absolute;z-index:8;left:7%;right:7%;top:-8px;height:7px;
  border:1px solid rgba(0,0,0,.75);background:rgba(0,0,0,.65);overflow:hidden
}
.unit .hp>i{display:block;width:var(--hp,100%);height:100%;background:linear-gradient(90deg,#6f1813,#db4d35,#ff9b64);transition:width .25s ease}

.shadow{
  position:absolute;z-index:0;left:13%;right:13%;bottom:0;height:10%;
  border-radius:50%;background:rgba(0,0,0,.58);filter:blur(6px);
  transform:scaleX(1);opacity:.72;
  animation:shadowBreath var(--idle-time,2.4s) ease-in-out infinite
}
.motion,.impact,.idle{position:absolute;inset:0;transform-origin:50% 88%;will-change:transform}
.motion{z-index:2}
.idle{animation:idleNormal var(--idle-time,2.4s) ease-in-out infinite}
.unit.profile-heavy{--idle-time:3.15s}
.unit.profile-heavy .idle{animation-name:idleHeavy}
.unit.profile-floating{--idle-time:2.15s}
.unit.profile-floating .idle{animation-name:idleFloat}
.art{
  display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;
  user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.55));
  transform:translateZ(0)
}
.unit.player .art{filter:drop-shadow(0 8px 8px rgba(0,0,0,.5)) drop-shadow(0 0 10px rgba(231,118,53,.14))}
.unit.boss .art{filter:drop-shadow(0 10px 9px rgba(0,0,0,.65)) drop-shadow(0 0 13px rgba(255,75,47,.18))}

@keyframes idleNormal{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(0,-4px,0) scale(1.012,1.018)}
}
@keyframes idleHeavy{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(0,-2px,0) scale(1.008,1.012)}
}
@keyframes idleFloat{
  0%,100%{transform:translate3d(0,2px,0) rotate(-.3deg)}
  50%{transform:translate3d(0,-7px,0) rotate(.4deg)}
}
@keyframes shadowBreath{
  0%,100%{transform:scaleX(1);opacity:.7}
  50%{transform:scaleX(.9);opacity:.55}
}

/* Attack is applied to a wrapper separate from idle so one PNG can keep "breathing" while lunging. */
.unit.player.is-attacking .motion{animation:attackRight .48s cubic-bezier(.18,.78,.2,1)}
.unit.soldier.is-attacking .motion,.unit.boss.is-attacking .motion{animation:attackLeft .54s cubic-bezier(.18,.78,.2,1)}
@keyframes attackRight{
  0%{transform:translate3d(0,0,0)}
  18%{transform:translate3d(-9px,2px,0) rotate(-1.4deg) scale(.99)}
  48%{transform:translate3d(48px,-4px,0) rotate(1.2deg) scale(1.035)}
  62%{transform:translate3d(52px,-4px,0) rotate(.8deg) scale(1.025)}
  100%{transform:translate3d(0,0,0)}
}
@keyframes attackLeft{
  0%{transform:translate3d(0,0,0)}
  20%{transform:translate3d(8px,2px,0) rotate(1deg) scale(.99)}
  50%{transform:translate3d(-42px,-3px,0) rotate(-1deg) scale(1.025)}
  64%{transform:translate3d(-46px,-3px,0) rotate(-.6deg) scale(1.02)}
  100%{transform:translate3d(0,0,0)}
}

.unit.is-hit .impact{animation:impactHit .34s cubic-bezier(.22,.8,.26,1)}
.unit.is-hit .art{animation:hitFlash .34s ease}
@keyframes impactHit{
  0%,100%{transform:translate3d(0,0,0) rotate(0)}
  24%{transform:translate3d(var(--hit-x,-10px),1px,0) rotate(var(--hit-r,-1.2deg))}
  46%{transform:translate3d(calc(var(--hit-x,-10px) * -.35),0,0) rotate(calc(var(--hit-r,-1.2deg) * -.35))}
  70%{transform:translate3d(calc(var(--hit-x,-10px) * .16),0,0)}
}
.unit.player{--hit-x:-9px;--hit-r:-1deg}
.unit.soldier,.unit.boss{--hit-x:10px;--hit-r:1.2deg}
@keyframes hitFlash{
  0%,100%{filter:drop-shadow(0 8px 8px rgba(0,0,0,.55));opacity:1}
  23%{filter:brightness(1.65) saturate(.7) drop-shadow(0 0 15px rgba(255,235,198,.8));opacity:.86}
}

.unit.is-casting .motion{animation:castPulse .68s cubic-bezier(.22,.75,.24,1)}
.unit.is-casting::before{
  content:"";position:absolute;z-index:1;inset:13% 5% 7%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,101,51,.34),rgba(218,171,91,.09) 42%,transparent 68%);
  filter:blur(3px);animation:castAura .68s ease-out
}
@keyframes castPulse{
  0%{transform:translateY(0) scale(1)}
  42%{transform:translateY(-8px) scale(1.035)}
  65%{transform:translateY(-5px) scale(1.025)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes castAura{
  0%{opacity:0;transform:scale(.6)}
  40%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.22)}
}

.unit.is-dead .motion{animation:unitDeath .72s ease-in forwards}
.unit.is-dead .shadow{animation:none;opacity:.15;transform:scaleX(.72)}
@keyframes unitDeath{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:1;filter:none}
  35%{transform:translate3d(8px,3px,0) rotate(2deg);opacity:.86}
  100%{transform:translate3d(12px,38px,0) rotate(8deg) scale(.9);opacity:.12;filter:grayscale(.75)}
}
.unit.is-reviving .motion{animation:unitRevive .8s cubic-bezier(.16,.8,.25,1)}
@keyframes unitRevive{
  0%{transform:translate3d(0,30px,0) scale(.9);opacity:.05;filter:brightness(1.9)}
  52%{transform:translate3d(0,-8px,0) scale(1.035);opacity:1;filter:brightness(1.45)}
  100%{transform:translate3d(0,0,0) scale(1);opacity:1;filter:none}
}

.fx{
  position:absolute;z-index:12;width:54px;height:54px;border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%);opacity:0
}
.fx.hit{
  background:
    radial-gradient(circle,#fff5cc 0 8%,#ffb94f 9% 18%,rgba(255,97,36,.65) 19% 34%,transparent 36%),
    conic-gradient(from 0deg,transparent 0 7%,#ffe39c 8% 11%,transparent 12% 25%,#ff8e36 26% 30%,transparent 31% 54%,#ffe39c 55% 59%,transparent 60%);
  animation:fxHit .38s ease-out
}
@keyframes fxHit{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.3) rotate(32deg)}
}

.damage{
  position:absolute;z-index:15;pointer-events:none;font-weight:900;font-size:20px;
  color:#fff0c4;text-shadow:0 2px 2px #421108,0 0 7px rgba(255,96,35,.9);
  animation:damagePop .78s cubic-bezier(.18,.82,.22,1) forwards
}
@keyframes damagePop{
  0%{opacity:0;transform:translate(-50%,4px) scale(.75)}
  18%{opacity:1;transform:translate(-50%,-8px) scale(1.18)}
  100%{opacity:0;transform:translate(-50%,-42px) scale(.92)}
}

.controls{
  position:absolute;z-index:30;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));
  padding:10px;border:1px solid rgba(217,182,110,.42);
  background:linear-gradient(180deg,rgba(18,14,9,.94),rgba(8,7,5,.94));
  box-shadow:0 -8px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,235,190,.035);
}
.controls .hint{margin:0 0 8px;color:var(--muted);font-size:12px;line-height:1.35;text-align:center}
.button-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.control{
  min-height:42px;border:1px solid rgba(217,182,110,.55);border-radius:5px;
  background:linear-gradient(180deg,#342719,#1a130d);color:#f8e8c1;
  font-weight:800;font-size:13px;letter-spacing:.02em;
  box-shadow:inset 0 1px rgba(255,244,214,.06);
  touch-action:manipulation
}
.control:active{transform:translateY(1px);background:linear-gradient(180deg,#241a11,#120d09)}
.control.primary{border-color:#d9b66e;background:linear-gradient(180deg,#5a3d1d,#2c1d11)}
.control.danger{border-color:rgba(255,116,95,.72);color:#ffd8d1}
.control[data-active="true"]{box-shadow:0 0 0 1px rgba(217,182,110,.26),0 0 14px rgba(210,149,61,.22) inset}

.tech-note{
  position:absolute;z-index:6;left:12px;bottom:144px;width:min(53%,220px);
  padding:6px 8px;border-left:2px solid rgba(217,182,110,.65);
  background:linear-gradient(90deg,rgba(11,9,6,.7),transparent);
  color:#d8c9aa;font-size:11px;line-height:1.35;pointer-events:none
}

@media (max-height:700px){
  .arena{inset:64px 0 128px}
  .controls{padding:8px}
  .control{min-height:38px;font-size:12px}
  .tech-note{display:none}
  .title small{display:none}
}
@media (prefers-reduced-motion:reduce){
  .idle,.shadow,.prototype::after{animation:none}
}
</style>
</head>
<body>
<main class="prototype" id="prototype" aria-label="四象江湖傳單張立繪動態原型">
  <header class="topbar">
    <div class="title">
      <strong>單張立繪動態原型</strong>
      <small>不重畫逐幀｜只靠 Presentation Layer</small>
    </div>
    <div class="badge">DEV 實驗，不接戰鬥邏輯</div>
  </header>

  <section class="arena" id="arena">
    <div class="ground-line" aria-hidden="true"></div>

    <article class="unit player profile-normal" id="player" data-side="player" data-state="alive">
      <div class="nameplate">火之冒險者</div><div class="hp"><i></i></div><div class="shadow"></div>
      <div class="motion"><div class="impact"><div class="idle">
        <img class="art" src="../assets/characters/battle_male_fire.png"
             data-fallback="https://raw.githubusercontent.com/tf00913225-alt/my-game/dev/assets/characters/battle_male_fire.png"
             alt="火之冒險者">
      </div></div></div>
    </article>

    <article class="unit soldier profile-floating" id="soldier" data-side="enemy" data-state="alive">
      <div class="nameplate">天兵天將</div><div class="hp"><i></i></div><div class="shadow"></div>
      <div class="motion"><div class="impact"><div class="idle">
        <img class="art" src="../assets/dungeons/abyss/floor5-soldier.webp"
             data-fallback="https://raw.githubusercontent.com/tf00913225-alt/my-game/dev/assets/dungeons/abyss/floor5-soldier.webp"
             alt="天兵天將">
      </div></div></div>
    </article>

    <article class="unit boss profile-heavy" id="boss" data-side="enemy" data-state="alive">
      <div class="nameplate">南帝天尊・Boss</div><div class="hp"><i></i></div><div class="shadow"></div>
      <div class="motion"><div class="impact"><div class="idle">
        <img class="art" src="../assets/dungeons/abyss/floor5-south-emperor.webp"
             data-fallback="https://raw.githubusercontent.com/tf00913225-alt/my-game/dev/assets/dungeons/abyss/floor5-south-emperor.webp"
             alt="南帝天尊">
      </div></div></div>
    </article>
  </section>

  <aside class="tech-note">同一張 PNG/WebP：Normal／Floating／Heavy 三種 motion profile 共用同一套程式，不需要每隻怪物做逐幀動畫。</aside>

  <section class="controls" aria-label="動態測試控制">
    <p class="hint">直接點按測試。死亡後再按「死亡／復活」即可復活。</p>
    <div class="button-grid">
      <button class="control primary" type="button" data-action="playerAttack">主角攻擊</button>
      <button class="control" type="button" data-action="soldierAttack">小怪攻擊</button>
      <button class="control" type="button" data-action="bossCast">Boss 大招</button>
      <button class="control" type="button" data-action="hitAll">受擊測試</button>
      <button class="control danger" type="button" data-action="deathToggle">死亡／復活</button>
      <button class="control" id="autoButton" type="button" data-action="auto">自動演示</button>
    </div>
  </section>
</main>
<script>
(()=>{
  "use strict";

  document.querySelectorAll("img[data-fallback]").forEach(img=>{
    img.addEventListener("error",()=>{
      const fallback=img.dataset.fallback;
      if(fallback&&img.src!==fallback){ img.src=fallback; }
    },{once:true});
  });

  const arena=document.getElementById("arena");
  const units={
    player:document.getElementById("player"),
    soldier:document.getElementById("soldier"),
    boss:document.getElementById("boss")
  };
  let autoTimer=0;
  let autoStep=0;

  function restartClass(unit,className,duration){
    if(!unit||unit.dataset.state==="dead"){ return; }
    unit.classList.remove(className);
    void unit.offsetWidth;
    unit.classList.add(className);
    window.setTimeout(()=>unit.classList.remove(className),duration);
  }

  function centerOf(unit){
    const box=unit.getBoundingClientRect();
    const arenaBox=arena.getBoundingClientRect();
    return {x:box.left-arenaBox.left+box.width*.5,y:box.top-arenaBox.top+box.height*.46};
  }

  function spawnHit(target,amount){
    if(!target||target.dataset.state==="dead"){ return; }
    const point=centerOf(target);
    const fx=document.createElement("div");
    fx.className="fx hit";
    fx.style.left=point.x+"px";
    fx.style.top=point.y+"px";
    arena.appendChild(fx);

    const text=document.createElement("div");
    text.className="damage";
    text.textContent="-"+amount;
    text.style.left=point.x+"px";
    text.style.top=(point.y-6)+"px";
    arena.appendChild(text);

    restartClass(target,"is-hit",360);
    window.setTimeout(()=>fx.remove(),420);
    window.setTimeout(()=>text.remove(),820);
  }

  function attack(attacker,target,damage){
    if(!attacker||attacker.dataset.state==="dead"||!target||target.dataset.state==="dead"){ return; }
    restartClass(attacker,"is-attacking",560);
    window.setTimeout(()=>spawnHit(target,damage),240);
  }

  function cast(unit,target){
    if(!unit||unit.dataset.state==="dead"){ return; }
    restartClass(unit,"is-casting",720);
    window.setTimeout(()=>spawnHit(target,1288),390);
  }

  function toggleDeath(unit){
    if(!unit){ return; }
    if(unit.dataset.state==="dead"){
      unit.dataset.state="alive";
      unit.classList.remove("is-dead");
      unit.classList.add("is-reviving");
      unit.style.setProperty("--hp","100%");
      window.setTimeout(()=>unit.classList.remove("is-reviving"),840);
      return;
    }
    unit.dataset.state="dead";
    unit.classList.remove("is-attacking","is-hit","is-casting","is-reviving");
    unit.classList.add("is-dead");
    unit.style.setProperty("--hp","0%");
  }

  function hitAll(){
    spawnHit(units.player,246);
    window.setTimeout(()=>spawnHit(units.soldier,388),90);
    window.setTimeout(()=>spawnHit(units.boss,516),180);
  }

  const autoActions=[
    ()=>attack(units.player,units.soldier,428),
    ()=>attack(units.soldier,units.player,216),
    ()=>cast(units.boss,units.player),
    ()=>attack(units.player,units.boss,692),
    ()=>hitAll()
  ];

  function stopAuto(){
    if(autoTimer){ window.clearTimeout(autoTimer);autoTimer=0; }
    const button=document.getElementById("autoButton");
    button.dataset.active="false";
    button.textContent="自動演示";
  }

  function autoTick(){
    if(!autoTimer){ return; }
    const action=autoActions[autoStep++%autoActions.length];
    action();
    autoTimer=window.setTimeout(autoTick,1100);
  }

  function toggleAuto(){
    if(autoTimer){ stopAuto(); return; }
    [units.player,units.soldier,units.boss].forEach(unit=>{
      if(unit.dataset.state==="dead"){ toggleDeath(unit); }
    });
    const button=document.getElementById("autoButton");
    button.dataset.active="true";
    button.textContent="停止演示";
    autoTimer=window.setTimeout(autoTick,120);
  }

  document.querySelector(".controls").addEventListener("click",event=>{
    const button=event.target.closest("[data-action]");
    if(!button){ return; }
    const actions={
      playerAttack:()=>attack(units.player,units.soldier,428),
      soldierAttack:()=>attack(units.soldier,units.player,216),
      bossCast:()=>cast(units.boss,units.player),
      hitAll,
      deathToggle:()=>toggleDeath(units.soldier),
      auto:toggleAuto
    };
    const action=actions[button.dataset.action];
    if(action){ action(); }
  });

  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ stopAuto(); } });
})();
</script>
</body>
</html>
