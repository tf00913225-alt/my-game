name: Finalize V173.44 Requested Update

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17344-finalize.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch supplied assets
        run: git fetch --no-tags origin assets-library:refs/remotes/origin/assets-library

      - name: Place supplied art on dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/maps assets/dungeons/covers assets/dungeons/abyss/maps
          git show origin/assets-library:'assets/inbox/荒漠地帶.png' > assets/maps/desert-v17344.png
          git show origin/assets-library:'assets/inbox/冰霜山脈.png' > assets/maps/ice-v17344.png
          git show origin/assets-library:'assets/inbox/熔岩深獄.png' > assets/maps/zone4-v17344.png
          git show origin/assets-library:'assets/inbox/巨獸荒原.png' > assets/maps/zone5-v17344.png
          git show origin/assets-library:'assets/inbox/修羅戰場.png' > assets/maps/zone6-v17344.png
          git show origin/assets-library:'assets/inbox/魔君祭壇.png' > assets/maps/zone7-v17344.png
          git show origin/assets-library:'assets/inbox/龍獄深淵.png' > assets/maps/zone8-v17344.png
          git show origin/assets-library:'assets/inbox/虛空盡頭.png' > assets/maps/zone9-v17344.png
          git show origin/assets-library:'assets/inbox/終焉之戰.png' > assets/maps/zone10-v17344.png
          git show origin/assets-library:'assets/inbox/金幣副本.png' > assets/dungeons/covers/gold-v17344.png
          git show origin/assets-library:'assets/inbox/深淵副本-東帝.png' > assets/dungeons/abyss/maps/floor-1.png
          git show origin/assets-library:'assets/inbox/深淵副本-南帝.png' > assets/dungeons/abyss/maps/floor-2.png
          git show origin/assets-library:'assets/inbox/深淵副本-天帝.png' > assets/dungeons/abyss/maps/floor-3.png
          git show origin/assets-library:'assets/inbox/深淵副本-北帝.png' > assets/dungeons/abyss/maps/floor-4.png
          git show origin/assets-library:'assets/inbox/深淵副本-五帝聯軍.png' > assets/dungeons/abyss/maps/floor-5.png

      - name: Apply corrected source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/v17344-apply.yml').read_text(encoding='utf-8')
          start="          python - <<'PY'\n"
          end="\n          PY\n\n      - name: Run focused and full repository checks"
          if start not in source or end not in source:
              raise SystemExit('unable to extract V173.44 patch body')
          body=source.split(start,1)[1].split(end,1)[0]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          body='\n'.join(lines)+'\n'
          old='next_text,count=re.subn(pattern,replacement,text,count=1,flags=flags)'
          new='next_text,count=re.subn(pattern,lambda _m: replacement,text,count=1,flags=flags)'
          if body.count(old)!=1:
              raise SystemExit('regex_once implementation was not found exactly once')
          body=body.replace(old,new,1)
          Path('/tmp/v17344_apply.py').write_text(body,encoding='utf-8')
          PY
          python /tmp/v17344_apply.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path,old,new,label):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise SystemExit(f'{label} was not found exactly once')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once(
              'tests/v143-combat-dungeon-polish.test.js',
              'assert.match(dungeon,/function openAbyssBossDialogue\\(\\)[\\s\\S]*?點擊對話繼續/);',
              'assert.match(dungeon,/function openAbyssBossDialogue\\(\\)[\\s\\S]*?點擊空白處繼續/);',
              'V143 historical dialogue assertion'
          )
          replace_once(
              'tests/v154-current-request.test.js',
              'assert.match(css,/data-dungeon-cover="equipment"[\\s\\S]*?background-size:cover !important/);',
              'assert.match(css,/data-dungeon-cover="gold"[\\s\\S]*?background-size:cover !important/);',
              'V154 historical dungeon cover selector assertion'
          )
          replace_once(
              'tests/v173.42-player-flow.test.js',
              'assert.match(abyssCss,/equipment-v17343\\.png/);',
              'assert.match(abyssCss,/gold-v17344\\.png/);',
              'V173.42 current gold cover assertion'
          )
          replace_once(
              'tests/v170-final-spec-integration.test.js',
              'run.orders.forEach(row=>assert.deepEqual(row,[1,2,3,4,5,6]));',
              'run.orders.forEach(row=>assert.deepEqual(row,[4,1,3,6,2,5]));',
              'V170 six-slot auto-target reference order'
          )
          replace_once(
              'tests/v170-final-spec-integration.test.js',
              'assert.equal(result.one40.factor,.60);',
              'assert.equal(result.one40.factor,.40);',
              'V170 one-character daily scale'
          )
          replace_once(
              'tests/v170-final-spec-integration.test.js',
              'assert.equal(result.two40.factor,.82);',
              'assert.equal(result.two40.factor,.72);',
              'V170 two-character daily scale'
          )

          p=Path('tests/v173.13-canvas-vfx-abyss-input.test.js')
          text=p.read_text(encoding='utf-8')
          old='''test("Abyss dialogue is owned directly by the map source and has pointer plus click fallback",()=>{\n    assert.match(abyss,/function openAbyssBossDialogue\\(\\)[\\s\\S]*?overlay\\.onclick=[\\s\\S]*?launchAbyssBossBattle\\(\\)/);\n    assert.match(abyss,/window\\.v141ChallengeAbyssBoss=function\\(\\)[\\s\\S]*?return openAbyssBossDialogue\\(\\);/);\n    assert.match(abyss,/\\["pointerup","click"\\]\\.forEach\\(type=>map\\.addEventListener\\(type,event=>/);\n    assert.match(abyss,/event\\.target&&typeof event\\.target\\.closest==="function"&&event\\.target\\.closest\\("\\.v143-abyss-dialogue"\\)\\)\\{ return; \\}/);\n    assert.doesNotMatch(legacyAbyssPatch,/v141ChallengeAbyssBoss=function/);\n});'''
          new='''test("Abyss dialogue is owned by the map and blank-area taps can advance it",()=>{\n    assert.match(abyss,/function openAbyssBossDialogue\\(\\)[\\s\\S]*?launchAbyssBossBattle\\(\\)[\\s\\S]*?activeAbyssDialogueAdvance=advanceDialogue/);\n    assert.match(abyss,/overlay\\.onclick=event=>[\\s\\S]*?advanceDialogue\\(\\)/);\n    assert.match(abyss,/window\\.v141ChallengeAbyssBoss=function\\(\\)[\\s\\S]*?return openAbyssBossDialogue\\(\\);/);\n    assert.match(abyss,/if\\(activeAbyssDialogueAdvance\\)[\\s\\S]*?activeAbyssDialogueAdvance\\(\\)/);\n    assert.match(abyss,/function maybeTriggerFinalAbyssEncounter\\(\\)/);\n    assert.doesNotMatch(legacyAbyssPatch,/v141ChallengeAbyssBoss=function/);\n});'''
          if text.count(old)!=1:
              raise SystemExit('V173.13 historical Abyss dialogue block was not found exactly once')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Ensure full-suite image dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run focused and full repository checks
        shell: bash
        run: |
          set +e
          {
            node --check js/17-stage-v60-training-render-guard.js &&
            node --check js/36-v141-content-systems.js &&
            node --check js/42-v148-combat-dungeon-fixes.js &&
            node --check js/47-v158-combat-tuning.js &&
            node tests/v173.44-current-request.test.js &&
            node .github/scripts/ci.mjs tests &&
            node .github/scripts/ci.mjs resources
          } > /tmp/v17344-check.log 2>&1
          status=$?
          cat /tmp/v17344-check.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/v17344-check.log V17344_FAILURE.log
            git config user.name "OpenAI ChatGPT"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add V17344_FAILURE.log
            if ! git diff --cached --quiet; then
              git commit -m "chore: capture V173.44 check failure"
              git push origin HEAD:dev
            fi
            exit "$status"
          fi
          exit 0

      - name: Commit requested update and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v17344-apply.yml .github/workflows/v17344-retry.yml .github/workflows/v17344-finalize.yml
          git rm -f V17344_FAILURE.log 2>/dev/null || true
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css tests assets
          git commit -m "fix: apply combat dungeon scaling and map updates"
          git push origin HEAD:dev
