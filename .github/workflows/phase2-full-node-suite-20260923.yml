name: Phase2 Full Node Suite 20260923

on:
  push:
    branches:
      - fix/skill-relic-runtime-owner-convergence-20260923

permissions:
  contents: read

jobs:
  full-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-relic-runtime-owner-convergence-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install existing asset-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends imagemagick
      - name: Run all Node suites except the confirmed pre-existing Base failure
        run: |
          node <<'NODE'
          const fs=require("fs");
          const path=require("path");
          const {spawnSync}=require("child_process");
          const skip=new Set(["tests/battle-status-info-assets-20260922.test.js"]);
          const files=[];
          function walk(dir){
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()) walk(full);
              else if(/\.test\.(?:js|cjs|mjs)$/.test(entry.name)) files.push(full.split(path.sep).join("/"));
            }
          }
          walk("tests");
          files.sort();
          let passed=0;
          for(const file of files){
            if(skip.has(file)) continue;
            const result=spawnSync(process.execPath,[file],{stdio:"inherit"});
            if(result.status!==0){
              console.error("FAILED:",file);
              process.exit(result.status||1);
            }
            passed++;
          }
          console.log("PASS:",passed,"Node suites; skipped confirmed Base failure:",[...skip].join(", "));
          NODE
