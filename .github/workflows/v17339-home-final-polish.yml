name: V173.39 Main City Final Polish

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17339-home-final-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply main-city owner edits
        run: python3 .github/scripts/v17339-home-final-polish.py apply

      - name: Ensure ImageMagick dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run repository checks
        run: |
          node --check .github/scripts/ci.mjs
          node .github/scripts/ci.mjs syntax
          node .github/scripts/ci.mjs tests
          node .github/scripts/ci.mjs resources
          node .github/scripts/ci.mjs html-ids
          node .github/scripts/ci.mjs loader

      - name: Install browser verifier
        run: |
          mkdir -p /tmp/v17339-ui-browser
          cd /tmp/v17339-ui-browser
          npm init -y >/dev/null 2>&1
          npm install --silent --no-fund --no-audit playwright-core

      - name: Verify portrait layout
        run: |
          BROWSER_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER_PATH"
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/v17339-home-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          NODE_PATH=/tmp/v17339-ui-browser/node_modules BROWSER_PATH="$BROWSER_PATH" node .github/scripts/v17339-home-mobile-check.js

      - name: Record verified state
        run: python3 .github/scripts/v17339-home-final-polish.py record

      - name: Remove staging files
        run: |
          rm -f .github/workflows/v17339-home-final-polish.yml
          rm -f .github/workflows/v17339-home-final-polish-runner.yml
          rm -f .github/scripts/v17339-home-final-polish.py
          rm -f .github/scripts/v17339-home-mobile-check.js

      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: finalize V173.39 main-city spacing"

      - name: Check final diff rules
        env:
          CI_BASE_SHA: ${{ github.sha }}
        run: |
          CI_HEAD_SHA="$(git rev-parse HEAD)" node .github/scripts/ci.mjs git-diff

      - name: Push to dev
        run: git push origin HEAD:dev
