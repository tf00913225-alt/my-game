name: V170 Autonomous Contract Cleanup Validation

on:
  push:
    branches:
      - validation/v170-autonomous-contract-cleanup-20260917

permissions:
  contents: read

jobs:
  diagnose-east-earth-shield:
    runs-on: ubuntu-latest
    steps:
      - name: Check out autonomous fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v170-autonomous-contract-cleanup-20260917
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact autonomous HEAD
        shell: bash
        run: test "$(git rev-parse HEAD)" = "e9f041e1c08b9830fe5ca33c6dd190bf8b0ab0e6"

      - name: Inject validation-only formal snapshot diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path("tests/v170-final-spec-integration.test.js")
          text=path.read_text(encoding="utf-8")
          start_marker='test("East Earth Shield and Heaven Calm use their assigned formal support values",()=>{'
          end_marker='\nfunction prepareExtremeEmperor(context){'
          start=text.index(start_marker)
          end=text.index(end_marker,start)
          case=text[start:end]

          old='''        currentBattleMonsters.splice(0,currentBattleMonsters.length,0,1,2,3,4);\n        updateUI=function(){};finishPlayerAction=function(){};addBattleLog=function(){};\n        showMonsterSkillNameBadge=function(){};showMonsterHit=function(){};\n        const earth=v155ResolveEastEarthShield(0,true);\n'''
          new='''        currentBattleMonsters.splice(0,currentBattleMonsters.length,0,1,2,3,4);\n        const snapshot=window.v138EnsureEnemyFormationSnapshot(currentBattleMonsters);\n        if(!snapshot){ throw new Error("East Earth Shield diagnosis requires the formal enemy snapshot"); }\n        const eastTargets=v141GetMonsterAllyTriTargets(0).map(entry=>entry.index);\n        const eastSlots=eastTargets.map(index=>window.FourSymbolsBattlefieldSlots.getEnemySlotForMonster(snapshot,index));\n        updateUI=function(){};finishPlayerAction=function(){};addBattleLog=function(){};\n        showMonsterSkillNameBadge=function(){};showMonsterHit=function(){};\n        const earth=v155ResolveEastEarthShield(0,true);\n'''
          if case.count(old)!=1:
              raise SystemExit(f"fixture anchor count={case.count(old)}")
          case=case.replace(old,new,1)

          old='''            earth:earth,calm:calm,\n            earthTargets:monsters.filter(monster=>monster.activeBuffs.some(buff=>buff.statusName==="萬象土盾")).length,\n'''
          new='''            earth:earth,calm:calm,eastTargets:eastTargets,eastSlots:eastSlots,\n            earthTargets:monsters.filter(monster=>monster.activeBuffs.some(buff=>buff.statusName==="萬象土盾")).length,\n'''
          if case.count(old)!=1:
              raise SystemExit(f"result anchor count={case.count(old)}")
          case=case.replace(old,new,1)

          old='''    assert.equal(result.earth,true);\n'''
          new='''    console.log("EAST_EARTH_SHIELD_DIAG="+JSON.stringify(result));\n    assert.equal(result.earth,true);\n'''
          if case.count(old)!=1:
              raise SystemExit(f"log anchor count={case.count(old)}")
          case=case.replace(old,new,1)

          path.write_text(text[:start]+case+text[end:],encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only)" = "tests/v170-final-spec-integration.test.js"

      - name: Run validation-only V170 diagnosis
        shell: bash
        run: |
          set +e
          timeout 90s node tests/v170-final-spec-integration.test.js > /tmp/v170-east.log 2>&1
          status=$?
          set -e
          cat /tmp/v170-east.log
          test "$status" -ne 124
          grep -F 'EAST_EARTH_SHIELD_DIAG=' /tmp/v170-east.log
