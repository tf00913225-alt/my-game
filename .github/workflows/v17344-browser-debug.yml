name: V173.44 GitHack Response Diagnostic

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17344-browser-debug.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GitHack responses
        shell: bash
        run: |
          set -euo pipefail
          FIXED=a253660ffe32000902e1ad9e769ed1a46819d1e0
          urls=(
            "https://raw.githack.com/tf00913225-alt/my-game/dev/css/00-main.css?v=173.42"
            "https://rawcdn.githack.com/tf00913225-alt/my-game/${FIXED}/css/00-main.css?v=173.42"
            "https://raw.githack.com/tf00913225-alt/my-game/dev/js/00-main.js?v=173.42"
            "https://rawcdn.githack.com/tf00913225-alt/my-game/${FIXED}/js/00-main.js?v=173.42"
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            echo "===== URL ${i}: ${url} ====="
            code=$(curl -L -sS --max-time 60 -D "/tmp/h${i}" -o "/tmp/b${i}" -w '%{http_code}' "$url" || true)
            echo "HTTP=${code}"
            grep -iE '^(content-type|content-length|cache-control|age|cf-cache-status|x-cache):' "/tmp/h${i}" || true
            echo "BYTES=$(wc -c < /tmp/b${i})"
            echo "FIRST120=$(head -c 120 /tmp/b${i} | tr '\n' ' ')"
            if [ "$i" -le 2 ]; then
              echo "HAS_ROOT=$(grep -c -- '--theme-box-bg' /tmp/b${i} || true)"
              echo "HAS_MODAL_HIDE=$(grep -c 'display:none' /tmp/b${i} || true)"
              echo "HAS_CREATION_INPUT=$(grep -c 'creation-input' /tmp/b${i} || true)"
            else
              echo "HAS_OPEN_CHARACTER_CREATION=$(grep -c 'openCharacterCreation' /tmp/b${i} || true)"
              echo "HAS_SECOND_REDIRECT=$(grep -c 'openSecondCharacterModal' /tmp/b${i} || true)"
            fi
          done
          echo "===== LOCAL SOURCE ====="
          echo "CSS_BYTES=$(wc -c < css/00-main.css)"
          echo "JS_BYTES=$(wc -c < js/00-main.js)"
