name: Temporary final map nav repair
on:
  push:
    branches:
      - fix/map-avatar-nav-size-player-scale-20260914
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/map-avatar-nav-size-player-scale-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Apply formal owner fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:160]!r}")
              p.write_text(text.replace(old,new,1))

          replace_once(
              "js/26-v131-patrol-appearance.js",
              '        const image=document.getElementById("patrolCharacterImg");\n        if(!image){ return; }\n        const index=normalize();',
              '        const image=document.getElementById("patrolCharacterImg");\n        if(!image){ return; }\n        image.loading="eager";\n        const index=normalize();'
          )

          replace_once(
              "css/02-stage-v3-layout-fix.css",
              '#game-stage > #app > #game-content .bottom-nav,\n#game-stage > #app > #game-content #mapPageNav{',
              '#game-stage > #app > #game-content .bottom-nav:not(.v148-context-nav),\n#game-stage > #app > #game-content #mapPageNav{'
          )

          replace_once(
              "css/38-v141-system-expansion.css",
              '#game-stage #app.v141-dungeon-active #v141DungeonNav,\n#game-stage #app.v148-context-nav-active #v141DungeonNav{display:flex !important;}',
              '#game-stage #app.v141-dungeon-active #v141DungeonNav,\n#game-stage #app.v148-context-nav-active #v141DungeonNav{display:grid !important;}'
          )

          replace_once(
              "js/54-v173.51-battle-qa.js",
              '    /* 122×94 legacy art box -> ~183×141 visual box: exact 1.5x presentation. */\n    inset:-49px -33px 30px!important;',
              '    /* Restore the original player-art footprint; enemy/BOSS contain rules stay unchanged. */\n    inset:-2px -2px 30px!important;'
          )

          for path in Path("tests").glob("*.js"):
              text=path.read_text()
              updated=text.replace('inset:-49px -33px 30px!important;', 'inset:-2px -2px 30px!important;')
              updated=updated.replace('player art is ~1.5x,', 'player art keeps its original footprint,')
              updated=updated.replace('.v148-context-nav-active #v141DungeonNav\\{display:flex !important;\\}', '.v148-context-nav-active #v141DungeonNav\\{display:grid !important;\\}')
              if updated!=text:
                  path.write_text(updated)
          PY

          cat > tests/map-nav-patrol-player-regression-20260914.test.js <<'TEST'
          "use strict";
          const assert=require("node:assert/strict");
          const fs=require("node:fs");
          const read=path=>fs.readFileSync(path,"utf8");
          const patrol=read("js/26-v131-patrol-appearance.js");
          const legacy=read("css/02-stage-v3-layout-fix.css");
          const nav=read("css/38-v141-system-expansion.css");
          const finalNav=read("css/45-v152-dev-fixes.css");
          const battle=read("js/54-v173.51-battle-qa.js");
          assert.match(patrol,/patrolCharacterImg[\s\S]*?image\.loading="eager";[\s\S]*?image\.src=artFor/);
          assert.match(legacy,/\.bottom-nav:not\(\.v148-context-nav\),/);
          assert.match(nav,/\.v148-context-nav-active #v141DungeonNav\{display:grid !important;\}/);
          assert.match(finalNav,/#v141DungeonNav\.v148-context-nav,[\s\S]*?height:84px !important;[\s\S]*?grid-template-columns:repeat\(5,minmax\(0,1fr\)\) !important;/);
          assert.match(finalNav,/#v141DungeonNav \.nav-art-button\{[\s\S]*?height:72px !important;/);
          assert.match(battle,/battle-player\.v174-cardless-unit>\.v174-battle-art\{[\s\S]*?inset:-2px -2px 30px!important;[\s\S]*?background-size:contain!important/);
          assert.doesNotMatch(battle,/battle-player\.v174-cardless-unit>\.v174-battle-art\{[\s\S]*?inset:-49px -33px 30px!important;/);
          console.log("map/nav/patrol/player regression guard passed");
          TEST
          sed -i 's/^          //' tests/map-nav-patrol-player-regression-20260914.test.js
      - name: Focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/map-nav-patrol-player-regression-20260914.test.js
          node tests/shared-nav-vfx-battle-layout-20260914.test.js
          node tests/v1741-battle-gameplay-layout-order.test.js
          node tests/v148-combat-dungeon-fixes.test.js
          node tests/v143-combat-dungeon-polish.test.js
          node tests/v153-fire-vfx.test.js
          node tests/boss-mobile-portrait-browser.test.js
      - name: Build production bundles
        run: npm run build
      - name: Verify production build
        run: npm run build:check
      - name: Browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=393,873 --remote-allow-origins='*' --remote-debugging-port=9222 --user-data-dir=/tmp/chrome http://127.0.0.1:8000/ >/tmp/chrome.log 2>&1 & CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do curl -fsS http://127.0.0.1:9222/json >/dev/null && break || sleep .25; done
          cat >/tmp/qa.mjs <<'NODE'
          import assert from 'node:assert/strict';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tabs=await(await fetch('http://127.0.0.1:9222/json')).json();
          const tab=tabs.find(x=>String(x.url||'').includes('127.0.0.1:8000'))||tabs[0];
          const ws=new WebSocket(tab.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let id=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result)}};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
          const ev=async expression=>(await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true})).result?.value;
          await send('Runtime.enable');await sleep(5000);
          assert.equal(await ev(`(async()=>{await FourSymbolsFeatures.ensure('patrol','repair-qa');return FourSymbolsFeatures.isReady('patrol')})()`),true);
          await sleep(500);
          const patrol=await ev(`(async()=>{const m=document.getElementById('mapPage'),i=document.getElementById('patrolCharacterImg');m.classList.add('active');m.style.display='block';if(window.v131ApplyPatrolArt)window.v131ApplyPatrolArt(false);for(let n=0;n<40&&(!i.complete||!i.naturalWidth);n++)await new Promise(r=>setTimeout(r,50));return {loading:i.loading,complete:i.complete,nw:i.naturalWidth,nh:i.naturalHeight,src:i.getAttribute('src')}})()`);
          assert.equal(patrol.loading,'eager',JSON.stringify(patrol));assert.ok(patrol.complete&&patrol.nw>0&&patrol.nh>0,JSON.stringify(patrol));
          assert.equal(await ev(`(async()=>{await FourSymbolsFeatures.ensure('boss-tower','nav-qa');return FourSymbolsFeatures.isReady('gameplay-core')})()`),true);
          await sleep(500);
          const nav=await ev(`(()=>{const app=document.getElementById('app');let n=document.getElementById('v141DungeonNav');if(!n){n=document.createElement('div');n.id='v141DungeonNav';n.className='bottom-nav map-page-nav v141-dungeon-nav v148-context-nav';n.dataset.v146Columns='5';n.innerHTML='<button class="nav-button"><img class="nav-art-button" src="assets/ui/nav-character.png"></button>'.repeat(5);document.getElementById('game-content').appendChild(n)}else n.classList.add('v148-context-nav');app.classList.add('v148-context-nav-active');const s=getComputedStyle(n),si=getComputedStyle(n.querySelector('img'));return {display:s.display,height:s.height,width:s.width,imgHeight:si.height}})()`);
          assert.deepEqual(nav,{display:'grid',height:'84px',width:'420px',imgHeight:'72px'});
          console.log('browser QA passed',JSON.stringify({patrol,nav}));ws.close();
          NODE
          node /tmp/qa.mjs
      - name: Full test suite
        run: npm test
      - name: Whitespace check
        run: git diff --check
      - name: Commit formal repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-final-map-nav-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore patrol avatar nav sizing and player scale'
          git push origin HEAD:fix/map-avatar-nav-size-player-scale-20260914
