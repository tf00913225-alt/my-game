name: Fixed Slot Phase 4 Code Only Integration

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply staged owner patch without modifying workflow files
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          workflow=Path('.github/workflows/fixed-slot-phase4-boss-mechanism.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY\n",start)
          body=workflow[start:end]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          old='guards.map(unit=>unit.vGameplayBattlefieldSlot)'
          new='Array.from(guards,unit=>unit.vGameplayBattlefieldSlot)'
          if body.count(old)!=1:
              raise SystemExit(f'expected one cross-realm assertion expression, found {body.count(old)}')
          body=body.replace(old,new,1)
          exec(compile(body,'phase4-owner-patch','exec'))
          PYCODE
      - name: Syntax check
        run: node --check js/gameplay-boss-tower-system.js
      - name: Fixed battlefield slot tests
        run: node tests/fixed-battlefield-slots.test.js
      - name: Gameplay Boss runtime tests
        run: node tests/gameplay-boss-tower-system.test.js
      - name: Boss mechanism UI regression tests
        run: node tests/boss-mechanism-vfx-card-ui-20260909.test.js
      - name: Gameplay hub UI tests
        run: node tests/gameplay-hub-ui-and-icon.test.js
      - name: Typography battle preservation tests
        run: node tests/ui-typography-battle-preservation.test.js
      - name: Production build check
        run: node scripts/build-production.mjs --check
      - name: Whitespace check
        run: git diff --check
      - name: Commit only production owner files and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/gameplay-boss-tower-system.js \
                  css/gameplay-boss-tower.css \
                  tests/gameplay-boss-tower-system.test.js \
                  tests/fixed-battlefield-slots.test.js \
                  tests/boss-mechanism-vfx-card-ui-20260909.test.js \
                  release/requirement-batches/2026-09-16-fixed-slot-battlefield-v1.json
          git diff --cached --check
          git commit -m "feat: bind boss and mechanism slots to battlefield owner"
          git push origin HEAD:feature/fixed-slot-battlefield-v1-20260916
