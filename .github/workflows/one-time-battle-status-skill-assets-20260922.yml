name: One-time battle status and skill asset import

on:
  push:
    branches:
      - fix/battle-status-drawers-vfx-followup-20260922

permissions:
  contents: write

concurrency:
  group: one-time-battle-status-skill-assets-20260922
  cancel-in-progress: false

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/battle-status-drawers-vfx-followup-20260922

      - name: Install lossless image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Fetch exact approved source assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin assets-library:refs/remotes/origin/assets-library
          mkdir -p /tmp/fs-assets
          git show 'origin/assets-library:assets/inbox/技能icon/淨心訣 icon.png' > '/tmp/fs-assets/purify-icon.png'
          git show 'origin/assets-library:assets/inbox/技能icon/淨心訣 技能釋放.png' > '/tmp/fs-assets/purify-cast.png'
          git show 'origin/assets-library:assets/inbox/技能icon/炎魂共鳴 icon.png' > '/tmp/fs-assets/fire-soul-icon.png'
          git show 'origin/assets-library:assets/inbox/技能icon/炎魂共鳴 技能釋放.png' > '/tmp/fs-assets/fire-soul-cast.png'
          git show 'origin/assets-library:assets/inbox/技能icon/焚血訣 icon.png' > '/tmp/fs-assets/blood-burn-icon.png'
          git show 'origin/assets-library:assets/inbox/技能icon/焚血訣 技能釋放.png' > '/tmp/fs-assets/blood-burn-cast.png'
          git show 'origin/assets-library:assets/inbox/技能icon/暈眩-狀態循環圖.png' > '/tmp/fs-assets/stun-sheet.png'

      - name: Convert lossless WebP and verify pixel identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/skills assets/vfx/fire assets/vfx/water assets/vfx/status

          verify_exact() {
            local src="$1"
            local dst="$2"
            local label="$3"
            local sw sh dw dh metric status
            sw="$(identify -format '%w' "$src")"
            sh="$(identify -format '%h' "$src")"
            dw="$(identify -format '%w' "$dst")"
            dh="$(identify -format '%h' "$dst")"
            test "$sw" = "$dw"
            test "$sh" = "$dh"
            set +e
            metric="$(compare -metric AE "$src" "$dst" null: 2>&1)"
            status=$?
            set -e
            if [ "$status" -ne 0 ] || [ "$metric" != "0" ]; then
              echo "$label pixel mismatch: AE=$metric status=$status" >&2
              exit 1
            fi
            test "$(head -c 4 "$dst")" = "RIFF"
            test "$(dd if="$dst" bs=1 skip=8 count=4 status=none)" = "WEBP"
            echo "$label exact: "$sw"x"$sh", AE=0"
          }

          convert_exact() {
            local src="$1"
            local dst="$2"
            local label="$3"
            cwebp -quiet -lossless -exact -mt "$src" -o "$dst"
            verify_exact "$src" "$dst" "$label"
          }

          verify_4x3() {
            local src="$1"
            local label="$2"
            local w h
            w="$(identify -format '%w' "$src")"
            h="$(identify -format '%h' "$src")"
            if [ $((w % 4)) -ne 0 ] || [ $((h % 3)) -ne 0 ]; then
              echo "$label is not an exact 4x3 sheet: "$w"x"$h >&2
              exit 1
            fi
            echo "$label 4x3 grid verified: "$w"x"$h", frame="$((w/4))"x"$((h/3))
          }

          convert_exact '/tmp/fs-assets/purify-icon.png' 'assets/skills/water-purify-mind.webp' '淨心訣 icon'
          convert_exact '/tmp/fs-assets/fire-soul-icon.png' 'assets/skills/fire-soul-resonance.webp' '炎魂共鳴 icon'
          convert_exact '/tmp/fs-assets/blood-burn-icon.png' 'assets/skills/fire-blood-burn-art.webp' '焚血訣 icon'

          for spec in             '/tmp/fs-assets/purify-cast.png|assets/vfx/water/purify-mind-cast.webp|淨心訣 VFX'             '/tmp/fs-assets/fire-soul-cast.png|assets/vfx/fire/fire-soul-resonance-cast.webp|炎魂共鳴 VFX'             '/tmp/fs-assets/blood-burn-cast.png|assets/vfx/fire/blood-burn-art-cast.webp|焚血訣 VFX'
          do
            IFS='|' read -r src dst label <<< "$spec"
            verify_4x3 "$src" "$label"
            convert_exact "$src" "$dst" "$label"
          done

          verify_4x3 '/tmp/fs-assets/stun-sheet.png' '暈眩狀態來源'
          sw="$(identify -format '%w' '/tmp/fs-assets/stun-sheet.png')"
          sh="$(identify -format '%h' '/tmp/fs-assets/stun-sheet.png')"
          fw=$((sw/4))
          fh=$((sh/3))
          crop="${fw}x${fh}+$((fw*2))+$fh"
          convert '/tmp/fs-assets/stun-sheet.png' -crop "$crop" +repage '/tmp/fs-assets/stun-frame.png'
          convert_exact '/tmp/fs-assets/stun-frame.png' 'assets/vfx/status/stun.webp' '暈眩 body frame'

      - name: Run focused tests and production build
        shell: bash
        run: |
          set -euo pipefail
          node --test             tests/battle-status-info-assets-20260922.test.js             tests/battle-status-drawers-vfx-followup-20260922.test.js             tests/battle-stats-relic-tower-auto-20260920.test.js             tests/boss-battle-architecture-convergence-20260918.test.js             tests/ui-typography-battle-preservation.test.js
          npm run build
          npm run build:check
          git diff --check

      - name: Commit generated assets and build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             assets/skills/water-purify-mind.webp             assets/skills/fire-soul-resonance.webp             assets/skills/fire-blood-burn-art.webp             assets/vfx/water/purify-mind-cast.webp             assets/vfx/fire/fire-soul-resonance-cast.webp             assets/vfx/fire/blood-burn-art-cast.webp             assets/vfx/status/stun.webp             asset-manifest.json build
          if git diff --cached --quiet; then
            echo 'No generated asset/build changes to commit.'
            exit 0
          fi
          git commit -m 'assets: import battle status and skill WebP assets'
          git push origin HEAD:fix/battle-status-drawers-vfx-followup-20260922
