name: Rebuild production bundles for native auth handoff

on:
  push:
    branches:
      - feature/android-native-auth-handoff-20260912
    paths:
      - ".github/workflows/rebuild-native-auth-bundles.yml"
      - "js/firebase/**"
      - "functions/**"
      - "scripts/build-production.mjs"
      - "config/**"
      - "release/release.json"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rebuild deterministic production bundles
        run: node scripts/build-production.mjs

      - name: Commit generated bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             asset-manifest.json             build/asset-manifest.json             build/firebase/             build/boot-core.*.js             index.html

          if git diff --cached --quiet; then
            echo "No generated bundle changes."
            exit 0
          fi

          git commit -m "chore: rebuild production bundles for native auth handoff"
          git push origin HEAD:feature/android-native-auth-handoff-20260912
