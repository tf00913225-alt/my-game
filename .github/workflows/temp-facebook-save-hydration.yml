name: Temp Facebook save hydration fix

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.head_ref == 'fix/facebook-save-hydration-20260911'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply resolved-save hydration fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main=Path('js/00-main.js')
          text=main.read_text(encoding='utf-8')
          old='''window.FourSymbolsGameSave=Object.freeze({\n    activate:activateAccountSaveOwner,\n    deactivate:deactivateAccountSaveOwner,\n    getKey:()=>SAVE_KEY,\n    load:()=>loadGame(),\n    save:options=>saveGame(options),\n    showCreation:()=>showCreation()\n});'''
          new='''window.FourSymbolsGameSave=Object.freeze({\n    activate:activateAccountSaveOwner,\n    deactivate:deactivateAccountSaveOwner,\n    getKey:()=>SAVE_KEY,\n    load:()=>loadGame(),\n    hydrate:save=>loadGame(save),\n    save:options=>saveGame(options),\n    showCreation:()=>showCreation()\n});'''
          if old not in text:
              raise SystemExit('FourSymbolsGameSave export anchor not found')
          text=text.replace(old,new,1)

          old='''function loadGame(){\n\n    try{\n\n        /*\n           先讀新版。\n        */\n\n        const repository=window.FourSymbolsAccountSave;\n        const activeUid=repository&&repository.getActiveUid();\n        if(!repository||!activeUid||SAVE_KEY!==repository.saveKey(activeUid)){ return false; }\n        const accountSave=repository.readForUid(activeUid);\n        const raw=accountSave.status==="ready"?JSON.stringify(accountSave.save):null;\n\n\n        if(!raw){\n\n            return false;'''
          new='''function loadGame(resolvedSave=null){\n\n    try{\n\n        /*\n           Startup may already have resolved and verified the exact UID save.\n           Hydrate that payload directly so READY cannot race a second repository read.\n           Ordinary load callers still read the active UID repository as before.\n        */\n\n        const repository=window.FourSymbolsAccountSave;\n        const activeUid=repository&&repository.getActiveUid();\n        if(!repository||!activeUid||SAVE_KEY!==repository.saveKey(activeUid)){ return false; }\n\n        let raw=null;\n        if(resolvedSave&&typeof resolvedSave==="object"&&!Array.isArray(resolvedSave)){\n            raw=JSON.stringify(resolvedSave);\n        }else{\n            const accountSave=repository.readForUid(activeUid);\n            raw=accountSave.status==="ready"?JSON.stringify(accountSave.save):null;\n        }\n\n        if(!raw){\n\n            return false;'''
          if old not in text:
              raise SystemExit('loadGame hydration anchor not found')
          main.write_text(text.replace(old,new,1),encoding='utf-8')

          startup=Path('js/52-v173.20-startup-loader.js')
          s=startup.read_text(encoding='utf-8')
          old='''        const loaded=global.FourSymbolsGameSave&&global.FourSymbolsGameSave.load();\n        if(!loaded){ throw new Error("Account save passed resolution but gameplay hydration failed."); }'''
          new='''        const loaded=global.FourSymbolsGameSave&&typeof global.FourSymbolsGameSave.hydrate==="function"&&global.FourSymbolsGameSave.hydrate(save);\n        if(!loaded){ throw new Error("Resolved account save could not hydrate gameplay state."); }'''
          if old not in s:
              raise SystemExit('startup enterReady anchor not found')
          startup.write_text(s.replace(old,new,1),encoding='utf-8')

          test=Path('tests/facebook-save-hydration.test.mjs')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst core=fs.readFileSync("js/00-main.js","utf8");\nconst startup=fs.readFileSync("js/52-v173.20-startup-loader.js","utf8");\n\ntest("resolved UID save hydrates the exact resolved payload without a second repository read",()=>{\n  assert.match(core,/hydrate:save=>loadGame\\(save\\)/);\n  assert.match(core,/function loadGame\\(resolvedSave=null\\)/);\n  assert.match(core,/if\\(resolvedSave&&typeof resolvedSave==="object"&&!Array\\.isArray\\(resolvedSave\\)\\)\\{[\\s\\S]*?raw=JSON\\.stringify\\(resolvedSave\\);/);\n  assert.match(startup,/FourSymbolsGameSave\\.hydrate\\(save\\)/);\n  assert.doesNotMatch(startup,/const loaded=global\\.FourSymbolsGameSave&&global\\.FourSymbolsGameSave\\.load\\(\\);/);\n});\n\ntest("empty verified UID still follows creation path instead of READY hydration",()=>{\n  assert.match(startup,/if\\(!safeCloudEmpty\\(cloud,user\\.uid\\)\\)[\\s\\S]*?saveResolved=true;[\\s\\S]*?return enterCreation\\(token\\)/);\n});\n''',encoding='utf-8')

          handoff=Path('HANDOFF.md')
          h=handoff.read_text(encoding='utf-8')
          section='''## 2026-09-11 Facebook UID 存檔 hydration 修正\n\n- 症狀：Facebook OAuth 已成功取得 Firebase UID，但 Account UI 顯示 `Account save passed resolution but gameplay hydration failed.`。\n- 根因：Startup State Machine 已在 `resolveSaveFor()` 解析出該 UID 的確切 save payload，`enterReady(save)` 卻忽略參數並再次呼叫 `FourSymbolsGameSave.load()` 重讀 repository；第二次讀取可能與已解析狀態不同步而回傳 false。\n- 修正：`FourSymbolsGameSave` 新增 `hydrate(save)`，沿用既有 `loadGame()` hydration/normalization 邏輯但直接使用已解析 payload；一般 `load()` 行為維持原本從 active UID repository 讀取。真正 verified-empty UID 仍只走 `enterCreation()`，不會誤進 READY。\n- 不修改 save schema、UID ownership、Firestore Rules、Game/Cache Version；`main` 不修改。\n\n'''
          handoff.write_text(section+h,encoding='utf-8')
          PY
      - name: Regenerate deterministic production assets
        run: node scripts/build-production.mjs
      - name: Commit fix and generated assets
        shell: bash
        run: |
          git add js/00-main.js js/52-v173.20-startup-loader.js tests/facebook-save-hydration.test.mjs HANDOFF.md index.html asset-manifest.json build/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(auth): hydrate resolved UID save directly"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
