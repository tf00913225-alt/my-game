name: Temporary auth/system UX build

on:
  push:
    branches:
      - fix/auth-system-navigation-ux-20260910

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate deterministic production assets
        run: npm run build

      - name: Commit generated assets back to work branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A build asset-manifest.json index.html
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: regenerate auth system UX assets [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
