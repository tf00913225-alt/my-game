name: V170 Autonomous Contract Cleanup Validation

on:
  push:
    branches:
      - validation/v170-autonomous-contract-cleanup-20260917

permissions:
  contents: read

jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out autonomous fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v170-autonomous-contract-cleanup-20260917
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact autonomous HEAD
        shell: bash
        run: test "$(git rev-parse HEAD)" = "8cbb4307f83893851a9adcd5a4b74cd6d2c11fe6"

      - name: Prepare Git comparison base and typography baselines
        shell: bash
        env:
          CI_BASE_SHA: e3de8f7fee4e65986420528247bdbb99cb588a07
        run: |
          if [[ "$CI_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && \
             [[ ! "$CI_BASE_SHA" =~ ^0{40}$ ]] && \
             ! git cat-file -e "$CI_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          fi

          for typography_baseline_sha in \
            39767ce2b9dbfa59650b7c5fd4d52a57a2642ea5 \
            4a592dd4c41d7efb1a4849fbfe0cbf68598121bf \
            29b9668057846164a941fbf6617d2458d9af5476; do
            if ! git cat-file -e "$typography_baseline_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$typography_baseline_sha"
            fi
          done

      - name: Ensure existing asset-test dependency
        shell: bash
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Re-run V170 with 90-second timeout
        shell: bash
        run: timeout 90s node tests/v170-final-spec-integration.test.js

      - name: Run all Fixed Slot targeted regressions
        shell: bash
        run: |
          node tests/fixed-slot-tri-target-window.test.js
          node tests/ally-tri-rage-fixed-slot-regression.test.js
          node tests/fixed-slot-battlefield-rendering-v2.test.js

      - name: Run all Node unit and integration suites
        shell: bash
        env:
          CI_BASE_SHA: e3de8f7fee4e65986420528247bdbb99cb588a07
          CI_HEAD_SHA: 8cbb4307f83893851a9adcd5a4b74cd6d2c11fe6
        run: node .github/scripts/ci.mjs tests

      - name: Verify tests-only diff and clean worktree
        shell: bash
        run: |
          git diff --check e3de8f7fee4e65986420528247bdbb99cb588a07..HEAD
          test -z "$(git status --porcelain)"
          files="$(git diff --name-only e3de8f7fee4e65986420528247bdbb99cb588a07..HEAD)"
          test "$files" = "tests/v170-final-spec-integration.test.js"
          git diff --stat e3de8f7fee4e65986420528247bdbb99cb588a07..HEAD
