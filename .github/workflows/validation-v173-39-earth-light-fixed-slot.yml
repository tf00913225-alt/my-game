name: V173.39 Earth Light Fixed Slot Validation

on:
  push:
    branches:
      - validation/v173-39-earth-light-fixed-slot-contract-20260917

permissions:
  contents: read

jobs:
  validate-v173-39:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/v173-39-earth-light-fixed-slot-contract-20260917
          fetch-depth: 3

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify validation scope
        shell: bash
        run: |
          base=7565af4975d3344fc5ec3b31e6b001c0fb9a8c98
          git fetch --no-tags --depth=1 origin "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          printf '%s\n' "$changed"
          test -z "$(git diff --name-only "$base" HEAD -- js css scripts config asset-manifest.json)"

      - name: Run migrated Earth Light contract
        run: node tests/v173.39-earth-light-vfx.test.js

      - name: Run related Fixed Slot VFX regressions
        shell: bash
        run: |
          node tests/v173.23-wind-vfx.test.js
          node tests/v173.13-canvas-vfx-abyss-input.test.js
          node tests/v173.11-abyss-vfx-dungeon.test.js
          node tests/v166-water-vfx.test.js
          node tests/v153-fire-vfx.test.js
          node tests/fixed-slot-battlefield-rendering-v2.test.js
          node tests/fixed-slot-tri-target-window.test.js
