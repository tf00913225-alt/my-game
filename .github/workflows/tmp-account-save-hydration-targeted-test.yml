name: Temporary account save hydration targeted test

on:
  push:
    branches:
      - fix/account-save-legacy-skill-hydration-20260919
    paths:
      - .github/workflows/tmp-account-save-hydration-targeted-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: fix/account-save-legacy-skill-hydration-20260919
          fetch-depth: 1

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run legacy account hydration regression
        run: node tests/account-save-legacy-skill-hydration.test.js

      - name: Check production build remains synchronized
        run: npm run build:check
