name: Premium Functional UI Responsive Inline Owner Fix

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-responsive-inline-owner-fix.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Print responsive fixture geometry
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/premium-functional-ui-responsive-browser.test.js')
          t=p.read_text()
          css='#game-stage #homeFeatureModal .home-feature-modal-box.wide{width:calc(100% - 8px)!important;max-width:none!important;height:calc(100% - 8px)!important;max-height:calc(100% - 8px)!important;min-height:0!important;box-sizing:border-box!important}'
          if css in t:
              t=t.replace(css,'',1)
          old="const box=document.querySelector('.home-feature-modal-box');const br=box.getBoundingClientRect();"
          new="const box=document.querySelector('.home-feature-modal-box');if(box&&box.classList.contains('wide')){[['display','flex'],['flex-direction','column'],['width','calc(100% - 8px)'],['max-width','none'],['height','calc(100% - 8px)'],['max-height','calc(100% - 8px)'],['min-height','0'],['overflow','hidden']].forEach(([k,v])=>box.style.setProperty(k,v,'important'));}const br=box.getBoundingClientRect();"
          if old in t:
              t=t.replace(old,new,1)
          marker='assert.equal(data.docOverflow,false,`${width}x${height} ${surface} document overflow`);'
          if marker not in t:
              raise SystemExit('assertion anchor missing')
          t=t.replace(marker,"console.log('QA_DATA '+JSON.stringify(data));"+marker,1)
          p.write_text(t)
          PY
          node tests/premium-functional-ui-responsive-browser.test.js
