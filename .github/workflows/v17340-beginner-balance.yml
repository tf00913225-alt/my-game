name: V173.40 Beginner Balance

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17340-beginner-balance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - name: Use current Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply V173.40 changes
        run: python3 .github/scripts/v17340-beginner-balance.py

      - name: Focused checks
        run: |
          node --check js/00-main.js
          node --check js/25-v131-fix-batch.js
          node --check js/39-v143-skill-animation.js
          node tests/v173.40-beginner-balance.test.js
          node tests/v170-final-spec-integration.test.js
          node tests/v173.23-wind-vfx.test.js
          node tests/v150-ice-arrow-rain-vfx.test.js

      - name: Remove temporary tooling
        run: |
          rm -f .github/scripts/v17340-beginner-balance.py
          rm -f .github/workflows/v17340-beginner-balance.yml

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: tune V173.40 beginner progression"

      - name: Push to dev
        run: git push origin HEAD:dev
