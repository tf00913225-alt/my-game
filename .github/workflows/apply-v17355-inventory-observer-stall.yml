name: Apply V173.55 inventory observer stall fix

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'launch V173.55 inventory observer stall fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Ensure asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi
      - name: Apply patch
        run: python .github/scripts/apply-v17355-inventory-observer-stall.py
      - name: Syntax and full tests
        run: |
          node --check js/20-anonymous-20.js
          node --check js/51-v169-rpg-ui.js
          node --check js/equipment-progression.js
          node --check js/53-v173.50-inventory-qol.js
          node --check js/55-v173.51-inventory-qa.js
          node .github/scripts/ci.mjs tests
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js tests
          git commit -m "V173.55 fix module 30 inventory observer starvation"
          git push origin HEAD:dev
