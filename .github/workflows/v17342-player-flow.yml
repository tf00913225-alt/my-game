name: V173.42 Player Flow
# retry 10

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17342-player-flow.yml

permissions:
  contents: write

jobs:
  apply:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 40

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Repair V173.42 staging script
        run: python3 .github/scripts/v17342-repair.py

      - name: Apply V173.42 changes
        run: python3 .github/scripts/v17342-player-flow.py

      - name: Sync intentional V173.42 assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('tests').glob('*.js'):
              s=p.read_text()
              s=s.replace('173\\.41','173\\.42')
              s=s.replace('173.41','173.42')
              p.write_text(s)

          p=Path('tests/v154-current-request.test.js')
          s=p.read_text()
          old='assert.match(css,/v141-abyss-intro:not\\(\\.complete\\)[\\s\\S]*?justify-content:flex-end !important/);'
          new='assert.match(css,/v141-abyss-intro:not\\(\\.complete\\)::before\\{[\\s\\S]*?aspect-ratio:9\\/16/);'
          if old not in s:
              raise SystemExit('V154 abyss cover assertion not found')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/v173.28-main-city-lobby.test.js')
          s=p.read_text()
          s=s.replace('test("six secondary entrances form two substantial vertical button rails"',
                      'test("eight secondary entrances form two substantial vertical button rails"',1)
          s=s.replace('assert.equal(count(actions,/class="home-card home-card-secondary"/g),6);',
                      'assert.equal(count(actions,/class="home-card home-card-secondary"/g),8);',1)
          s=s.replace('["rest","synthesis","quest","bestiary","achievement","announcement"]',
                      '["rest","synthesis","quest","bestiary","achievement","announcement","offlineExp","system"]',1)
          s=s.replace('grid-template-rows:repeat\\(3,82px\\);[\\s\\S]*min-height:256px',
                      'grid-template-rows:repeat\\(4,82px\\);[\\s\\S]*min-height:343px',1)

          old_name='test("offline experience and system use complete framed image-over-text buttons"'
          block_start=s.find(old_name)
          if block_start>=0:
              block_end=s.find('\n});',block_start)
              if block_end<0:
                  raise SystemExit('V173.28 utility test end not found')
              block_end+=len('\n});')
              new_block='''test("offline experience and system join the existing side rails",()=>{
    assert.equal(count(actions,/openHomeFeature\\('offlineExp'\\)/g),1);
    assert.equal(count(actions,/openHomeFeature\\('system'\\)/g),1);
    assert.equal(count(actions,/class="home-card home-card-utility"/g),0);
    assert.doesNotMatch(actions,/home-utility-actions/);
    assert.match(actions,/homeIconOfflineExp/);
    assert.match(actions,/homeIconSystem/);
});'''
              s=s[:block_start]+new_block+s[block_end:]
          p.write_text(s)
          PY

      - name: Focused V173.42 regression
        run: node tests/v173.42-player-flow.test.js

      - name: Check CI script syntax
        run: node --check .github/scripts/ci.mjs

      - name: Check all JavaScript syntax
        run: node .github/scripts/ci.mjs syntax

      - name: Ensure asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run all Node unit and integration suites
        run: node .github/scripts/ci.mjs tests

      - name: Check static local resources
        run: node .github/scripts/ci.mjs resources

      - name: Check duplicate HTML IDs
        run: node .github/scripts/ci.mjs html-ids

      - name: Check release entries and loader integrity
        run: node .github/scripts/ci.mjs loader

      - name: Remove temporary V173.42 tooling
        run: |
          rm -f .github/scripts/v17342-player-flow.py
          rm -f .github/scripts/v17342-repair.py
          rm -f .github/workflows/v17342-player-flow.yml

      - name: Commit validated V173.42
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: improve player flow element box and rewards"

      - name: Check final Git diff
        run: |
          CI_BASE_SHA="8bd904c3a4949e1dbe4066d34a194f3d4a690cd9" \
          CI_HEAD_SHA="$(git rev-parse HEAD)" \
          node .github/scripts/ci.mjs git-diff

      - name: Push validated V173.42 to dev
        run: git push origin HEAD:dev
