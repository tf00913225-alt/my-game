name: Skill runtime QA build recovery
on:
  push:
    branches:
      - fix/skill-action-dom-presentation-runtime-qa-20260930
    paths:
      - .github/workflows/skill-runtime-qa-build-recovery.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-action-dom-presentation-runtime-qa-20260930
          fetch-depth: 0
      - name: Apply formal Runtime row identity and regenerate production build
        run: |
          printf '%s' 'H4sIAAAAAAACA2WQyQrCMBCG73mKwZMSE1uXBilCr4J48QkmTSqpMYEmYsGXt3WhLnOZ9f9mGGWqChg7mgg4q8MsSdgZjeN1APmdE+OUbkGLMhUoOdeqylYLCWmSZMslYYz9Egil9I9SFMDm62wuphnQZyCgK1YXV0bjHTS629McTsbanUflL3E8uREg8DbpW15aDGGPZw2bodHbKPRC1vjrKCf0U6IwYtCRPwa2avPyeY8eGFZ3j3gcskOpbU7u5IZx+SEBAAA=' | base64 -d | gzip -d > /tmp/skill-row-identity.patch
          git apply /tmp/skill-row-identity.patch
          npm run build
          git rm .github/workflows/skill-runtime-qa-build-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/00-main.js index.html asset-manifest.json build
          git commit -m "fix: bind formal skill row identity for runtime QA"
          git push origin HEAD:fix/skill-action-dom-presentation-runtime-qa-20260930
