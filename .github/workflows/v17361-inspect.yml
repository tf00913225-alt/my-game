name: V173.61 integration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17361-inspect.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Import approved item art from assets-library
        run: |
          git fetch origin assets-library
          mkdir -p assets/items/materials assets/items/chests
          git show "origin/assets-library:assets/inbox/道具icon/礦石.png" > assets/items/materials/ore.png
          git show "origin/assets-library:assets/inbox/道具icon/副本與背包的寶箱.png" > assets/items/chests/dungeon-chest.png
          file assets/items/materials/ore.png assets/items/chests/dungeon-chest.png

      - name: Apply V173.61 source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")
          def write(path,text):
              Path(path).write_text(text,encoding="utf-8")
          def replace_once(path,old,new,label):
              s=read(path)
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              write(path,s.replace(old,new,1))
          def regex_once(path,pattern,replacement,label,flags=re.S):
              s=read(path)
              out,count=re.subn(pattern,replacement,s,count=1,flags=flags)
              if count!=1:
                  raise SystemExit(f"{label}: expected one regex anchor, found {count}")
              write(path,out)
          def append_once(path,marker,block):
              s=read(path)
              if marker in s:
                  return
              write(path,s.rstrip()+"\n\n"+block.strip()+"\n")

          # Release/cache wiring.
          write("index.html",read("index.html").replace("173.60","173.61"))
          for path in [
              "js/20-anonymous-20.js",
              "js/51-v169-rpg-ui.js",
              "js/53-v173.50-inventory-qol.js",
              "js/equipment-progression.js"
          ]:
              write(path,read(path).replace("173.60","173.61"))
          for path in [
              "tests/v173.20-startup-loader.test.js",
              "tests/v173.47-runtime-integrity.test.js",
              "tests/v173.48-premium-shop-layout.test.js",
              "tests/v173.49-exp-pool-scroll-stability.test.js",
              "tests/v173.50-inventory-qol.test.js",
              "tests/v173.51-qa.test.js",
              "tests/v173.53-startup-stall-regression.test.js",
              "tests/v173.54-qa-readiness.test.js",
              "tests/v173.55-inventory-observer-stall.test.js",
              "tests/v173.60-formal-tiers-talismans.test.js"
          ]:
              write(path,read(path).replace("173.60","173.61"))

          # Patrol page: add power-saving control beside existing quick toggles.
          p="index.html"; s=read(p)
          marker='''              </button>\n\n              <div class="map-quick-toggle-hint">'''
          if s.count(marker)!=1:
              raise SystemExit(f"patrol insert marker count={s.count(marker)}")
          power='''              </button>\n\n              <button\n                  id="quickPowerSavingToggle"\n                  class="map-quick-toggle-btn v17361-power-save-toggle"\n                  type="button"\n                  onclick="v17361TogglePowerSaving()"\n                  aria-label="省電模式"\n                  aria-pressed="false"\n              >省電 OFF</button>\n\n              <div class="map-quick-toggle-hint">'''
          write(p,s.replace(marker,power,1))

          # Supplied ore + common dungeon chest art, preserving formal rarity frames.
          replace_once(
              "js/27-v132-content-expansion.js",
              'icon:oreIcon(tier.key),',
              'icon:rasterItemIcon("assets/items/materials/ore.png",tier.key,"material"),',
              "ore art"
          )
          regex_once(
              "js/27-v132-content-expansion.js",
              r'    function chestIcon\(\)\{[\s\S]*?\n    \}\n\n    function ticketIcon',
              '''    function chestIcon(){\n        return rasterItemIcon("assets/items/chests/dungeon-chest.png","blue","chest");\n    }\n    // All general-dungeon backpack chests share this visual; item name remains semantic.\n    window.v17361GeneralDungeonChestIcon=chestIcon;\n\n    function ticketIcon''',
              "shared chest helper"
          )

          # Remove old CSS skill flashes only; keep Canvas particles and current Sprite VFX.
          regex_once(
              "js/35-v141-ui-battle.js",
              r'    window\.v141PlayCardEffect=function\(side,index,type\)\{[\s\S]*?\n    \};\n\n    function executeAdditionalSupportAction',
              '''    window.v141PlayCardEffect=function(side,index,type){\n        const card=cardFor(side,index);\n        if(!card){ return; }\n        // V173.61: CSS skill flashes retired; non-CSS Canvas particles remain.\n        playCanvasParticles(card,type);\n    };\n\n    function executeAdditionalSupportAction''',
              "v141 card CSS effect"
          )
          p="css/38-v141-system-expansion.css"; s=read(p)
          s,n1=re.subn(r'\n#game-stage #battlePage \.v141-once-heal,[\s\S]*?#game-stage #battlePage \.v141-once-talisman\{\n    animation:v141TalismanFlash \.82s ease-out !important;\n\}\n','\n',s,count=1)
          if n1!=1:
              raise SystemExit(f"CSS one-shot skill classes count={n1}")
          for name in ["v141HealFlash","v141ReviveFlash","v141TalismanFlash"]:
              s,n=re.subn(r'@keyframes '+name+r'\{[^\n]*\}\n?','',s,count=1)
              if n!=1:
                  raise SystemExit(f"CSS keyframe {name} count={n}")
          write(p,s)

          # Battle procedural SFX only.
          replace_once("js/34-v141-core-systems.js","master.gain.value=0.22;","master.gain.value=0.30;","battle gain")

          # Live quest state refresh when progress changes in background.
          regex_once(
              "js/34-v141-core-systems.js",
              r'    function recordQuestProgress\(id,amount,type\)\{[\s\S]*?\n    \}\n    window\.v141RecordQuestProgress=recordQuestProgress;',
              '''    function recordQuestProgress(id,amount,type){\n        if(typeof ensureDailyQuestsCurrent!=="function"){ return; }\n        ensureDailyQuestsCurrent();\n        const state=type==="commission"?commissionQuestState:dailyQuestState;\n        const definitions=type==="commission"?commissionQuestDefinitions:dailyQuestDefinitions;\n        const quest=definitions.find(item=>item.id===id);\n        if(!quest){ return; }\n        const before=Number(state.progress[id])||0;\n        const after=Math.min(quest.goal,before+Math.max(0,Number(amount)||0));\n        if(after===before){ return; }\n        state.progress[id]=after;\n        if(typeof window.v17361RefreshOpenQuestPage==="function"){ window.v17361RefreshOpenQuestPage(); }\n        if(typeof window.v148SyncQuestNoticeDots==="function"){ window.v148SyncQuestNoticeDots(); }\n    }\n    window.v141RecordQuestProgress=recordQuestProgress;''',
              "live quest progress"
          )

          # Screen Wake Lock owner + patrol power-saving preference.
          p="js/34-v141-core-systems.js"; s=read(p)
          if "V17361_POWER_SAVE_KEY" not in s:
              pos=s.rfind("\n})();")
              if pos<0:
                  raise SystemExit("js34 final IIFE anchor missing")
              wake='''\n\n    /* V173.61 — screen wake / patrol power-saving owner. */\n    const V17361_POWER_SAVE_KEY="v17361_patrol_power_saving";\n    let v17361ScreenWakeLock=null;\n\n    function v17361PowerSavingEnabled(){\n        try{ return localStorage.getItem(V17361_POWER_SAVE_KEY)==="1"; }catch(_){ return false; }\n    }\n    function v17361SyncPowerSavingButton(){\n        if(typeof document==="undefined"){ return; }\n        const button=document.getElementById("quickPowerSavingToggle");\n        if(!button){ return; }\n        const enabled=v17361PowerSavingEnabled();\n        button.classList.toggle("active",enabled);\n        button.setAttribute("aria-pressed",enabled?"true":"false");\n        button.textContent=enabled?"省電 ON":"省電 OFF";\n        button.title=enabled?"允許螢幕依系統設定休眠":"遊戲會嘗試保持螢幕常亮";\n    }\n    async function v17361ReleaseWakeLock(){\n        const lock=v17361ScreenWakeLock;\n        v17361ScreenWakeLock=null;\n        if(lock&&typeof lock.release==="function"){ try{ await lock.release(); }catch(_){ } }\n    }\n    async function v17361RequestWakeLock(){\n        v17361SyncPowerSavingButton();\n        if(v17361PowerSavingEnabled()||typeof document==="undefined"||document.visibilityState!=="visible"){\n            await v17361ReleaseWakeLock();\n            return false;\n        }\n        if(typeof navigator==="undefined"||!navigator.wakeLock||typeof navigator.wakeLock.request!=="function"){ return false; }\n        if(v17361ScreenWakeLock&&!v17361ScreenWakeLock.released){ return true; }\n        try{\n            const lock=await navigator.wakeLock.request("screen");\n            v17361ScreenWakeLock=lock;\n            if(lock&&typeof lock.addEventListener==="function"){\n                lock.addEventListener("release",()=>{ if(v17361ScreenWakeLock===lock){ v17361ScreenWakeLock=null; } });\n            }\n            return true;\n        }catch(_){ v17361ScreenWakeLock=null; return false; }\n    }\n    window.v17361TogglePowerSaving=function(){\n        const next=!v17361PowerSavingEnabled();\n        try{ localStorage.setItem(V17361_POWER_SAVE_KEY,next?"1":"0"); }catch(_){ }\n        v17361SyncPowerSavingButton();\n        if(next){ void v17361ReleaseWakeLock(); } else{ void v17361RequestWakeLock(); }\n        return next;\n    };\n    window.v17361RequestWakeLock=v17361RequestWakeLock;\n    window.v17361ReleaseWakeLock=v17361ReleaseWakeLock;\n    if(typeof document!=="undefined"){\n        document.addEventListener("pointerdown",()=>{ void v17361RequestWakeLock(); },{once:true,passive:true});\n        document.addEventListener("visibilitychange",()=>{\n            if(document.visibilityState==="visible"){ void v17361RequestWakeLock(); }\n            else{ void v17361ReleaseWakeLock(); }\n        });\n        setTimeout(v17361SyncPowerSavingButton,0);\n    }\n'''
              s=s[:pos]+wake+s[pos:]
              write(p,s)

          # Quest owner: daily/commission claim-all + targeted open-page redraw.
          p="js/00-main.js"; s=read(p)
          insertion_marker='''\n\n\n/*\n   V89：任務視窗為「固定標籤列 + 內層任務清單 + 固定完成度獎勵」架構。'''
          if s.count(insertion_marker)!=1:
              raise SystemExit(f"quest helper insertion marker count={s.count(insertion_marker)}")
          helpers='''\n\nfunction getClaimableQuestIds(definitions,state){\n    return (definitions||[]).filter(function(quest){\n        return quest && !state.claimed[quest.id] &&\n            (Number(state.progress[quest.id])||0)>=Math.max(1,Number(quest.goal)||1);\n    }).map(function(quest){ return quest.id; });\n}\n\nfunction v17361SyncQuestClaimAllButton(isCommission){\n    const button=$("questClaimAllButton");\n    if(!button){ return; }\n    const definitions=isCommission?commissionQuestDefinitions:dailyQuestDefinitions;\n    const state=isCommission?commissionQuestState:dailyQuestState;\n    const count=getClaimableQuestIds(definitions,state).length;\n    button.disabled=count<=0;\n    button.textContent=count>0?"一鍵領取（"+count+"）":"一鍵領取";\n    button.onclick=isCommission?v17361ClaimAllCommissionQuests:v17361ClaimAllDailyQuests;\n}\n\nfunction v17361RefreshOpenQuestPage(){\n    const body=$("questTabBody");\n    if(!body){ return false; }\n    const commissionBtn=$("questTabBtnCommission");\n    const isCommission=!!(commissionBtn&&commissionBtn.classList.contains("active"));\n    const scrollTop=body.scrollTop;\n    body.innerHTML=isCommission?renderCommissionQuestListContent():renderDailyQuestListContent();\n    const completionPanel=$("questCompletionPanel");\n    if(completionPanel){\n        completionPanel.innerHTML=renderQuestCompletionPanelContent(\n            isCommission?commissionQuestDefinitions:dailyQuestDefinitions,\n            isCommission?commissionQuestState:dailyQuestState\n        );\n    }\n    body.scrollTop=scrollTop;\n    v17361SyncQuestClaimAllButton(isCommission);\n    return true;\n}\nwindow.v17361RefreshOpenQuestPage=v17361RefreshOpenQuestPage;\n'''
          s=s.replace(insertion_marker,helpers+insertion_marker,1)

          toolbar_marker='''            '</div>'+\n\n            '<div id="questTabBody" class="quest-tab-body" role="tabpanel">'+'''
          toolbar='''            '</div>'+\n\n            '<div class="quest-batch-actions">'+\n                '<button id="questClaimAllButton" class="quest-claim-all-btn" type="button" '+\n                    (getClaimableQuestIds(\n                        isCommission?commissionQuestDefinitions:dailyQuestDefinitions,\n                        isCommission?commissionQuestState:dailyQuestState\n                    ).length?'':'disabled ')+\n                    'onclick="'+(isCommission?'v17361ClaimAllCommissionQuests()':'v17361ClaimAllDailyQuests()')+'">一鍵領取</button>'+\n            '</div>'+\n\n            '<div id="questTabBody" class="quest-tab-body" role="tabpanel">'+'''
          if s.count(toolbar_marker)!=1:
              raise SystemExit(f"quest toolbar marker count={s.count(toolbar_marker)}")
          s=s.replace(toolbar_marker,toolbar,1)

          # Add claim-all sync immediately before switchQuestTab closes.
          start=s.index("function switchQuestTab(tabName){")
          end=s.index("\n\n\n/*\n   ★ 新增（依照使用者要求，新增副本/BOSS",start)
          segment=s[start:end]
          close=segment.rfind("\n}")
          if close<0:
              raise SystemExit("switchQuestTab close missing")
          segment=segment[:close]+"\n    v17361SyncQuestClaimAllButton(isCommission);\n"+segment[close:]
          s=s[:start]+segment+s[end:]

          # Avoid per-item redraws during bulk claim.
          s,n=re.subn(r'\n\s*switchQuestTab\(\s*"daily"\s*\);', '\n    if(!window.__v17361BulkQuestClaim){ switchQuestTab("daily"); }', s, count=1)
          if n!=1: raise SystemExit(f"daily claim redraw count={n}")
          s,n=re.subn(r'\n\s*switchQuestTab\(\s*"commission"\s*\);', '\n    if(!window.__v17361BulkQuestClaim){ switchQuestTab("commission"); }', s, count=1)
          if n!=1: raise SystemExit(f"commission claim redraw count={n}")

          bestiary='''/* =====================================================\n   ★ 圖鑑\n===================================================== */'''
          if s.count(bestiary)!=1:
              raise SystemExit(f"bestiary marker count={s.count(bestiary)}")
          bulk='''function v17361ClaimAllQuestGroup(definitions,state,claimFn,title){\n    const ids=getClaimableQuestIds(definitions,state);\n    if(!ids.length){ v17361RefreshOpenQuestPage(); return 0; }\n    window.__v17361BulkQuestClaim=true;\n    try{ ids.forEach(function(id){ claimFn(id); }); }\n    finally{ window.__v17361BulkQuestClaim=false; }\n    v17361RefreshOpenQuestPage();\n    if(typeof window.rpgAlert==="function"){\n        void window.rpgAlert("已一鍵領取 "+ids.length+" 個"+title+"獎勵。",{title:title+"獎勵",confirmText:"知道了",tone:"success"});\n    }\n    return ids.length;\n}\nfunction v17361ClaimAllDailyQuests(){\n    return v17361ClaimAllQuestGroup(dailyQuestDefinitions,dailyQuestState,claimDailyQuest,"每日任務");\n}\nfunction v17361ClaimAllCommissionQuests(){\n    return v17361ClaimAllQuestGroup(commissionQuestDefinitions,commissionQuestState,claimCommissionQuest,"委託任務");\n}\nwindow.v17361ClaimAllDailyQuests=v17361ClaimAllDailyQuests;\nwindow.v17361ClaimAllCommissionQuests=v17361ClaimAllCommissionQuests;\n\n'''
          s=s.replace(bestiary,bulk+bestiary,1)
          write(p,s)

          # V173.51 keeps individual confirmation, but bulk claim emits one summary only.
          p="js/57-v173.51-quest-qa.js"; s=read(p)
          count=s.count("if(!b&&a&&q)")
          if count!=2:
              raise SystemExit(f"quest QA popup anchors count={count}")
          write(p,s.replace("if(!b&&a&&q)","if(!window.__v17361BulkQuestClaim&&!b&&a&&q)"))

          # Image-first daily reward previews; no descriptive reward paragraphs.
          regex_once(
              "js/42-v148-combat-dungeon-fixes.js",
              r'    window\.v148ShowDailyDungeonPreview=function\(type\)\{[\s\S]*?\n    \};\n\n    if\(typeof renderDungeonTabContent',
              '''    function v17361DailyRewardVisual(type){\n        if(type==="material"){\n            return '<div class="v17361-reward-visual single"><div class="v17361-reward-icon material" aria-label="材料寶箱與礦石">'+\n                '<img class="v17361-chest-art" src="assets/items/chests/dungeon-chest.png" alt="材料寶箱">'+\n                '<img class="v17361-ore-mini" src="assets/items/materials/ore.png" alt="礦石">'+\n                '<em>1–3</em></div></div>';\n        }\n        if(type==="gold"){\n            return '<div class="v17361-reward-visual single"><div class="v17361-reward-icon cover" aria-label="金幣獎勵">'+\n                '<img src="assets/dungeons/covers/gold-v17344.png" alt="金幣"></div></div>';\n        }\n        return '<div class="v17361-reward-visual single"><div class="v17361-reward-icon" aria-label="經驗獎勵">'+\n            '<img src="assets/ui/home-offline-exp.png" alt="經驗"></div></div>';\n    }\n    window.v148ShowDailyDungeonPreview=function(type){\n        const meta=DAILY_DUNGEON_META[type];\n        if(!meta||typeof window.v132ShowRewardModal!=="function"){ return; }\n        const html='<div class="v132-reward-modal-inner v17361-reward-preview"><h3>'+meta.title+'獎勵預覽</h3>'+\n            v17361DailyRewardVisual(type)+\n            '<div class="v132-reward-actions"><button type="button" onclick="v132CloseRewardModal()">返回</button></div></div>';\n        window.v132ShowRewardModal(html);\n    };\n\n    if(typeof renderDungeonTabContent''',
              "daily reward preview"
          )

          # Equipment preview: actual item art + rarity frames + chest count.
          regex_once(
              "js/equipment-progression.js",
              r'    window\.v17346ShowEquipmentDungeonPreview=function\(\)\{[\s\S]*?\n    \};\n\n    if\(typeof renderDungeonTabContent',
              '''    window.v17346ShowEquipmentDungeonPreview=function(){\n        if(typeof window.v132ShowRewardModal!=="function"){ return; }\n        const rewards=[\n            ["white","assets/equipment/warrior/head-01.png","40%"],\n            ["blue","assets/equipment/warrior/armor-01.png","40%"],\n            ["purple","assets/equipment/warrior/shoes-01.png","15%"],\n            ["orange","assets/equipment/warrior/weapon-01.png","5%"]\n        ];\n        const tiles=rewards.map(entry=>'<div class="v17361-reward-icon rarity-'+entry[0]+'"><img src="'+entry[1]+'" alt=""><em>'+entry[2]+'</em></div>').join("");\n        const html='<div class="v132-reward-modal-inner v17346-preview-modal v17361-reward-preview"><h3>裝備副本獎勵預覽</h3>'+\n            '<div class="v17361-reward-visual equipment">'+tiles+'</div>'+\n            '<div class="v17361-chest-count" aria-label="兩個裝備寶箱"><img src="assets/items/chests/dungeon-chest.png" alt=""><b>×2</b></div>'+\n            '<div class="v132-reward-actions"><button type="button" onclick="v132CloseRewardModal()">返回</button></div></div>';\n        window.v132ShowRewardModal(html);\n    };\n\n    if(typeof renderDungeonTabContent''',
              "equipment reward preview"
          )

          # Shared return fill, power-save control, quest claim-all styling.
          append_once("css/00-main.css","V173.61 — shared return icon center fill",'''/* V173.61 — shared return icon center fill / patrol power saving / quest batch action */
#game-stage img[src*="map-return.png"]{background:#050505;border-radius:50%;}
#game-stage .map-quick-toggle-btn.v17361-power-save-toggle{
    width:auto !important;min-width:64px;padding:0 9px !important;
    border:1px solid rgba(205,160,82,.74) !important;border-radius:12px !important;
    background:rgba(7,7,7,.9) !important;color:#d8c79f !important;
    font-size:10px !important;font-weight:900 !important;letter-spacing:.04em;white-space:nowrap;
}
#game-stage .map-quick-toggle-btn.v17361-power-save-toggle.active{
    border-color:#7ee0a9 !important;color:#aef1c9 !important;
    box-shadow:inset 0 0 0 1px rgba(126,224,169,.2),0 0 9px rgba(80,194,128,.2) !important;
}
#game-stage .quest-batch-actions{display:flex;justify-content:flex-end;padding:8px 10px 4px;}
#game-stage .quest-claim-all-btn{
    min-width:108px;min-height:36px;padding:7px 12px;border:1px solid #b98a42;border-radius:8px;
    background:linear-gradient(180deg,#4c3316,#211308);color:#ffe0a0;font-size:12px;font-weight:900;
}
#game-stage .quest-claim-all-btn:disabled{opacity:.42;filter:grayscale(.35);}''')

          append_once("css/43-v148-combat-dungeon-fixes.css","V173.61 — image-first daily reward previews",'''/* V173.61 — image-first daily reward previews */
#game-stage .v17361-reward-preview{max-width:420px;}
#game-stage .v17361-reward-visual{display:grid;gap:10px;margin:10px auto 14px;}
#game-stage .v17361-reward-visual.single{grid-template-columns:minmax(0,170px);justify-content:center;}
#game-stage .v17361-reward-visual.equipment{grid-template-columns:repeat(2,minmax(0,1fr));}
#game-stage .v17361-reward-icon{
    position:relative;aspect-ratio:1;overflow:hidden;border:1px solid rgba(209,167,92,.72);border-radius:14px;
    background:radial-gradient(circle at 50% 38%,rgba(104,79,38,.28),rgba(8,7,6,.96) 72%);
    box-shadow:inset 0 0 20px rgba(0,0,0,.62),0 7px 18px rgba(0,0,0,.28);
}
#game-stage .v17361-reward-icon>img:not(.v17361-ore-mini){width:100%;height:100%;display:block;object-fit:contain;padding:8px;box-sizing:border-box;}
#game-stage .v17361-reward-icon.cover>img{object-fit:cover!important;padding:0!important;}
#game-stage .v17361-reward-icon.material .v17361-chest-art{padding:4px!important;}
#game-stage .v17361-reward-icon .v17361-ore-mini{
    position:absolute;right:6px;bottom:6px;width:42%;height:42%;object-fit:contain;padding:3px;
    border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(5,5,5,.82);
}
#game-stage .v17361-reward-icon>em{
    position:absolute;right:7px;top:7px;min-width:34px;padding:3px 7px;border-radius:999px;background:rgba(5,5,5,.88);
    border:1px solid rgba(238,195,113,.55);color:#ffe2a5;font-style:normal;font-size:11px;font-weight:900;text-align:center;
}
#game-stage .v17361-reward-icon.rarity-white{border-color:#D8D8D8;}
#game-stage .v17361-reward-icon.rarity-blue{border-color:#42A5FF;box-shadow:inset 0 0 18px rgba(66,165,255,.16),0 0 10px rgba(66,165,255,.16);}
#game-stage .v17361-reward-icon.rarity-purple{border-color:#B05CFF;box-shadow:inset 0 0 18px rgba(176,92,255,.18),0 0 12px rgba(176,92,255,.18);}
#game-stage .v17361-reward-icon.rarity-orange{border-color:#FF9F38;box-shadow:inset 0 0 18px rgba(255,159,56,.2),0 0 14px rgba(255,159,56,.2);}
#game-stage .v17361-chest-count{display:flex;align-items:center;justify-content:center;gap:4px;margin:-4px 0 10px;color:#f8d58d;font-weight:900;}
#game-stage .v17361-chest-count img{width:42px;height:42px;object-fit:contain;}
#game-stage .v17361-chest-count b{font-size:14px;}''')

          # Handoff truth source.
          p="HANDOFF.md"; s=read(p)
          if not s.lstrip().startswith("## V173.61"):
              entry='''## V173.61 返回圖示／道具圖／副本預覽／音效／常亮省電／任務即時領取（目前 dev）
- V173.60 已通過受保護 Repository checks 並由 PR #70 正式合併 main；本輪新修改只在 dev。
- `css/00-main.css` 是共用返回按鈕視覺 owner：所有實際使用 `assets/ui/map-return.png` 的入口統一補 `#050505` 圓形黑底。
