name: Temporary map/nav diagnostic
on:
  push:
    branches:
      - fix/map-avatar-nav-size-player-scale-20260914
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose patrol asset and nav cascade
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PATROL FUNCTIONS ==='
          grep -RInE 'resetPatrolCharacterToIdle|startPatrolCharacterWalking|stopPatrolCharacterWalking|movePatrolCharacterRandomly' js | head -n 250 || true
          echo '=== PATROL IMAGE MUTATIONS ==='
          grep -RInE 'patrolCharacterImg|patrolCharacterWrap' js css index.html | head -n 350 || true
          echo '=== PATROL ASSETS ==='
          file assets/characters/patrol/* assets/characters/patrol-character.png || true
          if command -v identify >/dev/null 2>&1; then
            identify -verbose assets/characters/patrol/patrol-male-earth-front.0677960124f5.webp | grep -E 'Geometry:|Alpha:|mean:|min:|max:' | head -n 30 || true
            identify -verbose assets/characters/patrol/patrol-female-fire-front.6cb6c8d514b1.webp | grep -E 'Geometry:|Alpha:|mean:|min:|max:' | head -n 30 || true
            identify -verbose assets/characters/patrol-character.png | grep -E 'Geometry:|Alpha:|mean:|min:|max:' | head -n 30 || true
          fi
          echo '=== MANIFEST PATROL ASSETS ==='
          grep -n 'patrol-.*front\|patrol-character' asset-manifest.json | head -n 80 || true
          echo '=== NAV CASCADE ==='
          grep -RInE '#game-stage .*#v141DungeonNav|#game-stage #v141DungeonNav|v148-context-nav-active.*v141DungeonNav|v141-dungeon-active.*v141DungeonNav' css | head -n 400 || true
          echo '=== PLAYER SCALE ==='
          grep -nA8 -B2 'battle-player.v174-cardless-unit>.v174-battle-art' js/54-v173.51-battle-qa.js | head -n 40 || true
