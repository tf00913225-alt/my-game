name: Apply V173.50 inventory quality-of-life

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'launch V173.50 inventory quality-of-life patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply V173.50 patch
        run: |
          python .github/scripts/apply_v17350_inventory_qol.py
          node --check js/53-v173.50-inventory-qol.js
          node --check js/45-v154-dev-fixes.js
          node --check js/equipment-progression.js
          node --check js/20-anonymous-20.js
          node --check js/51-v169-rpg-ui.js
          node tests/v173.50-inventory-qol.test.js
          git diff --check

      - name: Commit V173.50
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/45-v154-dev-fixes.js js/equipment-progression.js js/20-anonymous-20.js js/51-v169-rpg-ui.js index.html tests
          git commit -m "V173.50 inventory bulk actions and persistent recovery warning"
          git push origin HEAD:dev
