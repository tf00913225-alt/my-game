name: Finalize V173.44 Notification Dot Size

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17344-dot-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make effective dot size seven pixels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('css/42-v146-system-polish.css')
          text=p.read_text(encoding='utf-8')
          old='''    width:7px !important;\n    height:7px !important;\n    min-width:10px !important;\n    min-height:10px !important;'''
          new='''    width:7px !important;\n    height:7px !important;\n    min-width:7px !important;\n    min-height:7px !important;'''
          if text.count(old)!=1:
              raise SystemExit('notification dot size block was not found exactly once')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Run minimal relevant regressions
        run: |
          set -euo pipefail
          node tests/v173.42-player-flow.test.js
          node tests/v173.44-current-request.test.js

      - name: Commit final dot fix and clean temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v17344-dot-final.yml
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/42-v146-system-polish.css
          git commit -m "fix: finalize notification dot size"
          git push origin HEAD:dev
          git push origin --delete temp-no || true
