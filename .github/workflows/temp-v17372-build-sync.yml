name: TEMP V173.72 Deterministic Build Sync

on:
  push:
    branches:
      - fix/v17372-stale-battle-status-tests-20260923

permissions:
  contents: write

jobs:
  sync-build:
    if: "${{ github.event.head_commit.message != 'build: synchronize deterministic V173.72 artifacts' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v17372-stale-battle-status-tests-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate deterministic production build
        run: node scripts/build-production.mjs
      - name: Commit generated build through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          git status --porcelain=v1 > /tmp/v17372-build-status.txt
          node <<'NODE'
          const fs=require("fs");
          (async()=>{
            const repo=process.env.REPO;
            const branch=process.env.BRANCH;
            const parentSha=process.env.PARENT_SHA;
            const token=process.env.GH_TOKEN;
            const rows=fs.readFileSync("/tmp/v17372-build-status.txt","utf8").split(/\r?\n/).filter(Boolean);
            const changes=[];
            for(const row of rows){
              const status=row.slice(0,2);
              let file=row.slice(3);
              if(file.includes(" -> ")){ file=file.split(" -> ").pop(); }
              if(file===".github/workflows/temp-v17372-build-sync.yml"){ continue; }
              changes.push({status,path:file,exists:fs.existsSync(file)&&fs.statSync(file).isFile()});
            }
            if(!changes.length){
              console.log("Deterministic build already synchronized.");
              return;
            }
            async function api(method,path,body){
              const response=await fetch("https://api.github.com/repos/"+repo+path,{
                method,
                headers:{
                  "authorization":"Bearer "+token,
                  "accept":"application/vnd.github+json",
                  "x-github-api-version":"2022-11-28",
                  "content-type":"application/json"
                },
                body:body===undefined?undefined:JSON.stringify(body)
              });
              if(!response.ok){ throw new Error(method+" "+path+" failed: "+response.status+" "+await response.text()); }
              return response.status===204?null:response.json();
            }
            const refPath="/git/ref/heads/"+branch.split("/").map(encodeURIComponent).join("/");
            const current=await api("GET",refPath);
            if(current.object.sha!==parentSha){ throw new Error("Branch advanced during build; refusing stale build commit."); }
            const parent=await api("GET","/git/commits/"+parentSha);
            const entries=[];
            for(const change of changes){
              if(!change.exists){
                entries.push({path:change.path,mode:"100644",type:"blob",sha:null});
                continue;
              }
              const bytes=fs.readFileSync(change.path);
              const blob=await api("POST","/git/blobs",{content:bytes.toString("base64"),encoding:"base64"});
              entries.push({path:change.path,mode:"100644",type:"blob",sha:blob.sha});
            }
            const tree=await api("POST","/git/trees",{base_tree:parent.tree.sha,tree:entries});
            const commit=await api("POST","/git/commits",{
              message:"build: synchronize deterministic V173.72 artifacts",
              tree:tree.sha,
              parents:[parentSha]
            });
            await api("PATCH","/git/refs/heads/"+branch.split("/").map(encodeURIComponent).join("/"),{
              sha:commit.sha,force:false
            });
            console.log("Created deterministic build commit "+commit.sha);
          })().catch(error=>{ console.error(error); process.exit(1); });
          NODE
