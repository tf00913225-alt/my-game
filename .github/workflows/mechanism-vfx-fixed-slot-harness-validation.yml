name: V138 Fixed Slot Formation Contract Validation

on:
  push:
    branches:
      - validation/mechanism-vfx-fixed-slot-harness-20260917

permissions:
  contents: read

jobs:
  validate-v138:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/mechanism-vfx-fixed-slot-harness-20260917
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate test patch
        shell: bash
        run: |
          git diff --check HEAD^ HEAD
          test -z "$(git diff --name-only HEAD^ HEAD -- js css scripts config asset-manifest.json)"

      - name: Run V138 feature requirements
        run: node tests/v138-feature-requirements.test.js
