name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare Git comparison base
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$CI_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && \
             [[ ! "$CI_BASE_SHA" =~ ^0{40}$ ]] && \
             ! git cat-file -e "$CI_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          fi

          for typography_baseline_sha in \
            39767ce2b9dbfa59650b7c5fd4d52a57a2642ea5 \
            4a592dd4c41d7efb1a4849fbfe0cbf68598121bf \
            29b9668057846164a941fbf6617d2458d9af5476; do
            if ! git cat-file -e "$typography_baseline_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$typography_baseline_sha"
            fi
          done

      - name: Check CI script syntax
        run: |
          node --check .github/scripts/ci.mjs
          node --check .github/scripts/boot-live-browser-qa.mjs
          node --check .github/scripts/release-gate.mjs
          node --check .github/scripts/run-boot-architecture-browser-qa.mjs
          node --check .github/scripts/run-skill-progression-browser-qa.mjs
          node --check .github/scripts/run-relic-progression-browser-qa.mjs
          node --check .github/scripts/run-adventure-browser-qa.mjs
          node --check .github/scripts/run-fixed-slot-battlefield-browser-qa.mjs

      - name: Check all project JavaScript syntax
        run: node .github/scripts/ci.mjs syntax

      - name: Run Adventure V1 targeted regression
        run: node tests/adventure-node-system-v1.test.js

      - name: Run Fixed Slot battlefield rendering regression
        run: node tests/fixed-slot-battlefield-rendering-v2.test.js

      - name: Ensure existing asset-test dependency
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run all Node unit and integration suites
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node .github/scripts/ci.mjs tests

      - name: Verify production build is synchronized
        id: build_sync
        run: npm run build:check

      - name: Capture build synchronization evidence
        if: failure() && steps.build_sync.outcome == 'failure'
        run: |
          npm run build
          mkdir -p artifacts/build-sync
          cp asset-manifest.json artifacts/build-sync/asset-manifest.json
          cp build/asset-manifest.json artifacts/build-sync/build-asset-manifest.json
          cp build/gameplay-core-*.js artifacts/build-sync/
          cp build/gameplay-core-*.css artifacts/build-sync/
          git diff -- asset-manifest.json config/feature-manifest.json scripts/build-production.mjs build/feature-adventure-* build/gameplay-core-* > artifacts/build-sync/build-sync.diff || true
          find build -maxdepth 1 -type f \( -name 'feature-adventure-*' -o -name 'gameplay-core-*' \) -print | sort > artifacts/build-sync/build-files.txt

      - name: Upload build synchronization evidence
        if: failure() && steps.build_sync.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-build-sync-${{ github.sha }}
          path: artifacts/build-sync
          if-no-files-found: error
          retention-days: 14

      - name: Run Fixed Slot battlefield 9x16 mobile browser QA
        id: fixed_slot_browser
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        run: node .github/scripts/run-fixed-slot-battlefield-browser-qa.mjs

      - name: Upload Fixed Slot battlefield browser evidence
        if: always() && steps.fixed_slot_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: fixed-slot-battlefield-browser-qa-${{ github.sha }}
          path: artifacts/browser-qa/fixed-slot-battlefield-rendering-v2.json
          if-no-files-found: error
          retention-days: 90

      - name: Run Adventure V1 mobile browser QA
        id: adventure_browser
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        run: node .github/scripts/run-adventure-browser-qa.mjs

      - name: Upload Adventure V1 browser evidence
        if: always() && steps.adventure_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: adventure-browser-qa-${{ github.sha }}
          path: artifacts/browser-qa/adventure-node-system-v1.json
          if-no-files-found: error
          retention-days: 90

      - name: Run account-first cold/warm mobile browser QA
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node .github/scripts/run-boot-architecture-browser-qa.mjs

      - name: Upload boot architecture browser evidence
        if: (github.ref == 'refs/heads/main' || github.base_ref == 'main') && always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-architecture-browser-qa-${{ github.sha }}
          path: artifacts/browser-qa/boot-architecture-browser-qa.json
          if-no-files-found: error
          retention-days: 90

      - name: Run skill progression mobile browser QA
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node .github/scripts/run-skill-progression-browser-qa.mjs

      - name: Run relic progression mobile browser QA
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node .github/scripts/run-relic-progression-browser-qa.mjs

      - name: Check static local resources
        run: node .github/scripts/ci.mjs resources

      - name: Check duplicate HTML IDs
        run: node .github/scripts/ci.mjs html-ids

      - name: Check release entries and loader integrity
        run: node .github/scripts/ci.mjs loader

      - name: Enforce release, cache, checklist and deprecated-code gates
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/release-gate.mjs ci

      - name: Check Git whitespace and conflict markers
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci.mjs git-diff

  deploy_dev:
    name: Dev deployment gate
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-dev-cloudflare.yml
    secrets: inherit
