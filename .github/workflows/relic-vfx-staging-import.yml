name: Relic VFX staging import

on:
  push:
    branches:
      - feature/relic-vfx-animation-20260918
    paths:
      - .github/workflows/relic-vfx-staging-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/relic-vfx-animation-20260918
          fetch-depth: 0

      - name: Checkout source artwork
        uses: actions/checkout@v4
        with:
          ref: assets-library
          path: _asset_source
          sparse-checkout: |
            assets/inbox/秘寶icon/秘寶技能VFX
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install WebP tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Convert exact 4x3 sheets to lossless WebP
        shell: bash
        run: |
          set -euo pipefail
          src="_asset_source/assets/inbox/秘寶icon/秘寶技能VFX"
          dst="assets/vfx/relic"
          mkdir -p "$dst" relic-vfx-artifact/source relic-vfx-artifact/decoded

          declare -A MAP=(
            ["九龍神火罩 vfx.png"]="relic_nine_dragon_fire.webp"
            ["乾坤玉壺vfx.png"]="relic_qiankun_flask.webp"
            ["伏魔金印vfx.png"]="relic_demon_suppressing_seal.webp"
            ["回天寶輪vfx.png"]="relic_returning_wheel.webp"
            ["天罡戰旗 vfx.png"]="relic_tiangang_banner.webp"
            ["太初聖符vfx.png"]="relic_origin_talisman.webp"
            ["寒泉玉佩 vfx.png"]="relic_cold_spring_jade.webp"
            ["山河寶鼎vfx.png"]="relic_mountain_river_cauldron.webp"
            ["岩岳鎮印vfx.png"]="relic_rock_mountain_seal.webp"
            ["烈陽神珠vfx.png"]="relic_sun_orb.webp"
            ["焚星殘印vfx.png"]="relic_burning_star_mark.webp"
            ["玄冰淨心vfx.png"]="relic_ice_mirror_heart.webp"
            ["玄武靈印vfx.png"]="relic_xuanwu_seal.webp"
            ["破軍殘卷vfx.png"]="relic_broken_army_scroll.webp"
            ["萬象歸元盤vfx.png"]="relic_all_returning_array.webp"
            ["赤宵戰紋vfx.png"]="relic_red_sky_war_mark.webp"
            ["追風行符vfx.png"]="relic_wind_chasing_talisman.webp"
            ["鎮魂古鐘 vfx.png"]="relic_soul_bell.webp"
            ["靈泉法瓶vfx.png"]="relic_spirit_spring_bottle.webp"
            ["青嵐羽符vfx.png"]="relic_qinglan_feather.webp"
          )

          : > relic-vfx-artifact/conversion-report.txt
          count=0
          for input_name in "${!MAP[@]}"; do
            input="$src/$input_name"
            output="$dst/${MAP[$input_name]}"
            test -f "$input"
            read width height <<<"$(identify -format '%w %h' "$input")"
            if (( width % 4 != 0 || height % 3 != 0 )); then
              echo "ERROR: $input_name is not divisible into a 4x3 grid: ${width}x${height}" >&2
              exit 1
            fi

            cwebp -quiet -lossless -exact -z 3 "$input" -o "$output"
            dwebp "$output" -quiet -o "relic-vfx-artifact/decoded/${MAP[$input_name]%.webp}.png"

            read out_width out_height <<<"$(identify -format '%w %h' "$output")"
            test "$width" = "$out_width"
            test "$height" = "$out_height"

            metric="$(compare -metric AE "$input" "relic-vfx-artifact/decoded/${MAP[$input_name]%.webp}.png" null: 2>&1 || true)"
            if [ "$metric" != "0" ]; then
              echo "ERROR: pixel mismatch for $input_name (AE=$metric)" >&2
              exit 1
            fi

            channels="$(identify -format '%[channels]' "$input")"
            out_channels="$(identify -format '%[channels]' "$output")"
            cp "$input" "relic-vfx-artifact/source/$input_name"
            printf '%s -> %s | %sx%s | cell=%sx%s | channels=%s -> %s | pixelAE=%s\n'               "$input_name" "${MAP[$input_name]}" "$width" "$height" "$((width/4))" "$((height/3))"               "$channels" "$out_channels" "$metric" >> relic-vfx-artifact/conversion-report.txt
            count=$((count+1))
          done

          test "$count" -eq 20
          find "$dst" -maxdepth 1 -type f -name '*.webp' | sort > relic-vfx-artifact/runtime-files.txt
          test "$(wc -l < relic-vfx-artifact/runtime-files.txt)" -eq 20

      - name: Commit converted runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vfx/relic
          if git diff --cached --quiet; then
            echo "No runtime asset changes"
          else
            git commit -m "assets: add relic VFX sprite sheets"
            git push origin HEAD:feature/relic-vfx-animation-20260918
          fi

      - name: Upload source and conversion evidence
        uses: actions/upload-artifact@v4
        with:
          name: relic-vfx-source-and-evidence
          path: relic-vfx-artifact
          if-no-files-found: error
          retention-days: 1
