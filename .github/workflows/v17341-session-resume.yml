name: V173.41 Session Resume
# retry 2

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17341-session-resume.yml

permissions:
  contents: write

jobs:
  apply:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 30

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply V173.41 lifecycle fix
        run: python3 .github/scripts/v17341-session-resume.py

      - name: Repair focused test block extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/v173.41-session-resume.test.js')
          s=p.read_text()
          old='''const marker="/* =====================================================\\\\n   V173.41 — MOBILE SESSION RESUME / BACKGROUND SAVE";\nconst start=main.indexOf(marker.replace(/\\\\n/g,"\\n"));\nconst end=main.indexOf("/* =====================================================\\n   基本設定",start);\nassert.ok(start>=0 && end>start,"V173.41 lifecycle block must live in js/00-main.js");\nconst block=main.slice(start,end);'''
          new='''const keyIndex=main.indexOf('const STARTUP_SESSION_READY_KEY="sixiang_startup_session_ready_v1";');\nconst start=main.lastIndexOf("/* =====================================================",keyIndex);\nconst end=main.indexOf("let deleteAllCharactersInProgress",keyIndex);\nassert.ok(keyIndex>=0 && start>=0 && end>keyIndex,"V173.41 lifecycle block must live in js/00-main.js");\nconst block=main.slice(start,end);'''
          if old not in s:
              raise SystemExit('focused extraction anchor not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Focused session-resume regression
        run: node tests/v173.41-session-resume.test.js

      - name: Check CI script syntax
        run: node --check .github/scripts/ci.mjs

      - name: Check all project JavaScript syntax
        run: node .github/scripts/ci.mjs syntax

      - name: Ensure asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run all Node unit and integration suites
        run: node .github/scripts/ci.mjs tests

      - name: Check static local resources
        run: node .github/scripts/ci.mjs resources

      - name: Check duplicate HTML IDs
        run: node .github/scripts/ci.mjs html-ids

      - name: Check release entries and loader integrity
        run: node .github/scripts/ci.mjs loader

      - name: Remove temporary V173.41 tooling
        run: |
          rm -f .github/scripts/v17341-session-resume.py
          rm -f .github/workflows/v17341-session-resume.yml

      - name: Commit validated V173.41
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: resume mobile session without long reload"

      - name: Check final Git diff
        run: |
          CI_BASE_SHA="8b1e91ee3645fa3c50da13f269f5092a3c767013" \
          CI_HEAD_SHA="$(git rev-parse HEAD)" \
          node .github/scripts/ci.mjs git-diff

      - name: Push validated V173.41 to dev
        run: git push origin HEAD:dev
