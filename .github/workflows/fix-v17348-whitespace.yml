name: Fix V173.48 whitespace

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'launch V173.48 whitespace cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove extra EOF blank line
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('css/49-v169-rpg-ui.css')
          s=p.read_text(encoding='utf-8')
          p.write_text(s.rstrip()+"\n",encoding='utf-8')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/49-v169-rpg-ui.css
          git commit -m "fix V173.48 CSS EOF whitespace"
          git push origin HEAD:dev
