name: Deploy dev to Cloudflare Pages

on:
  workflow_call:
    inputs:
      boss_mode:
        type: string
        default: full
      boss_required:
        type: boolean
        default: true
      tower_required:
        type: boolean
        default: true
      abyss_required:
        type: boolean
        default: true
      adventure_required:
        type: boolean
        default: true
      battle_daily_required:
        type: boolean
        default: true
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish_dev:
    name: Publish exact dev candidate
    runs-on: ubuntu-latest
    # QA follows publication in isolated parallel jobs.
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: four-symbols-dev
      DEV_BASE_URL: https://dev.four-symbols-dev.pages.dev
      EXPECTED_BRANCH: dev
      EXPECTED_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Use current Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Confirm this commit is still dev HEAD
        shell: bash
        run: |
          REMOTE_HEAD="$(git ls-remote origin refs/heads/dev | cut -f1)"
          test -n "$REMOTE_HEAD" || { echo "Cannot resolve dev HEAD"; exit 1; }
          if [[ "$REMOTE_HEAD" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "Refusing stale deployment: dev HEAD=$REMOTE_HEAD, workflow SHA=$EXPECTED_COMMIT_SHA"
            exit 1
          fi

      - name: Re-run release gate before packaging
        env:
          CI_BASE_SHA: ""
        run: node .github/scripts/release-gate.mjs ci

      - name: Normalize and verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN_RAW" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID_RAW" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^[Bb]earer[[:space:]]+//; s/^"//; s/"$//')"
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '\r\n[:space:]' | sed -E 's/^"//; s/"$//')"

          test -n "$TOKEN" || { echo "Cloudflare API token became empty after normalization"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "Cloudflare Account ID became empty after normalization"; exit 1; }

          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT_ID"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Prepare immutable static site
        run: node .github/scripts/prepare-static-deployment.mjs

      - name: Ensure Pages project exists
        shell: bash
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch="$EXPECTED_BRANCH" >/tmp/cf-project.log 2>&1 || true
          cat /tmp/cf-project.log

      - name: Deploy exact commit to dev URL
        shell: bash
        working-directory: _deploy
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name="$PROJECT_NAME" \
            --branch="$EXPECTED_BRANCH" \
            --commit-hash="$EXPECTED_COMMIT_SHA" \
            --commit-message="${EXPECTED_COMMIT_SHA::7} verified dev deploy" \
            --commit-dirty=true

      - name: Verify deployed commit, game version and cache version
        env:
          DEPLOY_BASE_URL: ${{ env.DEV_BASE_URL }}
        run: |
          success=0
          for attempt in 1 2 3 4 5 6; do
            if node .github/scripts/release-gate.mjs verify-deployed; then
              success=1
              break
            fi
            sleep 5
          done
          test "$success" = "1" || { echo "Deployed release manifest did not converge to expected SHA/version"; exit 1; }

      - name: Upload final release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.final.json
          if-no-files-found: error
          retention-days: 90


  responsive_live:
    name: responsive_live
    needs: publish_dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEV_BASE_URL: https://dev.four-symbols-dev.pages.dev
      EXPECTED_BRANCH: dev
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      DEPLOY_BASE_URL: https://dev.four-symbols-dev.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact deployed candidate before QA
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"
          node .github/scripts/release-gate.mjs verify-deployed

      - name: Ensure CJK font support for player-text browser QA
        run: |
          if ! fc-list :lang=zh | rg -q .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi

      - name: Verify deployed Responsive Item production runtime
        id: responsive_item_live
        run: |
          node .github/scripts/run-responsive-item-browser-qa.mjs
          node .github/scripts/run-forge-sockets-browser-qa.mjs
          QA_BASE_URL="$DEV_BASE_URL" node .github/scripts/run-foreground-potion-browser-qa.mjs

      - name: Upload deployed Responsive Item evidence
        if: always() && steps.responsive_item_live.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: responsive-item-live-qa-${{ github.sha }}
          path: |
            artifacts/browser-qa/responsive-item/
            artifacts/browser-qa/foreground-*
          if-no-files-found: error
          retention-days: 90

      - name: Require unchanged deployed candidate after QA
        run: |
          node .github/scripts/release-gate.mjs verify-deployed
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"

  battle_daily_live:
    if: ${{ !cancelled() && needs.publish_dev.result == 'success' && (github.event_name == 'workflow_dispatch' || inputs.battle_daily_required) }}
    name: battle_daily_live
    needs: publish_dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEV_BASE_URL: https://dev.four-symbols-dev.pages.dev
      EXPECTED_BRANCH: dev
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      DEPLOY_BASE_URL: https://dev.four-symbols-dev.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact deployed candidate before QA
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"
          node .github/scripts/release-gate.mjs verify-deployed

      - name: Ensure CJK font support for player-text browser QA
        run: |
          if ! fc-list :lang=zh | rg -q .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi

      - name: Run deployed battle layout and VFX live QA
        run: |
          QA_BASE_URL="$DEV_BASE_URL" node .github/scripts/run-battle-target-lifecycle-browser-qa.mjs
          QA_BASE_URL="$DEV_BASE_URL" node .github/scripts/run-hit-evasion-v2-browser-qa.mjs
          node .github/scripts/battle-layer-audio-live-qa.mjs
          DAILY_BALANCE_BASE_URL="$DEV_BASE_URL" node .github/scripts/run-daily-balance-browser-qa.mjs

      - name: Upload battle layout and VFX live QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: battle-layout-vfx-live-qa-${{ github.sha }}
          path: |
            artifacts/browser-qa/battle-layer-audio-live-qa.json
            artifacts/browser-qa/battle-layout-wind-flame-mobile.png
            artifacts/browser-qa/battle-layer-element-box-mobile.png
            artifacts/browser-qa/daily-balance*
            artifacts/browser-qa/battle-target-*
            artifacts/browser-qa/hit-evasion-v2*
          if-no-files-found: error
          retention-days: 90

      - name: Require unchanged deployed candidate after QA
        run: |
          node .github/scripts/release-gate.mjs verify-deployed
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"

  tower_live:
    if: ${{ !cancelled() && needs.publish_dev.result == 'success' && (github.event_name == 'workflow_dispatch' || inputs.tower_required) }}
    name: tower_live
    needs: publish_dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEV_BASE_URL: https://dev.four-symbols-dev.pages.dev
      EXPECTED_BRANCH: dev
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      DEPLOY_BASE_URL: https://dev.four-symbols-dev.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact deployed candidate before QA
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"
          node .github/scripts/release-gate.mjs verify-deployed

      - name: Ensure CJK font support for player-text browser QA
        run: |
          if ! fc-list :lang=zh | rg -q .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi

      - name: Verify deployed Tower MonsterBalance production runtime
        id: tower_balance_live
        run: TOWER_QA_BASE_URL="$DEV_BASE_URL" node .github/scripts/run-tower-challenge-browser-qa.mjs

      - name: Upload deployed Tower balance evidence
        if: always() && steps.tower_balance_live.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: tower-balance-live-qa-${{ github.sha }}
          path: artifacts/browser-qa/tower-challenge*
          if-no-files-found: error
          retention-days: 90

      - name: Require unchanged deployed candidate after QA
        run: |
          node .github/scripts/release-gate.mjs verify-deployed
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"

  abyss_live:
    if: ${{ !cancelled() && needs.publish_dev.result == 'success' && (github.event_name == 'workflow_dispatch' || inputs.abyss_required) }}
    name: abyss_live
    needs: publish_dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEV_BASE_URL: https://dev.four-symbols-dev.pages.dev
      EXPECTED_BRANCH: dev
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      DEPLOY_BASE_URL: https://dev.four-symbols-dev.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact deployed candidate before QA
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"
          node .github/scripts/release-gate.mjs verify-deployed

      - name: Ensure CJK font support for player-text browser QA
        run: |
          if ! fc-list :lang=zh | rg -q .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi

      - name: Verify deployed Abyss MonsterBalance runtime
        id: abyss_balance_live
        run: ABYSS_BALANCE_BASE_URL="$DEV_BASE_URL" ABYSS_MONSTER_BALANCE_QA=1 node .github/scripts/run-abyss-live-browser-qa.mjs

      - name: Upload deployed Abyss balance evidence
        if: always() && steps.abyss_balance_live.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: abyss-balance-live-qa-${{ github.sha }}
          path: artifacts/browser-qa/abyss-balance*
          if-no-files-found: error
          retention-days: 90

      - name: Require unchanged deployed candidate after QA
        run: |
          node .github/scripts/release-gate.mjs verify-deployed
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"

  adventure_live:
    if: ${{ !cancelled() && needs.publish_dev.result == 'success' && (github.event_name == 'workflow_dispatch' || inputs.adventure_required) }}
    name: adventure_live
    needs: publish_dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEV_BASE_URL: https://dev.four-symbols-dev.pages.dev
      EXPECTED_BRANCH: dev
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      DEPLOY_BASE_URL: https://dev.four-symbols-dev.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact deployed candidate before QA
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"
          node .github/scripts/release-gate.mjs verify-deployed

      - name: Ensure CJK font support for player-text browser QA
        run: |
          if ! fc-list :lang=zh | rg -q .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi

      - name: Verify deployed Adventure MonsterBalance runtime
        id: adventure_balance_live
        run: ADVENTURE_BALANCE_BASE_URL="$DEV_BASE_URL" ADVENTURE_MONSTER_BALANCE_QA=1 node .github/scripts/run-adventure-browser-qa.mjs

      - name: Upload deployed Adventure balance evidence
        if: always() && steps.adventure_balance_live.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: adventure-balance-live-qa-${{ github.sha }}
          path: artifacts/browser-qa/adventure-balance*
          if-no-files-found: error
          retention-days: 90

      - name: Require unchanged deployed candidate after QA
        run: |
          node .github/scripts/release-gate.mjs verify-deployed
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"

  boss_live:
    if: ${{ !cancelled() && needs.publish_dev.result == 'success' && (github.event_name == 'workflow_dispatch' || inputs.boss_required) }}
    name: boss_live
    needs: publish_dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOSS_GATE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'full' || inputs.boss_mode }}
      DEV_BASE_URL: https://dev.four-symbols-dev.pages.dev
      EXPECTED_BRANCH: dev
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      DEPLOY_BASE_URL: https://dev.four-symbols-dev.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact deployed candidate before QA
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"
          node .github/scripts/release-gate.mjs verify-deployed

      - name: Ensure CJK font support for player-text browser QA
        run: |
          if ! fc-list :lang=zh | rg -q .; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fi

      - name: Verify deployed Personal and World Boss MonsterBalance runtime
        id: boss_balance_live
        run: BOSS_BALANCE_BASE_URL="$DEV_BASE_URL" BOSS_MONSTER_BALANCE_QA=1 node .github/scripts/battle-layer-audio-live-qa.mjs

      - name: Upload deployed Boss balance evidence
        if: always() && steps.boss_balance_live.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: boss-balance-live-qa-${{ github.sha }}
          path: artifacts/browser-qa/boss-balance*
          if-no-files-found: error
          retention-days: 90


      - name: Require unchanged deployed candidate after QA
        run: |
          node .github/scripts/release-gate.mjs verify-deployed
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"

  deploy:
    name: Deploy dev preview
    if: always()
    needs: [publish_dev, responsive_live, battle_daily_live, tower_live, abyss_live, adventure_live, boss_live]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEV_BASE_URL: https://dev.four-symbols-dev.pages.dev
      EXPECTED_BRANCH: dev
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      DEPLOY_BASE_URL: https://dev.four-symbols-dev.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact deployed candidate before QA
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"
          node .github/scripts/release-gate.mjs verify-deployed
      - name: Require every deployed QA group
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_BOSS_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || inputs.boss_required }}
          CI_TOWER_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || inputs.tower_required }}
          CI_ABYSS_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || inputs.abyss_required }}
          CI_ADVENTURE_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || inputs.adventure_required }}
          CI_BATTLE_DAILY_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || inputs.battle_daily_required }}
        run: node .github/scripts/ci-aggregate.mjs --dev-deployment
      - name: Require unchanged deployed candidate after QA
        run: |
          node .github/scripts/release-gate.mjs verify-deployed
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$EXPECTED_COMMIT_SHA"
      - name: Deployment summary
        run: |
          echo "Branch: dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit SHA: $EXPECTED_COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "All deployed QA groups: PASSED on the same exact SHA" >> "$GITHUB_STEP_SUMMARY"
