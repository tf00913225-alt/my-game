name: V174 Rebuild Cardless Battle Artifacts

on:
  push:
    branches:
      - fix/battle-cardless-motion-ui
    paths:
      - .github/workflows/v174-rebuild-cardless-battle.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: fix/battle-cardless-motion-ui
          fetch-depth: 2
      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild deterministic production assets
        run: |
          node scripts/build-production.mjs
          node scripts/build-production.mjs --check
      - name: Commit generated artifacts to work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A build asset-manifest.json index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Rebuild production assets for cardless battle UI"
          git push origin HEAD:fix/battle-cardless-motion-ui
