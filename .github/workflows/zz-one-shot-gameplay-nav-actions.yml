name: One-shot gameplay nav actions repair

on:
  push:
    branches:
      - fix/gameplay-nav-actions-20260915

permissions:
  contents: write

jobs:
  repair-build-verify:
    if: ${{ !contains(github.event.head_commit.message, '[gameplay-nav-built]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/gameplay-nav-actions-20260915
          fetch-depth: 2
      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply root-cause repair
        run: python3 .github/one-shot-gameplay-nav-actions.py
      - name: Run focused regressions
        run: |
          node --test tests/gameplay-context-nav-actions-20260915.test.js
          node --test tests/shared-nav-owner-regression-20260915.test.js
          node tests/v148-combat-dungeon-fixes.test.js
          node --test tests/v169-rpg-ui.test.js
          node tests/v174-relic-navigation-button-polish.test.js
      - name: Rebuild deterministic production assets
        run: node scripts/build-production.mjs
      - name: Verify synchronized build and whitespace
        run: |
          node scripts/build-production.mjs --check
          git diff --check
      - name: Commit generated repair and remove helper
        run: |
          rm -f .github/one-shot-gameplay-nav-actions.py
          rm -f .github/workflows/zz-one-shot-gameplay-nav-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make gameplay nav actions context-safe [gameplay-nav-built]"
          git push origin HEAD:fix/gameplay-nav-actions-20260915
