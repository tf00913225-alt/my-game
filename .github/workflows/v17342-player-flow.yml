name: V173.42 Player Flow
# retry 2

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17342-player-flow.yml

permissions:
  contents: write

jobs:
  apply:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 40

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Repair duplicate shared-copy matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/v17342-player-flow.py')
          s=p.read_text()
          old='''s=once(s,\n''' + "'''                <small>戰鬥結束後低於門檻時使用補品</small>'''" + ''',\n''' + "'''                <small>低於門檻時自動使用補品</small>'''" + ''',\n"HP shared copy")\ns=once(s,\n''' + "'''                <small>戰鬥結束後低於門檻時使用補品</small>'''" + ''',\n''' + "'''                <small>低於門檻時自動使用補品</small>'''" + ''',\n"SP shared copy")'''
          new='''s=s.replace(\n''' + "'''                <small>戰鬥結束後低於門檻時使用補品</small>'''" + ''',\n''' + "'''                <small>低於門檻時自動使用補品</small>'''" + ''',1)\ns=s.replace(\n''' + "'''                <small>戰鬥結束後低於門檻時使用補品</small>'''" + ''',\n''' + "'''                <small>低於門檻時自動使用補品</small>'''" + ''',1)'''
          if old not in s:
              raise SystemExit('shared-copy matcher block not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Apply V173.42 changes
        run: python3 .github/scripts/v17342-player-flow.py

      - name: Focused V173.42 regression
        run: node tests/v173.42-player-flow.test.js

      - name: Check CI script syntax
        run: node --check .github/scripts/ci.mjs

      - name: Check all JavaScript syntax
        run: node .github/scripts/ci.mjs syntax

      - name: Ensure asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run all Node unit and integration suites
        run: node .github/scripts/ci.mjs tests

      - name: Check static local resources
        run: node .github/scripts/ci.mjs resources

      - name: Check duplicate HTML IDs
        run: node .github/scripts/ci.mjs html-ids

      - name: Check release entries and loader integrity
        run: node .github/scripts/ci.mjs loader

      - name: Remove temporary V173.42 tooling
        run: |
          rm -f .github/scripts/v17342-player-flow.py
          rm -f .github/workflows/v17342-player-flow.yml

      - name: Commit validated V173.42
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: improve player flow element box and rewards"

      - name: Check final Git diff
        run: |
          CI_BASE_SHA="8bd904c3a4949e1dbe4066d34a194f3d4a690cd9" \
          CI_HEAD_SHA="$(git rev-parse HEAD)" \
          node .github/scripts/ci.mjs git-diff

      - name: Push validated V173.42 to dev
        run: git push origin HEAD:dev
