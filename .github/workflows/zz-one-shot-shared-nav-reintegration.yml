name: One-shot shared nav reintegration

on:
  push:
    branches:
      - feature/reintegrate-shared-nav-20260915

permissions:
  contents: write

jobs:
  rebuild-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[shared-nav-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reintegration branch
        uses: actions/checkout@v4
        with:
          ref: feature/reintegrate-shared-nav-20260915
          fetch-depth: 2

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run focused shared navigation regressions
        shell: bash
        run: |
          node --test tests/shared-nav-owner-regression-20260915.test.js
          node --test tests/v141-system-expansion.test.js
          node --test tests/v146-system-polish.test.js
          node tests/v148-combat-dungeon-fixes.test.js
          node tests/gameplay-hub-ui-and-icon.test.js
          node tests/gameplay-ui-regressions-20260908.test.js
          node tests/remaining-ui-regressions-20260914.test.js

      - name: Rebuild deterministic production assets
        run: node scripts/build-production.mjs

      - name: Verify synchronized build and whitespace
        shell: bash
        run: |
          node scripts/build-production.mjs --check
          git diff --check

      - name: Commit generated build and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-one-shot-shared-nav-reintegration.yml
          git add -A
          git commit -m "build: sync shared navigation bundle [shared-nav-built]"
          git push origin HEAD:feature/reintegrate-shared-nav-20260915
