name: Premium Functional UI Responsive Fixture Fix

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-responsive-fixture-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Align static responsive fixture with formal character runtime shell
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('tests/premium-functional-ui-responsive-browser.test.js')
          text=path.read_text()
          old="""#homeFeatureModal{display:flex!important;position:absolute!important;inset:0!important;width:420px!important;height:746.6667px!important}.qa-test-title"""
          new="""#homeFeatureModal{display:flex!important;position:absolute!important;inset:0!important;width:420px!important;height:746.6667px!important}#game-stage #homeFeatureModal .home-feature-modal-box.wide{width:calc(100% - 8px)!important;max-width:none!important;height:calc(100% - 8px)!important;max-height:calc(100% - 8px)!important;min-height:0!important;box-sizing:border-box!important}.qa-test-title"""
          if old not in text:
              raise SystemExit('fixture anchor not found')
          text=text.replace(old,new,1)
          marker='const page=`<!doctype html>'
          comment='// Static screenshot fixtures do not execute js/19; mirror its verified maximum-mobile-shell geometry here.\n    '
          text=text.replace(marker,comment+marker,1)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = "tests/premium-functional-ui-responsive-browser.test.js"
      - name: Save fixture repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/premium-functional-ui-responsive-browser.test.js
          git diff --cached --check
          git commit -m "test: align responsive fixture with character runtime shell"
          git push origin HEAD:feature/premium-functional-ui
