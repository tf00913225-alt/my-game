name: V173.61 recovery

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17361-inspect.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Restore verified V173.61 CSS and remove temporary integration tools
        run: |
          git show f6469b94193fef4a0af748d10901b5a989574956:css/00-main.css > css/00-main.css
          git rm -f .github/scripts/v17361_patch.py
          git rm -f .github/workflows/v17361-inspect.yml

      - name: Verify restored CSS and full Node suite
        run: |
          test "$(wc -c < css/00-main.css)" -gt 100000
          grep -q 'v17361-power-save-toggle' css/00-main.css
          grep -q 'map-return.png' css/00-main.css
          node .github/scripts/ci.mjs tests

      - name: Commit recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/00-main.css .github/scripts/v17361_patch.py .github/workflows/v17361-inspect.yml
          git commit -m "restore verified V173.61 CSS and clean temporary tooling"
          git push origin HEAD:dev
