name: Retry2 V173.58 free-material reforge redesign

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'retry2 V173.58 free-material reforge redesign')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Ensure asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi
      - name: Apply V173.58 redesign and update regressions
        run: |
          python .github/scripts/fix-v17358-patcher.py
          python .github/scripts/apply-v17358-reforge-redesign.py
          python .github/scripts/fix-v17358-tests.py
          python - <<'PY'
          from pathlib import Path
          p=Path('css/38-v141-system-expansion.css')
          p.write_text(p.read_text(encoding='utf-8').rstrip()+"\n",encoding='utf-8')
          PY
      - name: Syntax and full tests
        run: |
          node --check js/20-anonymous-20.js
          node --check js/36-v141-content-systems.js
          node --check js/equipment-progression.js
          node --check js/55-v173.51-inventory-qa.js
          node .github/scripts/ci.mjs tests
          git diff --check
      - name: Commit V173.58
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js css tests
          git commit -m "V173.58 redesign equipment reforging"
          git push origin HEAD:dev
