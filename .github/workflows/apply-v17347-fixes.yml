name: Apply V173.47 runtime integrity fixes

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'launch v173.47 fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old,new,1)

          # 1) System-wide runtime readiness gate. It is installed synchronously
          # by the directly loaded js/20 loader, before DOMContentLoaded can expose
          # interactive legacy pages. Any critical runtime failure keeps the gate up.
          loader_path='js/20-anonymous-20.js'
          loader=read(loader_path)
          gate=r'''/* =====================================================
             V173.47 — CRITICAL RUNTIME READINESS GATE
             The app shell is parsed before late patch owners (V131→V169 and the
             equipment progression runtime) finish loading. On a warm/session resume
             that made old page renderers clickable for a short window. Block every
             user interaction at the document capture phase until the final critical
             runtime explicitly releases this gate. This is global, not shop-specific.
          ===================================================== */
          (function installV17347RuntimeReadinessGate(){
              if(typeof window==="undefined"||window.__v17347RuntimeGateInstalled){ return; }
              window.__v17347RuntimeGateInstalled=true;
              let released=false;
              let failed=false;

              function blockInteraction(event){
                  if(released){ return; }
                  if(event&&typeof event.preventDefault==="function"){ event.preventDefault(); }
                  if(event&&typeof event.stopImmediatePropagation==="function"){ event.stopImmediatePropagation(); }
              }

              document.addEventListener("pointerdown",blockInteraction,true);
              document.addEventListener("click",blockInteraction,true);
              document.addEventListener("keydown",blockInteraction,true);
              document.addEventListener("touchstart",blockInteraction,{capture:true,passive:false});

              function mountGate(){
                  if(released||!document.body||document.getElementById("v17347RuntimeGate")){ return; }
                  const gate=document.createElement("div");
                  gate.id="v17347RuntimeGate";
                  gate.setAttribute("role","status");
                  gate.setAttribute("aria-live","polite");
                  gate.style.cssText="position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#050403;color:#f3d58b;font:700 16px/1.5 system-ui,sans-serif;letter-spacing:.05em;pointer-events:auto";
                  const status=document.createElement("div");
                  status.id="v17347RuntimeGateStatus";
                  status.textContent="正在同步最新遊戲系統…";
                  status.style.cssText="padding:12px 18px;border:1px solid #8c672e;border-radius:10px;background:#171008;box-shadow:0 6px 20px rgba(0,0,0,.45)";
                  gate.appendChild(status);
                  document.body.appendChild(gate);
              }

              window.__v17347RuntimeGateFail=function(message){
                  failed=true;
                  mountGate();
                  const status=document.getElementById("v17347RuntimeGateStatus");
                  if(status){ status.textContent=message||"必要遊戲模組載入失敗，請重新整理。"; }
              };

              window.__v17347RuntimeGateRelease=function(){
                  if(released||failed){ return false; }
                  released=true;
                  document.removeEventListener("pointerdown",blockInteraction,true);
                  document.removeEventListener("click",blockInteraction,true);
                  document.removeEventListener("keydown",blockInteraction,true);
                  document.removeEventListener("touchstart",blockInteraction,true);
                  const gate=document.getElementById("v17347RuntimeGate");
                  if(gate){ gate.remove(); }
                  document.documentElement.dataset.runtimeReady="173.47";
                  document.dispatchEvent(new CustomEvent("v17347:runtime-ready"));
                  return true;
              };

              if(document.body){ mountGate(); }
              else{ document.addEventListener("DOMContentLoaded",mountGate,{once:true}); }
          })();

          '''
          if 'installV17347RuntimeReadinessGate' not in loader:
              loader=gate+loader
          loader=replace_once(loader,'const V_ASSET_VERSION="173.45";','const V_ASSET_VERSION="173.47";','loader cache version')
          runtime_error='''        script.addEventListener("error",function(){\n            script.dataset.failed="1";\n            console.error("版本補丁載入失敗：",runtime.src);\n            next(index+1);\n        },{once:true});'''
          runtime_error_fixed='''        script.addEventListener("error",function(){\n            script.dataset.failed="1";\n            console.error("版本補丁載入失敗：",runtime.src);\n            if(typeof window.__v17347RuntimeGateFail==="function"){\n                window.__v17347RuntimeGateFail("必要遊戲模組載入失敗，請重新整理。");\n            }\n            next(index+1);\n        },{once:true});'''
          loader=replace_once(loader,runtime_error,runtime_error_fixed,'critical runtime error gate')
          write(loader_path,loader)

          # Make the loader itself and all directly-versioned current entry assets fresh.
          index_path='index.html'
          index=read(index_path)
          if '173.45' not in index:
              raise SystemExit('index version: expected current 173.45 references')
          index=index.replace('173.45','173.47')
          write(index_path,index)

          # V169 owns the final shop tabs and then loads equipment progression.
          ui_path='js/51-v169-rpg-ui.js'
          ui=read(ui_path)
          ui=replace_once(ui,'script.src="js/equipment-progression.js?v=173.46";','script.src="js/equipment-progression.js?v=173.47";','equipment progression cache version')
          ui=replace_once(
              ui,
              '''        script.async=false;\n        document.head.appendChild(script);''',
              '''        script.async=false;\n        script.addEventListener("error",function(){\n            if(typeof window.__v17347RuntimeGateFail==="function"){\n                window.__v17347RuntimeGateFail("裝備與商店系統載入失敗，請重新整理。");\n            }\n        },{once:true});\n        document.head.appendChild(script);''',
              'equipment progression load failure gate'
          )
          write(ui_path,ui)

          # 2) Mage weapons are explicit: weapon-01/02 are staffs, weapon-03/04 are fans.
          equipment_path='js/equipment-progression.js'
          equipment=read(equipment_path)
          equipment=replace_once(
              equipment,
              'mage:{shoulder:"法環",head:"法冠",armor:"法袍",shoes:"法履",weapon:"法器"}',
              'mage:{shoulder:"法環",head:"法冠",armor:"法袍",shoes:"法履",weapon:"法杖"}',
              'mage generic weapon suffix'
          )
          old_name='''    function generatedName(rarity,classType,slot,random){\n        const prefixes=NAME_PREFIX[rarity.key];\n        const prefix=prefixes[Math.floor(random()*prefixes.length)%prefixes.length];\n        return prefix+NAME_SUFFIX[classType][slot];\n    }'''
          new_name='''    function mageWeaponSuffix(asset){\n        const source=String(asset||"");\n        return /weapon-(?:03|04)\\.png(?:\\?|$)/i.test(source)?"法扇":"法杖";\n    }\n    function generatedName(rarity,classType,slot,random,asset){\n        const prefixes=NAME_PREFIX[rarity.key];\n        const prefix=prefixes[Math.floor(random()*prefixes.length)%prefixes.length];\n        const suffix=classType==="mage"&&slot==="weapon"\n            ?mageWeaponSuffix(asset)\n            :NAME_SUFFIX[classType][slot];\n        return prefix+suffix;\n    }\n    function normalizeGeneratedMageWeaponName(item){\n        if(!item||!item.v17346GeneratedEquipment||item.classType!=="mage"||item.type!=="weapon"){ return item; }\n        const source=item.assetPath||item.icon||"";\n        const suffix=mageWeaponSuffix(source);\n        if(/法器$/.test(String(item.name||""))){ item.name=String(item.name).replace(/法器$/,suffix); }\n        return item;\n    }'''
          equipment=replace_once(equipment,old_name,new_name,'mage weapon naming helper')
          equipment=replace_once(equipment,'const name=generatedName(rarity,classType,slot,random);','const name=generatedName(rarity,classType,slot,random,asset);','mage weapon generated name call')
          equipment=replace_once(
              equipment,
              '''        if(typeof inventoryItems!=="undefined"&&Array.isArray(inventoryItems)){ inventoryItems.forEach(applySetRule); }\n        if(typeof characterEquipment!=="undefined"&&characterEquipment){\n            Object.values(characterEquipment).forEach(slots=>Object.values(slots||{}).forEach(applySetRule));\n        }''',
              '''        if(typeof inventoryItems!=="undefined"&&Array.isArray(inventoryItems)){\n            inventoryItems.forEach(item=>{ applySetRule(item); normalizeGeneratedMageWeaponName(item); });\n        }\n        if(typeof characterEquipment!=="undefined"&&characterEquipment){\n            Object.values(characterEquipment).forEach(slots=>Object.values(slots||{}).forEach(item=>{\n                applySetRule(item);\n                normalizeGeneratedMageWeaponName(item);\n            }));\n        }''',
              'saved mage weapon name migration'
          )

          # 4) Equipment dungeon is one three-wave gauntlet. Suppress post-battle
          # potion auto-recovery only between waves 1→2 and 2→3; final victory keeps
          # the normal post-battle recovery policy.
          equipment=replace_once(
              equipment,
              '''    let activeReforgeSnapshot=null;\n    let equipmentDungeonRunning=false;\n\n    function escapeHtml''',
              '''    let activeReforgeSnapshot=null;\n    let equipmentDungeonRunning=false;\n    let equipmentDungeonWaveIndex=-1;\n\n    if(typeof applyPostBattleAutoRecovery==="function"){\n        const previousEquipmentPostBattleAutoRecovery=applyPostBattleAutoRecovery;\n        applyPostBattleAutoRecovery=function(){\n            if(equipmentDungeonRunning&&equipmentDungeonWaveIndex>=0&&equipmentDungeonWaveIndex<2){\n                return;\n            }\n            return previousEquipmentPostBattleAutoRecovery.apply(this,arguments);\n        };\n    }\n\n    function escapeHtml''',
              'equipment dungeon interwave recovery guard'
          )
          equipment=replace_once(
              equipment,
              '''        const launch=index=>{\n            const started=window.v132LaunchDungeonBattle(waves[index],function(outcome){''',
              '''        const launch=index=>{\n            equipmentDungeonWaveIndex=index;\n            const started=window.v132LaunchDungeonBattle(waves[index],function(outcome){''',
              'equipment dungeon wave index start'
          )
          equipment=replace_once(
              equipment,
              '''                if(!win){ equipmentDungeonRunning=false; if(typeof showPage==="function"){ showPage("dungeon"); } if(typeof switchDungeonTab==="function"){ switchDungeonTab("daily"); } return; }''',
              '''                if(!win){ equipmentDungeonRunning=false; equipmentDungeonWaveIndex=-1; if(typeof showPage==="function"){ showPage("dungeon"); } if(typeof switchDungeonTab==="function"){ switchDungeonTab("daily"); } return; }''',
              'equipment dungeon lose clear wave index'
          )
          equipment=replace_once(
              equipment,
              '''                equipmentDungeonRunning=false;\n                showEquipmentReward();''',
              '''                equipmentDungeonRunning=false;\n                equipmentDungeonWaveIndex=-1;\n                showEquipmentReward();''',
              'equipment dungeon final clear wave index'
          )
          equipment=replace_once(
              equipment,
              '''            if(started===false){ equipmentDungeonRunning=false; }''',
              '''            if(started===false){ equipmentDungeonRunning=false; equipmentDungeonWaveIndex=-1; }''',
              'equipment dungeon launch failure clear wave index'
          )

          # The equipment module is the final critical page/system owner. Releasing
          # here guarantees the user cannot click any legacy page during cold/warm load.
          closing='''    if(typeof saveGame==="function"){ try{ saveGame(); }catch(_){ } }\n})();'''
          closing_fixed='''    if(typeof saveGame==="function"){ try{ saveGame(); }catch(_){ } }\n\n    if(typeof window.__v17347RuntimeGateRelease==="function"){\n        window.__v17347RuntimeGateRelease();\n    }\n})();'''
          equipment=replace_once(equipment,closing,closing_fixed,'runtime readiness gate release')
          write(equipment_path,equipment)

          # 3) Fire Rocket: the official sprite used to suppress the legacy fallback
          # even while its image was still decoding. On cold/slow loads that produced
          # a complete cast with no visible VFX. Decide the renderer at cast start:
          # if the sheet is not ready, omit it for this cast so legacy arrows render.
          anim_path='js/39-v143-skill-animation.js'
          anim=read(anim_path)
          anim=replace_once(
              anim,
              '''        const known=MANIFEST[config.id];\n        if(known){ return Object.assign({signature:config.id},known); }''',
              '''        const known=MANIFEST[config.id];\n        if(known){\n            const model=Object.assign({signature:config.id},known);\n            if(config.id==="fireRocket"&&model.sprite){\n                const record=getSpriteImage(model.sprite.src);\n                if(!record||record.failed||!record.ready){ model.sprite=null; }\n            }\n            return model;\n        }''',
              'fire rocket cold-load animation fallback'
          )
          write(anim_path,anim)

          # Advance current-version assertions and equipment runtime cache assertions.
          for test_path in Path('tests').glob('*.js'):
              text=read(test_path)
              updated=(text
                  .replace('173\\.45','173\\.47')
                  .replace('173.45','173.47')
                  .replace('equipment-progression\\.js\\?v=173\\.46','equipment-progression\\.js\\?v=173\\.47')
                  .replace('equipment-progression.js?v=173.46','equipment-progression.js?v=173.47'))
              if updated!=text:
                  write(test_path,updated)

          regression=Path('tests/v173.47-runtime-integrity.test.js')
          regression.write_text(r'''const fs=require("node:fs");
          const assert=require("node:assert/strict");

          const loader=fs.readFileSync("js/20-anonymous-20.js","utf8");
          const index=fs.readFileSync("index.html","utf8");
          const ui=fs.readFileSync("js/51-v169-rpg-ui.js","utf8");
          const equipment=fs.readFileSync("js/equipment-progression.js","utf8");
          const animation=fs.readFileSync("js/39-v143-skill-animation.js","utf8");

          assert.ok(loader.indexOf("installV17347RuntimeReadinessGate")<loader.indexOf('const V_ASSET_VERSION="173.47"'),"readiness gate must install before late loaders can expose legacy UI");
          assert.match(loader,/__v17347RuntimeGateFail/);
          assert.match(loader,/stopImmediatePropagation/);
          assert.match(index,/js\/20-anonymous-20\.js\?v=173\.47/);
          assert.match(ui,/equipment-progression\.js\?v=173\.47/);
          assert.match(equipment,/__v17347RuntimeGateRelease/);

          assert.match(equipment,/weapon-\(\?:03\|04\).*?"法扇":"法杖"/s);
          assert.match(equipment,/normalizeGeneratedMageWeaponName/);
          assert.doesNotMatch(equipment,/mage:\{shoulder:"法環",head:"法冠",armor:"法袍",shoes:"法履",weapon:"法器"\}/);

          assert.match(animation,/config\.id==="fireRocket"&&model\.sprite/);
          assert.match(animation,/record\.failed\|\|!record\.ready/);
          assert.match(animation,/model\.sprite=null/);

          assert.match(equipment,/equipmentDungeonWaveIndex<2/);
          assert.match(equipment,/previousEquipmentPostBattleAutoRecovery/);
          assert.match(equipment,/equipmentDungeonWaveIndex=index/);

          console.log("V173.47 runtime integrity regressions passed");
          ''',encoding='utf-8')
          PY

      - name: Validate targeted changes
        run: |
          node --check js/20-anonymous-20.js
          node --check js/51-v169-rpg-ui.js
          node --check js/equipment-progression.js
          node --check js/39-v143-skill-animation.js
          node tests/v173.47-runtime-integrity.test.js

      - name: Commit fixes to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/20-anonymous-20.js js/51-v169-rpg-ui.js js/equipment-progression.js js/39-v143-skill-animation.js tests
          git commit -m "fix runtime readiness, mage fan naming, fire rocket vfx, dungeon recovery"
          git push origin HEAD:dev
