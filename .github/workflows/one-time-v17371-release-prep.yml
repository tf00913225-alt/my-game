name: One-time V173.71 release prep

on:
  push:
    branches:
      - release/v17371-prep-20260922

permissions:
  contents: write

concurrency:
  group: one-time-v17371-release-prep
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v17371-prep-20260922

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare V173.71 release source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/update-release.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const OLD="173.70";
          const NEXT="173.71";
          const read=p=>fs.readFileSync(p,"utf8");
          const write=(p,c)=>fs.writeFileSync(p,c.endsWith("\n")?c:c+"\n");
          const readJson=p=>JSON.parse(read(p));
          const writeJson=(p,v)=>write(p,JSON.stringify(v,null,2));

          const release=readJson("release/release.json");
          release.version=NEXT;
          release.cacheVersion=NEXT;
          release.status="READY";
          writeJson("release/release.json",release);

          const requirements=readJson("release/requirements.json");
          requirements.releaseVersion=NEXT;
          writeJson("release/requirements.json",requirements);

          writeJson("release/release-update.json",{
            schemaVersion:1,
            publicNotice:true,
            releaseVersion:"V"+NEXT,
            noticeId:"release-v17371-20260922",
            title:"V173.71 戰鬥狀態與操作體驗更新",
            summary:"強化戰鬥狀態閱讀、手動操作流暢度與巡怪外觀顯示，並調整暈眩命中機制。",
            content:[
              "戰鬥狀態圖示與角色身上的狀態圖重新整理：可點擊敵我角色查看增益、負面狀態與剩餘回合，多個身體狀態改為每 2 秒輪播一次，護盾等狀態圖也放大顯示。",
              "戰鬥資訊與戰鬥數據介面提高閱讀優先權，手動回合倒數與選目標流程重新排版，並減少密集戰鬥中不必要的常駐動畫與重複畫面更新。",
              "淨心訣、焚血訣、炎魂共鳴加入正式技能圖示與 4×3 技能特效；暈眩也改用新版單張狀態圖。",
              "暈眩猛擊與風起雲湧的暈眩效果改為降低最終命中率 15／20／25／30／35 個百分點，最低命中率保留 1%。",
              "巡怪角色會正確跟隨玩家選擇的性別與元素外觀，不再出現橫向旋轉；遊戲介面的瀏覽器捲動條也改為隱藏但保留正常滑動。"
            ],
            publishedAt:"2026-09-22T15:50:00.000Z",
            updateMode:"normal",
            minimumVersion:null
          });

          let index=read("index.html");
          index=index.replaceAll("V"+OLD,"V"+NEXT);
          write("index.html",index);

          let loader=read("js/20-anonymous-20.js");
          const oldMarker='const V_ASSET_VERSION="'+OLD+'";';
          const newMarker='const V_ASSET_VERSION="'+NEXT+'";';
          if(!loader.includes(oldMarker)) throw new Error("loader version marker missing");
          loader=loader.replace(oldMarker,newMarker);
          write("js/20-anonymous-20.js",loader);

          const changelogEntry=`## V173.71 — 2026-09-22

          本版本聚焦戰鬥狀態資訊、手動戰鬥操作流暢度、暈眩命中規則、巡怪角色顯示與介面清爽度；不調整 EXP、金幣、掉落、存檔格式或帳號資料。

          ### 戰鬥狀態／資訊
          - 狀態 Icon 固定顯示於資源條上方，Idle 點擊敵我角色可查看元素、HP／SP、增益、負面狀態與剩餘回合。
          - 多個 Body 狀態改為每 2 秒依序輪播一次；呼吸效果同樣改為 2 秒週期且最高透明度維持 100%。護盾、結界、冰封、石化等身體狀態圖放大，可自然觸及卡牌邊緣。
          - 暈眩正式使用新版單張狀態圖；具有 Body 狀態圖的狀態不再於 HUD 重複顯示同一 Icon，詳細資訊仍保留 Icon。
          - 「戰鬥資訊」與「戰鬥數據」閱讀層不再被技能 VFX 或傷害浮字遮住；底部戰鬥資訊收合狀態移除多餘黑底／陰影並統一細邊框。
          - 手動回合倒數移到操作面板上方，技能／物品／選目標期間降至 25% 透明且不攔截點擊。
          - 移除密集戰鬥中不必要的永久立繪合成動畫與多目標選取重複更新，降低快速操作時的卡頓。

          ### 技能視覺／暈眩規則
          - 淨心訣、焚血訣、炎魂共鳴加入正式技能 Icon 與 4×3 技能 VFX。
          - 暈眩猛擊／風起雲湧的暈眩效果改為「最終命中率降低 15／20／25／30／35 個百分點」，並在最終公式保留 1% 最低命中率；技能描述與戰鬥說明同步更新。

          ### 巡怪／介面
          - 巡怪地圖角色外觀改由正式玩家性別／元素外觀 Owner 控制，返回與戰鬥轉場不再被舊流程替換，也不再出現 90° 橫向旋轉。
          - 遊戲內瀏覽器垂直／水平捲動條改為隱藏，但既有單指滑動與捲動功能維持不變。
          - 戰鬥畫面 renderBattle 後段處理收斂為單一正式 Owner，降低重複流程造成的顯示與維護風險，不改戰鬥數值。

          ### 對應 Requirement Batches
          - \`2026-09-22-battle-status-info-assets\`
          - \`2026-09-22-battle-status-carousel-drawers-vfx-followup\`
          - \`2026-09-22-battle-enemy-status-performance-info-drawer-followup\`
          - \`2026-09-22-battle-status-size-breath-drawer-cleanup\`
          - \`2026-09-22-v17371-main-release\`

          `;
          let changelog=read("CHANGELOG.md");
          const header="# 四象江湖傳版本紀錄\n\n";
          if(!changelog.startsWith(header)) throw new Error("CHANGELOG header mismatch");
          changelog=header+changelogEntry+changelog.slice(header.length);
          write("CHANGELOG.md",changelog);

          function walk(dir){
            const out=[];
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,ent.name);
              if(ent.isDirectory()) out.push(...walk(p));
              else if(ent.isFile()&&p.endsWith(".js")) out.push(p);
            }
            return out;
          }
          const touched=[];
          for(const p of walk("tests")){
            const before=read(p);
            let after=before.replaceAll(OLD,NEXT).replaceAll("173\\\\.70","173\\\\.71");
            if(after!==before){
              write(p,after);
              touched.push(p);
            }
          }
          console.log("Updated current-release test markers:",touched);

          const currentBatchPath="release/requirement-batches/2026-09-22-battle-status-size-breath-drawer-cleanup.json";
          const currentBatch=readJson(currentBatchPath);
          currentBatch.status="VERIFIED";
          for(const req of currentBatch.requirements||[]) req.status="VERIFIED";
          currentBatch.verification.repositoryChecks="PASS — dev push CI run 35748958296 Repository checks SUCCESS";
          currentBatch.verification.mobileBrowserQa="PASS — dev deployment job 106818143380 battle layout/VFX live mobile QA";
          currentBatch.verification.devDeployment="PASS — dev@8ca1475943a10a49481be24d7f28176913f06cc2 exact-SHA Cloudflare deployment verified";
          writeJson(currentBatchPath,currentBatch);

          writeJson("release/requirement-batches/2026-09-22-v17371-main-release.json",{
            schemaVersion:1,
            batchId:"2026-09-22-v17371-main-release",
            baseBranch:"dev",
            baseCommit:"8ca1475943a10a49481be24d7f28176913f06cc2",
            currentMain:"0b62be5944ff7a440682bfae28b3ccc43ee2fe91",
            officialVersion:NEXT,
            officialVersionBumpAllowed:true,
            overallStatus:"IMPLEMENTED",
            requirements:[
              {
                id:"REL-01",status:"VERIFIED",
                requirement:"確認 V173.71 來源為最新 dev，並完成 Repository checks、DEV exact-SHA deployment 與戰鬥 live mobile QA；專案負責人已明確指示完成後推進 main。",
                evidence:[
                  "dev@8ca1475943a10a49481be24d7f28176913f06cc2",
                  "CI run 35748958296 SUCCESS",
                  "DEV deploy job 106818143380 SUCCESS",
                  "Cloudflare exact deployed SHA 8ca1475943a10a49481be24d7f28176913f06cc2",
                  "Battle layer/VFX live mobile QA PASS"
                ]
              },
              {
                id:"REL-02",status:"VERIFIED",
                requirement:"依 current main...dev 完整差異盤點本次玩家可感知變更，沒有把純文件、CI 或工程術語直接當玩家公告內容。",
                evidence:[
                  "main@0b62be5944ff7a440682bfae28b3ccc43ee2fe91",
                  "dev@8ca1475943a10a49481be24d7f28176913f06cc2",
                  "compare: dev ahead 141 commits, 86 changed files",
                  "merged player-visible PRs #511 #512 #514 #515 #516 #518 #519",
                  "renderBattle convergence PR #507"
                ]
              },
              {
                id:"REL-03",status:"IMPLEMENTED",
                requirement:"建立 V173.71 Game/Cache Version、玩家公告、CHANGELOG 與 production build，並通過 release gate、完整 CI 與版本同步檢查。",
                evidence:[
                  "release/release.json",
                  "release/release-update.json",
                  "release/requirements.json",
                  "CHANGELOG.md",
                  "js/20-anonymous-20.js",
                  "index.html"
                ]
              },
              {
                id:"REL-04",status:"TODO",
                requirement:"發布準備 PR 合併 dev 後，V173.71 最新 dev HEAD 必須再次通過 Repository checks、DEV exact-SHA deployment、版本核對與 live QA。",
                evidence:[]
              },
              {
                id:"REL-05",status:"TODO",
                requirement:"以 protected dev → main 正式發布 PR 推進 main；main CI、production Pages deployment、production SHA、Game Version、Cache Version 全部驗證成功。",
                evidence:[]
              }
            ],
            includedRequirementBatches:[
              "2026-09-22-battle-status-info-assets",
              "2026-09-22-battle-status-carousel-drawers-vfx-followup",
              "2026-09-22-battle-enemy-status-performance-info-drawer-followup",
              "2026-09-22-battle-status-size-breath-drawer-cleanup"
            ],
            automatedVerification:"Pre-release source dev@8ca1475 passed CI run 35748958296 and exact-SHA dev deployment with battle live QA. Release metadata/build candidate verification is pending.",
            visualVerification:"Project owner authorized promotion after completion; deployed battle live QA passed on dev exact SHA.",
            verifiedSourceCommit:"8ca1475943a10a49481be24d7f28176913f06cc2",
            mergedDevCommit:null,
            mergedMainCommit:null,
            candidateCiRun:null,
            devPushCiRun:35748958296,
            devDeployJob:106818143380
          });
          NODE
          node /tmp/update-release.mjs

      - name: Install existing asset-test dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run build:check
          node .github/scripts/release-gate.mjs ci
          npm test
          git diff --check

      - name: Commit release candidate source and build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             release/release.json             release/requirements.json             release/release-update.json             release/requirement-batches/2026-09-22-battle-status-size-breath-drawer-cleanup.json             release/requirement-batches/2026-09-22-v17371-main-release.json             CHANGELOG.md             index.html             js/20-anonymous-20.js             tests             asset-manifest.json             build
          if git diff --cached --quiet; then
            echo 'No V173.71 release changes to commit.'
            exit 0
          fi
          git commit -m 'release: prepare V173.71 metadata and player notice'
          git push origin HEAD:release/v17371-prep-20260922
