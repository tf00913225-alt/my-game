name: Fixed Slot Phase 4 Build Output Diagnose

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916
    paths:
      - .github/workflows/fixed-slot-phase4-typography-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the exact final Phase 4 patch in the disposable runner
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          workflow=Path('.github/workflows/fixed-slot-phase4-integrate4.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PYCODE'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PYCODE\n",start)
          body=workflow[start:end]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body,'phase4-final-generated-build-patch','exec'))
          PYCODE
      - name: Regenerate production output and capture changed files
        run: |
          mkdir -p diagnostics
          set +e
          node scripts/build-production.mjs > diagnostics/build-regenerate-output.txt 2>&1
          build_status=$?
          node scripts/build-production.mjs --check >> diagnostics/build-regenerate-output.txt 2>&1
          check_status=$?
          set -e
          {
            printf '\nBUILD_STATUS=%s\nCHECK_STATUS=%s\n\nGIT_STATUS\n' "$build_status" "$check_status"
            git status --short
            printf '\nDIFF_CHECK\n'
            git diff --check || true
          } >> diagnostics/build-regenerate-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-build-regenerate-output
          path: diagnostics/build-regenerate-output.txt
          if-no-files-found: error
