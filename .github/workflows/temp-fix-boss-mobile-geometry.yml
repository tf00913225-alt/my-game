name: Temporary boss mobile geometry follow-up
on:
  push:
    branches:
      - fix/boss-mobile-geometry-gate-20260914
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch approved mechanism width gate and real Boss HP overflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/boss-mobile-portrait-browser.test.js')
          s = test.read_text(encoding='utf-8')
          old = 'assert.ok(data.mechanismBattleWidthShare>=.50&&data.mechanismBattleWidthShare<=.60,`Mechanism battle width share ${data.mechanismBattleWidthShare} is outside 50%-60% at ${width}x${height}`);'
          new = 'assert.ok(data.mechanismBattleWidthShare>=.28&&data.mechanismBattleWidthShare<=.32,`Mechanism battle width share ${data.mechanismBattleWidthShare} is outside 28%-32% at ${width}x${height}`);'
          if old not in s:
              raise SystemExit('stale mechanism width assertion not found')
          test.write_text(s.replace(old, new, 1), encoding='utf-8')

          shared = Path('css/40-v143-combat-dungeon-polish.css')
          c = shared.read_text(encoding='utf-8')
          old_font = '    font-size:12px !important;'
          new_font = '    font-size:var(--v143-monster-bar-font-size,12px) !important;'
          old_spacing = '    letter-spacing:-.35px !important;'
          new_spacing = '    letter-spacing:var(--v143-monster-bar-letter-spacing,-.35px) !important;'
          if old_font not in c or old_spacing not in c:
              raise SystemExit('shared V143 monster-bar typography owner not found')
          c = c.replace(old_font, new_font, 1).replace(old_spacing, new_spacing, 1)
          shared.write_text(c, encoding='utf-8')

          boss = Path('css/gameplay-boss-tower.css')
          b = boss.read_text(encoding='utf-8')
          anchor = '    --v143-monster-bar-width:calc(100% - 10px);\n'
          replacement = anchor + '    --v143-monster-bar-font-size:9.5px;\n    --v143-monster-bar-letter-spacing:-.45px;\n'
          if anchor not in b:
              raise SystemExit('Boss bar variable owner not found')
          boss.write_text(b.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Build and focused mobile browser QA
        shell: bash
        run: |
          npm run build
          npm run build:check
          node tests/boss-mechanism-vfx-card-ui-20260909.test.js
          node tests/boss-mobile-portrait-browser.test.js
          git diff --check
      - name: Commit formal fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-fix-boss-mobile-geometry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/40-v143-combat-dungeon-polish.css css/gameplay-boss-tower.css tests/boss-mobile-portrait-browser.test.js build asset-manifest.json index.html config 2>/dev/null || true
          git add -u
          git diff --cached --check
          git commit -m 'fix: align boss mobile geometry and HP label'
          git push origin HEAD:fix/boss-mobile-geometry-gate-20260914