name: Fixed Slot Phase 4 Boss Mechanism Integration

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate Boss and mechanism slots at their owners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(text, old, new, label, expected=1):
              count=text.count(old)
              if count!=expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              return text.replace(old,new,expected)

          p=Path('js/gameplay-boss-tower-system.js')
          s=p.read_text(encoding='utf-8')

          active_anchor='''    function activeBoss(){\n        return activeBattleContext&&activeBattleContext.boss&&activeBattleContext.boss.alive!==false?activeBattleContext.boss:null;\n    }\n'''
          active_replacement=active_anchor+'''    const BOSS_REINFORCEMENT_SLOTS=Object.freeze(["ENEMY_F2","ENEMY_F4"]);\n    const MECHANISM_SLOT_PRIORITY=Object.freeze(["MECH_C","MECH_L","MECH_R"]);\n    function battlefieldSlotOwner(){ return window.FourSymbolsBattlefieldSlots||null; }\n    function seedBossBattlefieldSnapshot(){\n        const context=activeBattleContext,boss=activeBoss(),owner=battlefieldSlotOwner();\n        if(!context||!context.summonPlan||!boss||!owner||typeof monsters==="undefined"||!Array.isArray(monsters)){ return null; }\n        const bossIndex=monsters.indexOf(boss);\n        if(bossIndex<0){ return null; }\n        const snapshot=owner.createEnemyFormationSnapshot([bossIndex],{originalFormationType:3});\n        owner.setActiveEnemySnapshot(snapshot);\n        context.bossIndex=bossIndex;\n        context.enemySnapshot=snapshot;\n        return snapshot;\n    }\n    function bossBattlefieldSnapshot(){\n        const context=activeBattleContext,owner=battlefieldSlotOwner();\n        if(!context||!owner){ return null; }\n        return context.enemySnapshot||owner.getActiveEnemySnapshot()||null;\n    }\n    function assignBossReinforcementSlot(monsterIndex,supportIndex){\n        const owner=battlefieldSlotOwner(),snapshot=bossBattlefieldSnapshot();\n        const slot=BOSS_REINFORCEMENT_SLOTS[supportIndex]||null;\n        if(!owner||!snapshot||!slot){ return null; }\n        return owner.assignMonsterToEnemySlot(snapshot,monsterIndex,slot);\n    }\n    function releaseBossBattlefieldSnapshot(){\n        const context=activeBattleContext,owner=battlefieldSlotOwner();\n        if(!context||!owner){ return; }\n        if(context.enemySnapshot&&owner.getActiveEnemySnapshot()===context.enemySnapshot){ owner.clearActiveEnemySnapshot(); }\n        context.enemySnapshot=null;\n    }\n    function mechanismSlotOrder(){\n        const owner=battlefieldSlotOwner();\n        const available=owner&&Array.isArray(owner.mechanismSlots)?owner.mechanismSlots:["MECH_L","MECH_C","MECH_R"];\n        return MECHANISM_SLOT_PRIORITY.filter(slot=>available.includes(slot));\n    }\n    function nextMechanismBattlefieldSlot(){\n        const context=activeBattleContext;if(!context){ return null; }\n        const used=new Set((context.mechanisms||[]).filter(card=>card&&card.hp>0&&!card.destroyed&&card.battlefieldSlot).map(card=>card.battlefieldSlot));\n        return mechanismSlotOrder().find(slot=>!used.has(slot))||null;\n    }\n'''
          s=replace_exact(s,active_anchor,active_replacement,'activeBoss helper anchor')

          cleanup_old='''    function cleanupMechanismPresentation(){\n        const area=document.getElementById("battleMonsterArea");\n'''
          cleanup_new='''    function cleanupMechanismPresentation(){\n        releaseBossBattlefieldSnapshot();\n        const area=document.getElementById("battleMonsterArea");\n'''
          s=replace_exact(s,cleanup_old,cleanup_new,'cleanup snapshot release')

          render_old='''        let slot=document.getElementById("bossMechanismSlot");\n        if(!slot){ slot=document.createElement("div");slot.id="bossMechanismSlot";slot.className="boss-mechanism-slot";slot.setAttribute("aria-label","BOSS 機制卡槽");area.appendChild(slot); }\n        const alive=aliveMechanisms();\n'''
          render_new='''        let slot=document.getElementById("bossMechanismSlot");\n        if(!slot){ slot=document.createElement("div");slot.id="bossMechanismSlot";slot.className="boss-mechanism-slot";slot.setAttribute("aria-label","BOSS 機制卡槽");area.appendChild(slot); }\n        const owner=battlefieldSlotOwner();\n        const mechanismSlots=owner&&Array.isArray(owner.mechanismSlots)?owner.mechanismSlots:["MECH_L","MECH_C","MECH_R"];\n        mechanismSlots.forEach(slotName=>{\n            let position=slot.querySelector('.boss-mechanism-position[data-slot="'+slotName+'"]');\n            if(!position){\n                position=document.createElement("div");\n                position.className="boss-mechanism-position";\n                position.dataset.slot=slotName;\n                slot.appendChild(position);\n            }\n        });\n        const alive=aliveMechanisms();\n'''
          s=replace_exact(s,render_old,render_new,'mechanism three-slot render')

          node_old='''            if(!node){\n                node=document.createElement("button");node.type="button";node.className="boss-mechanism-card";node.dataset.id=card.id;node.dataset.type=card.type;\n                node.onclick=function(){ selectMechanism(card.id); };slot.appendChild(node);\n            }\n            node.classList.toggle("targetable",!!(typeof actionReady!=="undefined"&&actionReady&&typeof pendingAction!=="undefined"&&pendingAction));\n'''
          node_new='''            if(!node){\n                node=document.createElement("button");node.type="button";node.className="boss-mechanism-card";node.dataset.id=card.id;node.dataset.type=card.type;\n                node.onclick=function(){ selectMechanism(card.id); };\n            }\n            const position=card.battlefieldSlot?slot.querySelector('.boss-mechanism-position[data-slot="'+card.battlefieldSlot+'"]'):null;\n            if(position&&node.parentNode!==position){ position.appendChild(node); }\n            else if(!node.parentNode){ slot.appendChild(node); }\n            node.classList.toggle("targetable",!!(typeof actionReady!=="undefined"&&actionReady&&typeof pendingAction!=="undefined"&&pendingAction));\n'''
          s=replace_exact(s,node_old,node_new,'mechanism card stable slot placement')

          spawn_old='''        const maximum=context.maxMechanisms||1;\n        if(aliveMechanisms().length>=maximum){ return null; }\n        const expected=context.expectedPartySize||expectedPartySizeForLevel(boss.level);\n'''
          spawn_new='''        const maximum=Math.min(context.maxMechanisms||1,mechanismSlotOrder().length);\n        if(aliveMechanisms().length>=maximum){ return null; }\n        const battlefieldSlot=nextMechanismBattlefieldSlot();\n        if(!battlefieldSlot){ return null; }\n        const expected=context.expectedPartySize||expectedPartySizeForLevel(boss.level);\n'''
          s=replace_exact(s,spawn_old,spawn_new,'mechanism slot allocation')

          card_old='''            type:definition.type,unitKind:"mechanism",rank:"mechanism",kind:definition.kind,name:definition.name,\n            maxHP:Math.max(1,scaledHp,levelFloor),hp:0,defense:Math.max(0,Math.round(numeric(boss.defense,0)*.4)),\n'''
          card_new='''            type:definition.type,unitKind:"mechanism",rank:"mechanism",kind:definition.kind,name:definition.name,battlefieldSlot:battlefieldSlot,\n            maxHP:Math.max(1,scaledHp,levelFloor),hp:0,defense:Math.max(0,Math.round(numeric(boss.defense,0)*.4)),\n'''
          s=replace_exact(s,card_old,card_new,'mechanism card slot state')

          summon_old='''        guards.forEach(guard=>{\n            const index=monsters.length;\n            monsters.push(guard);\n            currentBattleMonsters.push(index);\n        });\n'''
          summon_new='''        guards.forEach((guard,supportIndex)=>{\n            const index=monsters.length;\n            monsters.push(guard);\n            currentBattleMonsters.push(index);\n            guard.vGameplayBattlefieldSlot=assignBossReinforcementSlot(index,supportIndex);\n        });\n'''
          s=replace_exact(s,summon_old,summon_new,'boss reinforcement reserved slots')

          launch_old='''        battleStarting=false;if(!started){ cleanupMechanismPresentation();activeBattleContext=null; }return !!started;\n'''
          launch_new='''        battleStarting=false;\n        if(!started){ cleanupMechanismPresentation();activeBattleContext=null;return false; }\n        seedBossBattlefieldSnapshot();\n        return true;\n'''
          s=replace_exact(s,launch_old,launch_new,'boss launch snapshot seed',expected=2)
          p.write_text(s,encoding='utf-8')

          p=Path('css/gameplay-boss-tower.css')
          s=p.read_text(encoding='utf-8')
          css_old='''    flex:0 0 auto;\n    align-items:flex-start;\n    justify-content:center;\n    gap:8px;\n    margin:3px auto 0;\n'''
          css_new='''    flex:0 0 auto;\n    grid-template-columns:repeat(3,minmax(0,1fr));\n    align-items:flex-start;\n    justify-content:center;\n    gap:4px;\n    margin:3px auto 0;\n'''
          s=replace_exact(s,css_old,css_new,'mechanism grid owner')
          s=replace_exact(s,'''#game-stage #battleMonsterArea .boss-mechanism-slot.active{\n    display:flex;\n}\n\n''','''#game-stage #battleMonsterArea .boss-mechanism-slot.active{\n    display:grid;\n}\n\n#game-stage #battleMonsterArea .boss-mechanism-position{\n    position:relative;\n    display:flex;\n    min-width:0;\n    min-height:0;\n    align-items:flex-start;\n    justify-content:center;\n    pointer-events:none;\n}\n\n''','mechanism grid active')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/gameplay-boss-tower-system.test.js')
          s=p.read_text(encoding='utf-8')
          s=replace_exact(s,'''const source=fs.readFileSync("js/gameplay-boss-tower-system.js","utf8");\nconst accountSource=fs.readFileSync("js/startup/account-save-repository.js","utf8");\n''','''const source=fs.readFileSync("js/gameplay-boss-tower-system.js","utf8");\nconst accountSource=fs.readFileSync("js/startup/account-save-repository.js","utf8");\nconst battlefieldSource=fs.readFileSync("js/battlefield-slot-owner.js","utf8");\n''','test battlefield source')
          s=replace_exact(s,'''    vm.runInContext(accountSource,context,{filename:"js/startup/account-save-repository.js"});\n    context.FourSymbolsAccountSave.activate(TEST_UID);\n    vm.runInContext(source,context,{filename:"js/gameplay-boss-tower-system.js"});\n''','''    vm.runInContext(accountSource,context,{filename:"js/startup/account-save-repository.js"});\n    context.FourSymbolsAccountSave.activate(TEST_UID);\n    vm.runInContext(battlefieldSource,context,{filename:"js/battlefield-slot-owner.js"});\n    vm.runInContext(source,context,{filename:"js/gameplay-boss-tower-system.js"});\n''','test owner load')
          s=replace_exact(s,'''        assert.equal(context.vGameplayStartBoss("personal","personal-30"),true);\n        const boss=context.monsters[0];\n        assert.equal(context.monsters.length,1,"reinforcements must not exist in the opening roster");\n''','''        assert.equal(context.vGameplayStartBoss("personal","personal-30"),true);\n        const boss=context.monsters[0],slotOwner=context.FourSymbolsBattlefieldSlots;\n        const openingSnapshot=slotOwner.getActiveEnemySnapshot();\n        assert.equal(openingSnapshot.originalFormationType,3,"summoning Boss must reserve the three-unit formation from battle start");\n        assert.equal(slotOwner.getEnemySlotForMonster(openingSnapshot,0),"ENEMY_F3");\n        assert.equal(slotOwner.getAssignedMonsterAtEnemySlot(openingSnapshot,"ENEMY_F2"),null);\n        assert.equal(slotOwner.getAssignedMonsterAtEnemySlot(openingSnapshot,"ENEMY_F4"),null);\n        assert.equal(context.monsters.length,1,"reinforcements must not exist in the opening roster");\n''','boss opening reserved snapshot')
          s=replace_exact(s,'''        assert.equal(context.monsters.length,3);\n        const guards=context.monsters.slice(1);\n        assert.ok(guards.every(unit=>unit.vGameplayBossSummon===true&&unit.rank==="elite"&&unit.element===boss.element));\n''','''        assert.equal(context.monsters.length,3);\n        const guards=context.monsters.slice(1),summonedSnapshot=slotOwner.getActiveEnemySnapshot();\n        assert.equal(slotOwner.getEnemySlotForMonster(summonedSnapshot,0),"ENEMY_F3");\n        assert.equal(slotOwner.getEnemySlotForMonster(summonedSnapshot,1),"ENEMY_F2");\n        assert.equal(slotOwner.getEnemySlotForMonster(summonedSnapshot,2),"ENEMY_F4");\n        assert.deepEqual(guards.map(unit=>unit.vGameplayBattlefieldSlot),["ENEMY_F2","ENEMY_F4"]);\n        guards[0].alive=false;guards[0].hp=0;\n        assert.equal(slotOwner.getAssignedMonsterAtEnemySlot(summonedSnapshot,"ENEMY_F2"),1,"dead reinforcement keeps its assigned slot");\n        assert.equal(slotOwner.getEnemySlotForMonster(summonedSnapshot,0),"ENEMY_F3","Boss must not move after reinforcement death");\n        assert.ok(guards.every(unit=>unit.vGameplayBossSummon===true&&unit.rank==="elite"&&unit.element===boss.element));\n''','boss summoned slot assertions')
          mech_test='''\ntest("Mechanisms use stable independent sidecar slots and never join enemy unit geometry",()=>{\n    const {context}=load();\n    assert.equal(context.vGameplayStartBoss("personal","personal-70"),true);\n    const first=context.GameplaySystem.debugSpawnMechanism("shield","slot-test-a");\n    const second=context.GameplaySystem.debugSpawnMechanism("charge","slot-test-b");\n    assert.ok(first&&second);\n    assert.deepEqual([first.battlefieldSlot,second.battlefieldSlot],["MECH_C","MECH_L"]);\n    assert.equal(new Set([first.battlefieldSlot,second.battlefieldSlot]).size,2);\n    const owner=context.FourSymbolsBattlefieldSlots;\n    assert.deepEqual(value(context,"FourSymbolsBattlefieldSlots.mechanismSlots"),["MECH_L","MECH_C","MECH_R"]);\n    assert.ok([first.battlefieldSlot,second.battlefieldSlot].every(slot=>!owner.enemySlots.includes(slot)));\n    assert.equal(context.currentBattleMonsters.length,1,"mechanism cards must stay outside currentBattleMonsters");\n    const snapshot=owner.getActiveEnemySnapshot();\n    assert.equal(owner.getEnemySlotForMonster(snapshot,0),"ENEMY_F3");\n});\n\n'''
          anchor='''test("AoE destroys the shield but cannot retarget the Boss until the next formal action",()=>{\n'''
          s=replace_exact(s,anchor,mech_test+anchor,'mechanism independent slot test')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/fixed-battlefield-slots.test.js')
          s=p.read_text(encoding='utf-8')
          anchor='''const expectedLayouts={\n'''
          extra='''assert.deepEqual(slots.mechanismSlots,["MECH_L","MECH_C","MECH_R"],"mechanism realm exposes exactly three independent slots");\nassert.ok(slots.mechanismSlots.every(slot=>!slots.enemySlots.includes(slot)&&!slots.allySlots.includes(slot)),"mechanism slots never overlap unit geometry");\n\n'''
          s=replace_exact(s,anchor,extra+anchor,'fixed-slot mechanism realm assertions')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/boss-mechanism-vfx-card-ui-20260909.test.js')
          s=p.read_text(encoding='utf-8')
          s=replace_exact(s,'''assert.match(boss,/\\.boss-mechanism-slot\\.active\\{\\s*display:flex;/);\n''','''assert.match(boss,/\\.boss-mechanism-slot\\.active\\{\\s*display:grid;/);\nassert.match(boss,/\\.boss-mechanism-position\\{[\\s\\S]*?display:flex;[\\s\\S]*?justify-content:center;/);\n''','mechanism CSS regression expectation')
          s=replace_exact(s,'''assert.match(renderBlock,/node\\.onclick=function\\(\\)\\{ selectMechanism\\(card\\.id\\); \\};/);\n''','''assert.match(renderBlock,/node\\.onclick=function\\(\\)\\{ selectMechanism\\(card\\.id\\); \\};/);\nassert.match(renderBlock,/position\\.className="boss-mechanism-position"/);\nassert.match(renderBlock,/position\\.dataset\\.slot=slotName/);\nassert.match(renderBlock,/card\\.battlefieldSlot/);\n''','mechanism runtime regression expectation')
          p.write_text(s,encoding='utf-8')

          p=Path('release/requirement-batches/2026-09-16-fixed-slot-battlefield-v1.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          for item in data['requirements']:
              if item['id']=='SLOT-BOSS-01':
                  item['status']='IMPLEMENTED'
                  if 'tests/gameplay-boss-tower-system.test.js' not in item['evidence']: item['evidence'].append('tests/gameplay-boss-tower-system.test.js')
              if item['id']=='SLOT-MECH-01':
                  item['status']='IMPLEMENTED'
                  for evidence in ['css/gameplay-boss-tower.css','tests/gameplay-boss-tower-system.test.js','tests/boss-mechanism-vfx-card-ui-20260909.test.js']:
                      if evidence not in item['evidence']: item['evidence'].append(evidence)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify fixed Boss and mechanism slots
        run: |
          node --check js/gameplay-boss-tower-system.js
          node tests/fixed-battlefield-slots.test.js
          node tests/gameplay-boss-tower-system.test.js
          node tests/boss-mechanism-vfx-card-ui-20260909.test.js
          node tests/gameplay-hub-ui-and-icon.test.js
          node tests/ui-typography-battle-preservation.test.js
          node scripts/build-production.mjs --check
          git diff --check
      - name: Save owner integration and remove temporary audits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fixed-slot-phase4-boss-mechanism.yml
          rm -f .github/workflows/fixed-slot-runtime-skill-authority-audit.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: bind boss and mechanism slots to battlefield owner"
          git push origin HEAD:feature/fixed-slot-battlefield-v1-20260916
