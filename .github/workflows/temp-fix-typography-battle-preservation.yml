name: Temporary typography battle preservation guard update
on:
  push:
    branches:
      - fix/typography-battle-preservation-approved-layout-20260914
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch fixed preservation baselines
        shell: bash
        run: |
          for sha in \
            39767ce2b9dbfa59650b7c5fd4d52a57a2642ea5 \
            4a592dd4c41d7efb1a4849fbfe0cbf68598121bf \
            29b9668057846164a941fbf6617d2458d9af5476; do
            git fetch --no-tags --depth=1 origin "$sha"
          done
      - name: Align only approved Gameplay layout normalization and Boss geometry assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/ui-typography-battle-preservation.test.js')
          s=p.read_text(encoding='utf-8')

          old_comment=r'''        .replace(/\/\* Gameplay activity covers use the same 16:9 production ratio as dungeon\n   covers\. Combat BOSS\/mechanism cards remain independent 9:16 components\. \*\/\n/,"")'''
          new_comment=r'''        .replace(/\/\* Gameplay activity covers use the same 16:9 production ratio as dungeon\n   covers\. Combat BOSS\/mechanism cards remain independent (?:9:16|battlefield) components\. \*\/\n/,"")'''
          if old_comment not in s:
              raise SystemExit('cover-comment normalization anchor not found')
          s=s.replace(old_comment,new_comment,1)

          old_normal=r'''    assert.match(now,/#battleMonsterArea\.gameplay-boss-active\{[\s\S]*?--gameplay-boss-card-width:clamp\(118px,29%,132px\);[\s\S]*?--gameplay-mechanism-card-width:clamp\(222px,58%,252px\);[\s\S]*?margin-top:-16px;/);'''
          new_normal=r'''    assert.match(now,/#battleMonsterArea\.gameplay-boss-active\{[\s\S]*?--gameplay-boss-card-width:clamp\(118px,29%,132px\);[\s\S]*?--gameplay-mechanism-card-width:clamp\(123px,30%,138px\);[\s\S]*?margin-top:-16px;/);'''
          if old_normal not in s:
              raise SystemExit('normal Boss geometry assertion anchor not found')
          s=s.replace(old_normal,new_normal,1)

          old_short=r'''    assert.match(now,/@media \(max-height:920px\)\{[\s\S]*?--gameplay-boss-card-width:clamp\(138px,34%,150px\);[\s\S]*?--gameplay-mechanism-card-width:clamp\(78px,19\.5%,88px\);/);'''
          new_short=r'''    assert.match(now,/@media \(max-height:920px\)\{[\s\S]*?--gameplay-boss-card-width:clamp\(108px,27%,122px\);[\s\S]*?--gameplay-mechanism-card-width:clamp\(117px,29\.25%,132px\);/);'''
          if old_short not in s:
              raise SystemExit('short-screen Boss geometry assertion anchor not found')
          s=s.replace(old_short,new_short,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Run focused preservation guard
        shell: bash
        run: |
          node tests/ui-typography-battle-preservation.test.js
          git diff --check
      - name: Commit test-only correction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-fix-typography-battle-preservation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/ui-typography-battle-preservation.test.js
          git add -u
          git diff --cached --check
          git commit -m 'test: align battle preservation guard with approved layout'
          git push origin HEAD:fix/typography-battle-preservation-approved-layout-20260914