name: Relic VFX premium build sync

on:
  push:
    branches:
      - fix/relic-vfx-premium-duration-20260919
    paths:
      - .github/workflows/relic-vfx-premium-build-sync.yml

permissions:
  contents: write

jobs:
  build-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relic-vfx-premium-duration-20260919
          fetch-depth: 0
      - run: npm run build
      - run: |
          node tests/relic-vfx-animation-20260918.test.js
          node tests/v174-team-relic-system.test.js
          node tests/v174-team-relic-hardening.test.js
          node tests/v142-skill-animation.test.js
          node tests/battle-layout-vfx-runtime-20260917.test.js
          npm run build:check
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build asset-manifest.json index.html config
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: resync relic VFX premium durations"
          git push origin HEAD:fix/relic-vfx-premium-duration-20260919
