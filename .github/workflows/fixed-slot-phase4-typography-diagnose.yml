name: Fixed Slot Phase 4 Typography Diagnose

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916
    paths:
      - .github/workflows/fixed-slot-phase4-typography-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply corrected Boss and mechanism owner patch only
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          workflow=Path('.github/workflows/fixed-slot-phase4-boss-mechanism.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY\n",start)
          body=workflow[start:end]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          replacements={
            'guards.map(unit=>unit.vGameplayBattlefieldSlot)':'Array.from(guards,unit=>unit.vGameplayBattlefieldSlot)',
            'return owner.assignMonsterToEnemySlot(snapshot,monsterIndex,slot);':'return owner.assignMonsterToEnemySlot(snapshot,monsterIndex,slot)?slot:null;'
          }
          for old,new in replacements.items():
              count=body.count(old)
              if count!=1:
                  raise SystemExit(f'expected one staged expression {old!r}, found {count}')
              body=body.replace(old,new,1)
          exec(compile(body,'phase4-owner-only-diagnostic-patch','exec'))
          PYCODE
      - name: Capture original typography guard output
        run: |
          mkdir -p diagnostics
          set +e
          node tests/ui-typography-battle-preservation.test.js > diagnostics/typography-output.txt 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> diagnostics/typography-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-typography-output-full-history
          path: diagnostics/typography-output.txt
          if-no-files-found: error
