name: V173.39 VFX Footprint Repair

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/v17339-vfx-footprint-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply VFX geometry repair
        run: python3 .github/scripts/v17339-vfx-footprint-repair.py apply

      - name: Route fixed formation before generic battlefield
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("js/39-v143-skill-animation.js")
          text=path.read_text()
          old='            if(!sprite.targetBounds){\n                const bounds=sideAreaBounds(current.targetSide);'
          new='            if(!sprite.targetBounds&&!sprite.fixedFormation){\n                const bounds=sideAreaBounds(current.targetSide);'
          if text.count(old)!=1:
              raise SystemExit("generic battlefield branch mismatch")
          path.write_text(text.replace(old,new,1))
          PY

      - name: Update legacy Ice Arrow Rain expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path("tests/v166-water-vfx.test.js")
          text=path.read_text()
          first=re.compile(r'test\("Ice Arrow Rain uses one living-target bounding box",\(\)=>\{.*?\n\}\);\n\n(?=test\("enemy Ice Arrow Rain)',re.S)
          replacement=r'''test("Ice Arrow Rain keeps one fixed full-enemy-formation footprint",()=>{
              const results=[];
              [[1],[0,1,2]].forEach(indexes=>{
                  const monsters=[0,1,2].map(index=>({
                      alive:indexes.includes(index),hp:indexes.includes(index)?100:0,
                      statusEffects:[],activeBuffs:[]
                  }));
                  const runtime=loadRuntime({monsters,targetIndexes:indexes});
                  runtime.context.v142SkillAnimationDirector.play(
                      castConfig("iceArrowRain","all"),
                      {side:"player",actorIndex:0}
                  );
                  const {sprites}=stageSprites(runtime);
                  assert.equal(sprites.length,1,indexes.join(","));
                  const sprite=sprites[0];
                  assert.equal(sprite.dataset.targetSide,"monster");
                  assert.equal(sprite.dataset.placement,"battlefield");
                  assert.equal(sprite.dataset.areaId,"battleMonsterArea");
                  assert.equal(sprite.dataset.fixedFormation,"true");
                  assert.equal(sprite.dataset.targetIndexes,indexes.join(","));
                  assert.equal(sprite.style.left,"480px");
                  assert.equal(sprite.style.top,"170px");
                  assert.equal(sprite.style.clipPath||sprite.style["clip-path"],"none");
                  assert.equal(sprite.querySelectorAll(".v166-water-battlefield-tile").length,0);
                  results.push([sprite.style.left,sprite.style.top,sprite.style.width,sprite.style.height]);
              });
              assert.deepEqual(results[0],["480px","170px","537px","317px"]);
              assert.deepEqual(results[1],results[0]);
          });

'''
          match=first.search(text)
          if not match:
              raise SystemExit("legacy player Ice Arrow Rain test not found")
          text=text[:match.start()]+replacement+text[match.end():]
          second=re.compile(r'test\("enemy Ice Arrow Rain uses living player cards only",\(\)=>\{.*?\n\}\);\n\n(?=test\("enemy Tidal Beast)',re.S)
          replacement2=r'''test("enemy Ice Arrow Rain stays centered on the complete player formation",()=>{
              const runtime=loadRuntime();
              runtime.context.v142SkillAnimationDirector.play(
                  castConfig("iceArrowRain","all"),{side:"monster",actorIndex:0}
              );
              const {sprites}=stageSprites(runtime);
              assert.equal(sprites.length,1);
              assert.equal(sprites[0].dataset.targetSide,"player");
              assert.equal(sprites[0].dataset.areaId,"battlePlayerRow");
              assert.equal(sprites[0].dataset.fixedFormation,"true");
              assert.equal(sprites[0].dataset.targetIndexes,"0,1,2");
              assert.equal(sprites[0].style.left,"240px");
              assert.equal(sprites[0].style.top,"420px");
              assert.equal(sprites[0].style.width,"537px");
              assert.equal(sprites[0].style.height,"195px");
              assert.equal(sprites[0].style.clipPath||sprites[0].style["clip-path"],"none");
              assert.equal(sprites[0].querySelectorAll(".v166-water-battlefield-tile").length,0);
          });

'''
          match=second.search(text)
          if not match:
              raise SystemExit("legacy enemy Ice Arrow Rain test not found")
          path.write_text(text[:match.start()]+replacement2+text[match.end():])
          PY

      - name: Check animation syntax
        run: node --check js/39-v143-skill-animation.js

      - name: Run focused VFX regressions
        run: |
          node tests/v150-ice-arrow-rain-vfx.test.js
          node tests/v166-water-vfx.test.js
          node tests/v173.23-wind-vfx.test.js
          node tests/v173.39-earth-light-vfx.test.js

      - name: Ensure ImageMagick dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run repository checks
        run: |
          node --check .github/scripts/ci.mjs
          node .github/scripts/ci.mjs syntax
          node .github/scripts/ci.mjs tests
          node .github/scripts/ci.mjs resources
          node .github/scripts/ci.mjs html-ids
          node .github/scripts/ci.mjs loader

      - name: Record repair
        run: python3 .github/scripts/v17339-vfx-footprint-repair.py record

      - name: Remove staging files
        run: |
          rm -f .github/workflows/v17339-vfx-footprint-repair.yml
          rm -f .github/scripts/v17339-vfx-footprint-repair.py

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: stabilize area skill VFX footprints"

      - name: Check final diff rules
        env:
          CI_BASE_SHA: ${{ github.event.before }}
        run: CI_HEAD_SHA="$(git rev-parse HEAD)" node .github/scripts/ci.mjs git-diff

      - name: Push to dev
        run: git push origin HEAD:dev
