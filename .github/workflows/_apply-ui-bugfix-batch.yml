#game-stage #itemModal .v17351-compare-art{display:grid!important;place-items:center!important;width:112px!important;height:112px!important;max-width:100%!important;flex:0 0 112px!important;margin:0 auto 6px!important;overflow:hidden!important;border:1px solid #71532d!important;border-radius:9px!important;background:#0a0806!important}
#game-stage #itemModal .v17351-compare-art.empty{color:#756957!important;font-size:26px!important}
#game-stage #itemModal .v17351-compare-art>.v169-item-art,#game-stage #itemModal .v17351-compare-art .v169-item-art,#game-stage #itemModal .v17351-compare-art>img,#game-stage #itemModal .v17351-compare-art svg{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important}
#game-stage #itemModal .v17351-compare-pane>strong{display:block!important;flex:0 0 auto!important;min-height:34px!important;margin-bottom:4px!important;color:#f3e4c4!important;font-size:14px!important;line-height:1.3!important;overflow-wrap:anywhere!important}
