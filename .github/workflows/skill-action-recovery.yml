name: Skill Action Recovery Build
on:
  push:
    branches:
      - fix/skill-action-dom-presentation-runtime-qa-20260930
    paths:
      - .github/workflows/skill-action-recovery.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-action-dom-presentation-runtime-qa-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply verified local source patch
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/skill-action.patch
          git apply --whitespace=nowarn /tmp/skill-action.patch
      - name: Regenerate production build
        run: npm run build
      - name: Commit recovered source and build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/skill-action-recovery.yml
          git add .github/scripts/run-skill-progression-browser-qa.mjs css/00-main.css js/00-main.js js/41-v146-system-polish.js tests/skill-action-empty-top-regression.test.js tests/skill-inventory-battle-ui-convergence-20260926.test.js index.html asset-manifest.json build
          git commit -m "fix: converge skill action buttons and runtime QA"
          git push origin HEAD:fix/skill-action-dom-presentation-runtime-qa-20260930
