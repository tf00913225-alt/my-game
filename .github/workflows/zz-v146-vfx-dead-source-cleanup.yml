name: V146 VFX dead source cleanup

on:
  push:
    branches:
      - fix/combat-vfx-owner-cleanup-20260909

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove V146 legacy skill VFX source
        run: |
          python - <<'PY'
          from pathlib import Path

          # Retire the last dead CSS renderer block. V143 DOM Sprite Sheets are authoritative.
          p=Path('css/42-v146-system-polish.css')
          s=p.read_text()
          start=s.find('.v143-skill-flight{offset-anchor:50% 50%;transform-origin:50% 50%;}')
          end=s.find('.v146-area-impact{',start)
          if start < 0 or end < 0:
              raise SystemExit('V146 legacy VFX CSS block not found')
          s=s[:start]+'/* Legacy skill-flight / field / hit-impact renderer retired in V174; V143 raster owner only. */\n\n'+s[end:]
          p.write_text(s)

          # Replace the V146 historical visual contract with the final raster-only contract.
          p=Path('tests/v146-system-polish.test.js')
          s=p.read_text()
          start=s.find('test("battle timing, dead-target filtering and named choreography are enforced"')
          end=s.find('\ntest("shop quantity calculates and disables against the live total"',start)
          if start < 0 or end < 0:
              raise SystemExit('V146 historical choreography test block not found')
          block=r'''test("battle timing, dead-target filtering and raster-only choreography are enforced",()=>{
    assert.match(timing,/earliestAt:Math\.max\([\s\S]*boundaryGate\?boundaryGate\.deadline:0/);
    assert.match(animation,/function canReceive\(config,side,index\)/);
    assert.match(animation,/entity\.hp\)>0/);
    assert.match(animation,/dragonSlash:\{[\s\S]*dragon-slash-cast\.png/);
    assert.match(animation,/phoenixCry:\{[\s\S]*phoenix-cry-cast\.png/);
    assert.match(animation,/iceArrowRain:\{[\s\S]*frost-arrow-rain-vfx\.png/);
    assert.match(animation,/fireRocket:\{[\s\S]*fire-rocket-cast\.png/);
    assert.match(animation,/renderer:"dom-sprite"/);
    assert.doesNotMatch(animation,/<svg\b|v146-flight-art|v143-skill-flight|v143-skill-field|v143-hit-impact/);
    assert.doesNotMatch(css,/v146-flight-art|v143-skill-flight|v143-skill-field|v143-hit-impact/);
    assert.match(css,/background:transparent !important/);
    assert.match(css,/\.badge-normal[\s\S]*color:#fff !important/);
    assert.match(css,/@keyframes v146AreaImpact/);
    assert.match(css,/\.v146-status-popup/);
    assert.match(source,/rect\.top\+rect\.height\*\.86/);
    assert.match(source,/setTimeout\(\(\)=>popup\.remove\(\),1300\)/);
    assert.match(css,/animation:v146StatusPopup 1\.25s ease-out both/);
    assert.match(css,/10%,90%\{opacity:1/);
});
'''
          p.write_text(s[:start]+block+s[end:])

          # Battle preservation allows only the explicitly retired V146 renderer block.
          p=Path('tests/ui-typography-battle-preservation.test.js')
          s=p.read_text()
          anchor='''function retireV143EarthShieldSelector(text){
    return normalize(text.replace(
        "#battlePage .v146-defeated .v141-effect,\\n#battlePage .v146-defeated .v143-earth-shield-effect{display:none !important;}",
        "#battlePage .v146-defeated .v141-effect{display:none !important;}"
    ));
}
'''
          if anchor not in s:
              raise SystemExit('battle preservation Earth Shield helper not found')
          helper=anchor+r'''
function retireV146LegacySkillVfx(text){
    const start=text.indexOf(".v143-skill-flight{offset-anchor:50% 50%;transform-origin:50% 50%;}");
    if(start<0){ return normalize(text); }
    const end=text.indexOf(".v146-area-impact{",start);
    assert.ok(end>start,"retired V146 VFX block end missing");
    return normalize(text.slice(0,start)+text.slice(end));
}
'''
          s=s.replace(anchor,helper,1)
          s=s.replace(
              'retireV143EarthShieldSelector(segment(current(file),start,end)),\n        retireV143EarthShieldSelector(segment(at(BASE,file),start,end)),',
              'retireV146LegacySkillVfx(retireV143EarthShieldSelector(segment(current(file),start,end))),\n        retireV146LegacySkillVfx(retireV143EarthShieldSelector(segment(at(BASE,file),start,end))),',
              1
          )
          s=s.replace('outside retired V143 Earth Shield selector','outside retired V143 Earth Shield selector and V146 legacy skill VFX block',1)
          s=s.replace('translateY(12px)','translateY(16px)')
          needle='assert.doesNotMatch(current("css/42-v146-system-polish.css"),/v143-earth-shield-effect/);'
          replacement=needle+'\nassert.doesNotMatch(current("css/42-v146-system-polish.css"),/v143-skill-flight|v143-skill-field|v143-hit-impact|v146-flight-art/);'
          if needle not in s:
              raise SystemExit('battle preservation V146 assertion anchor missing')
          s=s.replace(needle,replacement,1)
          p.write_text(s)

          # Permanent V174 source guard covers V146 too.
          p=Path('tests/v174-raster-only-combat-vfx-owner.test.js')
          s=p.read_text()
          old='assert.doesNotMatch(css146,/v143-earth-shield-effect/);'
          new='assert.doesNotMatch(css146,/v143-earth-shield-effect|v143-skill-flight|v143-skill-field|v143-hit-impact|v146-flight-art/);'
          if old not in s:
              if new not in s:
                  raise SystemExit('V174 V146 guard anchor missing')
          else:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Verify focused source and tests
        run: |
          node tests/v146-system-polish.test.js
          node tests/ui-typography-battle-preservation.test.js
          node tests/v174-raster-only-combat-vfx-owner.test.js
          node --check js/39-v143-skill-animation.js
          if grep -nE 'v143-skill-flight|v143-skill-field|v143-hit-impact|v146-flight-art' css/42-v146-system-polish.css; then
            echo 'Legacy V146 VFX source remains'
            exit 1
          fi

      - name: Commit cleanup and remove temporary helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/scripts/zz-vfx-final-cleanup.py .github/scripts/zz-vfx-historical-test-migration.py
          git rm -f .github/workflows/zz-v146-vfx-dead-source-cleanup.yml
          git add css/42-v146-system-polish.css tests/v146-system-polish.test.js tests/ui-typography-battle-preservation.test.js tests/v174-raster-only-combat-vfx-owner.test.js
          git commit -m "refactor: retire final V146 procedural battle VFX source"
          git push origin HEAD:fix/combat-vfx-owner-cleanup-20260909
