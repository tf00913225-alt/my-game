name: V173.39 Home Pixel Tune

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/v17339-home-pixel-tune.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stabilize temporary measurement harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          browser=Path('.github/scripts/v17339-home-browser-check.mjs')
          text=browser.read_text()
          old='''        const creation=document.getElementById("creationPage");\n        if(creation){ creation.style.setProperty("display","none","important"); }\n        const home=document.getElementById("homePage")||document.querySelector(".home-city-hud")?.closest(".page");'''
          new='''        const creation=document.getElementById("creationPage");\n        if(creation){ creation.style.setProperty("display","none","important"); }\n        const viewport=document.getElementById("game-viewport");\n        if(viewport){ viewport.hidden=false; viewport.style.setProperty("display","block","important"); }\n        const stage=document.getElementById("game-stage");\n        if(stage){\n            stage.hidden=false; stage.style.setProperty("display","block","important");\n            stage.style.setProperty("position","absolute","important");\n            stage.style.setProperty("left","0","important"); stage.style.setProperty("top","0","important");\n            stage.style.setProperty("width","1080px","important"); stage.style.setProperty("height","1920px","important");\n            stage.style.setProperty("transform","none","important");\n        }\n        const legacyApp=document.querySelector("#game-stage > #app")||document.getElementById("app");\n        if(legacyApp){\n            legacyApp.hidden=false; legacyApp.style.setProperty("display","block","important");\n            legacyApp.style.setProperty("position","absolute","important");\n            legacyApp.style.setProperty("left","0","important"); legacyApp.style.setProperty("top","0","important");\n            legacyApp.style.setProperty("width","420px","important"); legacyApp.style.setProperty("height","746.6666667px","important");\n            legacyApp.style.setProperty("transform","none","important"); legacyApp.style.setProperty("margin","0","important");\n        }\n        const home=document.getElementById("homePage")||document.querySelector(".home-city-hud")?.closest(".page");'''
          if text.count(old)!=1: raise SystemExit('browser harness anchor mismatch')
          browser.write_text(text.replace(old,new,1))
          tune=Path('.github/scripts/v17339-home-pixel-tune.py')
          text=tune.read_text()
          bad=' assert.doesNotMatch(base,/\\.home-card-utility\\{[\\s\\S]*?transform:\\s*scale/);\n'
          if text.count(bad)!=1: raise SystemExit('static harness anchor mismatch')
          tune.write_text(text.replace(bad,'',1))
          PY

      - name: Prepare browser probe
        run: |
          npm install --no-save --no-package-lock playwright-core
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 8899 >/tmp/v17339-home-server.log 2>&1 &
          sleep 1

      - name: Measure V173.39 baseline
        run: node .github/scripts/v17339-home-browser-check.mjs baseline http://127.0.0.1:8899 /tmp/v17339-home-baseline.json

      - name: Apply exact pixel tune
        run: python3 .github/scripts/v17339-home-pixel-tune.py apply

      - name: Run focused static regression
        run: node tests/v173.39-main-city-final-polish.test.js

      - name: Verify 420x746.67 logical geometry in Chromium
        run: node .github/scripts/v17339-home-browser-check.mjs final http://127.0.0.1:8899 /tmp/v17339-home-baseline.json

      - name: Ensure ImageMagick dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run repository checks
        run: |
          node --check .github/scripts/ci.mjs
          node .github/scripts/ci.mjs syntax
          node .github/scripts/ci.mjs tests
          node .github/scripts/ci.mjs resources
          node .github/scripts/ci.mjs html-ids
          node .github/scripts/ci.mjs loader

      - name: Remove temporary tooling
        run: |
          rm -rf node_modules
          rm -f .github/workflows/v17339-home-pixel-tune.yml
          rm -f .github/scripts/v17339-home-pixel-tune.py
          rm -f .github/scripts/v17339-home-browser-check.mjs

      - name: Commit exact main-city tune
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: tune V173.39 main-city pixel geometry"

      - name: Check final diff rules
        env:
          CI_BASE_SHA: ${{ github.event.before }}
        run: CI_HEAD_SHA="$(git rev-parse HEAD)" node .github/scripts/ci.mjs git-diff

      - name: Push to dev
        run: git push origin HEAD:dev
