name: Premium Functional UI Quest Claim Fix

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-quest-claim-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Repair malformed quest control rules in final owner
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          path=Path('css/53-v173.51-qa.css')
          text=path.read_text()
          def replace(selector, body):
              global text
              pattern=re.compile(re.escape(selector)+r'\{[^{}]*\}')
              matches=list(pattern.finditer(text))
              if not matches:
                  raise SystemExit(f'missing selector: {selector}')
              # Use the final matching rule because this file is the late QA owner.
              m=matches[-1]
              text=text[:m.start()]+selector+'{'+body+'}'+text[m.end():]
          replace('#game-stage #homeFeatureModal.quest-mode .quest-tab','font-size:16px!important;min-height:44px!important;')
          replace('#game-stage #homeFeatureModal.quest-mode .quest-claim-btn','font-size:15px!important;min-width:78px!important;min-height:44px!important;')
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = "css/53-v173.51-qa.css"
          node tests/premium-functional-ui-batch5.test.js
          node tests/ui-typography-mobile-browser.test.js
      - name: Save verified owner repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/53-v173.51-qa.css
          git diff --cached --check
          git commit -m "fix: repair quest control hit areas"
          git push origin HEAD:feature/premium-functional-ui
