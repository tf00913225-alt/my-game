name: Sync V173.48 test references

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'launch v173.48 test reference sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Update version expectations
        run: |
          grep -RIl --include='*.js' '173\.47' tests | xargs -r sed -i 's/173\.47/173.48/g'
          git diff -- tests
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "sync tests with V173.48 entry versions"
          git push origin HEAD:dev
