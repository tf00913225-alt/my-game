.v132-reward-modal .v17363-preview-note{margin:10px 1px 0;padding:8px 10px;border-left:2px solid #b98b45;color:#9f927d;background:rgba(184,134,62,.06);font-size:11px;line-height:1.6;text-align:left;}
.v132-reward-modal .v17363-text-reward-preview .v132-reward-actions{margin-top:auto;}
