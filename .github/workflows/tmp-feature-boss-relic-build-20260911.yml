name: Temporary feature patch and production rebuild

on:
  push:
    branches:
      - feature/boss-balance-gameplay-relic-lv20-20260911

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/boss-balance-gameplay-relic-lv20-20260911
          fetch-depth: 0

      - name: Normalize temporary patch-script test compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/tmp-apply-boss-relic-lv20-20260911.mjs')
          source=path.read_text()
          replacements=[
            ('assert.equal(context.skillDatabase[skillId].element,boss.element,`${id} contains cross-element skill ${skillId}`);',
             'assert.equal(context.skillDatabase[skillId].element,boss.element,id+" contains cross-element skill "+skillId);'),
            ('assert.deepEqual(context.currentBattleMonsters,[0,1,2]);',
             'assert.deepEqual(value(context,"currentBattleMonsters"),[0,1,2]);')
          ]
          for old,new in replacements:
              if old not in source:
                  raise SystemExit('temporary patch-script compatibility anchor missing: '+old)
              source=source.replace(old,new,1)
          path.write_text(source)
          PY

      - name: Apply focused source and test patches
        run: node scripts/tmp-apply-boss-relic-lv20-20260911.mjs

      - name: Syntax check changed runtime owners
        run: |
          node --check js/gameplay-boss-tower-system.js
          node --check js/relic-progression-drop-system.js

      - name: Boss runtime tests
        run: |
          set +e
          node tests/gameplay-boss-tower-system.test.js > boss-runtime-test.log 2>&1
          code=$?
          cat boss-runtime-test.log
          exit $code

      - name: Upload focused failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boss-runtime-test-log-${{ github.run_id }}
          path: boss-runtime-test.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Relic progression tests
        run: node tests/v174-relic-progression-drop-system.test.js

      - name: Gameplay mobile browser test
        run: node tests/gameplay-ui-mobile-browser.test.js

      - name: Regenerate production assets
        run: |
          node scripts/build-production.mjs
          node scripts/build-production.mjs --check

      - name: Verify repository loader after rebuild
        run: node .github/scripts/ci.mjs loader

      - name: Remove temporary automation and commit feature changes
        run: |
          git rm scripts/tmp-apply-boss-relic-lv20-20260911.mjs
          git rm scripts/tmp-feature-build-trigger.txt
          git rm .github/workflows/tmp-feature-boss-relic-build-20260911.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: rebalance boss gameplay and guarantee Lv20 starter relics"
          git push origin HEAD:feature/boss-balance-gameplay-relic-lv20-20260911
