name: Temporary shared nav VFX battle layout repair
on:
  push:
    branches:
      - fix/shared-nav-vfx-battle-layout-20260914
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-nav-vfx-battle-layout-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch true owners
        run: python scripts/temp-shared-nav-vfx-battle-layout-repair.py
      - name: Focused regression tests
        run: |
          node tests/shared-nav-vfx-battle-layout-20260914.test.js
          node tests/v148-combat-dungeon-fixes.test.js
          node tests/v143-combat-dungeon-polish.test.js
          node tests/v153-fire-vfx.test.js
          node tests/boss-mobile-portrait-browser.test.js
      - name: Full test suite
        run: npm test
      - name: Rebuild production bundles
        run: npm run build
      - name: Validate built tree
        run: |
          npm run build:check
          git diff --check
      - name: Commit repaired owners and remove temporary runner
        run: |
          rm -f .github/workflows/temp-shared-nav-vfx-battle-layout.yml
          rm -f scripts/temp-shared-nav-vfx-battle-layout-repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: unify context nav and unclamp battle presentation"
          git push origin HEAD:fix/shared-nav-vfx-battle-layout-20260914
