name: TEMP relic cinematic build sync

on:
  push:
    branches:
      - fix/relic-battle-cinematic-target-highlight-dev-equip-20260919

permissions:
  contents: write

jobs:
  verify-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/relic-battle-cinematic-target-highlight-dev-equip-20260919
          fetch-depth: 0

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: JavaScript syntax
        run: node --check js/60-team-relic-system.js

      - name: Relic cinematic contract
        run: node tests/relic-battle-cutin-icon-readability-20260919.test.js

      - name: Battle presentation sequencing
        run: node tests/v174-battle-presentation-sequencing.test.js

      - name: Install ImageMagick for repository asset suites
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick

      - name: Full repository tests
        run: npm test

      - name: Synchronize production build
        run: npm run build

      - name: Verify production build synchronization
        run: npm run build:check

      - name: Commit generated build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No generated build changes"
            exit 0
          fi
          git commit -m "build(relic): sync cinematic target highlight"
          git push origin HEAD:fix/relic-battle-cinematic-target-highlight-dev-equip-20260919
