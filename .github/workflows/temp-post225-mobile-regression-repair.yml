name: Temporary post-225 mobile regression repair

on:
  push:
    branches:
      - fix/post-225-mobile-regressions-20260914

permissions:
  contents: write

env:
  REPAIR_LOG: post225-repair-test.log

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-225-mobile-regressions-20260914
          fetch-depth: 0
      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install asset-test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Patch true owners
        run: python3 scripts/temp-post225-repair.py
      - name: Focused regression tests
        run: |
          node tests/post225-mobile-regressions-20260914.test.js
          node tests/shared-nav-vfx-battle-layout-20260914.test.js
          node tests/v1741-battle-gameplay-layout-order.test.js
          node tests/v174-cardless-battle-browser.test.js
          node tests/v148-combat-dungeon-fixes.test.js
          node tests/v143-combat-dungeon-polish.test.js
          node tests/v153-fire-vfx.test.js
          node tests/v166-water-vfx.test.js
          node tests/boss-mobile-portrait-browser.test.js
      - name: Build production bundles
        run: npm run build
      - name: Verify production build
        run: npm run build:check
      - name: Run full test suite
        shell: bash
        run: |
          set +e
          npm test > "$REPAIR_LOG" 2>&1
          status=$?
          cat "$REPAIR_LOG"
          exit $status
      - name: Check whitespace
        if: success()
        run: git diff --check
      - name: Upload full-suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post225-repair-test-log-${{ github.sha }}
          path: post225-repair-test.log
          if-no-files-found: ignore
          retention-days: 2
      - name: Commit repair and remove temporary tools
        if: success()
        run: |
          rm -f .github/workflows/temp-post225-mobile-regression-repair.yml
          rm -f scripts/temp-post225-repair.py
          rm -f post225-repair-test.log
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair post-225 mobile UI and battle regressions"
          git push origin HEAD:fix/post-225-mobile-regressions-20260914
