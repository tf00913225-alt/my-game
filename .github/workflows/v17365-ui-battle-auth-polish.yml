# temporary validation pass 6
name: V173.65 UI battle auth polish

on:
  push:
    branches:
      - fix/v17365-ui-battle-auth-polish-20260913
    paths:
      - .github/workflows/v17365-ui-battle-auth-polish.yml

permissions:
  contents: write

jobs:
  apply-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/v17365-ui-battle-auth-polish-20260913
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure image test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Repair temporary patch driver syntax and anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/apply-v17365-ui-battle-auth-polish.mjs')
          text=path.read_text(encoding='utf-8')
          lines=text.splitlines()
          lines=[line for line in lines if 's=s.replace(/mechanismCardRule,' not in line]
          text='\n'.join(lines)+'\n'
          text=text.replace('const eagerAnchor="    apply();\\n\\n})();";', 'const eagerAnchor="    function boot(){";')
          text=text.replace('eager=replaceOnce(eager,eagerAnchor,"    apply();\\n"+addition+"\\n})();","eager main-city roster owner");', 'eager=replaceOnce(eager,eagerAnchor,addition+"\\n"+eagerAnchor,"eager main-city roster owner");')
          path.write_text(text,encoding='utf-8')
          PY
          node --check scripts/apply-v17365-ui-battle-auth-polish.mjs

      - name: Apply owner-source fixes
        run: node scripts/apply-v17365-ui-battle-auth-polish.mjs

      - name: Align intentional owner and 4:3 regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/boss-mechanism-vfx-card-ui-20260909.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// The function/mechanism card is the paired 9:16 battlefield component. Its', '// The function/mechanism card is the paired 4:3 battlefield component. Its')
          s=s.replace('aspect-ratio:9 \\/ 16;[\\s\\S]*?flex:0 0 var\\(--gameplay-mechanism-card-width\\);', 'aspect-ratio:4 \\/ 3;[\\s\\S]*?flex:0 0 var\\(--gameplay-mechanism-card-width\\);')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/ui-typography-battle-preservation.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// redundant title is removed, both BOSS and mechanism target cards use 9:16,', '// redundant title is removed, the BOSS target stays 9:16 while the mechanism target uses 4:3,')
          s=s.replace('assert.match(now,/\\.boss-mechanism-card\\{[\\s\\S]*?width:var\\(--gameplay-mechanism-card-width\\);[\\s\\S]*?min-width:0;[\\s\\S]*?aspect-ratio:9 \\/ 16;', 'assert.match(now,/\\.boss-mechanism-card\\{[\\s\\S]*?width:var\\(--gameplay-mechanism-card-width\\);[\\s\\S]*?min-width:0;[\\s\\S]*?aspect-ratio:4 \\/ 3;')
          s=s.replace('"Gameplay BOSS 9:16 sizing must stay specificity-driven"', '"Gameplay BOSS/mechanism sizing must stay specificity-driven"')
          s=s.replace('approved non-overlapping 16:9 activity-cover stack', 'approved non-overlapping 16:9 activity-cover stack and 4:3 mechanism target')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/boss-mobile-portrait-browser.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const ratio=16/9;', 'const bossRatio=16/9;\n    const mechanismRatio=3/4;')
          s=s.replace('Math.abs(data.bossRatio-ratio)<.025', 'Math.abs(data.bossRatio-bossRatio)<.025')
          s=s.replace('Math.abs(data.mechanismRatio-ratio)<.025', 'Math.abs(data.mechanismRatio-mechanismRatio)<.025')
          s=s.replace('`Mechanism card is not 9:16 at ${width}x${height}: ${data.mechanismRatio}`', '`Mechanism card is not 4:3 at ${width}x${height}: ${data.mechanismRatio}`')
          s=s.replace('assert.equal(data.mechanismComputed.aspectRatio,"9 / 16");', 'assert.equal(data.mechanismComputed.aspectRatio,"4 / 3");')
          s=s.replace('`Mechanism content overflows its 9:16 card at ${width}x${height}`', '`Mechanism content overflows its 4:3 card at ${width}x${height}`')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/ui-typography-standard.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const homePolish = read(owners.homePolish);", "const homePolish = read(owners.homePolish);\nconst homeRoster = read('css/19-stage-v54-main-city-moderate-native-scale.css');")
          s=s.replace('assert.match(homePolish, /\\.v146-home-roster > header\\{[^}]*font-size:15px/);', 'assert.match(homeRoster, /\\.v146-home-roster > header\\{[^}]*font-size:15px/);')
          s=s.replace('assert.match(homePolish, /\\.v146-home-character-main > div:first-child\\{[^}]*font-size:15px/);', 'assert.match(homeRoster, /\\.v146-home-character-main > div:first-child\\{[^}]*font-size:15px/);')
          s=s.replace('assert.match(homePolish, /\\.v146-home-resource strong\\{[^}]*font-size:13px/);', 'assert.match(homeRoster, /\\.v146-home-resource strong\\{[^}]*font-size:13px/);')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/v174-current-ui-fixes.test.js')
          s=p.read_text(encoding='utf-8').replace('const rosterCss=read("css/42-v146-system-polish.css");','const rosterCss=read("css/19-stage-v54-main-city-moderate-native-scale.css");')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/v173.39-main-city-final-polish.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('roster=read("css/42-v146-system-polish.css"),runtime=read("js/41-v146-system-polish.js")','roster=read("css/19-stage-v54-main-city-moderate-native-scale.css"),runtime=read("js/16-stage-v54-main-city-runtime.js")')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/v173.28-main-city-lobby.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const rosterCss=read("css/42-v146-system-polish.css");','const rosterCss=read("css/19-stage-v54-main-city-moderate-native-scale.css");')
          s=s.replace('const rosterRuntime=read("js/41-v146-system-polish.js");','const rosterRuntime=read("js/16-stage-v54-main-city-runtime.js");')
          s=s.replace('function numeric\\(value\\)', 'function rosterNumber\\(value\\)')
          s=s.replace('function formatHomeResourceValue\\(value\\)', 'function rosterResourceText\\(value\\)')
          s=s.replace('formatHomeResourceValue(12485243),formatHomeResourceValue(104852430),formatHomeResourceValue(1248524300)', 'rosterResourceText(12485243),rosterResourceText(104852430),rosterResourceText(1248524300)')
          s=s.replace('syncHomeResourceValue\\(hudGold,[^\\n]+\\);[\\s\\S]*syncHomeResourceValue\\(hudExp,[^\\n]+\\);', 'syncRosterResource\\(document.getElementById\\("homeHudGoldValue"\\),[^\\n]+\\);[\\s\\S]*syncRosterResource\\(document.getElementById\\("homeHudExpValue"\\),[^\\n]+\\);')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/v146-system-polish.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const source=fs.readFileSync("js/41-v146-system-polish.js","utf8");', 'const source=fs.readFileSync("js/41-v146-system-polish.js","utf8");\nconst eagerSource=fs.readFileSync("js/16-stage-v54-main-city-runtime.js","utf8");')
          s=s.replace('assert.match(source,/v146-home-roster/);','assert.match(eagerSource,/v146-home-roster/);')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax check touched JavaScript
        run: |
          node --check js/16-stage-v54-main-city-runtime.js
          node --check js/41-v146-system-polish.js
          node --check js/52-v173.20-startup-loader.js
          node --check js/54-v173.51-battle-qa.js
          node --check js/60-team-relic-system.js
          node --check js/firebase/firebase-auth-ui.js

      - name: Build synchronized production bundles
        run: npm run build

      - name: Run focused eight-issue regression
        run: node tests/v173.65-ui-battle-auth-polish.test.js

      - name: Run cardless battle browser regression
        run: node tests/v174-cardless-battle-browser.test.js

      - name: Run BOSS mobile geometry regression
        run: node tests/boss-mobile-portrait-browser.test.js

      - name: Run repository test suite
        run: npm test

      - name: Verify production build
        run: npm run build:check

      - name: Commit repair and generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: polish battle city skill auth and relic UI"
          git push origin HEAD:fix/v17365-ui-battle-auth-polish-20260913
