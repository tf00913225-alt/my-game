name: Temp Facebook diagnostic handoff update

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'fix/facebook-public-profile-diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Replace temporary diagnostic handoff section
        shell: bash
        run: |
          python -c 'import base64,pathlib; p=pathlib.Path("HANDOFF.md"); t=p.read_text(encoding="utf-8"); h="## 2026-09-11 Facebook public_profile DEV 診斷（TEMP）"; s=t.index(h); n=t.find("\n## ",s+len(h)); n=len(t) if n<0 else n+1; sec=base64.b64decode("").decode(); p.write_text(sec+t[n:],encoding="utf-8")'
      - name: Commit handoff update
        shell: bash
        run: |
          git add HANDOFF.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update Facebook diagnostic handoff"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
