name: Fixed Slot Checkpoint 3

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply persistent ally formation
        run: python3 scripts/_fixed_slot_phase3.py
      - name: Verify checkpoint 3
        run: |
          node --check js/battlefield-slot-owner.js
          node --check js/00-main.js
          node --check js/16-stage-v54-main-city-runtime.js
          node --check js/25-v131-fix-batch.js
          node --check js/35-v141-ui-battle.js
          node --check js/36-v141-content-systems.js
          node --check js/42-v148-combat-dungeon-fixes.js
          node --check js/50-v169-water-skill-rules.js
          node tests/fixed-battlefield-slots.test.js
          node tests/fixed-battlefield-ally-formation.test.js
          git diff --check
      - name: Commit safe checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fixed-slot-phase3-inspect.yml scripts/_fixed_slot_phase3.py
          git add -A
          git diff --cached --check
          git commit -m "feat: add persistent ally formation"
          git push origin HEAD:feature/fixed-slot-battlefield-v1-20260916
