name: Fixed Slot Phase 4 Assertion Repair

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 1
      - name: Repair only the cross-realm test expression and remove temporary diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/fixed-slot-phase4-boss-mechanism.yml')
          s=p.read_text(encoding='utf-8')
          old='guards.map(unit=>unit.vGameplayBattlefieldSlot)'
          new='Array.from(guards,unit=>unit.vGameplayBattlefieldSlot)'
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'expected one old assertion expression, found {count}')
          s=s.replace(old,new,1)
          if old in s or new not in s:
              raise SystemExit('assertion repair verification failed')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fixed-slot-phase4-diagnose.yml
          rm -f .github/workflows/fixed-slot-phase4-workflow-fix.yml
          rm -f .github/workflows/fixed-slot-phase4-repair2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: normalize phase4 cross-realm assertion"
          git push origin HEAD:feature/fixed-slot-battlefield-v1-20260916
