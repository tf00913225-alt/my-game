name: Temporary map/nav diagnostic
on:
  push:
    branches:
      - fix/map-avatar-nav-size-player-scale-20260914
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect final shared nav bundle with Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 & SERVER_PID=$!
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-allow-origins='*' --remote-debugging-port=9222 --user-data-dir=/tmp/chrome http://127.0.0.1:8000/ >/tmp/chrome.log 2>&1 & CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do curl -fsS http://127.0.0.1:9222/json >/dev/null && break || sleep .25; done
          cat >/tmp/diag.mjs <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));const tabs=await(await fetch('http://127.0.0.1:9222/json')).json();const tab=tabs.find(x=>String(x.url||'').includes('127.0.0.1:8000'))||tabs[0];const ws=new WebSocket(tab.webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});let id=0;const p=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&p.has(m.id)){const q=p.get(m.id);p.delete(m.id);m.error?q.reject(m.error):q.resolve(m.result)}};const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;p.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});const ev=async e=>(await send('Runtime.evaluate',{expression:e,awaitPromise:true,returnByValue:true})).result?.value;await send('Runtime.enable');await sleep(5000);
          console.log('FEATURE_API',await ev(`typeof FourSymbolsFeatures`));
          console.log('ENSURE',JSON.stringify(await ev(`(async()=>{try{await FourSymbolsFeatures.ensure('boss-tower','nav-diagnostic');return {ok:true,ready:FourSymbolsFeatures.isReady('gameplay-core')}}catch(e){return {ok:false,error:String(e)}}})()`)));
          await sleep(1000);
          const out=await ev(`(()=>{const app=document.getElementById('app');let n=document.getElementById('v141DungeonNav');if(!n){n=document.createElement('div');n.id='v141DungeonNav';n.className='bottom-nav map-page-nav v141-dungeon-nav v148-context-nav';n.dataset.v146Columns='5';n.innerHTML='<button class="nav-button"><img class="nav-art-button" src="assets/ui/nav-character.png"></button>'.repeat(5);(document.getElementById('game-content')||app).appendChild(n)}else n.classList.add('v148-context-nav');app.classList.add('v148-context-nav-active');const s=getComputedStyle(n),im=n.querySelector('img'),si=getComputedStyle(im),r=n.getBoundingClientRect(),ri=im.getBoundingClientRect();return {styles:[...document.querySelectorAll('link[data-feature-style]')].map(x=>({bundle:x.dataset.featureStyle,href:x.getAttribute('href')})),nav:{display:s.display,width:s.width,height:s.height,position:s.position,grid:s.gridTemplateColumns,rectW:r.width,rectH:r.height},img:{width:si.width,height:si.height,rectW:ri.width,rectH:ri.height},classes:n.className,app:app.className}})()`);
          console.log('FINAL_NAV',JSON.stringify(out));ws.close();
          NODE
          node /tmp/diag.mjs
