name: V173.44 Preview Host Diagnostic

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17344-browser-debug.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect preview hosts
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://tf00913225-alt.github.io/my-game/" \
            "https://raw.githack.com/tf00913225-alt/my-game/dev/index.html"; do
            echo "===== ${url} ====="
            code=$(curl -L -sS --max-time 60 -D /tmp/headers -o /tmp/body -w '%{http_code}' "$url" || true)
            echo "HTTP=${code}"
            grep -iE '^(content-type|content-length|cache-control|age|server|location):' /tmp/headers || true
            echo "BYTES=$(wc -c < /tmp/body)"
            grep -o '<title>[^<]*</title>' /tmp/body | head -1 || true
          done
