name: V173.61 integration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17361-inspect.yml
      - .github/scripts/v17361_patch.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Import approved item art from assets-library
        run: |
          git fetch origin assets-library
          mkdir -p assets/items/materials assets/items/chests
          git show "origin/assets-library:assets/inbox/道具icon/礦石.png" > assets/items/materials/ore.png
          git show "origin/assets-library:assets/inbox/道具icon/副本與背包的寶箱.png" > assets/items/chests/dungeon-chest.png
          file assets/items/materials/ore.png assets/items/chests/dungeon-chest.png
      - name: Validate patch script syntax
        run: python -m py_compile .github/scripts/v17361_patch.py
      - name: Apply V173.61 source fixes
        run: python .github/scripts/v17361_patch.py
      - name: Check modified JavaScript syntax
        run: |
          node --check js/00-main.js
          node --check js/27-v132-content-expansion.js
          node --check js/34-v141-core-systems.js
          node --check js/35-v141-ui-battle.js
          node --check js/42-v148-combat-dungeon-fixes.js
          node --check js/equipment-progression.js
          node --check js/57-v173.51-quest-qa.js
      - name: Ensure asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi
      - name: Run complete Node suites
        run: node .github/scripts/ci.mjs tests
      - name: Commit V173.61 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js css tests HANDOFF.md assets/items/materials/ore.png assets/items/chests/dungeon-chest.png
          git commit -m "V173.61 integrate UI assets power saving and quest fixes"
          git push origin HEAD:dev
