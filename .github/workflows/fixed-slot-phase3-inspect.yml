name: Fixed Slot Checkpoint 3

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply persistent ally formation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/_fixed_slot_phase3.py')
          text=path.read_text(encoding='utf-8')
          start=text.find('s=replace_once(s,\n"""    function normalizeShape')
          end=text.find('ally_block=',start)
          if start<0 or end<0:
              raise SystemExit('phase3 driver normalizeShape compatibility block not found')
          path.write_text(text[:start]+text[end:],encoding='utf-8')
          PY
          python3 scripts/_fixed_slot_phase3.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('css/31-v131-fix-batch.css')
          path.write_text(path.read_text(encoding='utf-8').rstrip()+"\n",encoding='utf-8')
          PY
      - name: Verify checkpoint 3
        run: |
          node --check js/battlefield-slot-owner.js
          node --check js/00-main.js
          node --check js/16-stage-v54-main-city-runtime.js
          node --check js/25-v131-fix-batch.js
          node --check js/35-v141-ui-battle.js
          node --check js/36-v141-content-systems.js
          node --check js/42-v148-combat-dungeon-fixes.js
          node --check js/50-v169-water-skill-rules.js
          node tests/fixed-battlefield-slots.test.js
          node tests/fixed-battlefield-ally-formation.test.js
          git diff --check
      - name: Commit safe checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fixed-slot-phase3-inspect.yml scripts/_fixed_slot_phase3.py
          git add -A
          git diff --cached --check
          git commit -m "feat: add persistent ally formation"
          git push origin HEAD:feature/fixed-slot-battlefield-v1-20260916
