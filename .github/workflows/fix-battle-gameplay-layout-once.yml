name: One-shot battle and gameplay layout fix

on:
  push:
    branches:
      - fix/battle-art-gameplay-layout-20260911
    paths:
      - .github/workflows/fix-battle-gameplay-layout-once.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/battle-art-gameplay-layout-20260911
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply focused owner fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Cardless battle owner: show the complete player portrait and reserve a
          #    dedicated HUD strip below the artwork for HP/SP.  The existing player
          #    name already lives immediately below the card and remains there.
          replace_once(
              "js/54-v173.51-battle-qa.js",
              '''#game-stage > #app > #game-content #battlePage .battle-player.v174-cardless-unit>.v174-battle-art{
              background-size:cover!important;background-position:center 18%!important;
          }''',
              '''#game-stage > #app > #game-content #battlePage .battle-player.v174-cardless-unit>.v174-battle-art{
              inset:0 0 30px!important;
              background-size:contain!important;background-position:center bottom!important;
          }
          #game-stage > #app > #game-content #battlePage .battle-player.v174-cardless-unit>.hp-bar{
              position:absolute!important;left:50%!important;bottom:13px!important;
              margin:0!important;transform:translateX(-50%)!important;
          }
          #game-stage > #app > #game-content #battlePage .battle-player.v174-cardless-unit>.sp-bar{
              position:absolute!important;left:50%!important;bottom:0!important;
              margin:0!important;transform:translateX(-50%)!important;
          }
          #game-stage > #app > #game-content #battlePage .battle-player.v174-cardless-unit>.battle-player-id{
              z-index:20!important;
          }''',
              "battle portrait/HUD separation",
          )

          # 2) Gameplay cover owner: the hub is one vertical stack.  Flex makes each
          #    16:9 cover participate in normal flow, so adjacent covers cannot overlap.
          replace_once(
              "css/gameplay-boss-tower.css",
              '''#game-stage .gameplay-hub-grid{
              display:grid;
              align-content:start;
              grid-template-columns:1fr;
              gap:10px;
              padding:12px;
          }''',
              '''#game-stage .gameplay-hub-grid{
              display:flex;
              flex-direction:column;
              align-items:stretch;
              gap:10px;
              padding:12px;
          }''',
              "gameplay cover stack owner",
          )
          replace_once(
              "css/gameplay-boss-tower.css",
              '''    width:100%;
              min-height:0;
              aspect-ratio:16 / 9;''',
              '''    width:100%;
              min-height:0;
              flex:0 0 auto;
              aspect-ratio:16 / 9;''',
              "gameplay cover flex participation",
          )

          # 3) BOSS detail owner: challenge action goes before the detail grid, i.e.
          #    immediately above the first section (recommended party).
          boss_path = Path("js/gameplay-boss-tower-system.js")
          boss = boss_path.read_text(encoding="utf-8")
          grid_marker = '            \'<div class="boss-detail-grid"><section><h4>建議陣容</h4>'
          button_line = '            \'<button type="button" class="gameplay-primary-action" onclick="vGameplayStartBoss(\\\'\'+type+\'\\\',\\\'\'+definition.id+\'\\\')">\'+(type==="world"?\'挑戰\'+WORLD_STAGE_PROFILES[stage-1].label:\'開始挑戰\')+\'</button></div>\';\n'
          if boss.count(grid_marker) != 1 or boss.count(button_line) != 1:
              raise SystemExit("boss detail order: expected owner markers were not unique")
          button_before_grid = '            \'<button type="button" class="gameplay-primary-action" onclick="vGameplayStartBoss(\\\'\'+type+\'\\\',\\\'\'+definition.id+\'\\\')">\'+(type==="world"?\'挑戰\'+WORLD_STAGE_PROFILES[stage-1].label:\'開始挑戰\')+\'</button>\'+\n'
          boss = boss.replace(grid_marker, button_before_grid + grid_marker, 1)
          boss = boss.replace(button_line, "            '</div>';\n", 1)
          boss_path.write_text(boss, encoding="utf-8")

          # 4) Relic owner: always make the relic preview the first detail-grid section.
          #    With the challenge action now before the grid this places it immediately
          #    below the challenge button, before recommended party.
          replace_once(
              "js/relic-progression-drop-system.js",
              '''        let section=grid.querySelector(".relic-progression-boss-preview");
                  if(!section){ section=document.createElement("section");section.className="relic-progression-boss-preview";grid.appendChild(section); }''',
              '''        let section=grid.querySelector(".relic-progression-boss-preview");
                  if(!section){ section=document.createElement("section");section.className="relic-progression-boss-preview"; }
                  if(grid.firstElementChild!==section){ grid.insertBefore(section,grid.firstElementChild); }''',
              "relic preview order",
          )

          # Strengthen the existing real-browser 16:9 cover regression so it also
          # proves that the four covers do not overlap vertically.
          replace_once(
              "tests/v174-gameplay-cover-16x9-browser.test.js",
              '''const rows=cards.map(card=>{const r=card.getBoundingClientRect(),s=getComputedStyle(card);return {width:r.width,height:r.height,ratio:r.width/r.height,aspectRatio:s.aspectRatio,minHeight:s.minHeight,overflowX:card.scrollWidth-card.clientWidth,overflowY:card.scrollHeight-card.clientHeight};});''',
              '''const rows=cards.map(card=>{const r=card.getBoundingClientRect(),s=getComputedStyle(card);return {top:r.top,bottom:r.bottom,width:r.width,height:r.height,ratio:r.width/r.height,aspectRatio:s.aspectRatio,minHeight:s.minHeight,overflowX:card.scrollWidth-card.clientWidth,overflowY:card.scrollHeight-card.clientHeight};});''',
              "gameplay browser geometry capture",
          )
          replace_once(
              "tests/v174-gameplay-cover-16x9-browser.test.js",
              '''            assert.ok(row.overflowY<=1,`card ${index} text must fit its 16:9 cover`);
                  });''',
              '''            assert.ok(row.overflowY<=1,`card ${index} text must fit its 16:9 cover`);
                      if(index>0){
                          assert.ok(row.top>=rows[index-1].bottom+9,`card ${index} must stack below card ${index-1} without overlap`);
                      }
                  });''',
              "gameplay browser no-overlap assertion",
          )

          # Extend the existing cardless mobile browser QA with the exact visual
          # contract requested here: full portrait (contain), then HP, SP, then name.
          battle_test = Path("tests/v174-cardless-battle-browser.test.js")
          bt = battle_test.read_text(encoding="utf-8")
          old = '''      playerArt:!!art,
                enemyArt:!!enemyArt,'''
          new = '''      playerArt:!!art,
                playerArtBackgroundSize:getComputedStyle(art).backgroundSize,
                playerArtRect:qaRect('#battlePlayerCard0 > .v174-battle-art'),
                playerHpRect:qaRect('#battlePlayerCard0 > .hp-bar'),
                playerSpRect:qaRect('#battlePlayerCard0 > .sp-bar'),
                playerNameRect:qaRect('#battlePlayerCard0 > .battle-player-id'),
                enemyArt:!!enemyArt,'''
          if bt.count(old) != 1:
              raise SystemExit("battle browser geometry capture marker mismatch")
          bt = bt.replace(old, new, 1)
          old = '''    assert.equal(data.playerArt,true);
              assert.equal(data.enemyArt,true);'''
          new = '''    assert.equal(data.playerArt,true);
              assert.equal(data.playerArtBackgroundSize,"contain");
              assert.ok(data.playerArtRect.bottom<=data.playerHpRect.top,"player artwork must end above HP bar");
              assert.ok(data.playerHpRect.bottom<=data.playerSpRect.top+1,"HP bar must sit above SP bar without portrait overlap");
              assert.ok(data.playerSpRect.bottom<=data.playerNameRect.top+1,"player name must sit below both resource bars");
              assert.equal(data.enemyArt,true);'''
          if bt.count(old) != 1:
              raise SystemExit("battle browser assertion marker mismatch")
          battle_test.write_text(bt.replace(old, new, 1), encoding="utf-8")

          # Small source-level regression for the two ordering requirements.
          Path("tests/v1741-battle-gameplay-layout-order.test.js").write_text(r'''"use strict";
          const assert=require("node:assert/strict");
          const fs=require("node:fs");
          const battle=fs.readFileSync("js/54-v173.51-battle-qa.js","utf8");
          const css=fs.readFileSync("css/gameplay-boss-tower.css","utf8");
          const boss=fs.readFileSync("js/gameplay-boss-tower-system.js","utf8");
          const relic=fs.readFileSync("js/relic-progression-drop-system.js","utf8");
          assert.match(battle,/battle-player\.v174-cardless-unit>\.v174-battle-art\{[\s\S]*?inset:0 0 30px!important;[\s\S]*?background-size:contain!important/);
          assert.match(battle,/battle-player\.v174-cardless-unit>\.hp-bar\{[\s\S]*?bottom:13px!important/);
          assert.match(battle,/battle-player\.v174-cardless-unit>\.sp-bar\{[\s\S]*?bottom:0!important/);
          assert.match(css,/\.gameplay-hub-grid\{[\s\S]*?display:flex;[\s\S]*?flex-direction:column;/);
          assert.match(css,/\.gameplay-mode-card\{[\s\S]*?flex:0 0 auto;[\s\S]*?aspect-ratio:16 \/ 9;/);
          const detail=boss.slice(boss.indexOf("function bossDetailMarkup"),boss.indexOf("function renderBossPage"));
          assert.ok(detail.indexOf("gameplay-primary-action")<detail.indexOf("boss-detail-grid"),"BOSS challenge action must render above recommended-party grid");
          assert.match(relic,/grid\.insertBefore\(section,grid\.firstElementChild\)/,"relic preview must be first detail section");
          console.log("V174.1 battle/gameplay layout ordering regression checks passed");
          ''', encoding="utf-8")
          PY

      - name: Check focused JavaScript syntax
        run: |
          node --check js/54-v173.51-battle-qa.js
          node --check js/gameplay-boss-tower-system.js
          node --check js/relic-progression-drop-system.js
          node --check tests/v1741-battle-gameplay-layout-order.test.js

      - name: Run focused UI regressions
        run: |
          node tests/v1741-battle-gameplay-layout-order.test.js
          node tests/v174-cardless-battle-browser.test.js
          node tests/v174-gameplay-cover-16x9-browser.test.js
          node tests/v174-boss-balance-gameplay-cover-relic-lv20.test.js

      - name: Rebuild deterministic production assets
        run: |
          node scripts/build-production.mjs
          node scripts/build-production.mjs --check

      - name: Re-run focused browser regressions against rebuilt manifest
        run: |
          node tests/v174-cardless-battle-browser.test.js
          node tests/v174-gameplay-cover-16x9-browser.test.js

      - name: Commit focused source, tests, and generated assets
        run: |
          rm .github/workflows/fix-battle-gameplay-layout-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): separate battle portrait HUD and gameplay covers"
          git push origin HEAD:fix/battle-art-gameplay-layout-20260911
