name: Apply V173.52 real startup progress

on:
  push:
    branches: [tmp-v17352-startup]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'launch V173.52 real startup progress')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v17352-startup
          fetch-depth: 0
      - name: Ensure asset-test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi
      - name: Apply patch
        run: python .github/scripts/apply-v17352-startup.py
      - name: Syntax and tests
        run: |
          node --check js/20-anonymous-20.js
          node --check js/52-v173.20-startup-loader.js
          node --check js/51-v169-rpg-ui.js
          node --check js/equipment-progression.js
          node --check js/53-v173.50-inventory-qol.js
          node .github/scripts/ci.mjs tests
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/20-anonymous-20.js js/52-v173.20-startup-loader.js js/51-v169-rpg-ui.js js/equipment-progression.js js/53-v173.50-inventory-qol.js index.html tests
          git commit -m "V173.52 real runtime startup progress"
          git push origin HEAD:tmp-v17352-startup
