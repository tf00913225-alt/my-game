name: Apply UI bugfix batch

on:
  push:
    branches:
      - bugfix/synthesis-dungeon-equipment-ui

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bugfix branch
        uses: actions/checkout@v4
        with:
          ref: bugfix/synthesis-dungeon-equipment-ui
          fetch-depth: 2

      - name: Apply owner-level fixes
        run: python3 .github/scripts/_apply-ui-bugfix-batch.py

      - name: Targeted syntax and regression checks
        shell: bash
        run: |
          node --check js/01-stage-v8-touch-lock.js
          node --check js/38-v143-system-fixes.js
          node --check js/55-v173.51-inventory-qa.js
          node --check js/58-v173.63-functional-fixes.js
          node tests/ui-synthesis-dungeon-equipment-comparison-regression.test.js
          node tests/v173.51-qa.test.js
          node tests/v173.58-reforge-redesign.test.js
          node tests/v173.63-visible-ui-owner-repairs.test.js
          git diff --check

      - name: Commit fixes and remove one-time migration files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-ui-bugfix-batch.yml .github/scripts/_apply-ui-bugfix-batch.py
          git add css/33-v132-content-expansion.css css/38-v141-system-expansion.css css/53-v173.51-qa.css \
                  js/01-stage-v8-touch-lock.js js/38-v143-system-fixes.js js/55-v173.51-inventory-qa.js js/58-v173.63-functional-fixes.js \
                  UI_GUIDELINES.md HANDOFF.md tests/v173.51-qa.test.js tests/ui-synthesis-dungeon-equipment-comparison-regression.test.js \
                  release/requirement-batches/2026-09-07-synthesis-dungeon-equipment-ui.json
          git commit -m "fix: repair synthesis dungeon and equipment UI"
          git push origin HEAD:bugfix/synthesis-dungeon-equipment-ui
