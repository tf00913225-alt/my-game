name: CI

on:
  push:
    branches:
      - dev
      - main
      - fix/dev-deterministic-build-root-cause-20260914
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  verify:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Converge VFX owner and regenerate deterministic build
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/dev-deterministic-build-root-cause-20260914'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path=Path("css/56-v174-critical-ui-regressions.css")
          css=css_path.read_text(encoding="utf-8")
          start_marker="/* The formal fire-rocket sheet is authored pointing upward."
          next_marker="/* Main-city persistent utility shell: boot-visible before relic gameplay executes. */"
          if start_marker in css:
              start=css.index(start_marker)
              end=css.index(next_marker,start)
              css=css[:start]+css[end:]
              css_path.write_text(css,encoding="utf-8")
          elif "v174FireRocketTravel" in css or 'data-skill="fireRocket"' in css:
              raise SystemExit("Unexpected Fire Rocket override shape; refusing broad edit")

          test_path=Path("tests/remaining-ui-regressions-20260914.test.js")
          test=test_path.read_text(encoding="utf-8")
          vfx_line='const vfx=read("js/39-v143-skill-animation.js");\n'
          vfx_css_line='const vfxCss=read("css/40-v143-combat-dungeon-polish.css");\n'
          if vfx_css_line not in test:
              if vfx_line not in test:
                  raise SystemExit("VFX test anchor missing")
              test=test.replace(vfx_line,vfx_line+vfx_css_line,1)

          old_assert='assert.match(fireCss,/rotate\\(var\\(--v143-sprite-angle,0deg\\)\\)/);'
          new_assert='assert.match(vfxCss,/@keyframes v143RasterTravel\\{[\\s\\S]*rotate\\(var\\(--v143-sprite-angle,0deg\\)\\)/);\nassert.doesNotMatch(fireCss,/v174FireRocketTravel/);\nassert.doesNotMatch(fireCss,/data-skill="fireRocket"/);'
          if old_assert in test:
              test=test.replace(old_assert,new_assert,1)
          elif new_assert not in test:
              raise SystemExit("Fire Rocket regression assertion anchor missing")
          test_path.write_text(test,encoding="utf-8")
          PY

          node tests/remaining-ui-regressions-20260914.test.js
          npm run build
          npm run build:check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- css/56-v174-critical-ui-regressions.css tests/remaining-ui-regressions-20260914.test.js build asset-manifest.json index.html
          if git diff --cached --quiet; then
            echo "Canonical source/build already converged."
          else
            git commit -m "build: converge VFX owner and regenerate deterministic assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare Git comparison base
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$CI_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && \
             [[ ! "$CI_BASE_SHA" =~ ^0{40}$ ]] && \
             ! git cat-file -e "$CI_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          fi

          # Typography regression suites audit the pre-change baseline and the
          # approved gameplay battle baseline byte-for-byte. fetch-depth: 2 does
          # not retain those fixed historical objects after the integration merge.
          for typography_baseline_sha in \
            39767ce2b9dbfa59650b7c5fd4d52a57a2642ea5 \
            4a592dd4c41d7efb1a4849fbfe0cbf68598121bf \
            29b9668057846164a941fbf6617d2458d9af5476; do
            if ! git cat-file -e "$typography_baseline_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$typography_baseline_sha"
            fi
          done

      - name: Check CI script syntax
        run: |
          node --check .github/scripts/ci.mjs
          node --check .github/scripts/boot-live-browser-qa.mjs
          node --check .github/scripts/release-gate.mjs
          node --check .github/scripts/run-boot-architecture-browser-qa.mjs
          node --check .github/scripts/run-skill-progression-browser-qa.mjs
          node --check .github/scripts/run-relic-progression-browser-qa.mjs

      - name: Check all project JavaScript syntax
        run: node .github/scripts/ci.mjs syntax

      - name: Ensure existing asset-test dependency
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      # Full repository tests are formal-release gates. Dev stays fast and relies
      # on change-focused tests before merge plus the static/build/release gates below.
      - name: Run all Node unit and integration suites
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node .github/scripts/ci.mjs tests

      - name: Verify production build is synchronized
        run: npm run build:check

      # Heavy browser QA is release-only. Development PRs/pushes keep the fast
      # repository checks above and can reach the dev preview without waiting
      # for unrelated full-game browser scenarios.
      - name: Run account-first cold/warm mobile browser QA
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node .github/scripts/run-boot-architecture-browser-qa.mjs

      - name: Upload boot architecture browser evidence
        if: (github.ref == 'refs/heads/main' || github.base_ref == 'main') && always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-architecture-browser-qa-${{ github.sha }}
          path: artifacts/browser-qa/boot-architecture-browser-qa.json
          if-no-files-found: error
          retention-days: 90

      - name: Run skill progression mobile browser QA
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node .github/scripts/run-skill-progression-browser-qa.mjs

      - name: Run relic progression mobile browser QA
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: node .github/scripts/run-relic-progression-browser-qa.mjs

      - name: Check static local resources
        run: node .github/scripts/ci.mjs resources

      - name: Check duplicate HTML IDs
        run: node .github/scripts/ci.mjs html-ids

      - name: Check release entries and loader integrity
        run: node .github/scripts/ci.mjs loader

      - name: Enforce release, cache, checklist and deprecated-code gates
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/release-gate.mjs ci

      - name: Check Git whitespace and conflict markers
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci.mjs git-diff

  deploy_dev:
    name: Dev deployment gate
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-dev-cloudflare.yml
    secrets: inherit
