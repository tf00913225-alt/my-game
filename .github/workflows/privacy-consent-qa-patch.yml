name: Privacy consent QA patch

on:
  push:
    branches:
      - feature/privacy-consent-gate-20260911

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[privacy-qa-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/privacy-consent-gate-20260911
          fetch-depth: 1
      - name: Keep boot architecture QA focused on boot ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/run-boot-architecture-browser-qa.mjs')
          text=path.read_text(encoding='utf-8')
          needle='  var scenario=new URL(location.href).searchParams.get("scenario")||"";\n'
          addition='  localStorage.setItem("four_symbols_privacy_consent_version","2026-09-11-v1");\n'
          if addition not in text:
              if needle not in text:
                  raise SystemExit('QA prelude marker missing')
              text=text.replace(needle,needle+addition,1)
              path.write_text(text,encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/run-boot-architecture-browser-qa.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: seed privacy consent in boot architecture QA [privacy-qa-patched]"
          git push origin HEAD:feature/privacy-consent-gate-20260911
