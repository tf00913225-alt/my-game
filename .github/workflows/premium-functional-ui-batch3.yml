name: Premium Functional UI Batch 3

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-batch3.yml
      - .github/scripts/premium-functional-ui-batch3.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply Batch 3 in inventory detail and relic presentation owners
        run: |
          set -euo pipefail
          before_runtime="$(sha256sum js/35-v141-ui-battle.js js/53-v173.50-inventory-qol.js js/19-stage-v78-character-inventory-runtime.js js/60-team-relic-system.js | sha256sum | awk '{print $1}')"
          python3 .github/scripts/premium-functional-ui-batch3.py
          after_runtime="$(sha256sum js/35-v141-ui-battle.js js/53-v173.50-inventory-qol.js js/19-stage-v78-character-inventory-runtime.js js/60-team-relic-system.js | sha256sum | awk '{print $1}')"
          test "$before_runtime" = "$after_runtime"
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "css/22-stage-v78-character-inventory-core.css
          css/23-stage-v77-inventory-detail-ui.css
          css/38-v141-system-expansion.css
          css/55-team-relic-system.css"
          test -f tests/premium-functional-ui-batch3.test.js
      - name: Run Batch 3 targeted regression
        run: |
          set -euo pipefail
          node tests/premium-functional-ui-batch1.test.js
          node tests/premium-functional-ui-batch2.test.js
          node tests/premium-functional-ui-batch3.test.js
          node tests/v141-system-expansion.test.js
          node tests/v173.18-final-request.test.js
          node tests/v174-team-relic-system.test.js
          node tests/v173.65-ui-battle-auth-polish.test.js
          node tests/remaining-ui-regressions-20260914.test.js
          git diff --check
      - name: Save verified Batch 3 and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/premium-functional-ui-batch3.yml .github/scripts/premium-functional-ui-batch3.py
          git add css/22-stage-v78-character-inventory-core.css css/23-stage-v77-inventory-detail-ui.css css/38-v141-system-expansion.css css/55-team-relic-system.css tests/premium-functional-ui-batch3.test.js
          git diff --cached --check
          git commit -m "feat: 統一背包秘寶與物品詳情質感"
          git push origin HEAD:feature/premium-functional-ui
