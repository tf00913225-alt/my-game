name: Premium Functional UI Final Verification

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-finalize.yml

permissions:
  contents: write

jobs:
  verify-build-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build synchronized content-hashed production assets
        run: |
          set -euo pipefail
          npm run build
          npm run build:check
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(build/|asset-manifest\.json$|index\.html$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected build output:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Run repository and premium UI regressions
        env:
          CI_BASE_SHA: 7edc8e25e60b66ce88ce96e0e0076feb61e7a6d3
        run: |
          set -euo pipefail
          node .github/scripts/ci.mjs syntax
          node .github/scripts/ci.mjs tests
          node .github/scripts/ci.mjs resources
          node .github/scripts/ci.mjs html-ids
          node .github/scripts/ci.mjs loader
          node tests/premium-functional-ui-batch1.test.js
          node tests/premium-functional-ui-batch2.test.js
          node tests/premium-functional-ui-batch3.test.js
          node tests/premium-functional-ui-batch4.test.js
          node tests/premium-functional-ui-batch5.test.js
          node .github/scripts/release-gate.mjs ci
          git diff --check

      - name: Run existing Chrome UI suites
        run: |
          set -euo pipefail
          node tests/ui-black-gold-window-browser.test.js
          node tests/ui-feature-large-panel-browser.test.js
          node tests/ui-critical-regressions-mobile-browser.test.js
          node tests/ui-team-relic-mobile-browser.test.js
          node tests/v173.49-exp-pool-scroll-stability-browser.test.js
          node .github/scripts/run-skill-progression-browser-qa.mjs
          node .github/scripts/run-relic-progression-browser-qa.mjs
          node .github/scripts/run-boot-architecture-browser-qa.mjs

      - name: Capture exact-size premium functional UI screenshots
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const cp=require('node:child_process');
          const assert=require('node:assert/strict');
          const root=process.cwd();
          const out=path.join(root,'artifacts/browser-qa/premium-functional-ui');
          fs.mkdirSync(out,{recursive:true});
          function chrome(){for(const name of ['google-chrome','google-chrome-stable','chromium','chromium-browser']){const r=cp.spawnSync('which',[name],{encoding:'utf8'});if(r.status===0&&r.stdout.trim())return r.stdout.trim();}throw new Error('Chrome required');}
          const binary=chrome();
          const styles=['css/00-main.css','css/22-stage-v78-character-inventory-core.css','css/23-stage-v77-inventory-detail-ui.css','css/25-stage-v90-quest-interface-core.css','css/31-v131-fix-batch.css','css/37-v139-rested-experience.css','css/38-v141-system-expansion.css','css/42-v146-system-polish.css','css/49-v169-rpg-ui.css','css/53-v173.51-qa.css','css/55-team-relic-system.css'];
          const links=styles.map(file=>`<link rel="stylesheet" href="${file}">`).join('');
          const common=`<div id="game-viewport"><div id="game-stage"><div id="app"><div id="game-content"><div id="homeFeatureModal" class="home-feature-modal show"><div class="home-feature-modal-box wide"><div class="home-feature-modal-title"><span>功能驗收</span><button class="home-feature-close-btn qa-major">返回</button></div><div id="homeFeatureModalBody"></div></div></div></div></div></div></div>`;
          const cells=Array.from({length:18},(_,i)=>`<div class="inventory-item inventory-item-classic ${i<8?'has-item':'empty'}"><div class="inventory-icon">${i<8?'◇':'·'}</div></div>`).join('');
          const questCards=Array.from({length:8},(_,i)=>`<article class="quest-card"><div class="quest-card-head"><b class="quest-card-name">漫長任務名稱 ${i+1}</b><span class="quest-status ${i<2?'ready':''}">${i<2?'可領取':'進行中'}</span></div><p class="quest-card-desc">完成指定目標並確認獎勵資訊不會因長中文而裁切。</p><div class="quest-progress-line"><span>進度</span><strong>${i+2} / 10</strong></div><div class="quest-progress-track"><div class="quest-progress-fill" style="width:${(i+2)*10}%"></div></div><div class="quest-card-foot"><span class="quest-reward"><b class="quest-reward-label">獎勵</b> 金幣 10,000</span><button class="quest-claim-btn qa-major" ${i<2?'':'disabled'}>領取</button></div></article>`).join('');
          const achievementCards=Array.from({length:7},(_,i)=>`<article class="v17351-achievement-card ${i<2?'ready':i===6?'claimed':'locked'}"><div class="v17351-achievement-copy"><b>長成就名稱 ${i+1}</b><span>完成指定進度，保留正式領取狀態與說明。</span><small>${i+1}/10・獎勵 5,000 金幣</small></div><button class="qa-major">${i<2?'領取':i===6?'已領取':'未達成'}</button></article>`).join('');
          const surfaces={
            character:`<div id="characterTabContent"><section id="homeExpPoolCard"><div class="exp-pool-hero"><div class="exp-pool-kicker">SHARED EXPERIENCE</div><div class="exp-pool-title">共用經驗池</div><div class="exp-pool-total"><b class="exp-pool-value">123,456</b></div><p class="exp-pool-caption">目前角色 EXP 8,900 / 下一級 10,000</p></div><div id="expDistributeList"><div class="v131-exp-row"><div class="v131-exp-name">極長角色名稱測試</div><div class="v131-exp-level">Lv.32 → Lv.33</div><button class="v131-exp-preview-btn qa-major">分配經驗 1,100</button></div></div><section id="statusPage"><div class="status-points-line">可用屬性點：<b id="attributePoints">12</b></div>${['攻擊','智力','體質','能量','精神','敏捷'].map(x=>`<div class="status-row"><span>${x}</span><button class="status-btn qa-major">−</button><span class="status-number">99 + 0</span><button class="status-btn qa-major">＋</button></div>`).join('')}<button id="confirmStatusButton" class="status-confirm qa-major">確認配點</button></section></div>`,
            inventory:`<div id="characterTabContent"><div id="inventoryPage" class="page inventory-page-classic"><section class="inventory-classic-shell"><section class="inventory-character-panel"><div class="inventory-character-switch"><button class="inventory-character-arrow qa-major">‹</button><div class="inventory-character-name"><span>極長角色名稱測試</span><small class="inventory-character-level">Lv.99</small></div><button class="inventory-character-arrow qa-major">›</button></div></section><section class="inventory-right-panel"><div class="inventory-stats-panel"><div class="inventory-stat-primary"><span>HP</span><b>123456 / 123456</b></div></div><div class="inventory-grid-scroll"><div id="inventoryGrid" class="inventory-grid inventory-grid-classic">${cells}</div></div><div class="v141-inventory-pager"><button class="qa-major">←</button><span>1 / 7</span><button class="qa-major">→</button></div></section></section></div></div>`,
            shop:`<div class="v17345-shop-shell"><div class="v17345-shop-tabs"><button class="active qa-major">補品</button><button class="qa-major">裝備</button></div><div class="shop-potion-interface"><div class="shop-potion-list">${Array.from({length:6},(_,i)=>`<article class="shop-potion-card"><div class="shop-potion-card-head"><b class="shop-potion-name">高級恢復藥 ${i+1}</b><span class="shop-potion-stock">持有 999</span></div><p class="shop-potion-effect">恢復大量生命並測試長說明文字。</p><div class="shop-potion-purchase-row"><label>數量</label><input class="shop-potion-quantity" value="99"><span class="v146-shop-total">999,999 金幣</span><button class="shop-potion-buy qa-commerce">購買</button></div></article>`).join('')}</div></div></div>`,
            synthesis:`<div class="v141-synthesis"><div class="v141-synthesis-wallet"><span>持有金幣</span><b>9,999,999</b></div><div class="v141-synthesis-tabs"><button class="active qa-major">裝備冶煉</button><button class="qa-major">符咒合成</button><button class="qa-major">碎片合成</button></div><div class="v141-synthesis-body"><article class="v141-synthesis-card"><h3>寒泉長刀・冶煉</h3><div class="v141-material-lines"><span>圖紙 <b>50 / 100</b></span><span class="lack">寒泉礦 <b>30 / 100</b></span><span>原裝備 <b>1 / 1</b></span><span>金幣 <b>99,999 / 20,000</b></span></div><div class="v141-reforge-current">目前詞條：攻擊 +12、敏捷 +8</div><button class="v141-synthesis-primary qa-major" disabled>材料不足</button></article></div></div>`,
            quest:`<div class="quest-interface"><div class="quest-tabs"><button class="quest-tab active qa-major">每日任務</button><button class="quest-tab qa-major">委託任務</button></div><div class="quest-tab-body"><div class="quest-list">${questCards}</div></div><div class="quest-completion-panel"><div class="quest-completion-head"><span>完成度</span><strong>60%</strong></div><div class="quest-completion-track"><div class="quest-completion-fill" style="width:60%"></div></div></div></div>`,
            achievement:`<div class="v17351-achievement-shell"><div class="v17351-achievement-toolbar"><span>已完成 2 / 30</span><button class="v17351-achievement-claim-all qa-major">全部領取</button></div><div class="v17351-achievement-list">${achievementCards}</div><div class="v17351-achievement-pager"><button class="qa-major">‹</button><b>1 / 5</b><button class="qa-major">›</button></div></div>`,
            info:`${Array.from({length:18},(_,i)=>`<div class="home-feature-row"><span>${i<3?'極長怪物名稱圖鑑項目':'怪物 '+(i+1)}<br><span style="font-size:11px;color:#b3a58c;">已發現・區域資料</span></span><span>擊殺 ${i*12}</span></div>`).join('')}`
          };
          const viewports=[[360,800],[390,844],[412,915]];
          const evidence=[];
          for(const [width,height] of viewports){
            for(const [surface,markup] of Object.entries(surfaces)){
              const fixture=path.join(root,`.premium-functional-${surface}.html`);
              const wide=surface==='shop'||surface==='synthesis'||surface==='quest'||surface==='achievement'||surface==='info'?'':'wide';
              let classes='home-feature-modal show'; if(surface==='shop')classes+=' v131-shop-open';if(surface==='synthesis')classes+=' v141-synthesis-modal';if(surface==='quest')classes+=' quest-mode';
              const page=`<!doctype html><html><head><meta charset="utf-8">${links}<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403}#game-viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}#game-stage{position:relative;width:1080px;height:1920px;flex:0 0 1080px;transform-origin:center center;overflow:hidden}#game-content{position:absolute;left:0;top:0;width:420px;height:746.6667px;transform:scale(2.5714285714);transform-origin:top left}#homeFeatureModal{display:flex!important;position:absolute!important;inset:0!important;width:420px!important;height:746.6667px!important}.qa-test-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head><body><div id="game-viewport"><div id="game-stage"><div id="app"><div id="game-content"><div id="homeFeatureModal" class="${classes}"><div class="home-feature-modal-box ${wide}"><div class="home-feature-modal-title"><span class="qa-test-title">功能型 UI・${surface}</span><button class="home-feature-close-btn qa-major">返回</button></div><div id="homeFeatureModalBody">${markup}</div></div></div></div></div></div></div><pre id="qa-result"></pre><script>(function(){const stage=document.getElementById('game-stage');stage.style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')';const box=document.querySelector('.home-feature-modal-box');const br=box.getBoundingClientRect();const majors=[...document.querySelectorAll('.qa-major')];const commerce=[...document.querySelectorAll('.qa-commerce')];const minCss=els=>els.length?Math.min(...els.map(el=>parseFloat(getComputedStyle(el).minHeight)||parseFloat(getComputedStyle(el).height)||0)):999;const overflow=[...document.querySelectorAll('#homeFeatureModalBody,#characterTabContent,.quest-tab-body,.v141-synthesis-body')].some(el=>el.scrollWidth>el.clientWidth+1);document.getElementById('qa-result').textContent=JSON.stringify({viewport:[innerWidth,innerHeight],surface,docOverflow:document.documentElement.scrollWidth>innerWidth+1||document.documentElement.scrollHeight>innerHeight+1,box:{left:br.left,top:br.top,right:br.right,bottom:br.bottom},contentOverflow:overflow,majorMin:minCss(majors),commerceMin:minCss(commerce)});})();</script></body></html>`;
              fs.writeFileSync(fixture,page,'utf8');
              const url='file://'+fixture.replace(/\\/g,'/');
              const shot=path.join(out,`${width}x${height}-${surface}.png`);
              const args=['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--allow-file-access-from-files','--force-device-scale-factor=1',`--window-size=${width},${height}`,`--screenshot=${shot}`,url];
              let r=cp.spawnSync(binary,args,{encoding:'utf8',timeout:30000,maxBuffer:8*1024*1024}); assert.equal(r.status,0,r.stderr||`screenshot failed ${surface}`);
              r=cp.spawnSync(binary,['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--allow-file-access-from-files','--force-device-scale-factor=1',`--window-size=${width},${height}`,'--dump-dom',url],{encoding:'utf8',timeout:30000,maxBuffer:8*1024*1024}); assert.equal(r.status,0,r.stderr||`dump failed ${surface}`);
              const m=r.stdout.match(/<pre id="qa-result">([^<]+)<\/pre>/); assert.ok(m,`missing QA result ${surface}`);const data=JSON.parse(m[1].replace(/&quot;/g,'"').replace(/&amp;/g,'&'));
              assert.equal(data.docOverflow,false,`${width}x${height} ${surface} document overflow`);assert.equal(data.contentOverflow,false,`${width}x${height} ${surface} horizontal content overflow`);assert.ok(data.box.left>=-1&&data.box.top>=-1&&data.box.right<=width+1&&data.box.bottom<=height+1,`${width}x${height} ${surface} panel clipped`);assert.ok(data.majorMin>=44,`${surface} major hit area ${data.majorMin}`);assert.ok(data.commerceMin>=42,`${surface} commerce hit area ${data.commerceMin}`);evidence.push(data);fs.unlinkSync(fixture);
            }
          }
          const dialog=path.join(root,'.premium-functional-dialog.html');
          fs.writeFileSync(dialog,`<!doctype html><html><head>${links}</head><body><div id="v169RpgDialogLayer" class="v169-rpg-dialog-layer show"><section class="v169-rpg-dialog" data-kind="confirm" data-tone="danger"><div class="v169-rpg-dialog-crest">⚠</div><h2>刪除角色</h2><div class="v169-rpg-dialog-message">這是不可逆操作。確認長文字仍可閱讀、取消與危險按鈕不被裝飾遮住。</div><div class="v169-rpg-dialog-actions"><button class="v169-rpg-dialog-button secondary">返回</button><button class="v169-rpg-dialog-button primary danger">確認刪除</button></div></section></div></body></html>`,'utf8');
          for(const [width,height] of viewports){const url='file://'+dialog.replace(/\\/g,'/');const shot=path.join(out,`${width}x${height}-danger-dialog.png`);const r=cp.spawnSync(binary,['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--allow-file-access-from-files','--force-device-scale-factor=1',`--window-size=${width},${height}`,`--screenshot=${shot}`,url],{encoding:'utf8',timeout:30000});assert.equal(r.status,0,r.stderr||'dialog screenshot failed');}
          fs.unlinkSync(dialog);
          fs.writeFileSync(path.join(out,'evidence.json'),JSON.stringify({viewports,evidence},null,2)+'\n');
          console.log(`Premium functional responsive browser QA passed: ${evidence.length} surface/viewport checks`);
          NODE

      - name: Upload premium functional UI browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: premium-functional-ui-browser-${{ github.sha }}
          path: artifacts/browser-qa/premium-functional-ui
          if-no-files-found: error
          retention-days: 90

      - name: Write requirement batch evidence
        env:
          QA_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='release/requirement-batches/2026-09-15-premium-functional-ui.json';
          const run=Number(process.env.QA_RUN_ID||0);
          const batch={schemaVersion:1,batchId:'2026-09-15-premium-functional-ui',baseBranch:'dev',baseCommit:'7edc8e25e60b66ce88ce96e0e0076feb61e7a6d3',officialVersion:'173.65',officialVersionBumpAllowed:false,overallStatus:'VERIFIED',requirements:[
            {id:'PFUI-01',status:'VERIFIED',requirement:'登入、系統、帳號、存檔沿用正式功能 owner，只統一黑金層級與危險操作 presentation',evidence:['css/37-v139-rested-experience.css','tests/premium-functional-ui-batch1.test.js']},
            {id:'PFUI-02',status:'VERIFIED',requirement:'角色經驗池、升級、六能力 pending 配點、裝備與技能 runtime 不變並完成 presentation 統一',evidence:['css/00-main.css','css/31-v131-fix-batch.css','css/38-v141-system-expansion.css','tests/premium-functional-ui-batch2.test.js']},
            {id:'PFUI-03',status:'VERIFIED',requirement:'背包維持最新正式 18 格 × 7 頁，秘寶與物品詳情只改 presentation',evidence:['css/22-stage-v78-character-inventory-core.css','css/23-stage-v77-inventory-detail-ui.css','css/55-team-relic-system.css','tests/premium-functional-ui-batch3.test.js']},
            {id:'PFUI-04',status:'VERIFIED',requirement:'商店、合成、冶煉交易與材料規則不變，最終 cascade owner 已同步黑金層級與操作 hit area',evidence:['css/38-v141-system-expansion.css','css/49-v169-rpg-ui.css','css/53-v173.51-qa.css','tests/premium-functional-ui-batch4.test.js']},
            {id:'PFUI-05',status:'VERIFIED',requirement:'成就、公告、圖鑑、任務與 shared Modal 保留正式 state/storage/scroll/modal manager 並統一 presentation',evidence:['css/25-stage-v90-quest-interface-core.css','css/38-v141-system-expansion.css','css/49-v169-rpg-ui.css','css/53-v173.51-qa.css','tests/premium-functional-ui-batch5.test.js']},
            {id:'PFUI-06',status:'VERIFIED',requirement:'360×800、390×844、412×915 在 GitHub Chrome 完成 responsive composition、horizontal overflow、hit area 與 screenshot 驗證',evidence:['artifacts/browser-qa/premium-functional-ui/evidence.json']}
          ],automatedVerification:'FEATURE_BRANCH_FULL_REGRESSION_AND_CHROME_QA',targetedVerificationRun:run,visualVerification:'GITHUB_CHROME_SCREENSHOT_QA',promotionApproval:'PENDING_PR_TO_DEV',verifiedOnDevVersion:'173.65',releasedAs:null};
          fs.writeFileSync(file,JSON.stringify(batch,null,2)+'\n');
          NODE

      - name: Final diff and temporary-file checks
        run: |
          set -euo pipefail
          npm run build:check
          git diff --check
          test -z "$(find .github/scripts -maxdepth 1 -type f -name 'premium-functional-ui-*' -print)"
          temp_workflows="$(find .github/workflows -maxdepth 1 -type f -name 'premium-functional-ui-*' ! -name 'premium-functional-ui-finalize.yml' -print)"
          test -z "$temp_workflows"
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(build/|asset-manifest\.json$|index\.html$|release/requirement-batches/2026-09-15-premium-functional-ui\.json$)' || true)"
          if [ -n "$unexpected" ]; then printf 'Unexpected final output:\n%s\n' "$unexpected" >&2; exit 1; fi

      - name: Save build, requirement evidence and remove finalizer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/premium-functional-ui-finalize.yml
          git add -A build asset-manifest.json index.html release/requirement-batches/2026-09-15-premium-functional-ui.json
          git diff --cached --check
          git commit -m "chore: sync premium UI build and verification evidence"
          git push origin HEAD:feature/premium-functional-ui
