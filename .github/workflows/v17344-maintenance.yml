name: V173.44 maintenance

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    name: Apply V173.44 maintenance
    if: "github.event.head_commit.message == 'chore: run V173.44 maintenance'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - name: Apply maintenance script
        run: python3 .github/scripts/v17344_maintenance.py

      - name: Minimal maintenance checks
        run: |
          node --check js/00-main.js
          node --check js/20-anonymous-20.js
          node --check js/27-v132-content-expansion.js
          node --check js/28-v133-economy-rebalance.js
          node --check js/35-v141-ui-battle.js
          node --check js/42-v148-combat-dungeon-fixes.js
          node --check js/50-v169-water-skill-rules.js
          node tests/v173.44-maintenance.test.js
          node .github/scripts/ci.mjs loader

      - name: Commit maintenance batch
        run: |
          git config user.name "tf00913225-alt"
          git config user.email "tf00913225@gmail.com"
          git add AGENTS.md index.html js tests
          git commit -m "fix: V173.44 daily dungeon and water learning maintenance"
          git push origin HEAD:dev
