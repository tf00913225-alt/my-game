name: V173.61 integration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17361-inspect.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Import approved item art from assets-library
        run: |
          git fetch origin assets-library
          mkdir -p assets/items/materials assets/items/chests
          git show "origin/assets-library:assets/inbox/道具icon/礦石.png" > assets/items/materials/ore.png
          git show "origin/assets-library:assets/inbox/道具icon/副本與背包的寶箱.png" > assets/items/chests/dungeon-chest.png
          file assets/items/materials/ore.png assets/items/chests/dungeon-chest.png

      - name: Apply V173.61 source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path,text):
              Path(path).write_text(text,encoding='utf-8')
          def replace_once(path,old,new,label):
              s=read(path)
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              write(path,s.replace(old,new,1))
          def append_once(path,marker,block):
              s=read(path)
              if marker in s:
                  return
              if not s.endswith('\n'):
                  s+='\n'
              write(path,s+block.strip('\n')+'\n')

          # Release/cache wiring.
          write('index.html',read('index.html').replace('173.60','173.61'))
          for path in [
              'js/20-anonymous-20.js',
              'js/51-v169-rpg-ui.js',
              'js/53-v173.50-inventory-qol.js',
              'js/equipment-progression.js'
          ]:
              write(path,read(path).replace('173.60','173.61'))
          version_tests=[
              'tests/v173.20-startup-loader.test.js',
              'tests/v173.47-runtime-integrity.test.js',
              'tests/v173.48-premium-shop-layout.test.js',
              'tests/v173.49-exp-pool-scroll-stability.test.js',
              'tests/v173.50-inventory-qol.test.js',
              'tests/v173.51-qa.test.js',
              'tests/v173.53-startup-stall-regression.test.js',
              'tests/v173.54-qa-readiness.test.js',
              'tests/v173.55-inventory-observer-stall.test.js',
              'tests/v173.60-formal-tiers-talismans.test.js'
          ]
          for path in version_tests:
              write(path,read(path).replace('173.60','173.61'))

          # Patrol page: add power-saving control beside the two existing shared toggles.
          p='index.html'; s=read(p)
          anchor='''    <button
                  id="quickAutoPatrolToggle"
                  class="map-quick-toggle-btn"
                  onclick="toggleAutoPatrol()"
                  aria-label="自動巡怪"
              >
                  <img class="icon-off" src="assets/battle/auto-patrol-off.png" alt="自動巡怪（關閉）">
                  <img class="icon-on" src="assets/battle/auto-patrol-on.png" alt="自動巡怪（開啟中）">
              </button>
          '''
          if s.count(anchor)!=1:
              raise SystemExit(f'patrol button anchor count={s.count(anchor)}')
          power='''
              <button
                  id="quickPowerSavingToggle"
                  class="map-quick-toggle-btn v17361-power-save-toggle"
                  type="button"
                  onclick="v17361TogglePowerSaving()"
                  aria-label="省電模式"
                  aria-pressed="false"
              >省電 OFF</button>
          '''
          write(p,s.replace(anchor,anchor+power,1))

          # Shared item art: the supplied ore art is reused across formal tiers, while rarity stays on the frame.
          replace_once(
              'js/27-v132-content-expansion.js',
              'icon:oreIcon(tier.key),',
              'icon:rasterItemIcon("assets/items/materials/ore.png",tier.key,"material"),',
              'ore art'
          )
          p='js/27-v132-content-expansion.js'; s=read(p)
          chest_anchor='''    function chestIcon(){
              const c=TIER_COLORS.blue;
              return svgWrap(
                  '<rect x="8" y="26" width="48" height="30" rx="3" '+
                  'fill="#2a1c0e" stroke="'+c.main+'" stroke-width="2.5"/>'+
                  '<path d="M8 30 Q32 12 56 30" fill="#3a270f" stroke="'+c.main+'" stroke-width="2.5"/>'+
                  '<rect x="27" y="26" width="10" height="18" fill="'+c.glow+'" opacity="0.85"/>'+
                  '<circle cx="32" cy="34" r="3.4" fill="#2a1c0e" stroke="'+c.glow+'" stroke-width="1.4"/>',
                  c.glow
              );
          }
          '''
          if s.count(chest_anchor)!=1:
              raise SystemExit(f'chest helper anchor count={s.count(chest_anchor)}')
          chest_new='''    function chestIcon(){
              return rasterItemIcon("assets/items/chests/dungeon-chest.png","blue","chest");
          }
          
              // All current/future general-dungeon backpack chests reuse one visual source;
              // the item name remains the semantic distinction.
              window.v17361GeneralDungeonChestIcon=chestIcon;
          '''
          write(p,s.replace(chest_anchor,chest_new,1))

          # Retire only the old CSS-class skill flash; keep the existing Canvas particles and later Sprite VFX.
          p='js/35-v141-ui-battle.js'; s=read(p)
          old='''    window.v141PlayCardEffect=function(side,index,type){
              const card=cardFor(side,index);
              if(!card){ return; }
              const className="v141-once-"+type;
              card.classList.remove(className);
              void card.offsetWidth;
              card.classList.add(className);
              playCanvasParticles(card,type);
              setTimeout(()=>card.classList.remove(className),850);
          };
          '''
          new='''    window.v141PlayCardEffect=function(side,index,type){
              const card=cardFor(side,index);
              if(!card){ return; }
              // V173.61: CSS skill flashes are retired. Keep non-CSS Canvas particles;
              // js/39 continues to own current Sprite/VFX timing and status synchronization.
              playCanvasParticles(card,type);
          };
          '''
          if s.count(old)!=1:
              raise SystemExit(f'v141PlayCardEffect anchor count={s.count(old)}')
          write(p,s.replace(old,new,1))

          p='css/38-v141-system-expansion.css'; s=read(p)
          patterns=[
              r'\n#game-stage #battlePage \.v141-once-heal,\n#game-stage #battlePage \.v141-once-potion\{\n    animation:v141HealFlash \.82s ease-out !important;\n\}\n\n#game-stage #battlePage \.v141-once-revive\{\n    animation:v141ReviveFlash \.82s ease-out !important;\n\}\n\n#game-stage #battlePage \.v141-once-talisman\{\n    animation:v141TalismanFlash \.82s ease-out !important;\n\}\n',
              r'\n@keyframes v141HealFlash\{[^\n]*\}\n@keyframes v141ReviveFlash\{[^\n]*\}\n@keyframes v141TalismanFlash\{[^\n]*\}\n'
          ]
          for i,pattern in enumerate(patterns,1):
              s,count=re.subn(pattern,'\n',s,count=1)
              if count!=1:
                  raise SystemExit(f'css skill animation block {i} count={count}')
          write(p,s)

          # Battle SFX: raise only the procedural battle master, not UI/global audio.
          replace_once('js/34-v141-core-systems.js','master.gain.value=0.22;','master.gain.value=0.30;','battle audio gain')

          # Live quest state refresh: only redraw the already-open quest body when progress actually changes.
          p='js/34-v141-core-systems.js'; s=read(p)
          old='''    function recordQuestProgress(id,amount,type){
              if(typeof ensureDailyQuestsCurrent!=="function"){ return; }
              ensureDailyQuestsCurrent();
              const state=type==="commission"?commissionQuestState:dailyQuestState;
              const definitions=type==="commission"?commissionQuestDefinitions:dailyQuestDefinitions;
              const quest=definitions.find(item=>item.id===id);
              if(!quest){ return; }
              state.progress[id]=Math.min(quest.goal,(Number(state.progress[id])||0)+Math.max(0,Number(amount)||0));
          }
          '''
          new='''    function recordQuestProgress(id,amount,type){
              if(typeof ensureDailyQuestsCurrent!=="function"){ return; }
              ensureDailyQuestsCurrent();
              const state=type==="commission"?commissionQuestState:dailyQuestState;
              const definitions=type==="commission"?commissionQuestDefinitions:dailyQuestDefinitions;
              const quest=definitions.find(item=>item.id===id);
              if(!quest){ return; }
              const before=Number(state.progress[id])||0;
              const after=Math.min(quest.goal,before+Math.max(0,Number(amount)||0));
              if(after===before){ return; }
              state.progress[id]=after;
              if(typeof window.v17361RefreshOpenQuestPage==="function"){ window.v17361RefreshOpenQuestPage(); }
              if(typeof window.v148SyncQuestNoticeDots==="function"){ window.v148SyncQuestNoticeDots(); }
          }
          '''
          if s.count(old)!=1:
              raise SystemExit(f'recordQuestProgress anchor count={s.count(old)}')
          s=s.replace(old,new,1)

          # Screen Wake Lock authority + patrol power-saving preference.
          wake_block=r'''
          
              /* =====================================================
                 V173.61 — screen wake / patrol power-saving owner
                 Normal mode attempts Screen Wake Lock after the first user gesture.
                 Power-saving mode releases it and lets the OS/browser dim normally.
              ===================================================== */
              const V17361_POWER_SAVE_KEY="v17361_patrol_power_saving";
              let v17361ScreenWakeLock=null;
          
              function v17361PowerSavingEnabled(){
                  try{ return localStorage.getItem(V17361_POWER_SAVE_KEY)==="1"; }catch(_){ return false; }
              }
              function v17361SyncPowerSavingButton(){
                  if(typeof document==="undefined"){ return; }
                  const button=document.getElementById("quickPowerSavingToggle");
                  if(!button){ return; }
                  const enabled=v17361PowerSavingEnabled();
                  button.classList.toggle("active",enabled);
                  button.setAttribute("aria-pressed",enabled?"true":"false");
                  button.textContent=enabled?"省電 ON":"省電 OFF";
                  button.title=enabled?"允許螢幕依系統設定休眠":"遊戲會嘗試保持螢幕常亮";
              }
              async function v17361ReleaseWakeLock(){
                  const lock=v17361ScreenWakeLock;
                  v17361ScreenWakeLock=null;
                  if(lock&&typeof lock.release==="function"){
                      try{ await lock.release(); }catch(_){ }
                  }
              }
              async function v17361RequestWakeLock(){
                  v17361SyncPowerSavingButton();
                  if(v17361PowerSavingEnabled()||typeof document==="undefined"||document.visibilityState!=="visible"){
                      await v17361ReleaseWakeLock();
                      return false;
                  }
                  if(typeof navigator==="undefined"||!navigator.wakeLock||typeof navigator.wakeLock.request!=="function"){ return false; }
                  if(v17361ScreenWakeLock&&!v17361ScreenWakeLock.released){ return true; }
                  try{
                      const lock=await navigator.wakeLock.request("screen");
                      v17361ScreenWakeLock=lock;
                      if(lock&&typeof lock.addEventListener==="function"){
                          lock.addEventListener("release",()=>{ if(v17361ScreenWakeLock===lock){ v17361ScreenWakeLock=null; } });
                      }
                      return true;
                  }catch(_){
                      v17361ScreenWakeLock=null;
                      return false;
                  }
              }
              window.v17361TogglePowerSaving=function(){
                  const next=!v17361PowerSavingEnabled();
                  try{ localStorage.setItem(V17361_POWER_SAVE_KEY,next?"1":"0"); }catch(_){ }
                  v17361SyncPowerSavingButton();
                  if(next){ void v17361ReleaseWakeLock(); }
                  else{ void v17361RequestWakeLock(); }
                  return next;
              };
              window.v17361RequestWakeLock=v17361RequestWakeLock;
              window.v17361ReleaseWakeLock=v17361ReleaseWakeLock;
              if(typeof document!=="undefined"){
                  document.addEventListener("pointerdown",()=>{ void v17361RequestWakeLock(); },{once:true,passive:true});
                  document.addEventListener("visibilitychange",()=>{
                      if(document.visibilityState==="visible"){ void v17361RequestWakeLock(); }
                      else{ void v17361ReleaseWakeLock(); }
                  });
                  setTimeout(v17361SyncPowerSavingButton,0);
              }
          '''
          if 'V17361_POWER_SAVE_KEY' not in s:
              pos=s.rfind('\n})();')
              if pos<0:
                  raise SystemExit('js34 final IIFE anchor missing')
              s=s[:pos]+wake_block+s[pos:]
          write(p,s)

          # Quest list owner: claim-all controls + targeted redraw + bulk-claim suppression.
          p='js/00-main.js'; s=read(p)
          helper_anchor='''function renderCommissionQuestListContent(){
          
              return renderQuestListGeneric(
                  commissionQuestDefinitions,
                  commissionQuestState,
                  "claimCommissionQuest"
              );
          
          }
          '''
          helper_insert=r'''
          
          function getClaimableQuestIds(definitions,state){
              return (definitions||[]).filter(function(quest){
                  return quest && !state.claimed[quest.id] &&
                      (Number(state.progress[quest.id])||0)>=Math.max(1,Number(quest.goal)||1);
              }).map(function(quest){ return quest.id; });
          }
          
          function v17361SyncQuestClaimAllButton(isCommission){
              const button=$("questClaimAllButton");
              if(!button){ return; }
              const definitions=isCommission?commissionQuestDefinitions:dailyQuestDefinitions;
              const state=isCommission?commissionQuestState:dailyQuestState;
              const count=getClaimableQuestIds(definitions,state).length;
              button.disabled=count<=0;
              button.textContent=count>0?"一鍵領取（"+count+"）":"一鍵領取";
              button.onclick=isCommission?v17361ClaimAllCommissionQuests:v17361ClaimAllDailyQuests;
          }
          
          function v17361RefreshOpenQuestPage(){
              const body=$("questTabBody");
              if(!body){ return false; }
              const commissionBtn=$("questTabBtnCommission");
              const isCommission=!!(commissionBtn&&commissionBtn.classList.contains("active"));
              const scrollTop=body.scrollTop;
              body.innerHTML=isCommission?renderCommissionQuestListContent():renderDailyQuestListContent();
              const completionPanel=$("questCompletionPanel");
              if(completionPanel){
                  completionPanel.innerHTML=renderQuestCompletionPanelContent(
                      isCommission?commissionQuestDefinitions:dailyQuestDefinitions,
                      isCommission?commissionQuestState:dailyQuestState
                  );
              }
              body.scrollTop=scrollTop;
              v17361SyncQuestClaimAllButton(isCommission);
              return true;
          }
          window.v17361RefreshOpenQuestPage=v17361RefreshOpenQuestPage;
          '''
          if s.count(helper_anchor)!=1:
              raise SystemExit(f'quest helper anchor count={s.count(helper_anchor)}')
          s=s.replace(helper_anchor,helper_anchor+helper_insert,1)

          toolbar_anchor='''            '</div>'+\n\n            '<div id="questTabBody" class="quest-tab-body" role="tabpanel">'+'''
          toolbar_new='''            '</div>'+\n\n            '<div class="quest-batch-actions">'+\n                '<button id="questClaimAllButton" class="quest-claim-all-btn" type="button" '+\n                    (getClaimableQuestIds(\n                        isCommission?commissionQuestDefinitions:dailyQuestDefinitions,\n                        isCommission?commissionQuestState:dailyQuestState\n                    ).length?'':'disabled ')+\n                    'onclick="'+(isCommission?'v17361ClaimAllCommissionQuests()':'v17361ClaimAllDailyQuests()')+'">一鍵領取</button>'+\n            '</div>'+\n\n            '<div id="questTabBody" class="quest-tab-body" role="tabpanel">'+'''
          if s.count(toolbar_anchor)!=1:
              raise SystemExit(f'quest toolbar anchor count={s.count(toolbar_anchor)}')
          s=s.replace(toolbar_anchor,toolbar_new,1)

          pattern=r'(function switchQuestTab\(tabName\)\{[\s\S]*?)(\n\}\n\n\n/\*\n   ★ 新增\(依照使用者要求，新增副本/BOSS)'
          match=re.search(pattern,s)
          if not match:
              raise SystemExit('switchQuestTab injection anchor missing')
          body=match.group(1)
          if 'v17361SyncQuestClaimAllButton(isCommission);' not in body:
              body+='\n    v17361SyncQuestClaimAllButton(isCommission);\n'
          s=s[:match.start()]+body+match.group(2)+s[match.end():]

          daily_switch='''    switchQuestTab(
              "daily"
          );'''
          commission_switch='''    switchQuestTab(
              "commission"
          );'''
          if s.count(daily_switch)!=1 or s.count(commission_switch)!=1:
              raise SystemExit(f'quest claim switch anchors daily={s.count(daily_switch)} commission={s.count(commission_switch)}')
          s=s.replace(daily_switch,'    if(!window.__v17361BulkQuestClaim){ switchQuestTab("daily"); }',1)
          s=s.replace(commission_switch,'    if(!window.__v17361BulkQuestClaim){ switchQuestTab("commission"); }',1)

          bestiary_anchor='''/* =====================================================
             ★ 圖鑑
          ===================================================== */'''
          bulk=r'''
          function v17361ClaimAllQuestGroup(definitions,state,claimFn,title){
              const ids=getClaimableQuestIds(definitions,state);
              if(!ids.length){ v17361RefreshOpenQuestPage(); return 0; }
              window.__v17361BulkQuestClaim=true;
              try{ ids.forEach(function(id){ claimFn(id); }); }
              finally{ window.__v17361BulkQuestClaim=false; }
              v17361RefreshOpenQuestPage();
              if(typeof window.rpgAlert==="function"){
                  void window.rpgAlert("已一鍵領取 "+ids.length+" 個"+title+"獎勵。",{title:title+"獎勵",confirmText:"知道了",tone:"success"});
              }
              return ids.length;
          }
          function v17361ClaimAllDailyQuests(){
              return v17361ClaimAllQuestGroup(dailyQuestDefinitions,dailyQuestState,claimDailyQuest,"每日任務");
          }
          function v17361ClaimAllCommissionQuests(){
              return v17361ClaimAllQuestGroup(commissionQuestDefinitions,commissionQuestState,claimCommissionQuest,"委託任務");
          }
          window.v17361ClaimAllDailyQuests=v17361ClaimAllDailyQuests;
          window.v17361ClaimAllCommissionQuests=v17361ClaimAllCommissionQuests;
          
          '''
          if s.count(bestiary_anchor)!=1:
              raise SystemExit(f'bestiary anchor count={s.count(bestiary_anchor)}')
          s=s.replace(bestiary_anchor,bulk+bestiary_anchor,1)
          write(p,s)

          # Existing V173.51 per-item reward popups stay, but bulk claim emits only one summary popup.
          p='js/57-v173.51-quest-qa.js'; s=read(p)
          count=s.count('if(!b&&a&&q)')
          if count!=2:
              raise SystemExit(f'quest QA popup anchors count={count}')
          write(p,s.replace('if(!b&&a&&q)','if(!window.__v17361BulkQuestClaim&&!b&&a&&q)'))

          # High-end image-first reward previews for EXP / materials / gold.
          p='js/42-v148-combat-dungeon-fixes.js'; s=read(p)
          old=r'''    window.v148ShowDailyDungeonPreview=function(type){
              const meta=DAILY_DUNGEON_META[type];
              if(!meta||typeof window.v132ShowRewardModal!=="function"){ return; }
              const layout=dailyPartyContext().soloProtected
                  ?"6普通 → 5普通+1精英 → 4普通+1精英+1BOSS"
                  :"6普通 → 4普通+2精英 → 3普通+2精英+1BOSS";
              const html='<div class="v132-reward-modal-inner"><h3>'+meta.title+'獎勵預覽</h3><p>'+meta.reward+'</p>'+
                  '<p>固定3輪×6隻：'+layout+'。</p>'+
                  '<div class="v132-reward-actions"><button type="button" onclick="v132CloseRewardModal()">返回</button></div></div>';
              window.v132ShowRewardModal(html);
          };
          '''
          new=r'''    function v17361DailyRewardVisual(type){
              if(type==="material"){
                  return '<div class="v17361-reward-visual single"><div class="v17361-reward-icon material" aria-label="材料寶箱與礦石">'+
                      '<img class="v17361-chest-art" src="assets/items/chests/dungeon-chest.png" alt="材料寶箱">'+
                      '<img class="v17361-ore-mini" src="assets/items/materials/ore.png" alt="礦石">'+
                      '<em>1–3</em></div></div>';
              }
              if(type==="gold"){
                  return '<div class="v17361-reward-visual single"><div class="v17361-reward-icon cover" aria-label="金幣獎勵">'+
                      '<img src="assets/dungeons/covers/gold-v17344.png" alt="金幣"></div></div>';
              }
              return '<div class="v17361-reward-visual single"><div class="v17361-reward-icon" aria-label="經驗獎勵">'+
                  '<img src="assets/ui/home-offline-exp.png" alt="經驗"></div></div>';
          }
          window.v148ShowDailyDungeonPreview=function(type){
              const meta=DAILY_DUNGEON_META[type];
              if(!meta||typeof window.v132ShowRewardModal!=="function"){ return; }
              const html='<div class="v132-reward-modal-inner v17361-reward-preview"><h3>'+meta.title+'獎勵預覽</h3>'+v17361DailyRewardVisual(type)+
                  '<div class="v132-reward-actions"><button type="button" onclick="v132CloseRewardModal()">返回</button></div></div>';
              window.v132ShowRewardModal(html);
          };
          '''
          if s.count(old)!=1:
              raise SystemExit(f'daily preview anchor count={s.count(old)}')
          write(p,s.replace(old,new,1))

          # Equipment dungeon preview joins the same visual language and uses real equipment art.
          p='js/equipment-progression.js'; s=read(p)
          old=r'''    window.v17346ShowEquipmentDungeonPreview=function(){
              if(typeof window.v132ShowRewardModal!=="function"){ return; }
              const html='<div class="v132-reward-modal-inner v17346-preview-modal"><h3>裝備副本獎勵預覽</h3><div class="v132-preview-list-scroll"><div class="v132-preview-reward"><span>⬜</span><b>白裝</b><strong>40%</strong><small>固定1詞條 +1～3</small></div><div class="v132-preview-reward"><span>🟦</span><b>藍裝</b><strong>40%</strong><small>固定1詞條 +4～6</small></div><div class="v132-preview-reward"><span>🟪</span><b>紫裝</b><strong>15%</strong><small>固定1詞條 +7～9・可冶煉×1</small></div><div class="v132-preview-reward"><span>🟧</span><b>橙裝</b><strong>5%</strong><small>固定1詞條 +10～12・可冶煉×1</small></div><p>勝利獲得2個寶箱，每箱3件；看廣告雙倍為12件裝備。</p></div><div class="v132-reward-actions"><button type="button" onclick="v132CloseRewardModal()">返回</button></div></div>';
              window.v132ShowRewardModal(html);
          };
          '''
          new=r'''    window.v17346ShowEquipmentDungeonPreview=function(){
              if(typeof window.v132ShowRewardModal!=="function"){ return; }
              const rewards=[
                  ["white","assets/equipment/warrior/head-01.png","40%"],
                  ["blue","assets/equipment/warrior/armor-01.png","40%"],
                  ["purple","assets/equipment/warrior/shoes-01.png","15%"],
                  ["orange","assets/equipment/warrior/weapon-01.png","5%"]
              ];
              const tiles=rewards.map(entry=>'<div class="v17361-reward-icon rarity-'+entry[0]+'"><img src="'+entry[1]+'" alt=""><em>'+entry[2]+'</em></div>').join("");
              const html='<div class="v132-reward-modal-inner v17346-preview-modal v17361-reward-preview"><h3>裝備副本獎勵預覽</h3><div class="v17361-reward-visual equipment">'+tiles+'</div><div class="v17361-chest-count" aria-label="兩個裝備寶箱"><img src="assets/items/chests/dungeon-chest.png" alt=""><b>×2</b></div><div class="v132-reward-actions"><button type="button" onclick="v132CloseRewardModal()">返回</button></div></div>';
              window.v132ShowRewardModal(html);
          };
          '''
          if s.count(old)!=1:
              raise SystemExit(f'equipment preview anchor count={s.count(old)}')
          write(p,s.replace(old,new,1))

          # Shared return-button center fill, patrol power-save button, quest batch control.
          append_once('css/00-main.css','V173.61 — shared return icon center fill',r'''
          /* V173.61 — shared return icon center fill / patrol power saving / quest batch action */
          #game-stage img[src*="map-return.png"]{
              background:#050505;
              border-radius:50%;
          }
          #game-stage .map-quick-toggle-btn.v17361-power-save-toggle{
              width:auto !important;
              min-width:64px;
              padding:0 9px !important;
