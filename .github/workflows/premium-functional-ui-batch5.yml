name: Premium Functional UI Batch 5

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-batch5.yml
      - .github/scripts/premium-functional-ui-batch5.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply Batch 5 in information and shared modal presentation owners
        run: |
          set -euo pipefail
          before_runtime="$(sha256sum js/00-main.js js/34-v141-core-systems.js js/35-v141-ui-battle.js js/51-v169-rpg-ui.js js/57-v173.51-quest-qa.js js/startup/account-save-repository.js | sha256sum | awk '{print $1}')"
          python3 .github/scripts/premium-functional-ui-batch5.py
          after_runtime="$(sha256sum js/00-main.js js/34-v141-core-systems.js js/35-v141-ui-battle.js js/51-v169-rpg-ui.js js/57-v173.51-quest-qa.js js/startup/account-save-repository.js | sha256sum | awk '{print $1}')"
          test "$before_runtime" = "$after_runtime"
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "css/25-stage-v90-quest-interface-core.css
          css/38-v141-system-expansion.css
          css/49-v169-rpg-ui.css
          css/53-v173.51-qa.css"
          test -f tests/premium-functional-ui-batch5.test.js
      - name: Run Batch 5 targeted regression
        run: |
          set -euo pipefail
          node tests/premium-functional-ui-batch1.test.js
          node tests/premium-functional-ui-batch2.test.js
          node tests/premium-functional-ui-batch3.test.js
          node tests/premium-functional-ui-batch4.test.js
          node tests/premium-functional-ui-batch5.test.js
          node tests/v173.28-main-city-lobby.test.js
          node tests/v141-system-expansion.test.js
          node tests/v173.51-qa.test.js
          node tests/v169-rpg-ui.test.js
          node tests/ui-large-panel-followup.test.js
          node tests/ui-typography-standard.test.js
          git diff --check
      - name: Save verified Batch 5 and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/premium-functional-ui-batch5.yml .github/scripts/premium-functional-ui-batch5.py
          git add css/25-stage-v90-quest-interface-core.css css/38-v141-system-expansion.css css/49-v169-rpg-ui.css css/53-v173.51-qa.css tests/premium-functional-ui-batch5.test.js
          git diff --cached --check
          git commit -m "feat: 統一資訊頁與共用彈窗質感"
          git push origin HEAD:feature/premium-functional-ui
