name: VFX owner cleanup

on:
  push:
    branches:
      - fix/combat-vfx-owner-cleanup-20260909

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply raster-only cleanup and historical contract migration
        run: |
          python .github/scripts/zz-vfx-final-cleanup.py
          python .github/scripts/zz-vfx-historical-test-migration.py
      - name: Source guard and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,sys
          rules={
            "js/35-v141-ui-battle.js":r'playCanvasParticles|v141-effect-canvas|getContext\(|createElement\(["\']canvas["\']\)',
            "js/37-v142-skill-animation.js":r'v142-particle-canvas|getContext\(|createElement\(["\']canvas["\']\)|<svg\b',
            "js/38-v143-system-fixes.js":r'v143-earth-shield-effect',
            "js/39-v143-skill-animation.js":r'canvas-crop|getContext\(|drawImage\(|createElement\(["\']canvas["\']\)|v149-word-|v143-cast-charge|v143-skill-flight|v143-hit-impact|v143-hit-particle|WebGLRenderingContext|createShader|shaderSource|getContext\(["\']webgl',
            "js/43-v149-skill-ui-rules.js":r'installWordCircleDirector|v149-word-|v149-barrier-corners',
            "js/46-v155-dev-fixes.js":r'v143SkillAnimationManifest',
            "js/59-abyss-two-tier-runtime.js":r'v143SkillAnimationManifest|patchExistingV143ExplosiveFlurryRenderer|canvas-crop',
            "css/38-v141-system-expansion.css":r'\.v141-effect-canvas|\.v141-effect-burn|v141BurnFlicker|v141StunOrbit',
            "css/40-v143-combat-dungeon-polish.css":r'v143-earth-shield-effect|v143EarthCornerBreath|\.v143-cast-charge|\.v143-skill-flight|\.v143-hit-impact|\.v143-hit-particle|\.v143-skill-field',
            "css/42-v146-system-polish.css":r'v143-earth-shield-effect',
            "css/44-v149-skill-ui-rules.css":r'v149-word-circle-stage|v149-barrier-corners|v149BarrierCornerPulse'
          }
          hits=[]
          for path,pattern in rules.items():
              rx=re.compile(pattern,re.I)
              for no,line in enumerate(Path(path).read_text().splitlines(),1):
                  if rx.search(line): hits.append(f"{path}:{no}:{line.strip()}")
          if hits:
              print("Legacy combat VFX source remains:\n"+"\n".join(hits))
              sys.exit(1)
          PY
          for file in js/35-v141-ui-battle.js js/37-v142-skill-animation.js js/38-v143-system-fixes.js js/39-v143-skill-animation.js js/43-v149-skill-ui-rules.js js/46-v155-dev-fixes.js js/59-abyss-two-tier-runtime.js; do node --check "$file"; done
      - name: Commit verified contract migration before tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add HANDOFF.md js/38-v143-system-fixes.js js/43-v149-skill-ui-rules.js js/46-v155-dev-fixes.js css/38-v141-system-expansion.css css/40-v143-combat-dungeon-polish.css css/42-v146-system-polish.css css/44-v149-skill-ui-rules.css tests/v149-skill-ui-rules.test.js tests/v153-fire-vfx.test.js tests/v166-water-vfx.test.js tests/v173.23-wind-vfx.test.js tests/v173.39-earth-light-vfx.test.js tests/v174-raster-only-combat-vfx-owner.test.js
          if ! git diff --cached --quiet; then
            git commit -m "test: align historical suites with raster-only VFX owner"
            git push origin HEAD:fix/combat-vfx-owner-cleanup-20260909
          fi
      - name: Focused combat VFX regressions
        run: |
          node tests/v174-raster-only-combat-vfx-owner.test.js
          node tests/v149-skill-ui-rules.test.js
          node tests/v153-fire-vfx.test.js
          node tests/v166-water-vfx.test.js
          node tests/v173.23-wind-vfx.test.js
          node tests/v173.39-earth-light-vfx.test.js
          node tests/abyss-two-tier-refactor.test.js
          node tests/boss-mechanism-vfx-card-ui-20260909.test.js
          node tests/v173.62-direct-skill-animation-trigger.test.js
      - name: Full repository checks
        run: |
          if ! command -v identify >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install --yes --no-install-recommends imagemagick; fi
          for sha in 39767ce2b9dbfa59650b7c5fd4d52a57a2642ea5 4a592dd4c41d7efb1a4849fbfe0cbf68598121bf; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha"
          done
          node .github/scripts/ci.mjs syntax
          node .github/scripts/ci.mjs tests
          node .github/scripts/ci.mjs resources
          node .github/scripts/ci.mjs html-ids
          node .github/scripts/ci.mjs loader
