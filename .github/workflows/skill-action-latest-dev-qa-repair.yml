name: Skill action latest-dev QA repair
on:
  push:
    branches:
      - fix/skill-action-dom-presentation-runtime-qa-rebased-20260930
    paths:
      - .github/workflows/skill-action-latest-dev-qa-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-action-dom-presentation-runtime-qa-rebased-20260930
          fetch-depth: 0
      - name: Apply runtime presentation repair and synchronize production build
        run: |
          curl -fsSL https://api.github.com/repos/tf00913225-alt/my-game/git/blobs/e8169855d0c4ed6e16b75a4f74a18c478765137d | jq -r .content | tr -d '\n' | base64 -d | gzip -d > /tmp/skill-action-qa-repair.patch
          git apply /tmp/skill-action-qa-repair.patch
          npm run build
          git rm .github/workflows/skill-action-latest-dev-qa-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/run-skill-progression-browser-qa.mjs css/00-main.css js/41-v146-system-polish.js index.html asset-manifest.json build
          git commit -m "fix: stabilize semantic skill action presentation"
          git push origin HEAD:fix/skill-action-dom-presentation-runtime-qa-rebased-20260930
