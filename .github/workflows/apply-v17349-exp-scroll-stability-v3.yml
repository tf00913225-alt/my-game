name: Apply V173.49 EXP stability

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'launch V173.49 EXP stability helper')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply patch
        run: |
          python .github/scripts/apply_v17349_exp_scroll_stability.py
          node --check js/28-v133-economy-rebalance.js
          node --check js/20-anonymous-20.js
          node --check js/51-v169-rpg-ui.js
          grep -q 'function v173CaptureExpPoolViewport' js/28-v133-economy-rebalance.js
          grep -q 'overflow-anchor:none !important' css/49-v169-rpg-ui.css
          grep -q 'touch-action:none !important' css/49-v169-rpg-ui.css
          grep -q 'V173.49' index.html
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/28-v133-economy-rebalance.js css/49-v169-rpg-ui.css js/20-anonymous-20.js js/51-v169-rpg-ui.js index.html tests
          git commit -m "V173.49 stabilize EXP allocation viewport"
          git push origin HEAD:dev
