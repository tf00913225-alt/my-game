name: Temporary feature patch and production rebuild

on:
  push:
    branches:
      - feature/boss-balance-gameplay-relic-lv20-20260911

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/boss-balance-gameplay-relic-lv20-20260911
          fetch-depth: 0

      - name: Normalize temporary patch-script test compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/tmp-apply-boss-relic-lv20-20260911.mjs')
          source=path.read_text()
          replacements=[
            ('assert.equal(context.skillDatabase[skillId].element,boss.element,`${id} contains cross-element skill ${skillId}`);',
             'assert.equal(context.skillDatabase[skillId].element,boss.element,id+" contains cross-element skill "+skillId);'),
            ('assert.deepEqual(context.currentBattleMonsters,[0,1,2]);',
             'assert.deepEqual(value(context,"currentBattleMonsters"),[0,1,2]);')
          ]
          for old,new in replacements:
              if old not in source:
                  raise SystemExit('temporary patch-script compatibility anchor missing: '+old)
              source=source.replace(old,new,1)
          lines=source.splitlines()
          for i,line in enumerate(lines):
              if '"<style>html,body{margin:0;width:390px;min-height:844px;background:#000}#game-stage{width:390px;height:844px}"+css.replace' in line:
                  lines[i]='"<style>html,body{margin:0;width:390px;min-height:844px;background:#000}#game-stage{width:390px;height:844px}"+css+"</style>"+'
              if '"<script>(function(){var card=document.querySelector' in line:
                  lines[i]='"<script>(function(){var card=document.querySelector(\'.gameplay-mode-card\');var r=card.getBoundingClientRect();var hint=getComputedStyle(document.querySelector(\'.skill-preview-body\'),\'::before\');var out={width:r.width,height:r.height,ratio:r.width/r.height,content:hint.content,whiteSpace:hint.whiteSpace,textAlign:hint.textAlign,fontSize:parseFloat(hint.fontSize),overflowX:document.documentElement.scrollWidth-window.innerWidth};document.body.setAttribute(\'data-qa\',encodeURIComponent(JSON.stringify(out)));})();</scr"+"ipt>";'
          source='\n'.join(lines)+'\n'
          path.write_text(source)
          PY

      - name: Apply focused source and test patches
        run: node scripts/tmp-apply-boss-relic-lv20-20260911.mjs

      - name: Syntax check changed runtime owners
        run: |
          node --check js/gameplay-boss-tower-system.js
          node --check js/relic-progression-drop-system.js
          node --check tests/gameplay-ui-mobile-browser.test.js

      - name: Boss runtime tests
        run: node tests/gameplay-boss-tower-system.test.js

      - name: Relic progression tests
        run: node tests/v174-relic-progression-drop-system.test.js

      - name: Gameplay mobile browser test
        run: node tests/gameplay-ui-mobile-browser.test.js

      - name: Regenerate production assets
        run: |
          node scripts/build-production.mjs
          node scripts/build-production.mjs --check

      - name: Verify repository loader after rebuild
        run: node .github/scripts/ci.mjs loader

      - name: Remove temporary automation files and stage
        run: |
          rm -f scripts/tmp-apply-boss-relic-lv20-20260911.mjs
          rm -f scripts/tmp-feature-build-trigger.txt
          rm -f .github/workflows/tmp-feature-boss-relic-build-20260911.yml
          git add -A
          git status --short

      - name: Check staged diff whitespace
        run: git diff --cached --check

      - name: Commit clean feature result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: rebalance boss gameplay and guarantee Lv20 starter relics"

      - name: Push clean feature result
        run: git push origin HEAD:feature/boss-balance-gameplay-relic-lv20-20260911
