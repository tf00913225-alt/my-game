name: Fix Fire Rocket headless compatibility

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'launch fire rocket headless compatibility fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch Fire Rocket readiness guard
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('js/39-v143-skill-animation.js')
          s=p.read_text(encoding='utf-8')
          old='''            if(config.id==="fireRocket"&&model.sprite){\n                const record=getSpriteImage(model.sprite.src);\n                if(!record||record.failed||!record.ready){ model.sprite=null; }\n            }'''
          new='''            if(config.id==="fireRocket"&&model.sprite&&typeof Image==="function"){\n                const record=getSpriteImage(model.sprite.src);\n                if(!record||record.failed||!record.ready){ model.sprite=null; }\n            }'''
          if s.count(old)!=1:
              raise SystemExit(f'expected 1 fire readiness block, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check js/39-v143-skill-animation.js
          node tests/v153-fire-vfx.test.js
          node tests/v173.47-runtime-integrity.test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/39-v143-skill-animation.js
          git commit -m "preserve official fire rocket vfx in headless tests"
          git push origin HEAD:dev
