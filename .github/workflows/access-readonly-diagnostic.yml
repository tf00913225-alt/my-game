name: Private DEV path phase diagnostic
on:
  push:
    branches: [fix/access-readonly-validation-20261030]
permissions:
  contents: read
concurrency:
  group: access-path-diagnostic
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/access-readonly-validation-20261030' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.DEV_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.DEV_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read exact DEV paths without following redirects
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {probe} from './qa-phase-probe.mjs';
          const id=process.env.CF_ACCESS_CLIENT_ID,secret=process.env.CF_ACCESS_CLIENT_SECRET;
          if(!id||!secret){console.error('Missing credentials');process.exit(1);}
          let h;
          try{h=new Headers();h.set('CF-Access-Client-Id',id);h.set('CF-Access-Client-Secret',secret);}
          catch{console.error('Invalid credential format');process.exit(1);}
          const result=await probe(url=>fetch(url,{headers:h,redirect:'manual',signal:AbortSignal.timeout(15000)}));
          console.log('PATH_DIAGNOSTIC '+JSON.stringify(result));
          if(result.some(x=>x.phase==='network-error'))process.exitCode=1;
          NODE
