#game-stage #itemModal .v17351-compare-back{flex:0 0 62px!important;width:62px!important;min-height:38px!important;padding:5px 8px!important;border:1px solid #987036!important;border-radius:7px!important;background:linear-gradient(180deg,#322316,#17100b)!important;color:#eddbb8!important;font-size:13px!important;font-weight:900!important}
#game-stage #itemModal .v17351-compare-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;flex:1 1 auto!important;min-height:0!important;gap:7px!important;padding:8px!important;overflow:hidden!important}
