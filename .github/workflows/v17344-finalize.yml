name: Finalize V173.44 Requested Update

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17344-finalize.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch supplied assets
        run: git fetch --no-tags origin assets-library:refs/remotes/origin/assets-library

      - name: Place supplied art on dev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/maps assets/dungeons/covers assets/dungeons/abyss/maps
          git show origin/assets-library:'assets/inbox/荒漠地帶.png' > assets/maps/desert-v17344.png
          git show origin/assets-library:'assets/inbox/冰霜山脈.png' > assets/maps/ice-v17344.png
          git show origin/assets-library:'assets/inbox/熔岩深獄.png' > assets/maps/zone4-v17344.png
          git show origin/assets-library:'assets/inbox/巨獸荒原.png' > assets/maps/zone5-v17344.png
          git show origin/assets-library:'assets/inbox/修羅戰場.png' > assets/maps/zone6-v17344.png
          git show origin/assets-library:'assets/inbox/魔君祭壇.png' > assets/maps/zone7-v17344.png
          git show origin/assets-library:'assets/inbox/龍獄深淵.png' > assets/maps/zone8-v17344.png
          git show origin/assets-library:'assets/inbox/虛空盡頭.png' > assets/maps/zone9-v17344.png
          git show origin/assets-library:'assets/inbox/終焉之戰.png' > assets/maps/zone10-v17344.png
          git show origin/assets-library:'assets/inbox/金幣副本.png' > assets/dungeons/covers/gold-v17344.png
          git show origin/assets-library:'assets/inbox/深淵副本-東帝.png' > assets/dungeons/abyss/maps/floor-1.png
          git show origin/assets-library:'assets/inbox/深淵副本-南帝.png' > assets/dungeons/abyss/maps/floor-2.png
          git show origin/assets-library:'assets/inbox/深淵副本-天帝.png' > assets/dungeons/abyss/maps/floor-3.png
          git show origin/assets-library:'assets/inbox/深淵副本-北帝.png' > assets/dungeons/abyss/maps/floor-4.png
          git show origin/assets-library:'assets/inbox/深淵副本-五帝聯軍.png' > assets/dungeons/abyss/maps/floor-5.png

      - name: Apply corrected source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/v17344-apply.yml').read_text(encoding='utf-8')
          start="          python - <<'PY'\n"
          end="\n          PY\n\n      - name: Run focused and full repository checks"
          if start not in source or end not in source:
              raise SystemExit('unable to extract V173.44 patch body')
          body=source.split(start,1)[1].split(end,1)[0]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          body='\n'.join(lines)+'\n'
          old='next_text,count=re.subn(pattern,replacement,text,count=1,flags=flags)'
          new='next_text,count=re.subn(pattern,lambda _m: replacement,text,count=1,flags=flags)'
          if body.count(old)!=1:
              raise SystemExit('regex_once implementation was not found exactly once')
          body=body.replace(old,new,1)
          Path('/tmp/v17344_apply.py').write_text(body,encoding='utf-8')
          PY
          python /tmp/v17344_apply.py
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/v143-combat-dungeon-polish.test.js')
          text=path.read_text(encoding='utf-8')
          old='assert.match(dungeon,/function openAbyssBossDialogue\\(\\)[\\s\\S]*?點擊對話繼續/);'
          new='assert.match(dungeon,/function openAbyssBossDialogue\\(\\)[\\s\\S]*?點擊空白處繼續/);'
          if text.count(old)!=1:
              raise SystemExit('V143 historical dialogue assertion was not found exactly once')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Ensure full-suite image dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends imagemagick
          fi

      - name: Run focused and full repository checks
        shell: bash
        run: |
          set -euo pipefail
          node --check js/17-stage-v60-training-render-guard.js
          node --check js/36-v141-content-systems.js
          node --check js/42-v148-combat-dungeon-fixes.js
          node --check js/47-v158-combat-tuning.js
          node tests/v173.44-current-request.test.js
          node .github/scripts/ci.mjs tests
          node .github/scripts/ci.mjs resources

      - name: Commit requested update and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v17344-apply.yml .github/workflows/v17344-retry.yml .github/workflows/v17344-finalize.yml
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css tests assets
          git commit -m "fix: apply combat dungeon scaling and map updates"
          git push origin HEAD:dev
