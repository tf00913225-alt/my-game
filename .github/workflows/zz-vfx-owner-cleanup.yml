name: VFX owner cleanup

on:
  push:
    branches:
      - fix/combat-vfx-owner-cleanup-20260909

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh historical raster VFX assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/v153-fire-vfx.test.js')
          s=p.read_text()
          s=s.replace(
              'assert.match(css,/v153FireCastFrames var\\(--v143-sprite-duration,1500ms\\) steps\\(1,end\\) 1 both/);',
              'assert.match(css,/v143RasterCastFrames var\\(--v143-sprite-duration,1200ms\\) steps\\(1,end\\) var\\(--v143-sprite-delay,0ms\\) 1 both/);'
          )
          s=s.replace(
              'assert.doesNotMatch(css,/v153FireCastFrames[^;]*infinite/);',
              'assert.doesNotMatch(css,/v143RasterCastFrames[^;]*infinite/);'
          )
          s=s.replace(
              'assert.match(css,/v153StatusSpriteFrames var\\(--v153-status-duration,800ms\\) steps\\(1,end\\) infinite/);',
              'assert.match(css,/v143StatusRasterFrames var\\(--v153-status-duration,1000ms\\) steps\\(1,end\\) infinite/);'
          )
          p.write_text(s)
          PY
      - name: Save historical test refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/v153-fire-vfx.test.js
          if ! git diff --cached --quiet; then
            git commit -m "test: align Fire VFX assertions with raster owner"
            git push origin HEAD:fix/combat-vfx-owner-cleanup-20260909
          fi
      - name: Focused VFX regression tests
        run: |
          node tests/v174-raster-only-combat-vfx-owner.test.js
          node tests/abyss-two-tier-refactor.test.js
          node tests/boss-mechanism-vfx-card-ui-20260909.test.js
          node tests/v153-fire-vfx.test.js
          node tests/v166-water-vfx.test.js
          node tests/v173.23-wind-vfx.test.js
          node tests/v173.39-earth-light-vfx.test.js
      - name: Full repository tests
        run: |
          if ! command -v identify >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y imagemagick; fi
          git fetch origin 39767ce2b9dbfa59650b7c5fd4d52a57a2642ea5 4a592dd4c41d7efb1a4849fbfe0cbf68598121bf --depth=1 || true
          for test in tests/*.test.js; do node "$test"; done
          node .github/scripts/ci.mjs
