name: Temporary finalize remaining UI repairs v3

on:
  push:
    branches:
      - fix/inventory-battle-nav-runtime-20260914
    paths:
      - .github/workflows/temp-finalize-remaining-ui-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inventory-battle-nav-runtime-20260914
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply remaining owner repairs against current source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/temp-finalize-remaining-ui.yml').read_text(encoding='utf-8')
          start_token="          python - <<'PY'\n"
          end_token='\n          PY\n'
          start=workflow.index(start_token)+len(start_token)
          end=workflow.index(end_token,start)
          script=textwrap.dedent(workflow[start:end])

          mechanism_start=script.index('# Mechanism cards also need to confirm hidden-until-hit VFX.')
          browser_start=script.index('# Browser geometry acceptance for monster name and active player highlight.',mechanism_start)
          static_start=script.index("Path('tests/remaining-ui-regressions-20260914.test.js')",browser_start)
          script=script[:mechanism_start]+'# Mechanism/browser QA patches are applied below against current source.\n\n'+script[static_start:]
          exec(compile(script,'<remaining-ui-repair>','exec'),{'__name__':'__main__'})

          # Current mechanism source already has popup support; add V143 hit confirmation in place.
          path=Path('js/gameplay-boss-tower-system.js')
          text=path.read_text(encoding='utf-8')
          old='''        const final=Math.max(1,Math.round(numeric(damage,1)));
              const node=document.querySelector('#bossMechanismSlot [data-id="'+card.id+'"]');
              if(node&&typeof showDamagePopup==="function"){
          '''
          new='''        const final=Math.max(1,Math.round(numeric(damage,1)));
              const node=document.querySelector('#bossMechanismSlot [data-id="'+card.id+'"]');
              if(typeof window.v143RunAtTargetHit==="function"){
                  window.v143RunAtTargetHit("monster","mechanism:"+card.id,function(){},true);
              }
              if(node&&typeof showDamagePopup==="function"){
          '''
          if text.count(old)!=1:
              raise SystemExit(f'current mechanism insertion: expected one match, got {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          # Current browser fixture: mark player 2 active and record real geometry/computed style.
          path=Path('tests/v174-cardless-battle-browser.test.js')
          text=path.read_text(encoding='utf-8')
          old='return `<div id="battlePlayerCard${index}" class="battle-player" style='
          new='return `<div id="battlePlayerCard${index}" class="battle-player${index===1?" active-turn":""}" style='
          if text.count(old)!=1:
              raise SystemExit(f'browser active fixture: expected one match, got {text.count(old)}')
          text=text.replace(old,new,1)

          old='''      enemyArt:!!enemyArt,
              playerIdle:getComputedStyle(document.getElementById('battlePlayerCard1').querySelector(':scope > .v174-battle-art')).animationName,
          '''
          new='''      enemyArt:!!enemyArt,
              enemyArtRect:qaRect('#battleMonster0 > .v174-battle-art'),
              enemyNameRect:qaRect('#battleMonster0 > .battle-monster-name'),
              enemyNameDisplay:getComputedStyle(enemy.querySelector('.battle-monster-name')).display,
              activeOutlineWidth:getComputedStyle(document.getElementById('battlePlayerCard1')).outlineWidth,
              activeOutlineColor:getComputedStyle(document.getElementById('battlePlayerCard1')).outlineColor,
              activeShadow:getComputedStyle(document.getElementById('battlePlayerCard1')).boxShadow,
              playerIdle:getComputedStyle(document.getElementById('battlePlayerCard1').querySelector(':scope > .v174-battle-art')).animationName,
          '''
          if text.count(old)!=1:
              raise SystemExit(f'browser result fields: expected one match, got {text.count(old)}')
          text=text.replace(old,new,1)

          old='''    assert.equal(data.enemyArt,true);
              assert.equal(data.playerIdle,"v174BattleIdle");
          '''
          new='''    assert.equal(data.enemyArt,true);
              assert.equal(data.enemyNameDisplay,"flex");
              assert.ok(data.enemyNameRect.height>0,"monster name must remain visible");
              assert.ok(data.enemyNameRect.bottom<=data.enemyArtRect.top+1,"monster name must sit above monster artwork");
              assert.equal(data.activeOutlineWidth,"2px");
              assert.notEqual(data.activeOutlineColor,"rgba(0, 0, 0, 0)");
              assert.notEqual(data.activeShadow,"none");
              assert.equal(data.playerIdle,"v174BattleIdle");
          '''
          if text.count(old)!=1:
              raise SystemExit(f'browser assertions: expected one match, got {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validate source and canonical production build
        run: |
          git diff --check
          node --check js/39-v143-skill-animation.js
          node --check js/54-v173.51-battle-qa.js
          node --check js/gameplay-boss-tower-system.js
          node --check tests/v174-cardless-battle-browser.test.js
          node tests/remaining-ui-regressions-20260914.test.js
          npm run build
          npm run build:check

      - name: Run focused runtime and mobile browser regressions
        run: |
          node tests/v153-fire-vfx.test.js
          node tests/v174-raster-only-combat-vfx-owner.test.js
          node tests/v152-dev-fixes.test.js
          node tests/v174-cardless-battle-browser.test.js
          node tests/remaining-ui-regressions-20260914.test.js
          git diff --check

      - name: Commit source build and tests; remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/temp-remaining-ui-repair.yml
          rm -f .github/workflows/temp-finalize-remaining-ui.yml
          rm -f .github/workflows/temp-finalize-remaining-ui-v2.yml
          rm -f .github/workflows/temp-finalize-remaining-ui-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finish remaining inventory battle and VFX regressions"
          git push origin HEAD:fix/inventory-battle-nav-runtime-20260914
