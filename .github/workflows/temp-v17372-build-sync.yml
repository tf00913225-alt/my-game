name: TEMP V173.72 Build Sync Artifact

on:
  push:
    branches:
      - fix/v17372-stale-battle-status-tests-20260923

permissions:
  contents: write

jobs:
  build-sync-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v17372-stale-battle-status-tests-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate deterministic production build
        run: node scripts/build-production.mjs
      - name: Collect exact generated diff
        run: |
          mkdir -p build-sync-artifact/files
          git status --porcelain=v1 > build-sync-artifact/status.txt
          node <<'NODE'
          const fs=require("fs"),path=require("path");
          const rows=fs.readFileSync("build-sync-artifact/status.txt","utf8").split(/\r?\n/).filter(Boolean);
          const changes=[];
          for(const row of rows){
            const status=row.slice(0,2);
            let file=row.slice(3);
            if(file.includes(" -> ")){ file=file.split(" -> ").pop(); }
            const exists=fs.existsSync(file)&&fs.statSync(file).isFile();
            changes.push({status,path:file,exists});
            if(exists){
              const out=path.join("build-sync-artifact","files",file);
              fs.mkdirSync(path.dirname(out),{recursive:true});
              fs.copyFileSync(file,out);
            }
          }
          fs.writeFileSync("build-sync-artifact/changes.json",JSON.stringify(changes,null,2)+"\n");
          console.log(JSON.stringify(changes));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v17372-build-sync
          path: build-sync-artifact
          if-no-files-found: error
          retention-days: 1
      - name: Commit deterministic build through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require("fs");
          const repo=process.env.REPO,branch=process.env.BRANCH,parentSha=process.env.PARENT_SHA,token=process.env.GH_TOKEN;
          const changes=JSON.parse(fs.readFileSync("build-sync-artifact/changes.json","utf8"))
            .filter(item=>item.path!=="build-sync-artifact/"&&!item.path.startsWith("build-sync-artifact/"));
          if(!changes.length){ console.log("Deterministic build already synchronized."); process.exit(0); }
          async function api(method,path,body){
            const response=await fetch("https://api.github.com/repos/"+repo+path,{
              method,headers:{
                "authorization":"Bearer "+token,
                "accept":"application/vnd.github+json",
                "x-github-api-version":"2022-11-28",
                "content-type":"application/json"
              },
              body:body===undefined?undefined:JSON.stringify(body)
            });
            if(!response.ok){ throw new Error(method+" "+path+" failed: "+response.status+" "+await response.text()); }
            return response.status===204?null:response.json();
          }
          const refPath="/git/ref/heads/"+branch.split("/").map(encodeURIComponent).join("/");
          const current=await api("GET",refPath);
          if(current.object.sha!==parentSha){ throw new Error("Branch advanced during build; refusing stale commit."); }
          const parent=await api("GET","/git/commits/"+parentSha);
          const entries=[];
          for(const change of changes){
            if(!change.exists){
              entries.push({path:change.path,mode:"100644",type:"blob",sha:null});
              continue;
            }
            const bytes=fs.readFileSync(change.path);
            const blob=await api("POST","/git/blobs",{content:bytes.toString("base64"),encoding:"base64"});
            entries.push({path:change.path,mode:"100644",type:"blob",sha:blob.sha});
          }
          const tree=await api("POST","/git/trees",{base_tree:parent.tree.sha,tree:entries});
          const commit=await api("POST","/git/commits",{
            message:"build: synchronize deterministic V173.72 artifacts",
            tree:tree.sha,parents:[parentSha]
          });
          await api("PATCH","/git/refs/heads/"+branch.split("/").map(encodeURIComponent).join("/"),{sha:commit.sha,force:false});
          console.log("Created deterministic build commit "+commit.sha);
          NODE
