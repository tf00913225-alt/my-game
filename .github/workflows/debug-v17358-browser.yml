name: Debug V173.58 browser regression

on:
  push:
    branches: [dev]

jobs:
  debug:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'debug V173.58 browser regression')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply pending V173.58 patch
        run: python .github/scripts/apply-v17358-reforge-redesign.py
      - name: Instrument browser fixture and run
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/ui-equipment-progression-browser.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script>\nwindow.inventorySlots=', '<script>\nwindow.__browserErrors=[];window.addEventListener("error",e=>window.__browserErrors.push(String(e.message||e.error||"unknown error")));\nwindow.inventorySlots=',1)
          s=s.replace("const preview=document.querySelector('.v17346-preview-modal'),title=preview.querySelector('h3'),list=preview.querySelector('.v132-preview-list-scroll'),actions=preview.querySelector('.v132-reward-actions');", "const preview=document.querySelector('.v17346-preview-modal');if(!preview){document.getElementById('result').textContent=JSON.stringify({error:'preview missing',browserErrors:window.__browserErrors});throw new Error('preview missing: '+window.__browserErrors.join(' | '));}const title=preview.querySelector('h3'),list=preview.querySelector('.v132-preview-list-scroll'),actions=preview.querySelector('.v132-reward-actions');",1)
          s=s.replace("const data=JSON.parse(match[1].replace(/&amp;/g,\"&\").replace(/&lt;/g,\"<\").replace(/&gt;/g,\">\").replace(/&quot;/g,'\"'));", "const raw=match[1].replace(/&amp;/g,\"&\").replace(/&lt;/g,\"<\").replace(/&gt;/g,\">\").replace(/&quot;/g,'\"'); console.log('RAW_RESULT='+raw); console.log('CHROME_STDERR='+run.stderr); const data=JSON.parse(raw); if(data.error) throw new Error(data.error+' :: '+(data.browserErrors||[]).join(' | '));",1)
          p.write_text(s,encoding='utf-8')
          PY
          node tests/ui-equipment-progression-browser.test.js
