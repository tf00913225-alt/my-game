name: V173.65 startup and EXP repair

on:
  push:
    branches:
      - fix/startup-viewport-exp-guard-20260913
    paths:
      - .github/workflows/v17365-startup-exp-repair.yml

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/startup-viewport-exp-guard-20260913
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ensure image test dependency
        run: |
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Build synchronized production bundles
        run: npm run build

      - name: Run targeted startup viewport regression
        run: node tests/v173.65-startup-viewport-browser.test.js

      - name: Run targeted EXP safety regression
        run: node tests/v173.49-exp-pool-scroll-stability.test.js

      - name: Recheck unrelated Element Box browser geometry
        run: node tests/ui-element-box-medium-modal.test.js

      - name: Run repository test suite
        run: npm test

      - name: Verify production build
        run: npm run build:check

      - name: Commit generated build outputs
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated build changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: sync startup viewport and EXP guard"
          git push origin HEAD:fix/startup-viewport-exp-guard-20260913
