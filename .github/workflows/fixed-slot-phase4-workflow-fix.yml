name: Fixed Slot Phase 4 Workflow Fix

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 1
      - name: Normalize the cross-realm assertion and clean diagnostic workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/fixed-slot-phase4-boss-mechanism.yml')
          s=p.read_text(encoding='utf-8')
          old='''        assert.deepEqual(guards.map(unit=>unit.vGameplayBattlefieldSlot),["ENEMY_F2","ENEMY_F4"]);'''
          new='''        assert.deepEqual(Array.from(guards,unit=>unit.vGameplayBattlefieldSlot),["ENEMY_F2","ENEMY_F4"]);'''
          if s.count(old)!=1:
              raise SystemExit('expected exactly one cross-realm assertion')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          rm -f .github/workflows/fixed-slot-phase4-diagnose.yml
          rm -f .github/workflows/fixed-slot-phase4-workflow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: normalize phase4 cross-realm assertion"
          git push origin HEAD:feature/fixed-slot-battlefield-v1-20260916
