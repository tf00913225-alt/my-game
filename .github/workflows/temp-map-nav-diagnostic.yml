name: Temporary map/nav diagnostic
on:
  push:
    branches:
      - fix/map-avatar-nav-size-player-scale-20260914
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect patrol lazy-load transition with Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/map-nav-http.log 2>&1 & SERVER_PID=$!
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-allow-origins='*' --remote-debugging-port=9222 --user-data-dir=/tmp/map-nav-chrome http://127.0.0.1:8000/ >/tmp/map-nav-chrome.log 2>&1 & CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:9222/json >/dev/null && break || sleep .25; done
          cat >/tmp/runtime-diag.mjs <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)); const tabs=await (await fetch('http://127.0.0.1:9222/json')).json(); const tab=tabs.find(x=>String(x.url||'').includes('127.0.0.1:8000'))||tabs[0];
          const ws=new WebSocket(tab.webSocketDebuggerUrl); await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j}); let id=0; const p=new Map(); ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&p.has(m.id)){const q=p.get(m.id);p.delete(m.id);m.error?q.reject(m.error):q.resolve(m.result)}};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;p.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))}); const ev=async e=>(await send('Runtime.evaluate',{expression:e,awaitPromise:true,returnByValue:true})).result?.value; await send('Runtime.enable'); await sleep(3000);
          const snap=async label=>console.log(label,JSON.stringify(await ev(`(()=>{const i=document.getElementById('patrolCharacterImg'),w=document.getElementById('patrolCharacterWrap'),m=document.getElementById('mapPage');const r=i.getBoundingClientRect(),s=getComputedStyle(i);return {mapClass:m.className,mapDisplay:getComputedStyle(m).display,loading:i.loading,complete:i.complete,nw:i.naturalWidth,nh:i.naturalHeight,src:i.currentSrc||i.src,rect:{w:r.width,h:r.height,x:r.x,y:r.y},display:s.display,visibility:s.visibility,opacity:s.opacity,wrap:getComputedStyle(w).display}})()`)));
          await snap('INACTIVE');
          await ev(`(()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const m=document.getElementById('mapPage');m.classList.add('active');m.style.display='block';m.style.position='absolute';m.style.inset='0';document.getElementById('patrolCharacterImg').scrollIntoView({block:'center'});return true})()`); await sleep(2000); await snap('ACTIVE_LAZY');
          await ev(`(()=>{const i=document.getElementById('patrolCharacterImg');i.loading='eager';const src=i.getAttribute('src');i.removeAttribute('src');void i.offsetWidth;i.setAttribute('src',src);return true})()`); await sleep(2000); await snap('ACTIVE_EAGER'); ws.close();
          NODE
          node /tmp/runtime-diag.mjs
      - name: Static nav cascade
        shell: bash
        run: |
          set -euo pipefail
          grep -RInE '#game-stage .*#v141DungeonNav|#game-stage #v141DungeonNav|v148-context-nav-active.*v141DungeonNav|v141-dungeon-active.*v141DungeonNav' css | head -n 300 || true
