name: Temporary post-225 mobile regression repair

on:
  push:
    branches:
      - fix/post-225-mobile-regressions-20260914

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-225-mobile-regressions-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install asset-test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Patch regression owners and guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, pairs):
              p=Path(path)
              text=p.read_text()
              for old,new in pairs:
                  if old not in text:
                      raise SystemExit(f"missing expected block in {path}: {old[:120]!r}")
                  text=text.replace(old,new,1)
              p.write_text(text)

          # Shared nav: V148 owns the semantic nav class even when an older module
          # created the node first; V152 owns the final 420x84 / 72px presentation.
          edit('js/42-v148-combat-dungeon-fixes.js', [
              ('        if(!nav||!contextActive){ return; }\n',
               '        if(!nav||!contextActive){ return; }\n        if(nav.classList&&typeof nav.classList.add==="function"){ nav.classList.add("v148-context-nav"); }\n')
          ])
          edit('css/45-v152-dev-fixes.css', [
              ('#game-stage #app.v141-dungeon-active #v141DungeonNav,\n#game-stage #app.v141-dungeon-active #v141DungeonNav[data-v146-columns="4"],\n#game-stage #app.v141-dungeon-active #v141DungeonNav[data-v146-columns="5"]{',
               '#game-stage #v141DungeonNav.v148-context-nav,\n#game-stage #v141DungeonNav.v148-context-nav[data-v146-columns="4"],\n#game-stage #v141DungeonNav.v148-context-nav[data-v146-columns="5"]{'),
              ('    #game-stage #app.v141-dungeon-active #v141DungeonNav{\n        height:80px !important;\n    }',
               '    #game-stage #v141DungeonNav.v148-context-nav{\n        height:80px !important;\n    }')
          ])

          # Gameplay panel: the circled gold line is the owner's decorative ::after.
          edit('css/gameplay-boss-tower.css', [
              ('#game-stage .gameplay-large-panel::before,\n#game-stage .gameplay-large-panel::after{',
               '#game-stage .gameplay-large-panel::before{'),
              ('#game-stage .gameplay-large-panel::before{ top:8px; }\n#game-stage .gameplay-large-panel::after{ bottom:8px; }',
               '#game-stage .gameplay-large-panel::before{ top:8px; }')
          ])

          # Battle presentation: capture CSS-owned art BEFORE the cardless class masks
          # background-image. Keep enemy HP/SP/name inside the existing card footprint
          # instead of expanding both monster rows in the fixed battle canvas.
          edit('js/54-v173.51-battle-qa.js', [
              ('#game-stage > #app > #game-content #battlePage .battle-monster.v174-cardless-unit>.monster-hp{\n    position:absolute!important;left:50%!important;bottom:13px!important;',
               '#game-stage > #app > #game-content #battlePage .battle-monster.v174-cardless-unit>.monster-hp{\n    position:absolute!important;left:50%!important;bottom:29px!important;'),
              ('#game-stage > #app > #game-content #battlePage .battle-monster.v174-cardless-unit>.monster-sp{\n    position:absolute!important;left:50%!important;bottom:0!important;',
               '#game-stage > #app > #game-content #battlePage .battle-monster.v174-cardless-unit>.monster-sp{\n    position:absolute!important;left:50%!important;bottom:16px!important;'),
              ('    position:absolute!important;left:-4px!important;right:-4px!important;top:calc(100% + 3px)!important;',
               '    position:absolute!important;left:-4px!important;right:-4px!important;top:auto!important;bottom:0!important;'),
              ('#game-stage > #app > #game-content #battlePage .battle-monster.v174-cardless-unit>.v174-battle-art{\n    inset:2px 2px 26px!important;',
               '#game-stage > #app > #game-content #battlePage .battle-monster.v174-cardless-unit>.v174-battle-art{\n    inset:2px 2px 42px!important;'),
              ('#game-stage > #app > #game-content #battlePage .battle-monster.gameplay-boss-card.v174-cardless-unit>.v174-battle-art{\n    inset:2px 2px 26px!important;',
               '#game-stage > #app > #game-content #battlePage .battle-monster.gameplay-boss-card.v174-cardless-unit>.v174-battle-art{\n    inset:2px 2px 42px!important;'),
              ('function syncUnitArtwork(card,kind){\n    if(!card)return;\n    card.classList.add("v174-cardless-unit");\n    let art=card.querySelector(":scope > .v174-battle-art");\n    if(!art){art=document.createElement("div");art.className="v174-battle-art";card.insertBefore(art,card.firstChild);}\n    const source=battleArtworkSource(card,kind);\n    if(source)art.style.backgroundImage=source;\n    card.style.setProperty("background-image","none","important");\n}',
               'function syncUnitArtwork(card,kind){\n    if(!card)return;\n    /* Capture CSS-owned artwork before v174-cardless-unit masks the card background. */\n    const source=battleArtworkSource(card,kind);\n    card.classList.add("v174-cardless-unit");\n    let art=card.querySelector(":scope > .v174-battle-art");\n    if(!art){art=document.createElement("div");art.className="v174-battle-art";card.insertBefore(art,card.firstChild);}\n    if(source){\n        art.style.backgroundImage=source;\n        card.style.setProperty("background-image","none","important");\n    }\n}')
          ])

          # Do not expand every monster row just to host an absolutely-positioned name.
          edit('css/40-v143-combat-dungeon-polish.css', [
              ('\n#game-stage #battleMonsterArea .v131-monster-row{\n    min-height:120px;\n    padding-bottom:18px;\n    box-sizing:border-box;\n    overflow:visible;\n}\n', '\n')
          ])

          # VFX sizing: a tall 9:16 portrait must not inflate a single-target skill.
          # Position still uses the complete visual rect; only the size reference is
          # the combat-unit footprint width. The outer-visible/inner-frame architecture
          # remains unchanged, so this is not a clipping workaround.
          p=Path('js/39-v143-skill-animation.js')
          text=p.read_text()
          old='const targetSize=Math.max(target.rect.width,target.rect.height);'
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 single-target size references, found {text.count(old)}')
          text=text.replace(old,'const targetSize=Math.max(1,Number(target.rect.width)||0);')
          p.write_text(text)

          # Update the two guards that encoded the broken outside-card identity lane.
          edit('tests/shared-nav-vfx-battle-layout-20260914.test.js', [
              ('const navCss=read("css/38-v141-system-expansion.css");',
               'const navCss=read("css/38-v141-system-expansion.css");\nconst finalNavCss=read("css/45-v152-dev-fixes.css");'),
              ('assert.match(navCss,/\\.v148-context-nav-active #bottomNav\\{display:none !important;\\}/);',
               'assert.match(navCss,/\\.v148-context-nav-active #bottomNav\\{display:none !important;\\}/);\nassert.match(finalNav,/classList\\.add\\("v148-context-nav"\\)/);\nassert.match(finalNavCss,/#v141DungeonNav\\.v148-context-nav,[\\s\\S]*?width:420px !important;[\\s\\S]*?height:84px !important;/);\nassert.match(finalNavCss,/#v141DungeonNav \\.nav-art-button\\{[\\s\\S]*?height:72px !important;/);'),
              ('assert.match(battle,/battle-monster\\.v174-cardless-unit>\\.battle-monster-name\\{[\\s\\S]*?top:calc\\(100% \\+ 3px\\)!important/);',
               'assert.match(battle,/battle-monster\\.v174-cardless-unit>\\.battle-monster-name\\{[\\s\\S]*?top:auto!important;bottom:0!important/);'),
              ('assert.match(vfxCss,/battleMonsterArea \\.v131-monster-row\\{[\\s\\S]*?padding-bottom:18px/);',
               'assert.doesNotMatch(vfxCss,/battleMonsterArea \\.v131-monster-row\\{[\\s\\S]*?padding-bottom:18px/);\nassert.match(battle,/monster-hp\\{[\\s\\S]*?bottom:29px!important/);\nassert.match(battle,/monster-sp\\{[\\s\\S]*?bottom:16px!important/);')
          ])
          edit('tests/v1741-battle-gameplay-layout-order.test.js', [
              ('assert.match(battle,/battle-monster\\.v174-cardless-unit>\\.battle-monster-name\\{[\\s\\S]*?top:calc\\(100% \\+ 3px\\)!important/);',
               'assert.match(battle,/battle-monster\\.v174-cardless-unit>\\.battle-monster-name\\{[\\s\\S]*?top:auto!important;bottom:0!important/);\nassert.match(battle,/battle-monster\\.v174-cardless-unit>\\.monster-hp\\{[\\s\\S]*?bottom:29px!important/);\nassert.match(battle,/battle-monster\\.v174-cardless-unit>\\.monster-sp\\{[\\s\\S]*?bottom:16px!important/);')
          ])

          Path('tests/post225-mobile-regressions-20260914.test.js').write_text(r'''"use strict";
const assert=require("node:assert/strict");
const fs=require("node:fs");
const read=p=>fs.readFileSync(p,"utf8");
const nav=read("js/42-v148-combat-dungeon-fixes.js");
const navCss=read("css/45-v152-dev-fixes.css");
const panelCss=read("css/gameplay-boss-tower.css");
const battle=read("js/54-v173.51-battle-qa.js");
const vfx=read("js/39-v143-skill-animation.js");
const vfxCss=read("css/40-v143-combat-dungeon-polish.css");

assert.match(nav,/classList\.add\("v148-context-nav"\)/,"existing shared nav nodes must receive the semantic owner class");
assert.match(navCss,/#v141DungeonNav\.v148-context-nav,[\s\S]*?width:420px !important;[\s\S]*?height:84px !important;/,"Gameplay and Dungeon must share final nav geometry");
assert.match(navCss,/#v141DungeonNav \.nav-art-button\{[\s\S]*?height:72px !important;/,"shared nav art size must be identical");
assert.doesNotMatch(panelCss,/\.gameplay-large-panel::after/,"Gameplay panel must not draw the reported extra bottom gold line");

const syncStart=battle.indexOf("function syncUnitArtwork");
const syncEnd=battle.indexOf("function syncResourceNumbers",syncStart);
const sync=battle.slice(syncStart,syncEnd);
assert.ok(sync.indexOf("const source=battleArtworkSource(card,kind)")<sync.indexOf('card.classList.add("v174-cardless-unit")'),"CSS-owned battle art must be captured before cardless masking");
assert.match(sync,/if\(source\)\{[\s\S]*?art\.style\.backgroundImage=source;[\s\S]*?setProperty\("background-image","none","important"\)/,"card background may only be cleared after artwork was captured");
assert.match(battle,/battle-monster\.v174-cardless-unit>\.monster-hp\{[\s\S]*?bottom:29px!important/);
assert.match(battle,/battle-monster\.v174-cardless-unit>\.monster-sp\{[\s\S]*?bottom:16px!important/);
assert.match(battle,/battle-monster\.v174-cardless-unit>\.battle-monster-name\{[\s\S]*?top:auto!important;bottom:0!important/);
assert.doesNotMatch(vfxCss,/battleMonsterArea \.v131-monster-row\{[\s\S]*?min-height:120px/,"enemy identity must not inflate fixed formation rows");

assert.equal((vfx.match(/const targetSize=Math\.max\(1,Number\(target\.rect\.width\)\|\|0\);/g)||[]).length,2,"single/target-trajectory VFX must size from target width, not tall portrait height");
assert.doesNotMatch(vfx,/const targetSize=Math\.max\(target\.rect\.width,target\.rect\.height\)/);
assert.match(vfxCss,/\.v143-skill-stage\{[\s\S]*?overflow:visible/);
assert.match(vfxCss,/\.v143-vfx-frame\{[\s\S]*?overflow:hidden/);
console.log("post-225 mobile regression guard passed");
''')
          PY
      - name: Focused regression tests
        run: |
          node tests/post225-mobile-regressions-20260914.test.js
          node tests/shared-nav-vfx-battle-layout-20260914.test.js
          node tests/v1741-battle-gameplay-layout-order.test.js
          node tests/v174-cardless-battle-browser.test.js
          node tests/v148-combat-dungeon-fixes.test.js
          node tests/v143-combat-dungeon-polish.test.js
          node tests/v153-fire-vfx.test.js
          node tests/v166-water-vfx.test.js
          node tests/boss-mobile-portrait-browser.test.js
      - name: Build production bundles
        run: npm run build
      - name: Validate build and full suite
        run: |
          npm run build:check
          npm test
          git diff --check
      - name: Commit repaired owners and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/temp-post225-mobile-regression-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair post-225 mobile UI and battle regressions"
          git push origin HEAD:fix/post-225-mobile-regressions-20260914
