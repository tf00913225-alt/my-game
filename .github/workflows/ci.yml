  promotion_health:
    name: Full regression promotion gate
    needs: classify
    if: needs.classify.outputs.promotion_health == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Confirm exact regression source snapshot
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reject unresolved or stale full regression health
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/full-regression-health.mjs

  health_start:
    name: Mark full regression pending
    if: inputs.full_regression || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        with:
          script: |
            const sha=process.env.CANDIDATE_SHA;
            if(!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid candidate SHA');
            await github.rest.repos.createCommitStatus({...context.repo,sha,
              context:'Full Regression Health',state:'pending',
              description:sha+' full regression pending',
              target_url:`${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});

  health_record:
    name: Full Regression Health
    needs: [classify, verify, health_start]
    if: always() && (inputs.full_regression || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          RESULTS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs=require('fs'), sha=process.env.CANDIDATE_SHA;
            if(!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid candidate SHA');
            const results=JSON.parse(process.env.RESULTS_JSON);
            const passed=['classify','verify','health_start'].every(k=>results[k]?.result==='success');
            const state=passed?'success':'failure';
            const url=`${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({...context.repo,sha,
              context:'Full Regression Health',state,description:sha+' full regression '+state,target_url:url});
            fs.writeFileSync('full-regression-health.json',JSON.stringify({sha,state,runId:context.runId,results},null,2)+'\n');
            await core.summary.addHeading('Full Regression Health').addRaw(`${sha}: ${state}`).write();
            if(!passed)core.setFailed('Required full regression children did not pass');
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-regression-health-${{ inputs.candidate_sha || github.sha }}
          path: full-regression-health.json
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Repository checks
    if: always()
    needs: [classify, core_checks, battle_browser, ui_browser, daily_browser, tower_wild_browser, portrait_browser, adventure_ui_browser, main_browser, abyss_balance, adventure_balance, boss_balance, session_authority, promotion_health]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 2
      - name: Confirm exact regression source snapshot
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Use current Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Require every necessary child gate
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_PLAN_JSON: ${{ needs.classify.outputs.plan_json }}
          CI_MAIN_REQUIRED: ${{ needs.classify.outputs.main_browser }}
        run: node .github/scripts/ci-aggregate.mjs

  deploy_dev:
    name: Dev deployment gate
    needs: [verify, classify]
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    uses: ./.github/workflows/deploy-dev-cloudflare.yml
    with:
      boss_required: ${{ needs.classify.outputs.boss_balance == 'true' }}
      tower_required: ${{ needs.classify.outputs.tower_wild_browser == 'true' }}
      abyss_required: ${{ needs.classify.outputs.abyss_balance == 'true' }}
      adventure_required: ${{ needs.classify.outputs.adventure_balance == 'true' || needs.classify.outputs.adventure_ui_browser == 'true' }}
      battle_daily_required: ${{ needs.classify.outputs.battle_browser == 'true' || needs.classify.outputs.daily_browser == 'true' }}
    secrets: inherit
