name: Temporary Boss Balance Build

on:
  push:
    branches:
      - feature/boss-balance-ui-relic-lv20-20260911

permissions:
  contents: write

jobs:
  apply-build-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply owner-level changes
        run: node scripts/tmp-apply-boss-balance-20260911.mjs
      - name: Rebuild deterministic production bundles
        run: |
          node scripts/build-production.mjs
          node scripts/build-production.mjs --check
      - name: Syntax and targeted behavior tests
        run: |
          node --check js/gameplay-boss-tower-system.js
          node --check js/relic-progression-drop-system.js
          node --check tests/gameplay-boss-tower-system.test.js
          node --check tests/v174-relic-progression-drop-system.test.js
          node --check tests/v174-boss-balance-ui-relic-lv20.test.js
          node tests/gameplay-boss-tower-system.test.js
          node tests/v174-relic-progression-drop-system.test.js
          node tests/v174-boss-balance-ui-relic-lv20.test.js
      - name: Remove temporary helper files
        run: |
          rm -f scripts/tmp-apply-boss-balance-20260911.mjs
          rm -f .github/workflows/tmp-boss-balance-build.yml
      - name: Commit generated source, tests and bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: rebalance bosses and guarantee Lv20 relics"
          git push origin HEAD:feature/boss-balance-ui-relic-lv20-20260911
