#game-stage #itemModal.v17351-equipment-comparison .item-modal-buttons button{min-width:0!important;height:45px!important;min-height:45px!important;padding:5px 4px!important;font-size:13px!important;white-space:normal!important;line-height:1.15!important}
#game-stage #itemModal .v17351-lock-button{border-color:#9c773b!important;background:linear-gradient(180deg,#2d2114,#15100b)!important;color:#efd08a!important;font-weight:900!important}
#game-stage #itemModal .v17351-lock-button.locked{border-color:#bc8737!important;background:linear-gradient(180deg,#5b3b12,#2a1b0a)!important;color:#ffe292!important;box-shadow:inset 0 0 10px rgba(236,180,68,.12)!important}
'''
          css53_new,count=re.subn(r'#game-stage #itemModal \.v17351-equipment-compare\{.*?#game-stage #itemModal \.v17351-lock-button\.locked\{[^}]*\}\n',compare_css,css53,count=1,flags=re.S)
          if count!=1:
