name: Premium Functional UI Responsive QA Evidence

on:
  push:
    branches:
      - feature/premium-functional-ui
    paths:
      - .github/workflows/premium-functional-ui-interaction-harness-fix.yml

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-functional-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run formal responsive browser QA
        run: |
          set -euo pipefail
          git diff --check
          node tests/premium-functional-ui-responsive-browser.test.js
      - name: Upload responsive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-functional-ui-responsive-evidence
          path: artifacts/browser-qa/premium-functional-ui
          if-no-files-found: warn
          retention-days: 14
