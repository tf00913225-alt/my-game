name: Temporary auth QA label fix

on:
  push:
    branches:
      - fix/auth-system-navigation-ux-20260910

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update the intentional auth action label in browser QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/scripts/run-boot-architecture-browser-qa.mjs')
          text=path.read_text(encoding='utf-8')
          old='for(const label of ["Google 登入","訪客開始遊戲","Email 登入","建立 Email 帳號"])'
          new='for(const label of ["Google 登入","訪客開始遊戲","Email 登入","建立帳號"])'
          if old not in text:
              raise SystemExit('expected auth label assertion not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check .github/scripts/run-boot-architecture-browser-qa.mjs
          rm .github/workflows/temp-auth-qa-label-fix.yml

      - name: Commit QA correction and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/scripts/run-boot-architecture-browser-qa.mjs .github/workflows/temp-auth-qa-label-fix.yml
          git commit -m "test: align boot QA with account creation label [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
