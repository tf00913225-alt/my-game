name: Temporary Status Asset Conversion 20260922

on:
  push:
    branches:
      - fix/battle-status-info-assets-20260922
    paths:
      - .github/workflows/tmp-status-assets-convert-20260922.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: fix/battle-status-info-assets-20260922
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends imagemagick

      - name: Fetch source art branch
        run: git fetch --no-tags origin assets-library:refs/remotes/origin/assets-library

      - name: Convert selected status art losslessly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/vfx/status /tmp/status-src
          convert_one() {
            local source="$1"
            local target="$2"
            git show "origin/assets-library:assets/inbox/技能icon/[戰鬥狀態圖與icon]/$source" > "/tmp/status-src/$source"
            convert "/tmp/status-src/$source" -define webp:lossless=true -quality 100 "assets/vfx/status/$target"
            diff_pixels="$(compare -metric AE "/tmp/status-src/$source" "assets/vfx/status/$target" null: 2>&1 || true)"
            if [[ "$diff_pixels" != "0" && "$diff_pixels" != "0 (0)" ]]; then
              echo "pixel mismatch for $source -> $target: $diff_pixels"
              exit 1
            fi
            test "$(identify -format '%wx%h' "/tmp/status-src/$source")" = "$(identify -format '%wx%h' "assets/vfx/status/$target")"
            test "$(head -c 4 "assets/vfx/status/$target")" = "RIFF"
            test "$(dd if="assets/vfx/status/$target" bs=1 skip=8 count=4 status=none)" = "WEBP"
          }

          convert_one "燃燒-單張狀態圖片.png" "burn.webp"
          convert_one "怒火-單張狀態圖片.png" "rage.webp"
          convert_one "暴怒 怒火-呼吸icon.png" "rage-icon.webp"
          convert_one "凍傷-呼吸icon.png" "frostbite-icon.webp"
          convert_one "冰封-固定圖片類.png" "freeze.webp"
          convert_one "重力-呼吸icon.png" "gravity-icon.webp"
          convert_one "殤風-呼吸icon.png" "damage-down-icon.webp"
          convert_one "暈眩-呼吸icon.png" "stun-icon.webp"
          convert_one "風行-單張狀態圖片.png" "windwalk.webp"
          convert_one "隱身-固定圖片類.png" "stealth.webp"
          convert_one "氣定神閒-單張狀態圖片.png" "calm-mind.webp"
          convert_one "破防-呼吸icon.png" "defense-down-icon.webp"
          convert_one "護盾-固定圖片類.png" "shield.webp"
          convert_one "石化-固定圖片類.png" "petrify.webp"
          convert_one "萬象土盾-固定圖片類.png" "earth-shield.webp"
          convert_one "岩石壁壘-固定圖片類.png" "rock-wall.webp"
          convert_one "結界-固定圖片類.png" "barrier.webp"
          convert_one "元祖賜福-單張狀態圖片.png" "yuan-zu-blessing.webp"
          convert_one "炎勢-呼吸icon.png" "fire-momentum-icon.webp"
          convert_one "鳳威-呼吸icon.png" "phoenix-might-icon.webp"
          convert_one "炎魂共鳴-單張狀態圖片.png" "fire-soul-resonance.webp"
          convert_one "焚血訣-單張狀態圖片.png" "blood-burn.webp"

      - name: Run targeted regression
        run: node tests/battle-status-info-assets-20260922.test.js

      - name: Synchronize production build
        run: npm run build

      - name: Verify synchronized build
        run: npm run build:check

      - name: Remove temporary workflow and commit generated assets
        env:
          BRANCH_NAME: fix/battle-status-info-assets-20260922
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-status-assets-convert-20260922.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "assets: import battle status WebP art and sync build"
          git push origin "HEAD:$BRANCH_NAME"

