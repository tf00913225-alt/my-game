name: Fixed Slot Phase 3 Runtime Fix

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix ally formation owner access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/25-v131-fix-batch.js')
          s=p.read_text(encoding='utf-8')
          old='''    function ensureAllyFormationState(){\n        if(!fixedBattlefieldSlots||typeof fixedBattlefieldSlots.ensureAllyFormation!=="function"){ return null; }\n        return fixedBattlefieldSlots.ensureAllyFormation(getExistingPartyIndexes());\n    }\n'''
          new='''    function ensureAllyFormationState(){\n        const owner=fixedBattlefieldSlots();\n        if(!owner||typeof owner.ensureAllyFormation!=="function"){ return null; }\n        return owner.ensureAllyFormation(getExistingPartyIndexes());\n    }\n'''
          if s.count(old)!=1: raise SystemExit('ensureAllyFormationState owner block mismatch')
          s=s.replace(old,new,1)
          old2='''        [fixedBattlefieldSlots.allyFrontSlots,fixedBattlefieldSlots.allyBackSlots].forEach((slots,rowIndex)=>{'''
          new2='''        const owner=fixedBattlefieldSlots();\n        [owner.allyFrontSlots,owner.allyBackSlots].forEach((slots,rowIndex)=>{'''
          if s.count(old2)!=1: raise SystemExit('ally row owner block mismatch')
          s=s.replace(old2,new2,1)
          old3='''                const characterIndex=fixedBattlefieldSlots.getCharacterAtAllySlot(slot);'''
          new3='''                const characterIndex=owner.getCharacterAtAllySlot(slot);'''
          if s.count(old3)!=1: raise SystemExit('ally slot lookup block mismatch')
          s=s.replace(old3,new3,1)
          s=s.replace('fixedBattlefieldSlots.getCharacterAtAllySlot(slot)','fixedBattlefieldSlots().getCharacterAtAllySlot(slot)')
          s=s.replace('fixedBattlefieldSlots.allyFrontSlots','fixedBattlefieldSlots().allyFrontSlots')
          s=s.replace('fixedBattlefieldSlots.allyBackSlots','fixedBattlefieldSlots().allyBackSlots')
          s=s.replace('fixedBattlefieldSlots.allySlots.includes(slot)','fixedBattlefieldSlots().allySlots.includes(slot)')
          s=s.replace('fixedBattlefieldSlots.moveAllyCharacter(vFixedFormationSelectedCharacter,slot)','fixedBattlefieldSlots().moveAllyCharacter(vFixedFormationSelectedCharacter,slot)')
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/fixed-battlefield-ally-formation.test.js')
          s=p.read_text(encoding='utf-8').rstrip()
          extra='''\n\nconst formationRuntime=fs.readFileSync(new URL("../js/25-v131-fix-batch.js",import.meta.url),"utf8");\nassert.match(formationRuntime,/const owner=fixedBattlefieldSlots\\(\\);[\\s\\S]*owner\\.ensureAllyFormation/,"battle ally renderer resolves the canonical owner object");\nassert.doesNotMatch(formationRuntime,/fixedBattlefieldSlots\\.ally(?:Front|Back|Slots)/,"battle ally renderer must not read properties from the owner getter function");\n'''
          p.write_text((s+extra).rstrip()+'\n',encoding='utf-8')
          PY
      - name: Verify runtime fix
        run: |
          node --check js/25-v131-fix-batch.js
          node tests/fixed-battlefield-slots.test.js
          node tests/fixed-battlefield-ally-formation.test.js
          git diff --check
      - name: Save runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fixed-slot-phase3-runtime-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: activate persistent ally formation runtime"
          git push origin HEAD:feature/fixed-slot-battlefield-v1-20260916
