name: Temporary dev build sync

on:
  push:
    branches:
      - fix/dev-build-sync-20260914

permissions:
  contents: write

jobs:
  sync-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rebuild deterministic production artifacts
        run: npm run build

      - name: Verify synchronized production build
        run: npm run build:check

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A asset-manifest.json build index.html
          if git diff --cached --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git commit -m "build: synchronize generated production artifacts"
          git push origin HEAD:fix/dev-build-sync-20260914
