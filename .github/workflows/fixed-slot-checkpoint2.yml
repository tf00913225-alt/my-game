name: Fixed Slot Checkpoint 2

on:
  push:
    branches:
      - feature/fixed-slot-battlefield-v1-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fixed-slot-battlefield-v1-20260916
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply owner consolidation
        run: python3 scripts/_fixed_slot_checkpoint2.py
      - name: Verify checkpoint 2
        run: |
          node --check js/battlefield-slot-owner.js
          node --check js/25-v131-fix-batch.js
          node --check js/31-v136-auto-battle-fix.js
          node --check js/42-v148-combat-dungeon-fixes.js
          node --check js/54-v173.51-battle-qa.js
          node --check scripts/build-production.mjs
          node tests/fixed-battlefield-slots.test.js
          git diff --check
      - name: Commit safe checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fixed-slot-checkpoint2.yml scripts/_fixed_slot_checkpoint2.py
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve targets from stable formation slots"
          git push origin HEAD:feature/fixed-slot-battlefield-v1-20260916
