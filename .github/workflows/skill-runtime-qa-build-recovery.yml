name: Skill runtime QA build recovery
on:
  push:
    branches:
      - fix/skill-action-dom-presentation-runtime-qa-20260930
    paths:
      - .github/workflows/skill-runtime-qa-build-recovery.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skill-action-dom-presentation-runtime-qa-20260930
          fetch-depth: 0
      - name: Apply formal Runtime QA repair and regenerate production build
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/skill-runtime-qa.patch
          git apply /tmp/skill-runtime-qa.patch
          npm run build
          git rm .github/workflows/skill-runtime-qa-build-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/00-main.js .github/scripts/run-skill-progression-browser-qa.mjs index.html asset-manifest.json build
          git commit -m "fix: bind formal skill row identity for runtime QA"
          git push origin HEAD:fix/skill-action-dom-presentation-runtime-qa-20260930
