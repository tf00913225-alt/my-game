<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共用介面母版樣張</title><style>
:root{color-scheme:dark;--ink:#171512;--wood:#29231d;--bronze:#94754c;--paper:#eee3c9;--muted:#c6b99f;--red:#733b32;--edge:#493a29;font-family:"Noto Serif TC","Microsoft JhengHei",serif}
*{box-sizing:border-box}body{margin:0;background:#151411;color:var(--paper)}button{font:inherit;cursor:pointer}.demo{max-width:720px;margin:auto;padding:20px}.notice{color:var(--muted);line-height:1.6}.samples,.tabs,footer{display:flex;gap:10px;flex-wrap:wrap}.samples button,.tabs button,.button{min-height:44px;padding:9px 18px;border:1px solid var(--bronze);color:var(--paper);background:#302820}.samples button[aria-pressed=true],.tabs button[aria-selected=true]{background:#d7c5a4;color:#211a15;border-color:#e1c692}.frame{position:relative;margin-top:20px;padding:18px;border:2px solid #7e6442;background:repeating-linear-gradient(175deg,rgba(255,255,255,.014) 0 3px,transparent 4px 13px),linear-gradient(145deg,#302a22,#1a1815 60%,#11110f);box-shadow:inset 0 0 0 3px #191611,inset 0 0 0 4px #5b4932,0 12px 28px #0009;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}.frame::before,.frame::after{content:"";position:absolute;top:7px;width:22px;height:22px;border-top:2px solid #ae9060;pointer-events:none}.frame::before{left:7px;border-left:2px solid #ae9060}.frame::after{right:7px;border-right:2px solid #ae9060}.frame-header{display:grid;grid-template-columns:1fr minmax(0,2fr) 1fr;align-items:center;gap:8px;border-bottom:1px solid #786043;padding-bottom:12px}.frame-header h2{margin:0;text-align:center;font-size:clamp(20px,5vw,25px);line-height:1.4;color:#eddfc1;text-shadow:0 2px #000}.frame-header .button{justify-self:start}.tabs{margin-top:14px}.tabs button{flex:1}.content{max-height:42vh;overflow:auto;margin:14px 0;padding:18px;color:#2b241b;background:repeating-linear-gradient(165deg,#ddcfb2 0 6px,#d9c9a9 7px 14px);line-height:1.8;scrollbar-gutter:stable}.content h3{margin-top:0}.divider{text-align:center;color:#825e3e}.button.primary{background:linear-gradient(#875047,#5b302a);border-color:#b68b65}.button.secondary{background:#29231d}.frame[data-frame=dialog]{max-width:480px;margin-left:auto;margin-right:auto}.frame[data-frame=special]{border-color:#b99a67;box-shadow:inset 0 0 0 4px #18140f,inset 0 0 0 6px #80673f,0 14px 30px #000b}.feedback{min-height:1.5em;color:var(--muted)}:focus-visible{outline:3px solid #f1d391;outline-offset:3px}@media(max-width:420px){.demo{padding:12px}.frame{padding:14px}.samples button{flex:1 1 auto}.frame-header{grid-template-columns:1fr minmax(0,2fr) 1fr}.frame-header .button{padding-inline:10px}}
</style></head>
<body>
<main class="demo">
  <h1>共用介面母版樣張</h1><p class="notice">合成內容，僅供設計審閱；不連接遊戲、帳號或存檔。</p>
  <nav class="samples" aria-label="選擇樣張"><button data-sample="main" aria-pressed="true">通用主框</button><button data-sample="dialog" aria-pressed="false">次級彈窗</button><button data-sample="special" aria-pressed="false">高階框候選</button></nav>
  <section class="frame" data-frame="main" aria-labelledby="frame-title">
    <header class="frame-header"><button class="button secondary" type="button" data-action="back">返回</button><h2 id="frame-title">江湖見聞</h2><span class="header-spacer" aria-hidden="true"></span></header>
    <div class="tabs" role="tablist" aria-label="內容分類"><button type="button" role="tab" id="tab-short" aria-selected="true" aria-controls="sample-panel" tabindex="0" data-tab="short">簡短內容</button><button type="button" role="tab" id="tab-long" aria-selected="false" aria-controls="sample-panel" tabindex="-1" data-tab="long">較長內容</button></div>
    <div class="content" id="sample-panel" role="tabpanel" aria-labelledby="tab-short" tabindex="0"><h3>行旅札記</h3><p data-copy>青山如故，行路有伴。這是短內容的呈現範例。</p><div class="divider" aria-hidden="true">◆</div><p>文字、操作與捲動的示意內容不代表遊戲資料。</p></div>
    <footer><button class="button secondary" type="button" data-action="back">返回</button><button class="button primary" type="button" data-action="confirm">確認</button></footer>
  </section><p class="feedback" role="status" aria-live="polite"></p>
</main><script>
const frame=document.querySelector('.frame');const title=document.querySelector('#frame-title');const copy=document.querySelector('[data-copy]');const feedback=document.querySelector('.feedback');const labels={main:'江湖見聞',dialog:'行旅提示',special:'珍藏鑑賞'};document.querySelectorAll('[data-sample]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-sample]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));frame.hidden=false;frame.dataset.frame=button.dataset.sample;title.textContent=labels[button.dataset.sample];feedback.textContent='';}));document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(item=>{item.setAttribute('aria-selected',String(item===button));item.tabIndex=item===button?0:-1});document.querySelector('#sample-panel').setAttribute('aria-labelledby',button.id);copy.textContent=button.dataset.tab==='long'?'山路迢迢，雲霧漸散。'.repeat(35):'青山如故，行路有伴。這是短內容的呈現範例。';}));document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{frame.hidden=true;const selected=document.querySelector('[data-sample][aria-pressed=true]');feedback.textContent=button.dataset.action==='back'?'已返回樣張選擇。':'已確認並返回樣張選擇。';selected.setAttribute('aria-pressed','false');selected.focus();}));

const tabs=[...document.querySelectorAll('[data-tab]')];document.querySelector('[role=tablist]').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const current=tabs.indexOf(document.activeElement);const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(current+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].focus();tabs[next].click();});
</script></body></html>
