# Phase 1 acceptance: docs/CLOUD_SAVE_IMPLEMENTATION_PROGRESS.md; final release evidence: https://github.com/tf00913225-alt/my-game/pull/341
name: Session Authority

on:
  workflow_call:
    inputs:
      emulator_only:
        type: boolean
        default: true
      candidate_sha:
        type: string
        default: ''
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - 'functions/**'
      - 'js/firebase/**'
      - 'firestore.rules'
      - 'firebase*.json'
      - 'scripts/test-session-authority-emulator.mjs'
      - 'tests/session-*.test.mjs'
      - 'tests/cloud-save-*.test.mjs'
      - 'tests/firebase-trusted-cloud-save-backend.test.mjs'
      - 'scripts/firestore-backup-readiness.mjs'
      - 'tests/firestore-backup-readiness.test.mjs'
      - '.github/workflows/session-authority.yml'
      - '.github/scripts/wait-session-repository-checks.mjs'
      - 'tests/session-repository-checks-wait.test.mjs'
  push:
    branches: [dev]
    paths:
      - 'functions/**'
      - 'js/firebase/**'
      - 'firestore.rules'
      - 'firebase*.json'
      - 'scripts/test-session-authority-emulator.mjs'
      - 'tests/session-*.test.mjs'
      - 'tests/cloud-save-*.test.mjs'
      - 'tests/firebase-trusted-cloud-save-backend.test.mjs'
      - 'scripts/firestore-backup-readiness.mjs'
      - 'tests/firestore-backup-readiness.test.mjs'
      - '.github/workflows/session-authority.yml'
      - '.github/scripts/wait-session-repository-checks.mjs'
      - 'tests/session-repository-checks-wait.test.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.emulator_only && format('session-emulator-{0}', github.run_id) || format('session-authority-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  emulator:
    name: Session authority emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix functions ci --no-audit --no-fund
      - run: node --test tests/session-client.test.mjs tests/session-repository-checks-wait.test.mjs
      - run: node --test tests/cloud-save-*.test.mjs tests/firebase-trusted-cloud-save-backend.test.mjs
      - name: Verify account boot with session backend unavailable
        run: node .github/scripts/run-boot-architecture-browser-qa.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: session-authority-boot-${{ github.sha }}
          path: artifacts/browser-qa/boot-architecture-browser-qa.json
          if-no-files-found: error
      - run: node --test tests/firestore-backup-readiness.test.mjs
      - name: Verify actual callable and Firestore authorization
        run: npx --yes firebase-tools@15.30.0 emulators:exec --project demo-four-symbols-session --config firebase.session-emulators.json --only auth,firestore,functions 'node scripts/test-session-authority-emulator.mjs'

  deploy:
    name: Deploy session authority from dev
    needs: emulator
    if: ${{ !inputs.emulator_only && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    # 65m bounded aggregate wait + 15m checkout/auth/readiness/deployment reserve.
    timeout-minutes: 80
    concurrency:
      group: firebase-native-auth-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Require current dev and its Repository checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node .github/scripts/wait-session-repository-checks.mjs
      - name: Require existing Firebase deployment secret
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$DEPLOY_CREDENTIAL" ]; then
            echo "::error::Missing FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON; Phase 1 live activation is BLOCKED."
            exit 1
          fi

      - name: Show Firebase deploy service account
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
        run: |
          node -e 'const credential = JSON.parse(process.env.DEPLOY_CREDENTIAL); console.log("Firebase deploy service account:", credential.client_email || "MISSING_CLIENT_EMAIL");'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
          project_id: four-symbols-jianghu
      - uses: google-github-actions/setup-gcloud@v2
        continue-on-error: true
      - name: Inspect Firestore recovery readiness (read only)
        shell: bash
        run: |
          echo "### Firestore (default) recovery readiness at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if database_json="$(gcloud firestore databases describe --database='(default)' --project=four-symbols-jianghu --format=json 2>/dev/null)"; then
            DB_JSON="$database_json" node -e 'const d=JSON.parse(process.env.DB_JSON);const region=d.locationId||"UNVERIFIED";const pitr=d.pointInTimeRecoveryEnablement||"UNVERIFIED";console.log(`Region: ${region}; PITR: ${pitr}`)' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Region: UNVERIFIED; PITR: UNVERIFIED (database metadata query unavailable)' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if schedules_json="$(gcloud firestore backups schedules list --database='(default)' --project=four-symbols-jianghu --format=json 2>/dev/null)"; then
            SCHEDULES_JSON="$schedules_json" node -e 'const s=JSON.parse(process.env.SCHEDULES_JSON);if(!Array.isArray(s))throw Error("Unexpected backup schedule response");console.log(`Scheduled backup count: ${s.length}`);for(const v of s)console.log(`Schedule: ${v.name||"UNVERIFIED"}; retention: ${v.retention||"UNVERIFIED"}`)' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Scheduled backups: UNVERIFIED (schedule query unavailable)' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if backups_json="$(gcloud firestore backups list --project=four-symbols-jianghu --format=json 2>/dev/null)"; then
            echo 'Backup inventory: query succeeded' >> "$GITHUB_STEP_SUMMARY"
          else
            backups_json=''
            echo 'Backup inventory: query unavailable' >> "$GITHUB_STEP_SUMMARY"
          fi
          FIRESTORE_DATABASE_JSON="${database_json:-}" FIRESTORE_BACKUPS_JSON="$backups_json" \
            node scripts/firestore-backup-readiness.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          if databases_json="$(gcloud firestore databases list --project=four-symbols-jianghu --format=json)"; then
            DATABASES_JSON="$databases_json" node -e '
              const databases=JSON.parse(process.env.DATABASES_JSON);
              if(!Array.isArray(databases)) throw Error("Unexpected database list");
              const leftovers=databases.map(d=>d.name).filter(n=>typeof n==="string" && n.startsWith("projects/four-symbols-jianghu/databases/restore-drill-") && /restore-drill-[0-9]+-[0-9]+$/.test(n));
              console.log(`Restore drill leftovers: ${leftovers.length}`);
              for(const name of leftovers) console.log(`Leftover: ${name}`);
            ' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Restore drill leftovers: UNVERIFIED (database list unavailable)' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm --prefix functions ci --no-audit --no-fund
      - name: Deploy protected cloud endpoints and deny-write rules
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          npx --yes firebase-tools@15.30.0 deploy --project four-symbols-jianghu --non-interactive --force --only 'functions:createGameSession,functions:revokeGameSession,functions:protectedTest,functions:issueCanonicalRecoveryApproval,functions:restoreCanonicalCurrent,functions:createInitialCanonicalCharacter,functions:bootstrapCloudSave,functions:submitLegacyMigrationCandidate,functions:screenLegacyMigrationCandidate,functions:saveCloudPreferences,functions:reserveTrustedGrant,functions:claimDailyCheckin,functions:purchaseCanonicalPotion,functions:allocateCanonicalSharedExp,functions:createNativeAuthHandoff,functions:redeemNativeAuthHandoff,firestore:rules'
