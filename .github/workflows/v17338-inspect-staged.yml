name: V173.44 Maintenance Repair

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/v17338-inspect-staged.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - name: Apply maintenance fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")
          def write(path,text):
              Path(path).write_text(text,encoding="utf-8")
          def once(text,old,new,label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return text.replace(old,new,1)

          # Formal daily dungeons: any one Lv10; EXP reward goes to shared pool.
          p="js/42-v148-combat-dungeon-fixes.js"
          s=read(p)
          s=once(s,
          '''    const DAILY_DUNGEON_META={
              exp:{title:"經驗副本",requirement:"任一角色達到10級",reward:"通關後可指定1名角色獲得EXP",legacyType:"exp"},
              material:{title:"材料副本",requirement:"任一角色達到20級",reward:"材料寶箱 ×1～3",legacyType:"material"},
              gold:{title:"金幣副本",requirement:"任一角色達到20級",reward:"大量金幣",legacyType:"equipment"}
          };''',
          '''    const DAILY_DUNGEON_META={
              exp:{title:"經驗副本",requirement:"任一角色達到10級",reward:"通關EXP直接存入經驗池",legacyType:"exp"},
              material:{title:"材料副本",requirement:"任一角色達到10級",reward:"材料寶箱 ×1～3",legacyType:"material"},
              gold:{title:"金幣副本",requirement:"任一角色達到10級",reward:"大量金幣",legacyType:"equipment"}
          };''',"daily meta")
          s=once(s,
          '''    function hasLevel20Character(){
              return partyIndexes().some(index=>numeric(getPartyCharacterByIndex(index)?.level)>=20);
          }''',
          '''    function hasLevel10Character(){
              return partyIndexes().some(index=>numeric(getPartyCharacterByIndex(index)?.level)>=10);
          }''',"daily level helper")
          s=once(s,
          '''        if(type==="exp"){
              const ready=partyIndexes().some(index=>numeric(getPartyCharacterByIndex(index)?.level)>=10);
              if(!ready){ alert("經驗副本需要任一角色達到10級才能開啟。"); return; }
          }else if(!hasLevel20Character()){
              alert(meta.title+"需要任一角色達到20級才能開啟。");
              return;
          }''',
          '''        if(!hasLevel10Character()){
              alert(meta.title+"需要任一角色達到10級才能開啟。");
              return;
          }''',"daily level gate")

          exp_block=re.compile(r'    function showDailyExpReward\(baseExp\)\{.*?\n    function goldDungeonReward\(level\)\{',re.S)
          replacement='''    function showDailyExpReward(baseExp){
              pendingDailyExpReward={baseExp:Math.max(0,Math.floor(numeric(baseExp)))};
              const html='<div class="v132-reward-modal-inner"><h3>經驗副本挑戰成功！</h3>'+\
                  '<p>EXP：<b>'+pendingDailyExpReward.baseExp.toLocaleString("zh-TW")+'</b>，獎勵將直接存入經驗池。</p>'+\
                  '<div class="v132-reward-actions">'+\
                  '<button type="button" onclick="v148ClaimDailyExpReward(false)">存入經驗池</button>'+\
                  '<button type="button" onclick="v148ClaimDailyExpReward(true)">看廣告雙倍存入</button></div></div>';
              if(typeof window.v132ShowRewardModal==="function"){ window.v132ShowRewardModal(html); }
          }

          window.v148ClaimDailyExpReward=function(doubled){
              const pending=pendingDailyExpReward;
              if(!pending){ return; }
              const grant=multiplier=>{
                  const amount=Math.max(0,Math.floor(pending.baseExp*multiplier));
                  sharedExp=Math.max(0,numeric(sharedExp)+amount);
                  pendingDailyExpReward=null;
                  if(typeof saveGame==="function"){ saveGame(); }
                  if(typeof updateUI==="function"){ updateUI(); }
                  if(typeof renderExpDistributeList==="function"){ renderExpDistributeList(); }
                  if(typeof addBattleLog==="function"){
                      addBattleLog("經驗副本結算："+amount+" EXP 已存入經驗池。");
                  }
                  if(typeof window.v132CloseRewardModal==="function"){ window.v132CloseRewardModal(); }
                  showPage("dungeon");
                  if(typeof switchDungeonTab==="function"){ switchDungeonTab("daily"); }
              };
              if(doubled&&typeof showRewardedAd==="function"){
                  showRewardedAd(()=>grant(2),()=>grant(1));
              }else{ grant(1); }
          };

          function goldDungeonReward(level){'''
          s,n=exp_block.subn(replacement,s,count=1)
          if n!=1:
              raise SystemExit(f"exp reward block: expected 1 match, got {n}")
          write(p,s)

          # Fix V132 legacy helper/export so the older layer can load, while aligning it to Lv10.
          p="js/27-v132-content-expansion.js"
          s=read(p)
          s=once(s,
          '''    window.v132HasTwoCharactersAtLevel20=hasTwoCharactersAtLevel20;''',
          '''    window.v132HasLevel10CharacterForDailyDungeon=hasLevel10CharacterForDailyDungeon;
              /* Compatibility alias: old callers now use the same single-Lv10 rule. */
              window.v132HasTwoCharactersAtLevel20=hasLevel10CharacterForDailyDungeon;''',"V132 daily compatibility export")
          write(p,s)

          # Additional characters remain Lv1. Catch-up still exists only through EXP multipliers.
          p="js/28-v133-economy-rebalance.js"
          s=read(p)
          s,n=re.subn(r'\n    function grantFastStartToAdditionalCharacter\(character,slotNumber\)\{.*?\n    \}\n\n    function grantDirectCatchUpExp',
                      '\n    function grantDirectCatchUpExp',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f"fast-start function: expected 1 match, got {n}")
          s=once(s,
          '''            const character=slotNumber===3?player3:player2;
              grantFastStartToAdditionalCharacter(character,slotNumber);
              recalibrateCharacterExpNext(character);''',
          '''            const character=slotNumber===3?player3:player2;
              recalibrateCharacterExpNext(character);''',"fast-start call")
          write(p,s)

          # Skill learning: make prerequisite lock explicit. Flood Beast remains 15 pts + Water Ball.
          p="js/00-main.js"
          s=read(p)
          s=once(s,
          '''            actionLabel=
                  !prereqMet
                  ?
                  "🔒 未解鎖"
                  :''',
          '''            actionLabel=
                  !prereqMet
                  ?
                  "🔒 "+getSkillPrereqLabel(skill)
                  :''',"skill prerequisite label")
          write(p,s)

          # Main-city UHD asset cache/version follows V173.44.
          p="css/46-v154-dev-fixes.css"
          s=read(p)
          s=once(s,"home-background-v17343.png","home-background-v17344.png","main-city UHD path")
          write(p,s)

          # Update existing regressions to the new intended behavior.
          p="tests/v173.42-player-flow.test.js"
          s=read(p)
          s=s.replace("/* Second / third character catch-up is EXP-only after the Lv10 fast start and ends at Lv20. */",
                      "/* Second / third character starts at Lv1; catch-up is EXP-only and ends at Lv20. */")
          s=once(s,
          '''assert.match(economy,/function grantFastStartToAdditionalCharacter\\(character,slotNumber\\)/);
          assert.match(economy,/character\\.level=10/);''',
          '''assert.doesNotMatch(economy,/function grantFastStartToAdditionalCharacter\\(character,slotNumber\\)/);
          assert.doesNotMatch(economy,/啟用追趕養成，從 Lv\\.10 開始冒險/);''',"player flow fast start assertions")
          s=s.replace("home-background-v17343\\.png","home-background-v17344\\.png")
          s=s.replace('"assets/ui/home-background-v17343.png"','"assets/ui/home-background-v17344.png"')
          s=once(s,
          '''assert.match(dungeonPolish,/v173GrantCharacterCatchUpExp/);''',
          '''assert.match(dungeonPolish,/sharedExp=Math\\.max\\(0,numeric\\(sharedExp\\)\\+amount\\)/);
          assert.doesNotMatch(dungeonPolish,/請指定1名角色領取/);''',"player flow exp reward assertion")
          write(p,s)

          p="tests/v173.44-current-request.test.js"
          s=read(p)
          s=once(s,
          '''const v131=fs.readFileSync("js/25-v131-fix-batch.js","utf8");''',
          '''const v131=fs.readFileSync("js/25-v131-fix-batch.js","utf8");
          const economy=fs.readFileSync("js/28-v133-economy-rebalance.js","utf8");
          const main=fs.readFileSync("js/00-main.js","utf8");
          const water=fs.readFileSync("js/50-v169-water-skill-rules.js","utf8");
          const v132=fs.readFileSync("js/27-v132-content-expansion.js","utf8");''',"current request imports")
          s=s.replace('assert.match(battle,/material:\\{title:"材料副本",requirement:"任一角色達到20級"/);',
                      'assert.match(battle,/material:\\{title:"材料副本",requirement:"任一角色達到10級"/);')
          s=s.replace('assert.match(battle,/gold:\\{title:"金幣副本",requirement:"任一角色達到20級"/);',
                      'assert.match(battle,/gold:\\{title:"金幣副本",requirement:"任一角色達到10級"/);')
          extra='''
          assert.match(battle,/exp:\\{title:"經驗副本",requirement:"任一角色達到10級",reward:"通關EXP直接存入經驗池"/);
          assert.match(battle,/function hasLevel10Character\\(\\)/);
          assert.doesNotMatch(battle,/hasLevel20Character/);
          assert.match(battle,/sharedExp=Math\\.max\\(0,numeric\\(sharedExp\\)\\+amount\\)/);
          assert.doesNotMatch(battle,/請指定1名角色領取/);
          assert.doesNotMatch(economy,/grantFastStartToAdditionalCharacter/);
          assert.match(v132,/v132HasTwoCharactersAtLevel20=hasLevel10CharacterForDailyDungeon/);
          assert.match(main,/"🔒 "\\+getSkillPrereqLabel\\(skill\\)/);
          assert.match(water,/floodBeast:\\{[\\s\\S]*?learnCost:15[\\s\\S]*?requires:\\["waterBall"\\]/);
          assert.match(abyssCss,/home-background-v17344\\.png/);
          assert.equal(fs.existsSync("assets/ui/home-background-v17344.png"),true,"assets/ui/home-background-v17344.png");
          '''
          s=once(s,'console.log("✓ V173.44 current request regression passed");',extra+'\nconsole.log("✓ V173.44 current request regression passed");',"current request tail")
          write(p,s)

          # Persist the new dev publishing truth for future conversations/agents.
          note='''

          ## DEV 預覽發布規則（2026-09-04 起）
          - `dev` 仍是唯一開發分支；預覽需求不得改動 `main`。
          - `dev` 每次 push 後，由 `.github/workflows/deploy-dev-cloudflare.yml` 自動部署 Cloudflare Pages。
          - 固定 DEV 測試網址：`https://four-symbols-dev.pages.dev`。
          - 不再使用 GitHack / RawGitHack / RawCDN 作為 `dev` 測試站，避免大量 CSS/JS/素材請求遭 429 限流造成裸 HTML 或新舊資源混載。
          - `assets-library` 與 `assets-library/assets/inbox/` 仍留在 GitHub，素材讀取與整理流程不受 Cloudflare Pages 影響。
          '''
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.splitlines())
          for doc in ("HANDOFF.md","AGENTS.md"):
              path=Path(doc)
              if path.exists():
                  text=path.read_text(encoding="utf-8")
                  if "https://four-symbols-dev.pages.dev" not in text:
                      path.write_text(text.rstrip()+note+"\n",encoding="utf-8")
          PY

          cp assets/ui/home-background-v17343.png assets/ui/home-background-v17344.png
          rm -f .github/workflows/v17344-maintenance-fix.yml

      - name: Validate maintenance fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check js/00-main.js
          node --check js/27-v132-content-expansion.js
          node --check js/28-v133-economy-rebalance.js
          node --check js/42-v148-combat-dungeon-fixes.js
          node --check js/50-v169-water-skill-rules.js
          node tests/v169-water-skill-rules.test.js
          node tests/v173.42-player-flow.test.js
          node tests/v173.43-growth-charge.test.js
          node tests/v173.44-current-request.test.js
          node .github/scripts/ci.mjs tests
          node .github/scripts/ci.mjs resources

      - name: Restore workflow and publish final dev state
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/v17338-inspect-staged.yml <<'YAML'
          name: V173.38 Inspect Staged Patch

          on:
            push:
              branches: [dev]
              paths:
                - .github/workflows/v17338-inspect-staged.yml
                - .github/v17338.patch.xz.b64

          permissions:
            contents: read

          jobs:
            inspect:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: dev
                    fetch-depth: 2
                - name: Decode and validate staged patch
                  run: |
                    base64 -d .github/v17338.patch.xz.b64 | xz -d > /tmp/v17338.patch
                    git apply --check /tmp/v17338.patch
                    git apply --stat /tmp/v17338.patch
                    sha256sum /tmp/v17338.patch
                    cp /tmp/v17338.patch v17338.patch
                - uses: actions/upload-artifact@v4
                  with:
                    name: v17338-staged-patch
                    path: v17338.patch
                    retention-days: 1
          YAML

          git config user.name "tf00913225-alt"
          git config user.email "tf00913225@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize V173.44 dungeon growth and water UX maintenance"
          git push origin HEAD:dev
